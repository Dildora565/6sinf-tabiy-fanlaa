nf Tabiiy fan • O‘rganing, kuzating, xulosa chiqaring!<\/footer>\n<\/main>\n<script>\nfunction showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}\nlet air=0;\nfunction drawParticles(){let box=document.getElementById('particles');box.innerHTML='';let n=Math.min(air*5+5,90);for(let i=0;i<n;i++){let p=document.createElement('span');p.className='particle';p.style.left=Math.random()*96+'%';p.style.top=Math.random()*82+'%';p.style.animationDelay=(Math.random()*2)+'s';p.style.animationDuration=(.7+Math.random()*2)+'s';box.appendChild(p)}}\nfunction pump(){if(air<10)air++;updateGas()}\nfunction releaseAir(){if(air>0)air--;updateGas()}\nfunction resetGas(){air=0;updateGas()}\nfunction updateGas(){let mass=(air*1.2).toFixed(1);document.getElementById('addedMass').textContent=mass+' g qo‘shimcha';document.getElementById('scaleDisplay').textContent=mass+' g';document.getElementById('filledBalloon').style.transform=`scale(${.72+air*.055})`;document.getElementById('gasNote').textContent=air===0?'Shar ichiga havo kiriting va massaning qanday o‘zgarishini kuzating.':`Shar ichiga havo kiritildi. Model bo‘yicha qo‘shimcha havo massasi: ${mass} g. Zarrachalar soni ko‘paydi.`;drawParticles()}\nfunction updateTemp(){let t=Number(document.getElementById('temperature').value);document.getElementById('tempValue').textContent=t+'°C';setState('waterState',t<0?'Muz (qattiq)':t<100?'Suyuq':'Bug‘ (gaz)');setState('alcoholState',t< -114?'Qattiq (muzlagan)':t<78?'Suyuq':'Bug‘ (gaz)');setState('ironState',t<1538?'Qattiq':'Suyuq (erigan)');setState('oxygenState',t< -183?'Suyuq yoki qattiq':'Gaz')}\nfunction setState(id,s){document.getElementById(id).textContent=s}\nlet heat=0;\nfunction heatUp(){heat=Math.min(heat+1,5);document.getElementById('copperRod').style.background=`linear-gradient(90deg,#f04438 ${heat*18}%,#fda29b ${heat*18+15}%,#cbd5e1 100%)`;document.getElementById('woodRod').style.background=`linear-gradient(90deg,#f59e0b ${heat*5}%,#e7c58a ${heat*5+15}%,#b9854a 100%)`;document.getElementById('heatStatus').textContent=heat===5?'Misda issiqlik uzoqroqqa tarqaldi':'Qizdirish darajasi: '+heat+'/5'}\nfunction resetHeat(){heat=0;document.getElementById('copperRod').style.background='linear-gradient(90deg,#c65d27,#d8a17c,#cbd5e1)';document.getElementById('woodRod').style.background='linear-gradient(90deg,#f59e0b,#e7c58a,#b9854a)';document.getElementById('heatStatus').textContent='Tayoqchalar sovuq'}\nfunction testMaterial(){let m=document.getElementById('material').value;let conduct=['copper','iron','graphite'].includes(m);let names={copper:'Mis sim',iron:'Temir mix',graphite:'Grafit',rubber:'Rezina',plastic:'Plastmassa',wood:'Quruq yog‘och',glass:'Shisha'};document.getElementById('sample').textContent=names[m];document.getElementById('lamp').classList.toggle('on',conduct);document.getElementById('electricResult').textContent=conduct?'Lampochka yonadi: '+names[m]+' elektr tokini o‘tkazadi.':'Lampochka yonmaydi: '+names[m]+' bu oddiy modelda elektrni yomon o‘tkazuvchi sifatida ko‘rsatilgan.'}\nfunction checkQuiz(){let answers={q1:'b',q2:'c',q3:'a',q4:'b',q5:'a',q6:'c'},score=0,total=Object.keys(answers).length;for(let q in answers){let chosen=document.querySelector(`input[name=\"${q}\"]:checked`);if(chosen&&chosen.value===answers[q])score++}let el=document.getElementById('quizResult');el.textContent=`Natija: ${score}/${total} ta to‘g‘ri javob (${Math.round(score/total*100)}%). `+(score===total?'Ajoyib! Barcha javoblar to‘g‘ri.':score>=4?'Yaxshi! Xato javoblarni qayta ko‘rib chiqing.':'Mavzuni yana bir bor o‘qib, qayta urinib ko‘ring.');el.className='feedback '+(score>=4?'correct':'wrong')}\nupdateGas();updateTemp();testMaterial();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Fizik o‘zgarishlar", "i": "🔄", "g": "Moddalar", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Fizik o‘zgarishlar<\/title>\n<style>\n:root{--bg:#f3f7ff;--ink:#172554;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--orange:#f59e0b;--card:#fff}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1e293b;line-height:1.6}\nheader{background:linear-gradient(135deg,#1d4ed8,#0891b2);color:white;padding:32px 18px;text-align:center}\nheader h1{font-size:clamp(1.7rem,4vw,2.7rem);margin:0 0 8px}header p{max-width:850px;margin:auto}\nmain{max-width:1100px;margin:24px auto;padding:0 14px}.section{background:var(--card);padding:22px;border-radius:18px;margin:18px 0;box-shadow:0 5px 20px #0f172a0d}\nh2{color:#1d4ed8;margin-top:0}h3{color:#0e7490}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}\n.tile{background:#eff6ff;border-radius:14px;padding:15px;border:1px solid #dbeafe}.tile strong{display:block;color:#1d4ed8;font-size:1.05rem}\n.note{background:#ecfeff;border-left:5px solid var(--cyan);padding:13px 16px;border-radius:8px}\n.warning{background:#fff7ed;border-left:5px solid var(--orange);padding:13px 16px;border-radius:8px}\nbutton,select,input{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;cursor:pointer;font-weight:bold}button:hover{filter:brightness(.92)}button.secondary{background:#475569}button.green{background:var(--green)}\n.lab{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.stage{background:linear-gradient(#e0f2fe,#f8fafc);border:2px solid #bae6fd;border-radius:16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}\n.cube{font-size:90px;transition:transform .5s}.thermo{font-weight:bold;font-size:1.2rem;color:#b91c1c}.water{width:130px;height:80px;background:#38bdf8;border:3px solid #0284c7;border-radius:10px 10px 20px 20px;position:relative;overflow:hidden;display:none}\n.bubble{position:absolute;bottom:-12px;width:10px;height:10px;border:2px solid white;border-radius:50%;animation:rise 2s infinite ease-in}\n.bubble:nth-child(2){left:35%;animation-delay:.5s}.bubble:nth-child(3){left:65%;animation-delay:1s}\n@keyframes rise{to{transform:translateY(-90px);opacity:0}}\n.controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.status{font-weight:bold;color:#0f766e}.bar{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#06b6d4,#2563eb);width:0%;transition:width .3s}\n.quiz-q{padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0}.quiz-q label{display:block;padding:5px;cursor:pointer}.result{font-size:1.1rem;font-weight:bold;margin-top:12px}\nfooter{text-align:center;color:#64748b;padding:25px}\n@media(max-width:650px){.lab{grid-template-columns:1fr}.section{padding:17px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🔬 Fizik o‘zgarishlar dunyosi<\/h1>\n  <p>6-sinf Tabiiy fanlar uchun interaktiv dars, suv va muz simulyatsiyasi hamda bilimni tekshirish testi.<\/p>\n<\/header>\n<main>\n<section class=\"section\">\n<h2>1. Fizik o‘zgarish nima?<\/h2>\n<p><b>Fizik o‘zgarish<\/b> — moddaning kimyoviy tarkibi o‘zgarmagan holda uning shakli, o‘lchami yoki agregat holati o‘zgarishidir. Bunda odatda yangi modda hosil bo‘lmaydi.<\/p>\n<div class=\"grid\">\n <div class=\"tile\"><strong>🧊 Muzning erishi<\/strong>Qattiq suv suyuq suvga aylanadi. Modda baribir H₂O bo‘lib qoladi.<\/div>\n <div class=\"tile\"><strong>💧 Suvning bug‘lanishi<\/strong>Suyuq suv suv bug‘iga aylanadi.<\/div>\n <div class=\"tile\"><strong>📄 Qog‘ozni yirtish<\/strong>Shakli va o‘lchami o‘zgaradi, lekin qog‘ozning tarkibi asosan o‘zgarmaydi.<\/div>\n <div class=\"tile\"><strong>🧂 Tuzning suvda erishi<\/strong>Tuz zarrachalari suv ichida tarqaladi; suvni bug‘latib, tuzni qayta olish mumkin.<\/div>\n<\/div>\n<div class=\"note\"><b>Esda tuting:<\/b> fizik o‘zgarishda moddaning tarkibi saqlanadi. Kimyoviy o‘zgarishda esa yangi modda yoki moddalar hosil bo‘lishi mumkin.<\/div>\n<\/section>\n\n<section class=\"section\">\n<h2>2. Qaytar va qaytmas o‘zgarishlar<\/h2>\n<div class=\"grid\">\n <div class=\"tile\"><strong>↔️ Qaytar o‘zgarish<\/strong>Sharoitni o‘zgartirib, dastlabki holatga qaytarish mumkin bo‘lgan jarayon.<br><b>Misol:<\/b> muz ⇄ suv ⇄ suv bug‘i.<\/div>\n <div class=\"tile\"><strong>➡️ Qaytmas o‘zgarish<\/strong>Dastlabki holatga oddiy usulda qaytarish qiyin yoki mumkin bo‘lmagan jarayon.<br><b>Misol:<\/b> oynaning sinishi, yog‘ochning yonishi.<\/div>\n<\/div>\n<div class=\"warning\"><b>Muhim aniqlik:<\/b> fizik o‘zgarishlarning hammasi ham oson qaytarilavermaydi. Masalan, oynaning sinishi fizik o‘zgarish, lekin uni avvalgi butun holatiga qaytarish qiyin. Yog‘ochning yonishi esa kimyoviy o‘zgarishdir.<\/div>\n<\/section>\n\n<section class=\"section\">\n<h2>3. Virtual laboratoriya: Suv va muz<\/h2>\n<p>Haroratni o‘zgartirib, suvning holati qanday almashishini kuzating. Bu soddalashtirilgan model: odatdagi atmosfera bosimida muz taxminan 0°C da eriydi, suv esa 100°C atrofida qaynaydi.<\/p>\n<div class=\"lab\">\n <div class=\"stage\">\n   <div id=\"object\" class=\"cube\">🧊<\/div>\n   <div id=\"water\" class=\"water\"><span class=\"bubble\"><\/span><span class=\"bubble\"><\/span><span class=\"bubble\"><\/span><\/div>\n   <div class=\"thermo\" id=\"temp\">Harorat: −10°C<\/div>\n   <div id=\"state\" class=\"status\">Holati: qattiq (muz)<\/div>\n <\/div>\n <div>\n  <label for=\"heat\"><b>Haroratni sozlang:<\/b><\/label>\n  <input id=\"heat\" type=\"range\" min=\"-10\" max=\"110\" value=\"-10\" style=\"width:100%;margin:15px 0\">\n  <div class=\"bar\"><span id=\"progress\"><\/span><\/div>\n  <div class=\"controls\">\n   <button onclick=\"changeTemp(-10)\">❄️ Sovutish<\/button>\n   <button class=\"green\" onclick=\"changeTemp(10)\">🔥 Qizdirish<\/button>\n   <button class=\"secondary\" onclick=\"resetLab()\">↺ Boshidan<\/button>\n  <\/div>\n  <p id=\"explain\">Muz sovuq holatda. Zarrachalar o‘z joyi atrofida tebranadi.<\/p>\n  <p><b>Kuzatish vazifasi:<\/b> haroratni sekin oshiring. 0°C atrofida nima sodir bo‘lishini va 100°C ga yaqinlashganda qanday o‘zgarish kuzatilishini ayting.<\/p>\n <\/div>\n<\/div>\n<\/section>\n\n<section class=\"section\">\n<h2>4. Zarrachalar modeli<\/h2>\n<p>Modda holati o‘zgarganda zarrachalarning o‘zi suv molekulasi bo‘lib qoladi; ularning harakati va o‘zaro joylashuvi o‘zgaradi.<\/p>\n<div class=\"grid\">\n <div class=\"tile\"><strong>🧊 Qattiq holat<\/strong>Zarrachalar bir-biriga yaqin va tartibli joylashgan, asosan o‘z joyida tebranadi.<\/div>\n <div class=\"tile\"><strong>💧 Suyuq holat<\/strong>Zarrachalar yaqin, ammo bir-birining yonidan siljiy oladi.<\/div>\n <div class=\"tile\"><strong>☁️ Gaz holat<\/strong>Zarrachalar uzoqroq joylashadi va erkinroq, tez harakatlanadi.<\/div>\n<\/div>\n<\/section>\n\n<section class=\"section\">\n<h2>5. Bilimingizni tekshiring<\/h2>\n<p>Har bir savol uchun bitta javob tanlang, so‘ng “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Muz eriganda qanday o‘zgarish yuz beradi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Kimyoviy o‘zgarish, yangi modda hosil bo‘ladi<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"b\"> Fizik o‘zgarish, modda suv bo‘lib qoladi<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"c\"> Hech qanday o‘zgarish bo‘lmaydi<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Qaysi biri kimyoviy o‘zgarish?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Muzning erishi<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"b\"> Qog‘ozni yirtish<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"c\"> Yog‘ochning yonishi<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Suv odatdagi atmosfera bosimida taxminan necha °C da qaynaydi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> 0°C<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"b\"> 50°C<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"c\"> 100°C<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Fizik o‘zgarishda nima saqlanib qoladi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Moddaning kimyoviy tarkibi<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"b\"> Har doim shakli<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"c\"> Har doim agregat holati<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Qaysi fizik o‘zgarishni qaytarish qiyin?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Suvni muzlatish<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"b\"> Oynaning sinishi<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"c\"> Muzning erishi<\/label><\/div>\n<\/form>\n<div class=\"controls\"><button onclick=\"checkQuiz()\">Natijani tekshirish<\/button><button class=\"secondary\" onclick=\"resetQuiz()\">Qayta ishlash<\/button><\/div>\n<div id=\"quizResult\" class=\"result\" aria-live=\"polite\"><\/div>\n<\/section>\n<section class=\"section\">\n<h2>6. Dars yakuni<\/h2>\n<ul>\n<li>Fizik o‘zgarishda yangi modda hosil bo‘lmaydi.<\/li>\n<li>Modda qattiq, suyuq yoki gaz holatiga o‘tishi mumkin.<\/li>\n<li>Qaytar yoki qaytmaslik — jarayonni boshlang‘ich holatga qaytarish mumkinligiga bog‘liq.<\/li>\n<li>Harorat o‘zgarishi zarrachalar harakatiga ta’sir qiladi.<\/li>\n<\/ul>\n<p class=\"note\"><b>Uyga vazifa:<\/b> uy yoki maktabdan 3 ta fizik o‘zgarish misolini toping. Har biri qaytar yoki qaytmasligini izohlang.<\/p>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fanlar • Interaktiv o‘quv materiali<\/footer>\n<script>\nconst slider=document.getElementById('heat');\nfunction renderTemp(v){\n v=Number(v); document.getElementById('temp').textContent='Harorat: '+(v<0?'−'+Math.abs(v):v)+'°C';\n document.getElementById('progress').style.width=((v+10)/120*100)+'%';\n const obj=document.getElementById('object'), water=document.getElementById('water'), state=document.getElementById('state'), exp=document.getElementById('explain');\n if(v<0){obj.style.display='block';obj.textContent='🧊';water.style.display='none';state.textContent='Holati: qattiq (muz)';exp.textContent='Muz sovuq holatda. Zarrachalar o‘z joyi atrofida tebranadi.'}\n else if(v<100){obj.style.display='block';obj.textContent='💧';water.style.display='none';state.textContent='Holati: suyuq (suv)';exp.textContent=v===0?'0°C atrofida muz erishi yoki suv muzlashi mumkin. Erish vaqtida berilgan issiqlik haroratni oshirishga emas, holatni o‘zgartirishga sarflanadi.':'Suv suyuq holatda. Zarrachalar bir-birining yonidan siljiy oladi.'}\n else{obj.style.display='block';obj.textContent='☁️';water.style.display='block';state.textContent='Holati: gaz (suv bug‘i)';exp.textContent='100°C atrofida, odatdagi atmosfera bosimida suv qaynaydi va bug‘ hosil bo‘ladi.'}\n}\nslider.addEventListener('input',e=>renderTemp(e.target.value));\nfunction changeTemp(d){slider.value=Math.max(-10,Math.min(110,Number(slider.value)+d));renderTemp(slider.value)}\nfunction resetLab(){slider.value=-10;renderTemp(-10)}\nfunction checkQuiz(){\n const answers={q1:'b',q2:'c',q3:'c',q4:'a',q5:'b'};let score=0;\n for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen&&chosen.value===a)score++}\n const r=document.getElementById('quizResult');r.textContent='Natija: '+score+'/5 ('+(score*20)+'%). '+(score===5?'A’lo! Mavzuni yaxshi o‘zlashtirdingiz.':score>=3?'Yaxshi! Xatolarni ko‘rib, yana urinib ko‘ring.':'Mavzuni qayta o‘qing va yana urinib ko‘ring.');r.style.color=score>=3?'#15803d':'#b91c1c';\n}\nfunction resetQuiz(){document.getElementById('quiz').reset();document.getElementById('quizResult').textContent=''}\nrenderTemp(-10);\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Moddalarning erish jarayoni", "i": "🧊", "g": "Moddalar", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Moddalarning erish jarayoni<\/title>\n<style>\n:root{--blue:#1769aa;--deep:#103b66;--cyan:#dff6ff;--green:#16794b;--orange:#f29b38;--ink:#203044;--bg:#f2f7fc}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}\nheader{background:linear-gradient(135deg,#0c477d,#1384b8);color:#fff;padding:32px 18px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.6rem)}header p{max-width:850px;margin:auto}\nnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;padding:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}\nnav a{color:var(--deep);text-decoration:none;padding:7px 12px;border-radius:20px;background:#eaf4fc;font-size:.92rem}\nmain{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #153a5b0c;border:1px solid #e2edf5}\nh2{color:var(--deep);margin-top:0}.tag{display:inline-block;background:#e3f6ed;color:#14633c;border-radius:8px;padding:3px 9px;font-weight:bold}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.mini{background:#f5faff;padding:15px;border-radius:12px;border:1px solid #dcebf7}\n.beaker-area{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;align-items:center}\n.beaker{height:245px;width:190px;margin:0 auto;position:relative;border:5px solid #8abbd3;border-top:0;border-radius:0 0 24px 24px;overflow:hidden;background:linear-gradient(to bottom,transparent 0 20%,#d9f5ff 20%);box-shadow:inset 0 -8px 0 #ffffff70}\n.water{position:absolute;inset:20% 0 0;background:linear-gradient(#b8edffb8,#56bce6b8);transition:background .3s}\n.particle{position:absolute;width:9px;height:9px;border-radius:50%;background:#e6a323;box-shadow:0 0 0 2px #fff7;transition:all .8s}\n.beaker-label{text-align:center;font-weight:bold;margin-top:8px}\n.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}\nbutton{border:0;background:var(--blue);color:white;padding:10px 15px;border-radius:9px;cursor:pointer;font-weight:bold}button:hover{filter:brightness(.92)}button.secondary{background:#557083}button.green{background:var(--green)}\ninput[type=range]{accent-color:var(--blue);width:min(100%,260px)}select{padding:9px;border:1px solid #bfd2e1;border-radius:8px}\n.stat{background:#edf8ff;padding:12px;border-radius:10px;text-align:center}.stat strong{font-size:1.25rem;color:var(--deep)}\n.note{border-left:5px solid var(--orange);padding:10px 14px;background:#fff8ec;border-radius:6px}\n.quiz-q{padding:14px;border:1px solid #e1eaf2;border-radius:12px;margin:12px 0}.quiz-q label{display:block;margin:5px 0;cursor:pointer}\nfooter{text-align:center;padding:25px;color:#5b6c7a}\n@media(max-width:520px){.card{padding:16px}.beaker{height:220px;width:165px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div>🔬 6-SINF · TABIIY FAN<\/div>\n  <h1>Moddalarning erish jarayoni<\/h1>\n  <p>Erish qanday sodir bo‘ladi? Harorat, aralashtirish va zarrachalar harakati eritma hosil bo‘lishiga qanday ta’sir qiladi? Keling, kuzatamiz va tajriba qilamiz!<\/p>\n<\/header>\n<nav>\n  <a href=\"#tushuncha\">Asosiy tushuncha<\/a><a href=\"#simulyatsiya\">Simulyatsiya<\/a><a href=\"#harorat\">Harorat tajribasi<\/a><a href=\"#eritma\">Eritmalar<\/a><a href=\"#tajriba\">Mini-loyiha<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"tushuncha\">\n<h2>1. Erish nima?<\/h2>\n<p><b>Erish (erish jarayoni)<\/b> — moddaning boshqa modda ichida zarrachalar darajasida tarqalib, bir jinsli aralashma — <b>eritma<\/b> hosil qilishidir. Masalan, shakar suvda eriydi. Shakar yo‘q bo‘lib ketmaydi: uning juda mayda zarrachalari suv bo‘ylab tarqaladi.<\/p>\n<div class=\"grid\">\n <div class=\"mini\"><h3>💧 Erituvchi<\/h3><p>Boshqa moddani eritadigan modda. Kundalik hayotda ko‘pincha suv erituvchi bo‘ladi.<\/p><i>Misol: suv.<\/i><\/div>\n <div class=\"mini\"><h3>🧂 Eruvchi modda<\/h3><p>Erituvchida tarqaladigan modda.<\/p><i>Misol: osh tuzi yoki shakar.<\/i><\/div>\n <div class=\"mini\"><h3>🥤 Eritma<\/h3><p>Erituvchi va erigan modda bir tekis taqsimlanganda hosil bo‘lgan bir jinsli aralashma.<\/p><i>Misol: shakarli suv.<\/i><\/div>\n<\/div>\n<div class=\"note\"><b>Muhim farq:<\/b> bu darsda “erish” deganda shakarning suvda erishini nazarda tutamiz. Muzning suvga aylanishi ham “erish” deb ataladi, ammo u qattiq holatdan suyuq holatga o‘tish — boshqa fizik jarayondir.<\/div>\n<h3>Hayotiy misollar<\/h3>\n<ul><li>Choyga shakar solganda shakar zarrachalari choy bo‘ylab tarqaladi.<\/li><li>Suvga tuz qo‘shib aralashtirilganda tuzli eritma hosil bo‘ladi.<\/li><li>Gazlangan ichimlikda karbonat angidrid gazi suyuqlikda erigan bo‘ladi.<\/li><\/ul>\n<\/section>\n\n<section class=\"card\" id=\"simulyatsiya\">\n<h2>2. Interaktiv simulyatsiya: “Stakanda nima sodir bo‘ladi?”<\/h2>\n<p>Quyidagi boshqaruvlardan foydalaning. Shakar qo‘shing, aralashtiring va zarrachalar qanday tarqalishini kuzating. Bu model jarayonning soddalashtirilgan tasviridir.<\/p>\n<div class=\"beaker-area\">\n <div><div class=\"beaker\" id=\"beaker\"><div class=\"water\" id=\"water\"><\/div><\/div><div class=\"beaker-label\">🧪 Suv va shakar modeli<\/div><\/div>\n <div>\n  <div class=\"stat\"><strong id=\"sugarCount\">0<\/strong><br>shartli shakar zarrachalari<\/div>\n  <div class=\"stat\" style=\"margin-top:9px\"><strong id=\"state\">Toza suv<\/strong><br>hozirgi holat<\/div>\n  <div class=\"controls\"><button id=\"add\">＋ Shakar qo‘shish<\/button><button id=\"stir\" class=\"green\">⟳ Aralashtirish<\/button><button id=\"reset\" class=\"secondary\">Qayta boshlash<\/button><\/div>\n  <p id=\"explain\">Stakanda hozircha faqat suv bor. Shakar qo‘shib ko‘ring.<\/p>\n <\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"harorat\">\n<h2>3. Harorat erish tezligiga qanday ta’sir qiladi?<\/h2>\n<p>Ko‘p qattiq moddalar, jumladan shakar, iliq yoki issiq suvda odatda tezroq eriydi. Harorat oshganda suv zarrachalari tezroq harakatlanadi. Aralashtirish ham erish tezligini oshiradi.<\/p>\n<div class=\"grid\">\n <div class=\"mini\"><h3>❄️ A-stakan: sovuq suv<\/h3><div class=\"stat\"><strong id=\"coldVal\">10°C<\/strong><\/div><p>Suv zarrachalari nisbatan sekin harakatlanadi. Shakar ko‘pincha sekinroq eriydi.<\/p><\/div>\n <div class=\"mini\"><h3>☀️ B-stakan: issiq suv<\/h3><div class=\"stat\"><strong id=\"hotVal\">80°C<\/strong><\/div><p>Suv zarrachalari tezroq harakatlanadi. Bir xil sharoitda shakar odatda tezroq eriydi.<\/p><\/div>\n<\/div>\n<div class=\"controls\"><label for=\"temp\">Suv harorati: <b id=\"tempText\">25°C<\/b><\/label><input type=\"range\" id=\"temp\" min=\"5\" max=\"90\" value=\"25\"><\/div>\n<div class=\"controls\"><label for=\"mix\">Aralashtirish:<\/label><select id=\"mix\"><option value=\"0\">Aralashtirilmaydi<\/option><option value=\"1\">Sekin aralashtirish<\/option><option value=\"2\">Tez aralashtirish<\/option><\/select><\/div>\n<div class=\"stat\"><strong id=\"speedText\">O‘rtacha tezlik<\/strong><br><span id=\"speedExplain\">Harorat va aralashtirishni o‘zgartirib, taxminiy ta’sirni solishtiring.<\/span><\/div>\n<p class=\"note\">Eslatma: ekrandagi tezlik bahosi faqat tushuntirish uchun tuzilgan model. Haqiqiy erish vaqti shakar miqdori, kristallarning kattaligi, suv hajmi va aralashtirishga ham bog‘liq. Issiq suv bilan tajribani faqat kattalar nazoratida bajaring.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"eritma\">\n<h2>4. To‘yinmagan va to‘yingan eritmalar<\/h2>\n<div class=\"grid\">\n <div class=\"mini\"><h3>To‘yinmagan eritma<\/h3><p>Berilgan haroratda yana eruvchi modda erita oladigan eritma. Ozgina tuz solib aralashtirilganda odatda shunday bo‘ladi.<\/p><\/div>\n <div class=\"mini\"><h3>To‘yingan eritma<\/h3><p>Berilgan haroratda eruvchi moddaning eng ko‘p miqdori erigan eritma. Ortiqcha tuz tubda qolishi mumkin.<\/p><\/div>\n<\/div>\n<h3>Tabiatdagi ahamiyati<\/h3>\n<p>Suvda kislorod kabi gazlar ham eriydi. Baliqlar suvda erigan kisloroddan nafas oladi. Suv harorati ko‘tarilganda kislorodning suvda eruvchanligi odatda kamayadi; shu sababli juda iliq suv suv jonivorlariga qiyinchilik tug‘dirishi mumkin.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"tajriba\">\n<h2>5. Mini-loyiha: “Qaysi sharoitda shakar tezroq eriydi?”<\/h2>\n<p><span class=\"tag\">Guruhli tajriba<\/span><\/p>\n<h3>Kerakli jihozlar<\/h3><ul><li>2 ta shaffof stakan<\/li><li>Bir xil hajmdagi suv: biri salqin, biri iliq<\/li><li>2 ta bir xil choy qoshiq shakar<\/li><li>Qoshiq va sekundomer<\/li><\/ul>\n<h3>Bajarish tartibi<\/h3>\n<ol><li>Stakanlarga teng miqdorda suv quying.<\/li><li>Birinchi stakanga shakar solib, aralashtirmasdan kuzating.<\/li><li>Ikkinchi stakanga xuddi shuncha shakar solib, bir xil tezlikda aralashtiring.<\/li><li>Shakar ko‘rinmay qolguncha ketgan vaqtni yozib oling.<\/li><li>Tajriba natijasini solishtiring va xulosa chiqaring.<\/li><\/ol>\n<p class=\"note\"><b>Adolatli tajriba:<\/b> faqat bitta omilni o‘zgartiring. Harorat ta’sirini o‘rganishda ikkala stakanni ham bir xil usulda aralashtiring; aralashtirish ta’sirini o‘rganishda esa haroratni bir xil saqlang.<\/p>\n<h3>Kuzatish jadvali<\/h3>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr style=\"background:#eaf4fc\"><th style=\"padding:10px;border:1px solid #d4e3ee\">Stakan<\/th><th style=\"padding:10px;border:1px solid #d4e3ee\">Suv harorati<\/th><th style=\"padding:10px;border:1px solid #d4e3ee\">Aralashtirish<\/th><th style=\"padding:10px;border:1px solid #d4e3ee\">Erish vaqti<\/th><\/tr><\/thead><tbody><tr><td style=\"padding:10px;border:1px solid #d4e3ee\">A<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">Salqin<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">Bir xil usul<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">_____ soniya<\/td><\/tr><tr><td style=\"padding:10px;border:1px solid #d4e3ee\">B<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">Iliq<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">Bir xil usul<\/td><td style=\"padding:10px;border:1px solid #d4e3ee\">_____ soniya<\/td><\/tr><\/tbody><\/table>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>6. Bilimingizni sinab ko‘ring<\/h2>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Erituvchi nima?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> Eritmada eriydigan modda<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Boshqa moddani eritadigan modda<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Faqat qattiq modda<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Shakar suvda eriganda nima sodir bo‘ladi?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> Shakar yo‘q bo‘lib ketadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Shakar zarrachalari suv bo‘ylab tarqaladi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Suv darhol muzlaydi<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Odatda shakar qaysi suvda tezroq eriydi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Iliqroq suvda<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Har doim muzdek suvda<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Harorat ta’sir qilmaydi<\/label><\/div>\n<div class=\"quiz-q\"><b>4. To‘yingan eritmada nima kuzatilishi mumkin?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> Har qanday miqdor cheksiz eriydi<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Ortiqcha modda erimay qoladi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Erituvchi yo‘qoladi<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Tajriba adolatli bo‘lishi uchun nima qilish kerak?<\/b><label><input type=\"radio\" name=\"q5\" value=\"a\"> Bir vaqtda barcha shartlarni o‘zgartirish<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Faqat tekshirilayotgan bitta omilni o‘zgartirish<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Natijalarni yozmaslik<\/label><\/div>\n<button type=\"button\" id=\"check\" class=\"green\">Javoblarni tekshirish<\/button> <button type=\"reset\" class=\"secondary\" id=\"clear\">Qayta ishlash<\/button>\n<\/form>\n<div id=\"result\" class=\"stat\" style=\"display:none;margin-top:14px\" aria-live=\"polite\"><\/div>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan · Interaktiv dars materiali · O‘rganing, kuzating, xulosa chiqaring!<\/footer>\n<script>\nconst beaker=document.getElementById('beaker'), water=document.getElementById('water');\nlet particles=0, dissolved=false;\nfunction drawParticles(){\n beaker.querySelectorAll('.particle').forEach(p=>p.remove());\n for(let i=0;i<Math.min(particles,34);i++){\n  const p=document.createElement('span');p.className='particle';\n  if(dissolved){p.style.left=(8+Math.random()*82)+'%';p.style.top=(25+Math.random()*68)+'%';p.style.width='7px';p.style.height='7px';}\n  else{p.style.left=(38+Math.random()*24)+'%';p.style.top=(78+Math.random()*12)+'%';p.style.width='8px';p.style.height='8px';}\n  beaker.appendChild(p);\n }\n document.getElementById('sugarCount').textContent=particles;\n document.getElementById('state').textContent=particles===0?'Toza suv':dissolved?'Eritma hosil bo‘ldi':'Shakar tubda';\n document.getElementById('explain').textContent=particles===0?'Stakanda hozircha faqat suv bor. Shakar qo‘shib ko‘ring.':dissolved?'Aralashtirish natijasida shakar zarrachalari suv bo‘ylab tarqaldi. Ular ko‘zga ko‘rinmasa ham eritmada mavjud.':'Shakar qo‘shildi. Endi aralashtirib, zarrachalarning tarqalishini kuzating.';\n}\ndocument.getElementById('add').onclick=()=>{particles=Math.min(34,particles+6);dissolved=false;drawParticles()};\ndocument.getElementById('stir').onclick=()=>{if(!particles){document.getElementById('explain').textContent='Avval shakar qo‘shing.';return}dissolved=true;drawParticles()};\ndocument.getElementById('reset').onclick=()=>{particles=0;dissolved=false;drawParticles()};\nconst temp=document.getElementById('temp'), mix=document.getElementById('mix');\nfunction updateSpeed(){\n const t=+temp.value,m=+mix.value;document.getElementById('tempText').textContent=t+'°C';\n let score=(t-5)/85 + m*.42;\n let label=score<.35?'Sekinroq':score<.85?'O‘rtacha tezlik':'Tezroq';\n document.getElementById('speedText').textContent=label;\n document.getElementById('speedExplain').textContent=`Model bahosi: harorat ${t}°C, aralashtirish — ${mix.options[mix.selectedIndex].text.toLowerCase()}.`;\n}\ntemp.addEventListener('input',updateSpeed);mix.addEventListener('change',updateSpeed);\ndocument.getElementById('check').onclick=()=>{\n const answers={q1:'b',q2:'b',q3:'a',q4:'b',q5:'b'};let score=0,answered=0;\n for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector(`input[name=\"${q}\"]:checked`);if(chosen){answered++;if(chosen.value===a)score++}}\n const r=document.getElementById('result');r.style.display='block';\n r.innerHTML=`Natija: <strong>${score}/5<\/strong><br>${answered<5?'Barcha savollarga javob bering. ':''}${score===5?'Ajoyib! Mavzuni yaxshi tushunibsiz.':score>=3?'Yaxshi! Xatolarni ko‘rib, mavzuni yana takrorlang.':'Mavzuni qayta o‘qib, yana urinib ko‘ring.'}`;\n};\ndocument.getElementById('clear').onclick=()=>{setTimeout(()=>document.getElementById('result').style.display='none',0)};\ndrawParticles();updateSpeed();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Qaynash va bug‘lanish", "i": "♨️", "g": "Moddalar", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Qaynash va bug‘lanish<\/title>\n<style>\n:root{--ink:#17324d;--blue:#1677c8;--cyan:#dff6ff;--orange:#ff9e43;--bg:#f3f8fc;--green:#198754}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}\nheader{padding:34px 18px;text-align:center;color:white;background:linear-gradient(135deg,#075985,#0ea5e9,#67e8f9)}\nheader h1{margin:0;font-size:clamp(1.8rem,4vw,3rem)}header p{margin:8px auto 0;max-width:800px}\nmain{max-width:1100px;margin:auto;padding:20px}\nnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 24px}\nnav a{background:white;color:#075985;border:1px solid #c6e7f6;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:bold}\nsection,.card{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #17324d12}\nh2{color:#075985;margin-top:0}h3{color:#0e7490}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.info{background:#f0f9ff;border-left:5px solid #0ea5e9;padding:14px;border-radius:10px}\n.warn{background:#fff7ed;border-left:5px solid #fb923c;padding:14px;border-radius:10px}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;cursor:pointer;font-weight:bold}\nbutton:hover{filter:brightness(.93)}button.secondary{background:#64748b}button.orange{background:#ea580c}\n.sim-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}\n@media(max-width:700px){.sim-layout{grid-template-columns:1fr}main{padding:12px}}\ncanvas{width:100%;height:300px;background:linear-gradient(#e0f7ff 0 48%,#fef3c7 48%);border:2px solid #bae6fd;border-radius:14px;display:block}\n.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}\nlabel{font-weight:bold}input[type=range]{width:min(260px,100%)}\n.stat{background:#ecfeff;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.5rem;color:#0369a1}\ntable{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border:1px solid #d5e5ef;text-align:left}th{background:#e0f2fe}\n.quiz-q{padding:15px;border:1px solid #dbeafe;border-radius:12px;margin:12px 0}.quiz-q label{display:block;font-weight:normal;margin:6px 0;cursor:pointer}\n#result{font-size:1.1rem;font-weight:bold;margin-top:14px}\nfooter{text-align:center;padding:24px;color:#527086}\n.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:.85rem;font-weight:bold}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"pill\">6-sinf • Tabiiy fan<\/span>\n  <h1>Qaynash va bug‘lanish<\/h1>\n  <p>Suyuqlik qanday qilib gazga aylanadi? Interaktiv simulyatsiya, hayotiy misollar va mini-test orqali o‘rganing.<\/p>\n<\/header>\n<main>\n<nav>\n<a href=\"#nazariya\">Nazariya<\/a><a href=\"#simulyatsiya\">Simulyatsiya<\/a><a href=\"#taqqoslash\">Taqqoslash<\/a><a href=\"#hayot\">Hayotda<\/a><a href=\"#test\">Mini-test<\/a>\n<\/nav>\n<section id=\"nazariya\">\n<h2>1. Asosiy tushunchalar<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><h3>💨 Bug‘lanish<\/h3><p><b>Bug‘lanish<\/b> — suyuqlikning sirtidan molekulalar ajralib chiqib, gaz holatiga o‘tishidir. U har qanday haroratda sodir bo‘lishi mumkin.<\/p><p><b>Misol:<\/b> ho‘l kiyimning qurishi, ko‘l yuzasidan suvning bug‘lanishi.<\/p><\/div>\n<div class=\"card\"><h3>♨️ Qaynash<\/h3><p><b>Qaynash<\/b> — suyuqlikning butun hajmida bug‘ pufakchalari hosil bo‘lishi bilan kechadigan jadal bug‘lanish jarayonidir.<\/p><p><b>Misol:<\/b> isitilayotgan choynakdagi suvning pufakchalar hosil qilib qaynashi.<\/p><\/div>\n<div class=\"card\"><h3>🌡️ Qaynash harorati<\/h3><p>Normal atmosfera bosimida toza suv taxminan <b>100 °C<\/b> da qaynaydi. Bosim o‘zgarsa, qaynash harorati ham o‘zgaradi.<\/p><\/div>\n<\/div>\n<div class=\"info\"><b>Molekulalar qanday harakatlanadi?<\/b> Suyuqlik molekulalari doimo harakatda. Yetarli energiyaga ega sirt molekulalari suyuqlikni tark etadi — bu bug‘lanish. Qaynashda esa suyuqlik ichida ham bug‘ pufakchalari hosil bo‘ladi.<\/div>\n<\/section>\n\n<section id=\"simulyatsiya\">\n<h2>2. Interaktiv simulyatsiya<\/h2>\n<p>Rejimni tanlang, haroratni o‘zgartiring va <b>“Boshlash”<\/b> tugmasini bosing. Rangli doiralar — suyuqlik molekulalarining soddalashtirilgan modeli.<\/p>\n<div class=\"sim-layout\">\n<div>\n<canvas id=\"scene\" width=\"600\" height=\"360\" aria-label=\"Bug‘lanish va qaynash simulyatsiyasi\"><\/canvas>\n<div class=\"controls\">\n<label for=\"mode\">Jarayon:<\/label>\n<select id=\"mode\"><option value=\"evap\">Bug‘lanish<\/option><option value=\"boil\">Qaynash<\/option><\/select>\n<\/div>\n<div class=\"controls\">\n<label for=\"temp\">Harorat: <span id=\"tempVal\">25<\/span> °C<\/label>\n<input id=\"temp\" type=\"range\" min=\"10\" max=\"100\" value=\"25\">\n<\/div>\n<div class=\"controls\">\n<button id=\"start\">▶ Boshlash<\/button><button id=\"pause\" class=\"secondary\">⏸ To‘xtatish<\/button><button id=\"reset\" class=\"orange\">↺ Qayta boshlash<\/button>\n<\/div>\n<\/div>\n<div>\n<div class=\"grid\">\n<div class=\"stat\"><strong id=\"state\">Sekin bug‘lanish<\/strong><span>Jarayon holati<\/span><\/div>\n<div class=\"stat\"><strong id=\"speed\">Past<\/strong><span>Molekulalar harakati<\/span><\/div>\n<\/div>\n<h3>Hozir nimani kuzatyapsiz?<\/h3>\n<p id=\"explain\">Suyuqlik yuzasidagi ayrim molekulalar havoga chiqmoqda. Pufakchalar yo‘q.<\/p>\n<div class=\"warn\">Model tushuntirish uchun soddalashtirilgan. Harorat slayderi haqiqiy laboratoriya o‘lchovi emas.<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"taqqoslash\">\n<h2>3. Bug‘lanish va qaynash farqi<\/h2>\n<table>\n<thead><tr><th>Belgi<\/th><th>Bug‘lanish<\/th><th>Qaynash<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Qayerda sodir bo‘ladi?<\/td><td>Suyuqlik sirtida<\/td><td>Butun hajmida<\/td><\/tr>\n<tr><td>Qaysi haroratda?<\/td><td>Har qanday haroratda<\/td><td>Muayyan qaynash haroratida<\/td><\/tr>\n<tr><td>Ko‘rinishi<\/td><td>Odatda sezilarsiz, pufakchasiz<\/td><td>Pufakchalar paydo bo‘ladi<\/td><\/tr>\n<tr><td>Tezligiga ta’sir qiluvchi omillar<\/td><td>Harorat, sirt maydoni, shamol, suyuqlik turi<\/td><td>Asosan bosim va berilayotgan issiqlik<\/td><\/tr>\n<tr><td>Harorat<\/td><td>Bug‘lanish suyuqlikni sovitishi mumkin<\/td><td>Toza modda qaynab turganda, berilgan bosimda harorat deyarli o‘zgarmaydi<\/td><\/tr>\n<\/tbody><\/table>\n<\/section>\n\n<section id=\"hayot\">\n<h2>4. Kundalik hayotdan misollar<\/h2>\n<div class=\"grid\">\n<div class=\"info\"><b>👕 Kiyim qurishi<\/b><br>Quyosh va shamol bug‘lanishni tezlashtiradi. Kiyimning ochiq yoyilishi sirt maydonini oshiradi.<\/div>\n<div class=\"info\"><b>🥵 Terlash<\/b><br>Ter bug‘langanda tanadan issiqlik oladi. Shu sababli odam salqinlikni his qiladi.<\/div>\n<div class=\"info\"><b>🏔️ Tog‘da suv qaynashi<\/b><br>Balandlikda atmosfera bosimi pastroq bo‘lgani uchun suv 100 °C dan past haroratda qaynashi mumkin.<\/div>\n<div class=\"info\"><b>❄️ Qor va muz<\/b><br>Qattiq moddaning suyuqlikka aylanmasdan gazga o‘tishi sublimatsiya deyiladi. Bu bug‘lanishdan boshqa jarayon.<\/div>\n<\/div>\n<h3>O‘ylab ko‘ring<\/h3>\n<p>Bir xil miqdordagi suv keng likopcha va tor stakanga solindi. Qaysi biridagi suv tezroq bug‘lanadi?<\/p>\n<button class=\"secondary\" onclick=\"document.getElementById('answer').hidden=false\">Javobni ko‘rish<\/button>\n<p id=\"answer\" hidden><b>Javob:<\/b> keng likopchadagi suv tezroq bug‘lanadi, chunki uning ochiq sirt maydoni kattaroq.<\/p>\n<\/section>\n\n<section id=\"test\">\n<h2>5. Bilimingizni sinab ko‘ring<\/h2>\n<p>Har bir savol uchun bitta javobni tanlang, so‘ng “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Bug‘lanish qayerda sodir bo‘ladi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Suyuqlikning faqat tubida<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"b\"> Suyuqlik sirtida<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"c\"> Faqat 100 °C da<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Qaynashning muhim belgisi qaysi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Suyuqlik ichida bug‘ pufakchalari hosil bo‘ladi<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"b\"> Suyuqlik umuman bug‘lanmaydi<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"c\"> Faqat sovuqda sodir bo‘ladi<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Suvning bug‘lanishini qaysi omil tezlashtirishi mumkin?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Sirt maydonini kamaytirish<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"b\"> Shamolni to‘xtatish<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"c\"> Haroratni oshirish<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Normal atmosfera bosimida suv taxminan necha °C da qaynaydi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> 0 °C<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"b\"> 100 °C<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"c\"> 50 °C<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Ter bug‘langanda odam nega salqinlikni sezadi?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Bug‘lanish tanadan issiqlik oladi<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"b\"> Tana issiqlik ishlab chiqarmay qo‘yadi<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"c\"> Ter muzga aylanadi<\/label><\/div>\n<button type=\"button\" id=\"check\">Natijani tekshirish<\/button> <button type=\"reset\" class=\"secondary\" id=\"clear\">Qayta ishlash<\/button>\n<\/form>\n<div id=\"result\" role=\"status\"><\/div>\n<\/section>\n<section>\n<h2>6. Dars yakuni<\/h2>\n<ul>\n<li>Bug‘lanish suyuqlik sirtida va har qanday haroratda sodir bo‘lishi mumkin.<\/li>\n<li>Qaynash suyuqlikning butun hajmida bug‘ pufakchalari hosil bo‘lishi bilan kechadi.<\/li>\n<li>Harorat, sirt maydoni va shamol bug‘lanish tezligiga ta’sir qiladi.<\/li>\n<li>Qaynash harorati tashqi bosimga bog‘liq.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan • Interaktiv o‘quv materiali<\/footer>\n<script>\nconst canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');\nconst mode=document.getElementById('mode'),temp=document.getElementById('temp');\nconst tempVal=document.getElementById('tempVal'),state=document.getElementById('state'),speed=document.getElementById('speed'),explain=document.getElementById('explain');\nlet particles=[],vapors=[],running=true,frame=0;\nfunction resetParticles(){particles=[];vapors=[];for(let i=0;i<70;i++)particles.push({x:65+Math.random()*470,y:165+Math.random()*130,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,r:4+Math.random()*2});frame=0}\nfunction updateText(){\n const t=+temp.value,boil=mode.value==='boil';\n tempVal.textContent=t;\n if(boil){state.textContent=t>=100?'Qaynash modeli':'Isitilmoqda';speed.textContent=t>=100?'Juda tez':t>=60?'Tez':'O‘rtacha';explain.textContent=t>=100?'Pufakchalar suyuqlik ichida paydo bo‘lib, yuqoriga ko‘tariladi. Modelda 100 °C — odatiy bosimdagi suv uchun ko‘rsatkich.':'Suyuqlik qizimoqda. Harorat qaynash nuqtasiga yetmaguncha qaynash to‘liq boshlanmaydi.'}\n else {state.textContent=t>=70?'Tez bug‘lanish':t>=35?'O‘rtacha bug‘lanish':'Sekin bug‘lanish';speed.textContent=t>=70?'Tez':t>=35?'O‘rtacha':'Past';explain.textContent='Suyuqlik sirtidan ayrim molekulalar havoga chiqadi. Bug‘lanish uchun qaynash haroratigacha isitish shart emas.'}\n}\nfunction draw(){\n ctx.clearRect(0,0,canvas.width,canvas.height);\n ctx.fillStyle='#bae6fd';ctx.fillRect(0,0,600,175);\n ctx.fillStyle='#38bdf8';ctx.fillRect(45,165,510,150);\n ctx.strokeStyle='#0369a1';ctx.lineWidth=4;ctx.strokeRect(45,165,510,150);\n ctx.fillStyle='#f59e0b';ctx.fillRect(210,322,180,12);\n ctx.fillStyle='#92400e';ctx.font='bold 15px Arial';ctx.fillText('Issiqlik manbai',244,350);\n ctx.fillStyle='#075985';ctx.font='bold 16px Arial';ctx.fillText(mode.value==='boil'?'QAYNASH MODELI':'BUG‘LANISH MODELI',20,28);\n let boil=mode.value==='boil',t=+temp.value,activity=(.4+t/55);\n particles.forEach(p=>{\n  if(running){p.x+=p.vx*activity;p.y+=p.vy*activity;\n   if(p.x<52||p.x>548)p.vx*=-1;\n   if(p.y<171||p.y>309)p.vy*=-1;\n   if(boil&&t>=95&&Math.random()<.025){vapors.push({x:p.x,y:p.y,r:3+Math.random()*4,life:55})}\n   if(!boil&&Math.random()<t/8000&&p.y<190){vapors.push({x:p.x,y:p.y,r:3,life:60});p.y=290}\n  }\n  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#075985';ctx.fill();\n });\n vapors.forEach(v=>{if(running){v.y-=1.1;v.life--}ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();ctx.strokeStyle='#0284c7';ctx.stroke()});\n vapors=vapors.filter(v=>v.life>0&&v.y>30);\n if(running)frame++;\n requestAnimationFrame(draw);\n}\ndocument.getElementById('start').onclick=()=>{running=true};\ndocument.getElementById('pause').onclick=()=>{running=false};\ndocument.getElementById('reset').onclick=()=>{resetParticles();running=true};\nmode.onchange=()=>{resetParticles();updateText()};\ntemp.oninput=updateText;\nresetParticles();updateText();draw();\ndocument.getElementById('check').onclick=()=>{\n const answers={q1:'b',q2:'a',q3:'c',q4:'b',q5:'a'};let score=0,answered=0;\n for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen){answered++;if(chosen.value===a)score++}}\n const result=document.getElementById('result');\n if(answered<5){result.textContent='Iltimos, barcha 5 ta savolga javob bering. Hozircha '+answered+' ta savol belgilangan.';result.style.color='#b45309';return}\n result.textContent='Natija: '+score+'/5. '+(score===5?'Ajoyib! Mavzuni juda yaxshi tushunibsiz.':score>=3?'Yaxshi! Xatolarni ko‘rib, mavzuni yana takrorlang.':'Mavzuni yana bir bor o‘qing va qayta urinib ko‘ring.');\n result.style.color=score>=4?'#198754':'#b45309';\n};\ndocument.getElementById('clear').onclick=()=>{document.getElementById('result').textContent=''};\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Massa, og‘irlik va gravitatsiya", "i": "⚖️", "g": "Fizika", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Massa, og‘irlik va gravitatsiya kuchi<\/title>\n<style>\n:root{--navy:#14213d;--blue:#2563eb;--sky:#eaf4ff;--gold:#fbbf24;--green:#15803d;--ink:#1f2937;--muted:#64748b;--card:#fff}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f3f7fc;line-height:1.65}\nheader{background:linear-gradient(135deg,#14213d,#2563eb);color:white;padding:34px 18px;text-align:center}\nheader .tag{display:inline-block;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:5px 13px;font-size:.9rem}\nh1{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.2;margin:15px 0 10px}header p{max-width:760px;margin:auto;color:#e7efff}\nnav{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 3px 12px #0f172a12;display:flex;gap:8px;overflow-x:auto;padding:10px}\nnav a{white-space:nowrap;text-decoration:none;color:#1d4ed8;background:#eff6ff;padding:8px 12px;border-radius:10px;font-size:.92rem}\nmain{max-width:1050px;margin:22px auto;padding:0 14px}.card{background:var(--card);padding:22px;margin:16px 0;border-radius:18px;box-shadow:0 5px 20px #0f172a0b;border:1px solid #e5eaf2}\nh2{color:#173b78;margin-top:0}h3{color:#1d4ed8}.lead{font-size:1.06rem}.callout{padding:14px 16px;background:#eff6ff;border-left:5px solid #3b82f6;border-radius:10px;margin:14px 0}.warning{background:#fff7ed;border-left-color:#f59e0b}.good{background:#f0fdf4;border-left-color:#22c55e}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{padding:11px;border:1px solid #dbe3ef;text-align:left;vertical-align:top}th{background:#eaf2ff;color:#183b73}\n.formula{font-size:1.5rem;font-weight:bold;text-align:center;background:#14213d;color:#fff;border-radius:12px;padding:15px;margin:14px 0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.mini{padding:16px;border:1px solid #dce6f4;border-radius:14px;background:#fbfdff}\nbutton{border:0;border-radius:10px;padding:10px 15px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}button:hover{filter:brightness(.94)}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;max-width:100%}\n.sim{background:linear-gradient(180deg,#e0f2fe,#f8fafc);border-radius:15px;padding:18px;text-align:center}.planet{font-size:4.5rem;line-height:1.3}.readout{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.readout div{background:white;border:1px solid #dbeafe;border-radius:12px;padding:12px 18px;min-width:140px}.value{font-size:1.5rem;color:#1d4ed8;font-weight:bold}.scale{width:170px;height:18px;border-radius:20px;background:#cbd5e1;margin:12px auto;overflow:hidden}.scale span{display:block;height:100%;background:#2563eb;width:100%;transition:width .3s}\n.question{padding:15px;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0}.question label{display:block;margin:6px 0;cursor:pointer}.feedback{font-weight:bold;margin-top:10px}.small{color:var(--muted);font-size:.92rem}footer{text-align:center;padding:28px;color:#64748b}\n@media(max-width:600px){.card{padding:16px}th,td{padding:8px;font-size:.92rem}.formula{font-size:1.25rem}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"tag\">6-sinf • Tabiiy fanlar • Fizika bo‘limi<\/span>\n  <h1>Massa, og‘irlik va gravitatsiya kuchi<\/h1>\n  <p>Jismlar nima uchun Yerga tortiladi? Massa va og‘irlikning farqi nimada? Interaktiv simulyatsiya, misollar va testlar orqali o‘rganamiz.<\/p>\n<\/header>\n<nav>\n<a href=\"#maqsad\">Dars maqsadi<\/a><a href=\"#massa\">Massa va og‘irlik<\/a><a href=\"#gravitatsiya\">Gravitatsiya<\/a><a href=\"#simulyatsiya\">Simulyatsiya<\/a><a href=\"#misollar\">Misollar<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"maqsad\">\n<h2>1. Dars maqsadi<\/h2>\n<div class=\"grid\">\n<div class=\"mini\"><h3>📘 Bilim<\/h3><p>Massa, og‘irlik va gravitatsiya tushunchalarini izohlash.<\/p><\/div>\n<div class=\"mini\"><h3>🧮 Hisoblash<\/h3><p>P = m × g formulasi yordamida og‘irlikni hisoblash.<\/p><\/div>\n<div class=\"mini\"><h3>🔎 Kuzatish<\/h3><p>Turli osmon jismlarida massa bir xil, og‘irlik esa turlicha bo‘lishini ko‘rish.<\/p><\/div>\n<\/div>\n<div class=\"callout\"><b>Esda tuting:<\/b> massa — jismdagi modda miqdorini tavsiflaydi. Og‘irlik esa jismning gravitatsiya ta’sirida tayanchga yoki osmaga ko‘rsatadigan kuchidir.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"massa\">\n<h2>2. Massa va og‘irlik orasidagi farq<\/h2>\n<p class=\"lead\">Kundalik suhbatda “vaznim 40 kg” deyish odatiy. Fizikada esa kilogramm massa birligi, nyuton kuch birligidir.<\/p>\n<table>\n<thead><tr><th>Xususiyat<\/th><th>Massa (m)<\/th><th>Og‘irlik (P)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Ma’nosi<\/td><td>Jismning inertligini va modda miqdorini tavsiflaydi.<\/td><td>Jismning tayanchga yoki osmaga gravitatsiya sabab ko‘rsatadigan kuchi.<\/td><\/tr>\n<tr><td>Birligi<\/td><td>Kilogramm (kg), gramm (g)<\/td><td>Nyuton (N)<\/td><\/tr>\n<tr><td>O‘lchash<\/td><td>Tarozi yordamida<\/td><td>Dinamometr yordamida<\/td><\/tr>\n<tr><td>Joyga bog‘liqligi<\/td><td>Joy o‘zgarsa ham odatda o‘zgarmaydi.<\/td><td>Gravitatsiya va vaziyatga qarab o‘zgarishi mumkin.<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"callout warning\"><b>Muhim aniqlik:<\/b> tarozi kundalik hayotda ko‘pincha kilogrammda ko‘rsatadi, lekin kuchni o‘lchaydigan dinamometr nyutonda ko‘rsatadi. Og‘irlik — gravitatsiya kuchi bilan bog‘liq kuch; uni “massa” bilan adashtirmang.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"gravitatsiya\">\n<h2>3. Gravitatsiya kuchi nima?<\/h2>\n<p>Gravitatsiya — massaga ega jismlarning bir-birini tortish hodisasi. Yer bizni o‘ziga tortgani uchun biz yer yuzasida turamiz, tashlab yuborilgan to‘p esa pastga tushadi. Quyoshning gravitatsiyasi sayyoralarni o‘z orbitasida ushlab turishga yordam beradi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><h3>🌍 Yer<\/h3><p>Yer yuzasida g taxminan 9,8 N/kg. Maktabdagi sodda hisoblarda 10 N/kg deb olinadi.<\/p><\/div>\n<div class=\"mini\"><h3>🌙 Oy<\/h3><p>Oy sirtida tortishish Yerdagidan taxminan 6 marta kuchsiz. Shu sababli astronavtning og‘irligi kamayadi.<\/p><\/div>\n<div class=\"mini\"><h3>🪐 Boshqa sayyoralar<\/h3><p>Har bir sayyorada gravitatsiya turlicha. Shu bois bir xil massali jismning og‘irligi ham turlicha bo‘ladi.<\/p><\/div>\n<\/div>\n<h3>Og‘irlikni hisoblash formulasi<\/h3>\n<div class=\"formula\">P = m × g<\/div>\n<ul>\n<li><b>P<\/b> — og‘irlik kuchi (nyuton, N);<\/li>\n<li><b>m<\/b> — massa (kilogramm, kg);<\/li>\n<li><b>g<\/b> — gravitatsion maydon kuchlanganligi, Yerda taxminan 9,8 N/kg (sodda hisobda 10 N/kg).<\/li>\n<\/ul>\n<div class=\"callout good\"><b>Oddiy misol:<\/b> massasi 40 kg bo‘lgan bola uchun Yerda g ≈ 10 N/kg deb olsak, P = 40 × 10 = 400 N.<\/div>\n<p><b>Vaznsizlik haqida:<\/b> kosmik kemada odam “suzib yurgandek” ko‘rinishi gravitatsiya umuman yo‘qligini anglatmaydi. Kema va uning ichidagi odam birgalikda erkin tushish holatida bo‘lgani uchun tayanch bosimi sezilmaydi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"simulyatsiya\">\n<h2>4. Interaktiv simulyatsiya: sayyorani almashtiring<\/h2>\n<p>Massa qiymatini kiriting, so‘ng osmon jismini tanlang. Massa o‘zgarmaydi, og‘irlik esa tanlangan joydagi g qiymatiga qarab hisoblanadi.<\/p>\n<div class=\"sim\">\n<div class=\"planet\" id=\"planetIcon\">🌍<\/div>\n<label for=\"massInput\"><b>Jism massasi (kg):<\/b><\/label>\n<input id=\"massInput\" type=\"number\" min=\"0.1\" max=\"10000\" step=\"0.1\" value=\"40\">\n<div style=\"margin:14px\"><label for=\"world\"><b>Osmon jismi:<\/b><\/label>\n<select id=\"world\">\n<option value=\"9.8\" data-icon=\"🌍\">Yer — g = 9,8 N/kg<\/option>\n<option value=\"1.6\" data-icon=\"🌙\">Oy — g = 1,6 N/kg<\/option>\n<option value=\"3.7\" data-icon=\"🔴\">Mars — g = 3,7 N/kg<\/option>\n<option value=\"24.8\" data-icon=\"🪐\">Yupiter — g = 24,8 N/kg<\/option>\n<\/select><\/div>\n<div class=\"readout\">\n<div><div>Massa<\/div><div class=\"value\" id=\"massOut\">40 kg<\/div><\/div>\n<div><div>Og‘irlik<\/div><div class=\"value\" id=\"weightOut\">392 N<\/div><\/div>\n<div><div>g qiymati<\/div><div class=\"value\" id=\"gOut\">9,8 N/kg<\/div><\/div>\n<\/div>\n<div class=\"scale\"><span id=\"scaleFill\"><\/span><\/div>\n<p id=\"simText\">Yerda 40 kg massali jismning og‘irligi taxminan 392 N.<\/p>\n<button onclick=\"resetSim()\">Boshlang‘ich holat<\/button>\n<\/div>\n<p class=\"small\">Simulyatsiya ta’limiy modeldir. Hisoblashda P = m × g formulasi ishlatiladi; natija ikki xonagacha yaxlitlanadi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"misollar\">\n<h2>5. Yechilgan misollar<\/h2>\n<div class=\"mini\"><h3>1-misol<\/h3><p>Massasi 5 kg bo‘lgan sumkaning Yer sirtidagi og‘irligini toping. g = 10 N/kg.<\/p><p><b>Yechish:<\/b> P = m × g = 5 × 10 = <b>50 N<\/b>.<\/p><\/div>\n<div class=\"mini\"><h3>2-misol<\/h3><p>Massasi 30 kg bo‘lgan jism Oyda qanday og‘irlikka ega? g = 1,6 N/kg.<\/p><p><b>Yechish:<\/b> P = 30 × 1,6 = <b>48 N<\/b>. Massasi esa 30 kg bo‘lib qoladi.<\/p><\/div>\n<div class=\"mini\"><h3>3-misol<\/h3><p>Jismning massasi 2 kg. Yerda g = 9,8 N/kg. Og‘irligini hisoblang.<\/p><p><b>Yechish:<\/b> P = 2 × 9,8 = <b>19,6 N<\/b>.<\/p><\/div>\n<h3>Mustaqil mashq<\/h3>\n<p>Massasi 8 kg bo‘lgan jismning Yer sirtidagi og‘irligini g = 10 N/kg deb olib hisoblang.<\/p>\n<details><summary><b>Javobni ko‘rish<\/b><\/summary><p>P = 8 × 10 = <b>80 N<\/b>.<\/p><\/details>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>6. Bilimingizni sinab ko‘ring<\/h2>\n<p>Har bir savol uchun bitta javobni belgilang va “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"question\"><b>1. Massaning asosiy o‘lchov birligi qaysi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Nyuton (N)<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Kilogramm (kg)<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Metr (m)<\/label><\/div>\n<div class=\"question\"><b>2. Og‘irlik kuchini o‘lchash uchun qaysi asbob ishlatiladi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Dinamometr<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Termometr<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Chizg‘ich<\/label><\/div>\n<div class=\"question\"><b>3. P = m × g formuladagi g nimani bildiradi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Jismning hajmini<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Haroratni<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Gravitatsion maydon kuchlanganligini<\/label><\/div>\n<div class=\"question\"><b>4. Massasi 10 kg bo‘lgan jism Yerda g = 10 N/kg bo‘lsa, og‘irligi qancha?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> 10 N<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> 100 N<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> 1 kg<\/label><\/div>\n<div class=\"question\"><b>5. Bir xil jism Oydan Yerga olib kelinganda nima bo‘ladi?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Massasi 6 marta ortadi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Massasi yo‘qoladi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Massasi bir xil qoladi, og‘irligi ortadi<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button>\n<button type=\"reset\" style=\"background:#64748b\" onclick=\"document.getElementById('quizResult').textContent=''\">Qayta ishlash<\/button>\n<div class=\"feedback\" id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n\n<section class=\"card\">\n<h2>7. Dars yakuni — eslab qoling!<\/h2>\n<ul>\n<li>Massa kilogrammda (kg), og‘irlik kuchi nyutonda (N) o‘lchanadi.<\/li>\n<li>Massa odatda joy o‘zgarganda ham bir xil qoladi.<\/li>\n<li>Og‘irlik gravitatsiyaga bog‘liq va turli osmon jismlarida o‘zgaradi.<\/li>\n<li>Og‘irlikni hisoblash formulasi: <b>P = m × g<\/b>.<\/li>\n<li>Gravitatsiya — massaga ega jismlarning o‘zaro tortishish hodisasi.<\/li>\n<\/ul>\n<div class=\"callout good\"><b>O‘ylab ko‘ring:<\/b> Nima uchun Oyda astronavt balandroq sakray oladi? Javob: Oyda gravitatsiya kuchsizroq, shuning uchun astronavtning og‘irligi Yerdagidan kichikroq.<\/div>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fanlar • Massa, og‘irlik va gravitatsiya kuchi<br>O‘quv maqsadida tayyorlangan interaktiv HTML darsi<\/footer>\n<script>\nconst massInput=document.getElementById('massInput'),world=document.getElementById('world');\nfunction updateSim(){\n let m=parseFloat(massInput.value); if(!Number.isFinite(m)||m<0){m=0}\n let g=parseFloat(world.value),p=m*g;\n document.getElementById('massOut').textContent=m.toLocaleString('uz-UZ',{maximumFractionDigits:2})+' kg';\n document.getElementById('weightOut').textContent=p.toLocaleString('uz-UZ',{maximumFractionDigits:2})+' N';\n document.getElementById('gOut').textContent=g.toLocaleString('uz-UZ')+' N/kg';\n document.getElementById('planetIcon').textContent=world.selectedOptions[0].dataset.icon;\n document.getElementById('simText').textContent=world.selectedOptions[0].text.split(' — ')[0]+'da '+m+' kg massali jismning og‘irligi taxminan '+p.toLocaleString('uz-UZ',{maximumFractionDigits:2})+' N. Massa esa '+m+' kg bo‘lib qoladi.';\n document.getElementById('scaleFill').style.width=Math.min(100,(p/Math.max(m*24.8,1))*100)+'%';\n}\nfunction resetSim(){massInput.value=40;world.value='9.8';updateSim()}\nmassInput.addEventListener('input',updateSim);world.addEventListener('change',updateSim);updateSim();\nfunction checkQuiz(){\n const answers={q1:'b',q2:'a',q3:'c',q4:'b',q5:'c'};let score=0,answered=0;\n for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen){answered++;if(chosen.value===a)score++}}\n const result=document.getElementById('quizResult');\n if(answered<5){result.textContent='Iltimos, barcha 5 ta savolga javob bering. Hozircha '+answered+' ta savol belgilangan.';result.style.color='#b45309';return}\n result.textContent='Natija: '+score+'/5 ('+(score*20)+'%). '+(score===5?'Ajoyib! Mavzuni juda yaxshi tushunibsiz.':score>=3?'Yaxshi! Xatolarni ko‘rib, mavzuni yana bir marta takrorlang.':'Mavzuni qayta o‘qing va yana urinib ko‘ring.');\n result.style.color=score>=4?'#15803d':'#b45309';\n}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Harakatlanayotgan jismlarga ta’sir etuvchi kuchlar", "i": "🏃", "g": "Fizika", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Harakatlanayotgan jismlarga ta’sir qiluvchi kuchlar<\/title>\n<style>\n:root{--blue:#155eef;--navy:#14213d;--teal:#0f9d8a;--orange:#f59e0b;--bg:#f4f7fb;--ink:#243047}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}\nheader{background:linear-gradient(135deg,#123b75,#1677c8);color:white;padding:34px 18px;text-align:center}\nheader h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:8px auto;max-width:950px;line-height:1.2}\nheader p{margin:10px auto;max-width:780px}\n.badge{display:inline-block;background:#ffffff22;border:1px solid #ffffff55;padding:5px 12px;border-radius:30px;font-size:.9rem}\nnav{position:sticky;top:0;z-index:5;background:white;box-shadow:0 2px 12px #12213d14;padding:10px;display:flex;gap:8px;overflow-x:auto;justify-content:center}\nnav a{white-space:nowrap;text-decoration:none;color:#155eef;font-weight:bold;padding:7px 10px;border-radius:8px}nav a:hover{background:#eaf1ff}\nmain{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #2430470c;border:1px solid #e7edf5}\nh2{color:#123b75;margin-top:0;border-bottom:2px solid #eaf1ff;padding-bottom:8px}h3{color:#1767b7}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}\n.tile{border:1px solid #e2eaf5;border-radius:12px;padding:15px;background:#fbfdff}\n.icon{font-size:2rem}.note{background:#eef6ff;border-left:5px solid var(--blue);padding:13px 16px;border-radius:8px}.warning{background:#fff7e6;border-left:5px solid var(--orange);padding:13px 16px;border-radius:8px}\nbutton{border:0;background:var(--blue);color:white;padding:10px 15px;border-radius:9px;font-weight:bold;cursor:pointer}button:hover{filter:brightness(.92)}button.secondary{background:#e8eef8;color:#17345d}\nlabel{display:block;margin:8px 0;padding:10px;border:1px solid #e3eaf4;border-radius:9px;cursor:pointer}label:hover{background:#f4f8ff}\ninput[type=range]{width:100%}.result{font-weight:bold;margin-top:12px}.sim{background:#f6faff;border:1px solid #dce8f8;border-radius:13px;padding:16px}\n#motionStage{height:160px;position:relative;overflow:hidden;background:linear-gradient(#dff3ff 0 72%,#c9d7a5 72%);border-radius:10px;margin:12px 0}\n#ball{position:absolute;left:6%;bottom:30px;width:45px;height:45px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffcf67,#ed6b22 70%);box-shadow:0 4px 8px #0002}\n#arrow{position:absolute;left:8%;bottom:90px;font-size:1.6rem;color:#155eef;transition:left .2s}\n.force-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.force-row span{background:#eaf1ff;padding:5px 10px;border-radius:7px;font-size:.92rem}\ntable{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #dce5f0;padding:10px;text-align:left}th{background:#edf4ff}\nfooter{text-align:center;color:#65738a;padding:25px}\n.quiz-q{margin:16px 0;padding:14px;background:#fbfdff;border:1px solid #e3eaf4;border-radius:10px}\nsmall{color:#65738a}\n@media(max-width:600px){.card{padding:16px}nav{justify-content:flex-start}th,td{padding:7px;font-size:.9rem}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"badge\">6-sinf · Tabiiy fan<\/span>\n  <h1>Harakatlanayotgan jismlarga ta’sir qiluvchi kuchlar<\/h1>\n  <p>Kuchlar, ishqalanish, havo qarshiligi va Arximed kuchini kundalik hayot misollari hamda interaktiv tajribalar orqali o‘rganamiz.<\/p>\n<\/header>\n<nav>\n  <a href=\"#maqsad\">Dars maqsadi<\/a><a href=\"#kuch\">Kuch nima?<\/a><a href=\"#turlar\">Kuch turlari<\/a><a href=\"#suzish\">Suzish va cho‘kish<\/a><a href=\"#tajriba\">Simulyatsiya<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"maqsad\">\n<h2>1. Dars maqsadi va reja<\/h2>\n<div class=\"grid\">\n<div class=\"tile\"><div class=\"icon\">🎯<\/div><h3>Dars maqsadi<\/h3><p>O‘quvchilar kuchning jism harakatiga ta’sirini tushunadi, asosiy kuchlarni farqlaydi va jismlarning suzishi yoki cho‘kishini izohlaydi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">📚<\/div><h3>Dars rejasi<\/h3><ol><li>Kuch va uning ta’siri<\/li><li>Og‘irlik, ishqalanish va havo qarshiligi<\/li><li>Arximed kuchi, suzish va cho‘kish<\/li><li>Interaktiv tajriba va test<\/li><\/ol><\/div>\n<div class=\"tile\"><div class=\"icon\">🧠<\/div><h3>Asosiy tushuncha<\/h3><p>Kuch jismning tezligini, harakat yo‘nalishini yoki shaklini o‘zgartirishi mumkin.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"kuch\">\n<h2>2. Kuch nima va u qanday ta’sir qiladi?<\/h2>\n<p><b>Kuch<\/b> — jismlarning o‘zaro ta’sirini ifodalovchi fizik kattalik. Kuch <b>nyuton (N)<\/b> birligida o‘lchanadi. Kuchning yo‘nalishi ham, kattaligi ham muhim.<\/p>\n<div class=\"grid\">\n<div class=\"tile\"><div class=\"icon\">🚲<\/div><h3>Tezlikni o‘zgartiradi<\/h3><p>Pedal bosilganda velosiped tezlashadi. Tormozlanganda ishqalanish uni sekinlashtiradi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">⚽<\/div><h3>Yo‘nalishni o‘zgartiradi<\/h3><p>Uchib kelayotgan to‘pni tepish uning yo‘nalishini o‘zgartiradi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🛑<\/div><h3>Jismni to‘xtatadi<\/h3><p>Harakatga qarshi ta’sir qiluvchi kuch jismni sekinlashtirishi va to‘xtatishi mumkin.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🧽<\/div><h3>Shaklni o‘zgartiradi<\/h3><p>Plastilin yoki gubkani siqqanda u deformatsiyalanadi.<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Eslab qoling:<\/b> kuchlar ko‘pincha birgalikda ta’sir qiladi. Agar kuchlar teng va qarama-qarshi yo‘nalgan bo‘lsa, ular bir-birini muvozanatlashi mumkin.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"turlar\">\n<h2>3. Harakatlanayotgan jismlarga ta’sir qiluvchi kuchlar<\/h2>\n<div class=\"grid\">\n<div class=\"tile\"><div class=\"icon\">🌍<\/div><h3>Og‘irlik kuchi<\/h3><p>Yer jismlarni o‘ziga tortadi. Shu sababli yuqoriga otilgan to‘p yana pastga tushadi.<\/p><p><b>Yo‘nalishi:<\/b> Yer markazi tomon.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🛞<\/div><h3>Ishqalanish kuchi<\/h3><p>Bir-biriga tegib turgan sirtlar orasida yuzaga keladi va ko‘pincha harakatga qarshilik qiladi. Masalan, velosiped tormozi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🌬️<\/div><h3>Havo qarshiligi<\/h3><p>Jism havoda harakatlanganda havo bilan o‘zaro ta’sirlashadi. Odatda u harakatga qarshi yo‘naladi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">💧<\/div><h3>Arximed kuchi<\/h3><p>Suyuqlik yoki gaz ichidagi jismga yuqoriga yo‘nalgan ko‘taruvchi kuch ta’sir qiladi.<\/p><\/div>\n<\/div>\n<h3>Hayotiy misollar<\/h3>\n<table><thead><tr><th>Vaziyat<\/th><th>Asosiy kuch yoki ta’sir<\/th><th>Natija<\/th><\/tr><\/thead><tbody>\n<tr><td>To‘pning pastga tushishi<\/td><td>Og‘irlik kuchi<\/td><td>To‘p Yer tomon tezlanadi<\/td><\/tr>\n<tr><td>Chana qor ustida sirpanishi<\/td><td>Ishqalanish<\/td><td>Chana sekinlashadi<\/td><\/tr>\n<tr><td>Parashyutning tushishi<\/td><td>Havo qarshiligi<\/td><td>Tushish tezligi kamayadi<\/td><\/tr>\n<tr><td>Kemaning suvda turishi<\/td><td>Og‘irlik va Arximed kuchi<\/td><td>Kuchlar muvozanatlashadi<\/td><\/tr>\n<\/tbody><\/table>\n<\/section>\n\n<section class=\"card\" id=\"suzish\">\n<h2>4. Nima uchun ayrim jismlar suzadi, boshqalari cho‘kadi?<\/h2>\n<p>Suyuqlikka tushirilgan jismga pastga yo‘nalgan og‘irlik kuchi va yuqoriga yo‘nalgan <b>Arximed kuchi<\/b> ta’sir qiladi. Jismning qanday tutishi uning o‘rtacha zichligi va siqib chiqargan suyuqlik miqdoriga bog‘liq.<\/p>\n<div class=\"grid\">\n<div class=\"tile\"><div class=\"icon\">🪨<\/div><h3>Cho‘kadi<\/h3><p>Jismning o‘rtacha zichligi suvnikidan katta bo‘lsa, u odatda cho‘kadi. Masalan, kichik temir bo‘lagi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🪵<\/div><h3>Suzadi<\/h3><p>Jismning o‘rtacha zichligi suvnikidan kichik bo‘lsa, u suv yuzida suzishi mumkin. Masalan, yog‘och.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🚢<\/div><h3>Kema nega cho‘kmaydi?<\/h3><p>Kemaning ichi bo‘sh bo‘lgani uchun umumiy hajmiga nisbatan o‘rtacha zichligi kamayadi. Kema ko‘p suvni siqib chiqarib, yetarli ko‘taruvchi kuch hosil qiladi.<\/p><\/div>\n<\/div>\n<div class=\"warning\"><b>Plastilin tajribasi:<\/b> plastilinni zich dumaloq bo‘lak qilib suvga soling — u cho‘kishi mumkin. Uni qayiq shaklida yasang — keng, ichi bo‘sh shakli ko‘proq suvni siqib chiqarib, suzishiga yordam beradi.<\/div>\n<h3>Qog‘oz nega har xil tezlikda tushadi?<\/h3>\n<p>Yassi qog‘oz katta yuzasi bilan havoga qarshilik qiladi va sekin tushadi. G‘ijimlangan qog‘ozning havo bilan ta’sirlashadigan yuzasi kichikroq bo‘lgani uchun, odatda, tezroq tushadi. Ikkalasiga ham og‘irlik kuchi ta’sir qiladi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"tajriba\">\n<h2>5. Interaktiv simulyatsiya<\/h2>\n<p>Quyidagi boshqaruvlar bilan kuch va harakat o‘rtasidagi bog‘liqlikni kuzating. Bu soddalashtirilgan model bo‘lib, haqiqiy tajribadagi barcha omillarni hisobga olmaydi.<\/p>\n<div class=\"sim\">\n<h3>🚗 Jismning harakatini kuzatish<\/h3>\n<div id=\"motionStage\"><div id=\"arrow\">➡️<\/div><div id=\"ball\"><\/div><\/div>\n<label for=\"push\">Oldinga itarish kuchi: <b id=\"pushVal\">5<\/b><\/label><input id=\"push\" type=\"range\" min=\"0\" max=\"10\" value=\"5\">\n<label for=\"friction\">Ishqalanish kuchi: <b id=\"fricVal\">2<\/b><\/label><input id=\"friction\" type=\"range\" min=\"0\" max=\"10\" value=\"2\">\n<div class=\"force-row\"><span id=\"net\">Natijaviy kuch: 3 birlik<\/span><span id=\"motionText\">Jism tezlashadi<\/span><\/div>\n<button id=\"resetMotion\" class=\"secondary\">Boshlang‘ich holatga qaytarish<\/button>\n<p><small>Modelda oldinga itarish kuchi ishqalanishdan katta bo‘lsa jism tezlashadi; teng bo‘lsa tezligi o‘zgarmaydi; ishqalanish katta bo‘lsa sekinlashadi.<\/small><\/p>\n<\/div>\n<div class=\"sim\" style=\"margin-top:18px\">\n<h3>💧 Suvda suzish tajribasi<\/h3>\n<p>Jismning o‘rtacha zichligini tanlang:<\/p>\n<label><input type=\"radio\" name=\"density\" value=\"light\" checked> Suvdan kichik — masalan, yog‘och<\/label>\n<label><input type=\"radio\" name=\"density\" value=\"same\"> Suvga yaqin — muvozanatga kelishi mumkin<\/label>\n<label><input type=\"radio\" name=\"density\" value=\"heavy\"> Suvdan katta — masalan, temir bo‘lagi<\/label>\n<div id=\"water\" style=\"height:180px;background:linear-gradient(#d9f4ff,#55bde8);border:3px solid #b3e4f5;border-radius:12px;position:relative;overflow:hidden;margin:12px 0\">\n<div style=\"position:absolute;top:0;left:0;right:0;height:5px;background:#fff9\"><\/div>\n<div id=\"object\" style=\"position:absolute;left:calc(50% - 28px);top:25px;width:56px;height:56px;background:#bd7b43;border:3px solid #8e552a;border-radius:12px;transition:top .7s;box-shadow:0 3px 6px #1233\"><\/div>\n<\/div>\n<p class=\"result\" id=\"floatResult\" aria-live=\"polite\">Jism suv yuzida suzadi.<\/p>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>6. Bilimingizni tekshiring<\/h2>\n<p>Har bir savol uchun bitta javobni tanlang. So‘ng «Javoblarni tekshirish» tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Kuch qaysi birlikda o‘lchanadi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Kilogramm<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Nyuton<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Metr<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Velosiped tormozlanganda uni sekinlashtiradigan kuch qaysi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Ishqalanish kuchi<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Faqat Arximed kuchi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Yorug‘lik kuchi<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Arximed kuchi qaysi tomonga yo‘naladi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Pastga<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Har doim oldinga<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Yuqoriga<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Nima uchun g‘ijimlangan qog‘oz odatda tezroq tushadi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Uning massasi yo‘qoladi<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Havo qarshiligi kamroq bo‘ladi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Og‘irlik kuchi yo‘qoladi<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Kemaning suzishiga nima yordam beradi?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Faqat uning rangi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Keng, ichi bo‘sh shakli va ko‘taruvchi kuch<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Kema og‘irlik kuchiga ega emas<\/label><\/div>\n<button type=\"button\" id=\"checkQuiz\">Javoblarni tekshirish<\/button> <button type=\"reset\" class=\"secondary\" id=\"clearQuiz\">Qayta ishlash<\/button>\n<div class=\"result\" id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n\n<section class=\"card\">\n<h2>7. Darsni mustahkamlash<\/h2>\n<ul>\n<li>Uyda xavfsiz tarzda qog‘oz varaq va g‘ijimlangan qog‘ozni bir xil balandlikdan tashlab, tushish vaqtini solishtiring.<\/li>\n<li>Plastilindan shar va qayiq shaklini yasab, kattalar nazoratida suvda sinab ko‘ring.<\/li>\n<li>Daftaringizga uchta kundalik vaziyat yozing va har birida qaysi kuchlar ta’sir qilayotganini tushuntiring.<\/li>\n<\/ul>\n<div class=\"note\"><b>Xulosa:<\/b> harakatdagi jismlarga bir nechta kuch bir vaqtda ta’sir qilishi mumkin. Harakatning o‘zgarishi kuchlarning kattaligi va yo‘nalishiga bog‘liq. Suzish va cho‘kishda esa og‘irlik kuchi, Arximed kuchi, jism shakli va o‘rtacha zichlik muhim.<\/div>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan · Interaktiv dars materiali<\/footer>\n<script>\nconst push=document.getElementById('push'), friction=document.getElementById('friction');\nfunction updateMotion(){\n const p=+push.value, f=+friction.value, net=p-f;\n document.getElementById('pushVal').textContent=p;\n document.getElementById('fricVal').textContent=f;\n document.getElementById('net').textContent='Natijaviy kuch: '+net+' birlik';\n const text=net>0?'Jism tezlashadi':net<0?'Jism sekinlashadi':'Kuchlar muvozanatlashgan';\n document.getElementById('motionText').textContent=text;\n document.getElementById('ball').style.left=(6+Math.max(0,Math.min(10,p-f+5))*7)+'%';\n document.getElementById('arrow').style.left=(8+Math.max(0,Math.min(10,p-f+5))*7)+'%';\n}\npush.addEventListener('input',updateMotion);friction.addEventListener('input',updateMotion);\ndocument.getElementById('resetMotion').addEventListener('click',()=>{push.value=5;friction.value=2;updateMotion()});\nfunction updateFloat(){\n const value=document.querySelector('input[name=\"density\"]:checked').value;\n const obj=document.getElementById('object'), result=document.getElementById('floatResult');\n if(value==='light'){obj.style.top='15px';obj.style.background='#bd7b43';result.textContent='Jism suv yuzida suzadi: uning o‘rtacha zichligi suvnikidan kichik.'}\n else if(value==='same'){obj.style.top='65px';obj.style.background='#8c9aaa';result.textContent='Jism suyuqlik ichida muvozanatda turishi mumkin: o‘rtacha zichliklar yaqin.'}\n else{obj.style.top='118px';obj.style.background='#7c8795';result.textContent='Jism cho‘kadi: uning o‘rtacha zichligi suvnikidan katta.'}\n}\ndocument.querySelectorAll('input[name=\"density\"]').forEach(el=>el.addEventListener('change',updateFloat));\nconst answers={q1:'b',q2:'a',q3:'c',q4:'b',q5:'b'};\ndocument.getElementById('checkQuiz').addEventListener('click',()=>{\n let score=0, unanswered=0;\n for(const [q,a] of Object.entries(answers)){\n  const selected=document.querySelector('input[name=\"'+q+'\"]:checked');\n  if(!selected)unanswered++;else if(selected.value===a)score++;\n }\n const result=document.getElementById('quizResult');\n result.textContent='Natija: '+score+'/5 ta to‘g‘ri.'+(unanswered?' '+unanswered+' ta savol javobsiz qoldi.':'')+(score===5?' Ajoyib!':score>=3?' Yaxshi! Xatolarni ko‘rib chiqing.':' Mavzuni yana bir bor takrorlang.');\n result.style.color=score>=4?'#087f5b':'#b45309';\n});\ndocument.getElementById('clearQuiz').addEventListener('click',()=>{document.getElementById('quizResult').textContent=''});\nupdateMotion();updateFloat();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Elektr zanjir sxemalari", "i": "💡", "g": "Fizika", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Fizika — Elektr zanjir sxemalari<\/title>\n<style>\n:root{--bg:#eef5ff;--card:#fff;--ink:#172554;--blue:#2563eb;--green:#16a34a;--orange:#f59e0b;--muted:#52627a}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e0f2fe,#f8fafc 55%,#ede9fe);color:var(--ink);line-height:1.6}\nheader{padding:30px 18px;text-align:center;background:linear-gradient(120deg,#1d4ed8,#6d28d9);color:#fff}\nheader h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}header p{margin:0;font-size:17px}\nmain{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:var(--card);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #1e3a8a12;border:1px solid #dbeafe}\nh2{margin-top:0;color:#1d4ed8}h3{color:#4338ca}.plan{display:flex;gap:10px;flex-wrap:wrap}.plan span{background:#dbeafe;padding:8px 12px;border-radius:99px;font-weight:bold}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}\n.diagram{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:12px;text-align:center;overflow:hidden}.diagram svg{width:100%;height:auto;max-height:210px}\n.note{background:#eff6ff;border-left:5px solid #3b82f6;padding:12px 15px;border-radius:8px}.warn{background:#fff7ed;border-left:5px solid #f59e0b;padding:12px 15px;border-radius:8px}\nbutton,select{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}button{background:#2563eb;color:white;font-weight:bold}button:hover{filter:brightness(.94)}button.secondary{background:#475569}button.green{background:#15803d}\n.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.bulb{fill:#cbd5e1;stroke:#64748b;stroke-width:3}.bulb.on{fill:#fde047;stroke:#eab308;filter:drop-shadow(0 0 8px #facc15)}.wire{stroke:#64748b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.wire.live{stroke:#16a34a}.battery{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.label{font-size:13px;fill:#172554;font-weight:bold}.electron{fill:#16a34a;stroke:white;stroke-width:1}.result{font-weight:bold;color:#166534;min-height:28px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #cbd5e1;padding:10px;text-align:left}th{background:#dbeafe}\n.quiz-q{padding:14px;background:#f8fafc;border-radius:12px;margin:12px 0}.quiz-q label{display:block;margin:7px 0;cursor:pointer}.footer{text-align:center;color:var(--muted);padding:25px}\n@media(max-width:600px){.card{padding:16px}th,td{padding:7px;font-size:14px}}\n<\/style>\n<\/head>\n<body>\n<header><h1>⚡ Elektr zanjir sxemalari<\/h1><p>6-sinf Fizika • Nazariya, sxemalar va interaktiv simulyatsiya<\/p><\/header>\n<main>\n<section class=\"card\"><h2>📚 Dars rejasi<\/h2><div class=\"plan\"><span>1. Ketma-ket ulanish<\/span><span>2. Parallel ulanish<\/span><span>3. Chiroqlar yorqinligi<\/span><\/div><p>Elektr zanjiri — elektr to
