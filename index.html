play:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:18px;align-items:center}\n.bodybox{background:linear-gradient(#e9f7ff,#fff5ef);border-radius:18px;padding:10px;text-align:center;min-height:470px;position:relative;overflow:hidden}\nsvg{max-width:100%;height:auto}.organ-shape{stroke:#693e31;stroke-width:2;cursor:pointer;transition:filter .2s,stroke-width .2s}.organ-shape:hover,.organ-shape.active{filter:drop-shadow(0 0 5px #f4a261);stroke:#12352a;stroke-width:4}\n.food{fill:#ffd166;stroke:#9b6b00;stroke-width:1.5}.food-dot{animation:travel 6s linear infinite}\n@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}\n@keyframes travel{0%{transform:translateY(0)}100%{transform:translateY(190px)}}\n.pulse{animation:pulse 1.5s infinite;transform-origin:center}\n.info-panel{padding:18px;background:#e9f8ef;border-radius:16px;min-height:210px}\n.progress{height:14px;background:#e0e9e3;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#25a55f,#b2e95b);transition:width .4s}\ntable{border-collapse:collapse;width:100%;margin:10px 0}th,td{border:1px solid #d5e7da;padding:10px;text-align:left}th{background:#e1f5e7}\n.quizq{padding:15px;border:1px solid #dbece0;border-radius:12px;margin:12px 0}.quizq label{display:block;padding:5px;cursor:pointer}\n.notice{background:#fff5d7;border-left:5px solid #e7b42c;padding:13px;border-radius:10px}\nfooter{text-align:center;padding:25px;color:#567166}\n@media(max-width:700px){.sim-layout{grid-template-columns:1fr}.bodybox{min-height:390px}nav{position:static}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🥗 OVQAT HAZM QILISH SISTEMASI<\/h1>\n  <p>6-sinf uchun kengaytirilgan dars, animatsion model va interaktiv virtual tajriba<\/p>\n  <p>Ovqat og‘izdan kirib, organizmga foydali moddalar yetkazilguncha qanday yo‘l bosishini kuzating!<\/p>\n<\/header>\n<nav>\n<a href=\"#reja\">Dars rejasi<\/a><a href=\"#nazariya\">Nazariya<\/a><a href=\"#sim\">Simulyatsiya<\/a><a href=\"#hayvonlar\">Hayvonlar<\/a><a href=\"#model\">Model va tajriba<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"reja\">\n<h2>📚 Dars rejasi va maqsadlar<\/h2>\n<ol>\n<li>Odamning ovqat hazm qilish sistemasi organlarini tavsiflaymiz.<\/li>\n<li>Aksariyat umurtqali hayvonlar ovqat hazm qilish sistemasining o‘xshash jihatlarini o‘rganamiz.<\/li>\n<li>Modelda o‘rganilayotgan obyektning asosiy xususiyatlari qanday aks etishini bilib olamiz.<\/li>\n<li>Ilmiy tushunchani tasvirlashda modeldan foydalanamiz.<\/li>\n<\/ol>\n<div class=\"grid\">\n<div class=\"organ\"><b>🎯 Dars maqsadi<\/b><br>Ovqatning yo‘lini tushuntirish, organlarni vazifasi bilan bog‘lash va model yordamida hazm jarayonini ko‘rsatish.<\/div>\n<div class=\"organ\"><b>🔑 Asosiy tushuncha<\/b><br>Hazm qilish — ovqat tarkibidagi murakkab moddalarni organizm o‘zlashtira oladigan sodda moddalarga parchalash jarayoni.<\/div>\n<div class=\"organ\"><b>💡 O‘ylab ko‘ring<\/b><br>Nima uchun ovqatni yaxshilab chaynash kerak? Ovqatdagi oziq moddalar qayerda qonga o‘tadi?<\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"nazariya\">\n<h2>🧠 1. Ovqat hazm qilish nima?<\/h2>\n<p>Biz ovqat orqali energiya, o‘sish va to‘qimalarni tiklash uchun zarur moddalarni olamiz. Ammo non, go‘sht, meva va boshqa mahsulotlar tarkibidagi moddalar organizmga darhol tayyor holda singib ketmaydi. Ovqat mexanik ravishda maydalanadi, hazm shiralarining ta’sirida kimyoviy parchalanadi, foydali moddalar qonga so‘riladi, hazm bo‘lmagan qoldiqlar esa tashqariga chiqariladi.<\/p>\n<div class=\"grid\">\n<div class=\"organ\"><b>Mexanik hazm<\/b><br>Tishlar ovqatni maydalaydi, oshqozon va ichak mushaklari uni aralashtirib, siljitadi.<\/div>\n<div class=\"organ\"><b>Kimyoviy hazm<\/b><br>So‘lak, oshqozon shirasi, oshqozon osti bezi shirasi va ichak shirasi tarkibidagi fermentlar oziq moddalarni mayda qismlarga parchalaydi.<\/div>\n<div class=\"organ\"><b>So‘rilish<\/b><br>Hazm bo‘lgan oziq moddalar asosan ingichka ichak devori orqali qon va limfaga o‘tadi.<\/div>\n<div class=\"organ\"><b>Chiqarish<\/b><br>Suvning bir qismi yo‘g‘on ichakda so‘riladi, qolgan hazm bo‘lmagan qoldiqlar najas holida chiqariladi.<\/div>\n<\/div>\n<h3>Ovqatning yo‘li — 7 asosiy bosqich<\/h3>\n<div class=\"stage\"><span class=\"num\">1<\/span><div><b>Og‘iz bo‘shlig‘i<\/b> — tishlar ovqatni maydalaydi, til uni aralashtiradi, so‘lak ovqatni namlaydi va kraxmal hazmini boshlaydi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">2<\/span><div><b>Halqum<\/b> — yutilayotgan luqma og‘izdan qizilo‘ngach tomon o‘tadi. Yutishda nafas yo‘li himoyalanadi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">3<\/span><div><b>Qizilo‘ngach<\/b> — mushaklarning to‘lqinsimon qisqarishi ovqatni oshqozonga suradi. Bu harakat peristaltika deyiladi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">4<\/span><div><b>Oshqozon<\/b> — ovqat aralashtiriladi, oshqozon shirasi ta’sirida ayniqsa oqsillar hazmi boshlanadi. Ovqat suyuqroq aralashmaga aylanadi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">5<\/span><div><b>Ingichka ichak<\/b> — hazm jarayoni asosan shu yerda yakunlanadi. Oziq moddalar ichak devoridagi mayda tukchalar orqali qonga yoki limfaga so‘riladi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">6<\/span><div><b>Yo‘g‘on ichak<\/b> — suv va ayrim mineral moddalar so‘riladi, ichak bakteriyalari qoldiqlar bilan o‘zaro ta’sirlashadi, najas shakllanadi.<\/div><\/div>\n<div class=\"stage\"><span class=\"num\">7<\/span><div><b>To‘g‘ri ichak va anal teshigi<\/b> — najas vaqtincha to‘planadi va organizmdan chiqariladi.<\/div><\/div>\n<div class=\"notice\"><b>Eslab qoling:<\/b> jigar va oshqozon osti bezi ham hazm qilishda juda muhim. Jigar ishlab chiqaradigan o‘t suyuqligi yog‘larni mayda tomchilarga ajratishga yordam beradi; oshqozon osti bezi fermentlari oqsil, yog‘ va uglevodlar hazmida qatnashadi. Ovqat bu bezlardan o‘tmaydi — ularning suyuqliklari ichakka quyiladi.<\/div>\n<h3>Har bir organning vazifasi<\/h3>\n<table><tr><th>Organ<\/th><th>Asosiy vazifasi<\/th><th>Oddiy misol<\/th><\/tr>\n<tr><td>Og‘iz, tish va til<\/td><td>Maydalash, aralashtirish, so‘lak bilan namlash<\/td><td>Nonni chaynaganda yumshaydi<\/td><\/tr>\n<tr><td>Halqum<\/td><td>Yutish paytida ovqatni qizilo‘ngachga o‘tkazish<\/td><td>Luqma keyingi yo‘lga o‘tadi<\/td><\/tr>\n<tr><td>Qizilo‘ngach<\/td><td>Peristaltika bilan ovqatni siljitish<\/td><td>Ovqat oshqozonga yetadi<\/td><\/tr>\n<tr><td>Oshqozon<\/td><td>Aralashtirish va oshqozon shirasi bilan hazm qilish<\/td><td>Ovqat bo‘tqasimon aralashmaga aylanadi<\/td><\/tr>\n<tr><td>Jigar va o‘t pufagi<\/td><td>Jigar o‘t ishlab chiqaradi; o‘t pufagi uni saqlab, ichakka chiqaradi<\/td><td>Yog‘larning hazm bo‘lishiga yordam beradi<\/td><\/tr>\n<tr><td>Oshqozon osti bezi<\/td><td>Hazm fermentlari va boshqa suyuqliklarni ichakka chiqaradi<\/td><td>Oziq moddalarni parchalashga yordam beradi<\/td><\/tr>\n<tr><td>Ingichka ichak<\/td><td>Hazmni yakunlash va oziq moddalarni so‘rish<\/td><td>Oziq moddalar qonga o‘tadi<\/td><\/tr>\n<tr><td>Yo‘g‘on ichak<\/td><td>Suvni so‘rish va najasni shakllantirish<\/td><td>Qoldiq quyuqlashadi<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section class=\"card\" id=\"sim\">\n<h2>🎮 2. Interaktiv animatsion simulyatsiya<\/h2>\n<p>Quyidagi modelda ovqat luqmasi bosqichma-bosqich harakatlanadi. Bosqichlarni tugmalar bilan boshqaring yoki avtomatik animatsiyani yoqing. Organ ustiga bossangiz, uning vazifasi ko‘rsatiladi.<\/p>\n<div class=\"sim-layout\">\n<div class=\"bodybox\">\n<svg viewBox=\"0 0 380 500\" role=\"img\" aria-label=\"Ovqat hazm qilish sistemasi soddalashtirilgan modeli\">\n<path d=\"M147 35 Q190 3 233 35 Q255 60 241 93 L226 112 L226 145 Q260 153 276 184 L300 285 Q306 315 280 325 L260 279 L250 226 L245 200 L239 260 L235 360 L224 448 L195 448 L190 330 L184 448 L154 448 L145 350 L142 260 L135 200 L130 230 L120 285 L101 325 Q77 315 83 285 L104 184 Q120 153 154 145 L154 112 L139 93 Q125 60 147 35Z\" fill=\"#f3c8ae\" stroke=\"#c88e75\" stroke-width=\"2\"/>\n<path d=\"M167 80 Q190 92 213 80 L213 107 Q190 122 167 107Z\" fill=\"#f4a6a6\" class=\"organ-shape\" data-name=\"Og‘iz bo‘shlig‘i\" data-info=\"Tishlar ovqatni maydalaydi, til aralashtiradi, so‘lak ovqatni namlaydi va uglevodlar hazmini boshlaydi.\"/>\n<path d=\"M181 107 L199 107 L199 177 Q199 191 190 193 Q181 191 181 177Z\" fill=\"#e98a87\" class=\"organ-shape\" data-name=\"Qizilo‘ngach\" data-info=\"Qizilo‘ngach mushaklarining to‘lqinsimon qisqarishi ovqatni oshqozonga siljitadi.\"/>\n<path d=\"M199 200 Q220 188 238 210 Q250 237 225 257 Q205 270 188 250 Q176 231 188 215Z\" fill=\"#e8756d\" class=\"organ-shape pulse\" data-name=\"Oshqozon\" data-info=\"Oshqozon ovqatni aralashtiradi. Oshqozon shirasi, jumladan kislota va fermentlar, hazm jarayonida qatnashadi.\"/>\n<path d=\"M165 213 Q148 204 137 222 L132 246 Q145 260 165 245Z\" fill=\"#8fcf82\" class=\"organ-shape\" data-name=\"Jigar\" data-info=\"Jigar o‘t suyuqligini ishlab chiqaradi. O‘t yog‘larni mayda tomchilarga ajratishga yordam beradi.\"/>\n<path d=\"M157 251 Q167 240 180 251 L178 263 L160 263Z\" fill=\"#4c9b63\" class=\"organ-shape\" data-name=\"O‘t pufagi\" data-info=\"O‘t pufagi jigar ishlab chiqargan o‘t suyuqligini saqlaydi va kerak bo‘lganda ichakka chiqaradi.\"/>\n<path d=\"M177 269 Q200 258 221 271 L218 282 Q198 276 178 285Z\" fill=\"#e9b45b\" class=\"organ-shape\" data-name=\"Oshqozon osti bezi\" data-info=\"Oshqozon osti bezi fermentlarni ingichka ichakka chiqarib, oziq moddalar hazmiga yordam beradi.\"/>\n<path d=\"M153 276 C123 265 121 300 146 304 C175 310 209 296 223 309 C244 330 207 340 174 325 C140 310 126 342 151 354 C179 369 218 346 225 365 C231 385 197 392 165 375 C135 359 127 392 157 403 C186 416 224 397 222 416\" fill=\"none\" stroke=\"#e28b46\" stroke-width=\"15\" stroke-linecap=\"round\" class=\"organ-shape\" data-name=\"Ingichka ichak\" data-info=\"Ingichka ichakda hazm jarayoni yakunlanadi. Oziq moddalar ichak devoridan qon va limfaga so‘riladi.\"/>\n<path d=\"M139 277 L128 277 L128 405 Q128 427 150 427 L229 427 Q251 427 251 405 L251 277 L239 277 L239 400 Q239 414 225 414 L154 414 Q140 414 140 400Z\" fill=\"#b87bd0\" fill-opacity=\".85\" class=\"organ-shape\" data-name=\"Yo‘g‘on ichak\" data-info=\"Yo‘g‘on ichakda suv va ayrim minerallar so‘riladi. Hazm bo‘lmagan qoldiqlardan najas shakllanadi.\"/>\n<path d=\"M184 415 L184 444\" stroke=\"#8f5ab1\" stroke-width=\"12\" stroke-linecap=\"round\" class=\"organ-shape\" data-name=\"To‘g‘ri ichak va anal teshigi\" data-info=\"Najas to‘g‘ri ichakda vaqtincha to‘planadi va anal teshigi orqali tashqariga chiqariladi.\"/>\n<circle id=\"foodDot\" cx=\"190\" cy=\"86\" r=\"7\" class=\"food\" style=\"display:none\"/>\n<g font-size=\"10\" fill=\"#173d2c\" font-weight=\"bold\">\n<text x=\"15\" y=\"78\">Og‘iz<\/text><path d=\"M48 75 L163 90\" stroke=\"#567\" fill=\"none\"/>\n<text x=\"8\" y=\"160\">Qizilo‘ngach<\/text><path d=\"M75 157 L181 155\" stroke=\"#567\" fill=\"none\"/>\n<text x=\"275\" y=\"231\">Oshqozon<\/text><path d=\"M269 234 L232 235\" stroke=\"#567\" fill=\"none\"/>\n<text x=\"7\" y=\"246\">Jigar<\/text><path d=\"M37 243 L136 233\" stroke=\"#567\" fill=\"none\"/>\n<text x=\"8\" y=\"350\">Ingichka<\/text><text x=\"8\" y=\"362\">ichak<\/text><path d=\"M57 350 L145 348\" stroke=\"#567\" fill=\"none\"/>\n<text x=\"270\" y=\"345\">Yo‘g‘on<\/text><text x=\"270\" y=\"357\">ichak<\/text><path d=\"M267 350 L239 350\" stroke=\"#567\" fill=\"none\"/>\n<\/g>\n<\/svg>\n<\/div>\n<div>\n<div class=\"info-panel\"><h3 id=\"stepTitle\">Boshlashga tayyormisiz?<\/h3><p id=\"stepText\">“Keyingi bosqich” tugmasini bosing. Sariq nuqta ovqat luqmasini ifodalaydi. Bu biologik jarayonning soddalashtirilgan modeli.<\/p><p><b>Hayotiy bog‘lanish:<\/b> <span id=\"lifeText\">Ovqat tanaga qurilish materiali va energiya beradi.<\/span><\/p><\/div>\n<div style=\"margin-top:14px\"><button onclick=\"prevStep()\" class=\"secondary\">⬅ Oldingi<\/button><button onclick=\"nextStep()\">Keyingi bosqich ➜<\/button><button onclick=\"toggleAuto()\" id=\"autoBtn\" class=\"secondary\">▶ Avtoanimatsiya<\/button><button onclick=\"resetSim()\" class=\"secondary\">↺ Qayta boshlash<\/button><\/div>\n<p><b>Jarayon:<\/b> <span id=\"stepCount\">0 / 7<\/span><\/p><div class=\"progress\"><div class=\"bar\" id=\"progressBar\"><\/div><\/div>\n<h3>Organni tanlang<\/h3><p>Rasmdagi rangli organga bosing — vazifasi shu yerda tushuntiriladi.<\/p>\n<\/div>\n<\/div>\n<div class=\"notice\" style=\"margin-top:16px\"><b>Modelni kuzatish savoli:<\/b> Nega ovqat avval oshqozonga, undan keyin ingichka ichakka o‘tadi? Nima uchun oziq moddalar qonga asosan ingichka ichakda so‘riladi?<\/div>\n<\/section>\n\n<section class=\"card\" id=\"hayvonlar\">\n<h2>🐄 3. Umurtqali hayvonlarda ovqat hazm qilish sistemasi<\/h2>\n<p>Odam, mushuk, sigir va tovuq — barchasi umurtqali hayvonlar. Ularning ovqat hazm qilish sistemalarida umumiy qismlar mavjud, chunki barchasi ovqatni qabul qilishi, hazm qilishi, foydali moddalarni o‘zlashtirishi va qoldiqlarni chiqarishi kerak. Lekin oziqlanish turiga qarab ayrim organlar farq qiladi.<\/p>\n<table><tr><th>Hayvon<\/th><th>O‘xshash organlar<\/th><th>O‘ziga xos jihati<\/th><th>Nima uchun?<\/th><\/tr>\n<tr><td>Odam<\/td><td>Og‘iz, halqum, qizilo‘ngach, oshqozon, ingichka va yo‘g‘on ichak<\/td><td>Turli xil oziq-ovqatni iste’mol qiladi<\/td><td>Aralash oziqlanishga moslashgan<\/td><\/tr>\n<tr><td>Mushuk<\/td><td>Og‘iz, qizilo‘ngach, oshqozon, ichaklar<\/td><td>Ichaklari o‘simlikxo‘r hayvonlarnikiga nisbatan qisqaroq<\/td><td>Asosan go‘sht bilan oziqlanadi<\/td><\/tr>\n<tr><td>Sigir<\/td><td>Og‘iz, qizilo‘ngach, oshqozon, ichaklar<\/td><td>Oshqozoni to‘rt bo‘limli: katta qorin, to‘r qorin, qatqorin, shirdon<\/td><td>O‘simlikdagi sellyulozani mikroorganizmlar yordamida parchalashga moslashgan; kavsh qaytaradi<\/td><\/tr>\n<tr><td>Tovuq<\/td><td>Og‘iz, qizilo‘ngach, oshqozon, ingichka va yo‘g‘on ichak<\/td><td>Jig‘ildon va muskulli oshqozon mavjud; kloaka orqali chiqaradi<\/td><td>Tishlari yo‘q, donni muskulli oshqozonda maydalaydi<\/td><\/tr>\n<tr><td>Baliq<\/td><td>Og‘iz, halqum, qizilo‘ngach, oshqozon va ichak (turiga qarab)<\/td><td>Hazm sistemasi oziq turiga qarab farqlanadi<\/td><td>Suv muhitidagi turli oziq bilan oziqlanadi<\/td><\/tr>\n<\/table>\n<div class=\"grid\">\n<div class=\"organ\"><b>O‘xshashlik<\/b><br>Ovqat kiradigan yo‘l va hazm bo‘lmagan qoldiq chiqadigan yo‘l mavjud; ichaklar oziq moddalarni hazm qilish va so‘rishda qatnashadi.<\/div>\n<div class=\"organ\"><b>Farqlanish sababi<\/b><br>Tishlar, oshqozon bo‘limlari va ichak uzunligi hayvonning qanday oziqlanishiga moslashgan.<\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"model\">\n<h2>🧪 4. Ilmiy model va amaliy tajriba<\/h2>\n<p><b>Model<\/b> — haqiqiy obyekt yoki jarayonning muhim xususiyatlarini soddalashtirib ko‘rsatadigan tasvir, maket yoki tajriba. Bizning animatsiyamiz ovqatning yo‘lini ko‘rsatadi, lekin haqiqiy hazm qilishning barcha kimyoviy jarayonlarini to‘liq takrorlamaydi.<\/p>\n<h3>Oddiy sinf modeli: “Oshqozon va ichak”<\/h3>\n<ol>\n<li>O‘qituvchi nazoratida pishirilgan kartoshka yoki nonning mayda bo‘laklarini yopiladigan paketga soling.<\/li>\n<li>Oz miqdorda suv qo‘shing. Paketni yopib, tashqaridan sekin ezib-aralashtiring. Bu tishlar va oshqozon mushaklarining mexanik ishini ramziy ko‘rsatadi.<\/li>\n<li>Aralashmani mato yoki mayda teshikli elak ustiga qo‘ying. O‘tgan suyuqlikni kuzating. Bu ichak devoridan so‘rilish g‘oyasini soddalashtirib ko‘rsatadi.<\/li>\n<li>Natijani yozing: aralashma qanday o‘zgardi? Nima o‘tdi, nima qoldi?<\/li>\n<\/ol>\n<div class=\"notice\"><b>Xavfsizlik va aniqlik:<\/b> Tajriba namunasi yeyilmaydi. Bu modelda haqiqiy fermentlar, ichak tukchalari, qon aylanishi va barcha kimyoviy reaksiyalar to‘liq aks etmaydi. Model — tushuntirish vositasi, haqiqiy organ emas.<\/div>\n<h3>Modelning kuchli va cheklangan tomonlari<\/h3>\n<table><tr><th>Model nimani ko‘rsatadi?<\/th><th>Nimani to‘liq ko‘rsatmaydi?<\/th><\/tr>\n<tr><td>Ovqatning bosqichma-bosqich siljishi<\/td><td>Organlardagi murakkab mushak harakatlari<\/td><\/tr>\n<tr><td>Ovqatning maydalanishi va aralashishi<\/td><td>Fermentlarning aniq kimyoviy ta’siri<\/td><\/tr>\n<tr><td>Suyuqlikning elak/mato orqali o‘tishi<\/td><td>Ichak tukchalari orqali tanlab so‘rilish va qonga o‘tish<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>📝 5. Bilimingizni sinab ko‘ring<\/h2>\n<p>Har bir savolda bitta to‘g‘ri javobni tanlang. Yakunda natijangiz ko‘rsatiladi.<\/p>\n<form id=\"quiz\">\n<div class=\"quizq\"><b>1. Ovqat hazm bo‘lishi qayerda boshlanadi?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> Oshqozonda<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Og‘iz bo‘shlig‘ida<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Yo‘g‘on ichakda<\/label><\/div>\n<div class=\"quizq\"><b>2. Ovqatni qizilo‘ngach bo‘ylab siljitadigan harakat nima deyiladi?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> Fotosintez<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Nafas olish<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Peristaltika<\/label><\/div>\n<div class=\"quizq\"><b>3. Oziq moddalarning ko‘p qismi qayerda so‘riladi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Ingichka ichakda<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Qizilo‘ngachda<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Og‘izda<\/label><\/div>\n<div class=\"quizq\"><b>4. Yo‘g‘on ichakning muhim vazifalaridan biri qaysi?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> Havodan kislorod olish<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Suvning bir qismini so‘rish<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Qonni yurakka haydash<\/label><\/div>\n<div class=\"quizq\"><b>5. Jigar hazm qilishda qanday yordam beradi?<\/b><label><input type=\"radio\" name=\"q5\" value=\"a\"> Insulin bilan ovqatni chaynaydi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Ovqatni qizilo‘ngachdan o‘tkazadi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> O‘t suyuqligini ishlab chiqaradi<\/label><\/div>\n<div class=\"quizq\"><b>6. Sigir oshqozonining to‘rt bo‘limli bo‘lishi nimaga moslashgan?<\/b><label><input type=\"radio\" name=\"q6\" value=\"a\"> O‘simlik oziqni hazm qilishga<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> Uchishda yengil bo‘lishga<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> Suv ostida nafas olishga<\/label><\/div>\n<div class=\"quizq\"><b>7. Tovuqning muskulli oshqozoni nima uchun kerak?<\/b><label><input type=\"radio\" name=\"q7\" value=\"a\"> Ovqatni ko‘rish uchun<\/label><label><input type=\"radio\" name=\"q7\" value=\"b\"> Don va ovqatni maydalash uchun<\/label><label><input type=\"radio\" name=\"q7\" value=\"c\"> Qon ishlab chiqarish uchun<\/label><\/div>\n<div class=\"quizq\"><b>8. Ilmiy modelning asosiy vazifasi nima?<\/b><label><input type=\"radio\" name=\"q8\" value=\"a\"> Haqiqiy obyektni barcha jihatdan aynan takrorlash<\/label><label><input type=\"radio\" name=\"q8\" value=\"b\"> Faqat chiroyli rasm bo‘lish<\/label><label><input type=\"radio\" name=\"q8\" value=\"c\"> Muhim xususiyatlarni soddalashtirib ko‘rsatish<\/label><\/div>\n<div class=\"quizq\"><b>9. Ovqatning hazm bo‘lmagan qoldig‘i qayerdan chiqariladi?<\/b><label><input type=\"radio\" name=\"q9\" value=\"a\"> Anal teshigidan<\/label><label><input type=\"radio\" name=\"q9\" value=\"b\"> Burundan<\/label><label><input type=\"radio\" name=\"q9\" value=\"c\"> Qizilo‘ngachdan<\/label><\/div>\n<div class=\"quizq\"><b>10. Odam va mushuk hazm sistemalarining o‘xshashligiga qaysi misol to‘g‘ri?<\/b><label><input type=\"radio\" name=\"q10\" value=\"a\"> Ikkalasida ham jig‘ildon bor<\/label><label><input type=\"radio\" name=\"q10\" value=\"b\"> Ikkalasida ham og‘iz, oshqozon va ichaklar bor<\/label><label><input type=\"radio\" name=\"q10\" value=\"c\"> Ikkalasi ham faqat o‘simlik yeydi<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button><button type=\"reset\" class=\"secondary\" onclick=\"document.getElementById('result').textContent=''\">Qayta ishlash<\/button>\n<\/form>\n<div id=\"result\" class=\"info-panel\" style=\"margin-top:14px\" aria-live=\"polite\"><\/div>\n<\/section>\n<section class=\"card\">\n<h2>🏁 Dars yakuni — eslab qoling<\/h2>\n<ul>\n<li>Ovqatning yo‘li: <b>og‘iz → halqum → qizilo‘ngach → oshqozon → ingichka ichak → yo‘g‘on ichak → to‘g‘ri ichak → anal teshigi.<\/b><\/li>\n<li>Hazm qilish mexanik maydalash va kimyoviy parchalanishni o‘z ichiga oladi.<\/li>\n<li>Oziq moddalarning asosiy qismi ingichka ichakda so‘riladi, yo‘g‘on ichakda esa suvning bir qismi so‘riladi.<\/li>\n<li>Umurtqali hayvonlarda umumiy hazm organlari bor, ammo oziqlanishiga qarab tuzilishida farqlar uchraydi.<\/li>\n<li>Model murakkab ilmiy jarayonni tushunishni osonlashtiradi, lekin haqiqiy jarayonning barcha tafsilotlarini ko‘rsatmaydi.<\/li>\n<\/ul>\n<h3>Uyga vazifa<\/h3>\n<ol><li>Ovqat hazm qilish organlarini ketma-ket yozing va har birining vazifasini bir jumlada tushuntiring.<\/li><li>Odam, sigir va tovuq hazm sistemasidan ikkita o‘xshashlik va ikkita farq yozing.<\/li><li>“Model menga nimani tushunishga yordam berdi?” mavzusida 4–5 gap yozing.<\/li><\/ol>\n<\/section>\n<\/main>\n<footer>6-sinf tabiiy fanlar • Ovqat hazm qilish sistemasi • Interaktiv o‘quv modeli<\/footer>\n<script>\nconst steps=[\n{title:\"1-bosqich: Og‘iz bo‘shlig‘i\",text:\"Tishlar ovqatni mayda bo‘laklarga ajratadi. Til ovqatni so‘lak bilan aralashtiradi. So‘lak kraxmal hazmini boshlaydi.\",life:\"Ovqatni shoshmasdan chaynash hazm jarayoniga yordam beradi.\",y:86},\n{title:\"2-bosqich: Halqum\",text:\"Yutish paytida ovqat luqmasi halqumdan qizilo‘ngachga o‘tadi. Nafas yo‘liga ovqat tushmasligi uchun maxsus himoya mexanizmlari ishlaydi.\",life:\"Ovqatlanayotganda gapirish yoki kulish tiqilib qolish xavfini oshirishi mumkin.\",y:125},\n{title:\"3-bosqich: Qizilo‘ngach\",text:\"Qizilo‘ngach mushaklari ketma-ket qisqarib, luqmani oshqozonga suradi. Bu to‘lqinsimon harakat peristaltika deb ataladi.\",life:\"Ovqat tanani egib yoki yotib olganimizda ham mushaklar harakati bilan pastga siljiy oladi.\",y:165},\n{title:\"4-bosqich: Oshqozon\",text:\"Oshqozon ovqatni aralashtiradi. Oshqozon shirasi oqsillar hazm bo‘lishini boshlaydi va ko‘plab mikroblarni yo‘qotishga yordam beradi.\",life:\"Oshqozon — ovqatni saqlab, aralashtiradigan vaqtinchalik “qop”ga o‘xshaydi.\",y:230},\n{title:\"5-bosqich: Ingichka ichak\",text:\"O‘t suyuqligi va oshqozon osti bezi fermentlari hazmga yordam beradi. Hazm yakunlanadi, oziq moddalar ichak devori orqali qonga yoki limfaga o‘tadi.\",life:\"Oziq moddalardan organizm energiya oladi va o‘sish uchun foydalanadi.\",y:320},\n{title:\"6-bosqich: Yo‘g‘on ichak\",text:\"Hazm bo‘lmagan qoldiq yo‘g‘on ichakka o‘tadi. Bu yerda suv va ayrim mineral moddalar so‘rilib, najas shakllanadi.\",life:\"Yetarli suv ichish va tolaga boy oziq iste’mol qilish ichak faoliyatiga yordam beradi.\",y:375},\n{title:\"7-bosqich: To‘g‘ri ichak va anal teshigi\",text:\"Najas to‘g‘ri ichakda vaqtincha to‘planadi va anal teshigi orqali tashqariga chiqariladi.\",life:\"Organizm hazm bo‘lmagan qoldiqlarni chiqarib, ichki muhit muvozanatini saqlashga yordam beradi.\",y:440}\n];\nlet current=-1,autoTimer=null;\nfunction setStep(i){current=Math.max(-1,Math.min(6,i));const dot=document.getElementById('foodDot');if(current<0){dot.style.display='none';document.getElementById('stepTitle').textContent='Boshlashga tayyormisiz?';document.getElementById('stepText').textContent='“Keyingi bosqich” tugmasini bosing. Sariq nuqta ovqat luqmasini ifodalaydi.';document.getElementById('lifeText').textContent='Ovqat tanaga qurilish materiali va energiya beradi.';}else{let s=steps[current];dot.style.display='block';dot.setAttribute('cy',s.y);document.getElementById('stepTitle').textContent=s.title;document.getElementById('stepText').textContent=s.text;document.getElementById('lifeText').textContent=s.life;}document.getElementById('stepCount').textContent=(current+1)+' / 7';document.getElementById('progressBar').style.width=((current+1)/7*100)+'%';}\nfunction nextStep(){setStep(current>=6?-1:current+1)}\nfunction prevStep(){setStep(current<=0?-1:current-1)}\nfunction resetSim(){stopAuto();setStep(-1)}\nfunction toggleAuto(){if(autoTimer){stopAuto();return}document.getElementById('autoBtn').textContent='⏸ To‘xtatish';autoTimer=setInterval(()=>{if(current>=6){setStep(-1)}else{nextStep()}},2800)}\nfunction stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}document.getElementById('autoBtn').textContent='▶ Avtoanimatsiya'}\ndocument.querySelectorAll('.organ-shape').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.organ-shape').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('stepTitle').textContent=el.dataset.name;document.getElementById('stepText').textContent=el.dataset.info;document.getElementById('lifeText').textContent='Organlar birgalikda ishlaydi: har birining vazifasi umumiy hazm jarayoniga hissa qo‘shadi.';}));\nconst answers={q1:'b',q2:'c',q3:'a',q4:'b',q5:'c',q6:'a',q7:'b',q8:'c',q9:'a',q10:'b'};\nfunction checkQuiz(){let score=0,miss=[];for(let q in answers){let sel=document.querySelector('input[name=\"'+q+'\"]:checked');if(sel&&sel.value===answers[q])score++;else miss.push(q.slice(1))}let msg='Natija: '+score+'/10 ('+(score*10)+'%). ';if(score>=9)msg+='Ajoyib! Mavzuni juda yaxshi tushunibsiz.';else if(score>=7)msg+='Yaxshi! Xato javoblarni qayta ko‘rib chiqing.';else msg+='Nazariyani yana bir marta o‘qib, simulyatsiyani qayta bajaring.';if(miss.length)msg+=' Qayta ko‘rish kerak bo‘lgan savollar: '+miss.join(', ')+'.';document.getElementById('result').textContent=msg;}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Ratsional ovqatlanish", "i": "🥗", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Ratsional ovqatlanish<\/title>\n<style>\n/* ===== Asosiy uslublar ===== */\n:root{--c:#6366f1;--bg:#fff8e7;--tx:#1f2937}\n*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}\nbody{font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif;font-size:18px;background:var(--bg);color:var(--tx);padding-bottom:84px}\nheader{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff;box-shadow:0 2px 8px #0002}\n.pill{background:#fde68a;border-radius:24px;padding:8px 14px;font-weight:700}\n.ib{min-height:48px;min-width:48px;border:0;border-radius:24px;background:#e0e7ff;font-size:22px}\nmain{max-width:760px;margin:0 auto;padding:12px}\nsection{display:none;--c:#6366f1}\nsection.on{display:block}\n#v-s1{--c:#22c55e}#v-s2{--c:#f59e0b}#v-s3{--c:#ec4899}#v-t{--c:#8b5cf6}\nh1{font-size:30px;text-align:center;margin:8px 0}\nh2{color:var(--c);font-size:24px;margin:16px 0 8px}\nh3{margin:12px 0 6px;color:var(--c)}\n.card{background:#fff;border-left:8px solid var(--c);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 6px #0001}\n.btn{min-height:52px;padding:10px 16px;border:0;border-radius:16px;background:var(--c);color:#fff;font-size:18px;font-weight:700;margin:4px 2px;cursor:pointer}\n.btn.big{display:block;width:100%;margin:10px 0;font-size:22px}\n.btn.alt{background:#fff;color:var(--c);border:3px solid var(--c)}\n.btn.bad{background:#ef4444}\n.row{display:flex;flex-wrap:wrap;gap:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}\n/* Avatar */\n.avbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px;margin:8px 0;position:sticky;top:64px;z-index:10;box-shadow:0 2px 8px #0002}\n.avw{position:relative;width:96px;text-align:center;flex:none}\n.av{font-size:70px;line-height:1;display:inline-block}\n.fx{position:absolute;right:-6px;top:-8px;font-size:32px;opacity:0}\n.fx.show{animation:pop 1.6s ease-out}\n.bub{flex:1;background:#fef3c7;border-radius:16px;padding:10px 12px;font-size:16px;position:relative}\n.bub:before{content:\"\";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:#fef3c7;border-left:0}\n.av.jump{animation:jump .7s 2}.av.shake{animation:shake .5s 3}.av.yawn{animation:yawn 1.2s 2}\n.av.run{animation:run .5s 5}.av.sleep{animation:sleep 1.5s 2}\n@keyframes jump{50%{transform:translateY(-22px) rotate(8deg)}}\n@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}\n@keyframes yawn{50%{transform:scale(1.3,.85)}}\n@keyframes run{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px) rotate(10deg)}}\n@keyframes sleep{50%{transform:rotate(-15deg) scale(.92)}}\n@keyframes pop{0%{opacity:0;transform:translateY(10px)}20%,80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}\n/* Shkalalar */\n.bar{background:#e5e7eb;border-radius:12px;height:22px;overflow:hidden;margin:2px 0 8px}\n.bar i{display:block;height:100%;background:var(--c);transition:width .5s;border-radius:12px}\n/* Sudrash */\n.dc{background:#fff;border:3px solid var(--c);border-radius:14px;padding:10px;text-align:center;min-height:64px;touch-action:none;user-select:none;font-weight:700;cursor:grab}\n.dc.sel{background:#fde68a;transform:scale(1.05)}\n.dc.wrong,.slot.wrong{animation:shake .4s}\n.zone{min-height:90px;border:4px dashed var(--c);border-radius:16px;padding:8px;text-align:center;background:#fff8}\n.zone.good{border-color:#22c55e}.zone.badz{border-color:#ef4444}\n.ghost{position:fixed;z-index:99;pointer-events:none;width:120px;opacity:.85}\n.slot{flex:1;min-width:90px;min-height:78px;border:3px dashed var(--c);border-radius:12px;text-align:center;background:#fff;padding:4px;font-size:15px}\n.slot.ok{ba nconst clamp = v => Math.max(0, Math.min(100, v));\n\n// Ball va yulduzcha qo'shish\nfunction add(p, st = 0){ S.score += p; S.stars += st; $(\"#sc\").textContent = S.score; $(\"#st\").textContent = S.stars; }\n\n// Oddiy signal tovushi (Web Audio)\nfunction beep(f = 600, d = .12){\n  if(!S.snd) return;\n  try{\n    const a = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)());\n    const o = a.createOscillator(), g = a.createGain();\n    o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(a.destination);\n    o.start(); o.stop(a.currentTime + d);\n  }catch(e){}\n}\nconst good = () => { beep(700); setTimeout(() => beep(950), 110); };\nconst bad = () => beep(200, .25);\n\n// Konfetti\nfunction confetti(){\n  for(let i = 0; i < 24; i++){\n    const s = document.createElement(\"span\");\n    s.className = \"cf\"; s.textContent = [\"🎉\",\"⭐\",\"🎊\",\"✨\"][i % 4];\n    s.style.left = Math.random() * 95 + \"vw\"; s.style.animationDelay = Math.random() * .5 + \"s\";\n    document.body.appendChild(s); setTimeout(() => s.remove(), 2300);\n  }\n}\n\n// Oyna\nfunction modal(html){ $(\"#mb\").innerHTML = html + `<button class=\"btn big\" onclick=\"$('#modal').classList.remove('on')\">Yopish<\/button>`; $(\"#modal\").classList.add(\"on\"); }\n\n/* ===================== AVATAR \"AZIZ\" ===================== */\nconst MOOD = {happy:\"😄\",tired:\"🥱\",hungry:\"🤤\",heavy:\"🤢\",strong:\"😎\",sleep:\"😴\",sad:\"😩\",dizzy:\"😵‍💫\"};\nfunction avHTML(id){\n  return `<div class=\"avbox\"><div class=\"avw\"><div class=\"av\" id=\"av${id}\">😄<\/div><div class=\"fx\" id=\"fx${id}\"><\/div><\/div><div class=\"bub\" id=\"bub${id}\">Salom! Men Azizman 👋<\/div><\/div>`;\n}\n// Holatni o'zgartirish: kayfiyat, matn, animatsiya, effekt emoji\nfunction setAv(id, m, t, anim, fx){\n  const a = $(\"#av\" + id); if(!a) return;\n  a.textContent = MOOD[m] || m; a.className = \"av\"; void a.offsetWidth;\n  if(anim) a.classList.add(anim);\n  if(t) $(\"#bub\" + id).textContent = t;\n  const f = $(\"#fx\" + id); f.className = \"fx\"; f.textContent = fx || \"\"; void f.offsetWidth;\n  if(fx) f.classList.add(\"show\");\n}\n\n/* ===================== SUDRAB QO'YISH + BOSIB TANLASH ===================== */\n// Sudrash (pointer events: telefonda ham ishlaydi)\nfunction drag(el, zones, cb){\n  el.addEventListener(\"pointerdown\", e => {\n    let moved = false, g; const sx = e.clientX, sy = e.clientY;\n    const mv = ev => {\n      if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;\n      if(!moved){ moved = true; g = el.cloneNode(true); g.classList.add(\"ghost\"); document.body.appendChild(g); }\n      g.style.left = ev.clientX - 60 + \"px\"; g.style.top = ev.clientY - 40 + \"px\";\n    };\n    const up = ev => {\n      removeEventListener(\"pointermove\", mv); removeEventListener(\"pointerup\", up);\n      if(moved){\n        g.remove();\n        const t = document.elementFromPoint(ev.clientX, ev.clientY);\n        const z = t && t.closest(zones); if(z) cb(el, z);\n        el._d = true; setTimeout(() => el._d = false, 50);\n      }\n    };\n    addEventListener(\"pointermove\", mv); addEventListener(\"pointerup\", up);\n  });\n}\n// Ikkala usul: sudrash yoki \"kartani bos, keyin joyni bos\"\nfunction wire(cards, zones, cb){\n  let sel = null;\n  cards.forEach(c => {\n    drag(c, zones, cb);\n    c.addEventListener(\"click\", () => { if(c._d) return; cards.forEach(x => x.classList.remove(\"sel\")); sel = c; c.classList.add(\"sel\"); });\n  });\n  $$(zones).forEach(z => z.addEventListener(\"click\", () => { if(sel && sel.isConnected){ const s = sel; sel.classList.remove(\"sel\"); sel = null; cb(s, z); } }));\n}\nconst theory = k => `<h2>📖 Nazariya<\/h2>` + THEORY[k].map(t => `<div class=\"card\">${t}<\/div>`).join(\"\");\n\n/* ===================== NAVIGATSIYA ===================== */\nconst INIT = {}; // bo'lim bir marta quriladi\nfunction show(v){\n  stopSims();\n  $$(\"section\").forEach(s => s.classList.toggle(\"on\", s.id === \"v-\" + v));\n  $$(\"nav button\").forEach(b => b.classList.toggle(\"on\", b.dataset.v === v));\n  if(!INIT[v]){ INIT[v] = 1; ({home:buildHome, s1:buildS1, s2:buildS2, s3:buildS3, t:buildTest})[v](); }\n  scrollTo(0, 0);\n}\n$$(\"nav button\").forEach(b => b.onclick = () => show(b.dataset.v));\n$(\"#snd\").onclick = () => { S.snd = !S.snd; $(\"#snd\").textContent = S.snd ? \"🔊\" : \"🔇\"; };\n$(\"#rst\").onclick = () => { if(confirm(\"Hammasi nolga qaytariladi. Davom etamizmi?\")) location.reload(); };\n\n/* ===================== BOSH EKRAN ===================== */\nfunction buildHome(){\n  $(\"#v-home\").innerHTML = `<h1>🥗 Ratsional ovqatlanish<\/h1>${avHTML(\"H\")}\n  <button class=\"btn big\" style=\"background:#22c55e\" onclick=\"show('s1')\">🌿 1. Sog'lom turmush tarzi<\/button>\n  <button class=\"btn big\" style=\"background:#f59e0b\" onclick=\"show('s2')\">🕒 2. Ovqatlanish tartibi<\/button>\n  <button class=\"btn big\" style=\"background:#ec4899\" onclick=\"show('s3')\">🍎 3. Kaloriyaga e'tibor<\/button>\n  <button class=\"btn big\" style=\"background:#8b5cf6\" onclick=\"show('t')\">📝 Test<\/button>\n  <button class=\"btn big alt\" onclick=\"recap()\">💡 Eslab qol!<\/button>`;\n  setAv(\"H\", \"happy\", \"Salom! Men Azizman. Keling, sog'lom ovqatlanishni o'rganamiz!\", \"jump\", \"👋\");\n}\nfunction recap(){ modal(`<h2>💡 Eslab qol!<\/h2>` + RECAP.map(t => `<div class=\"card\">${t}<\/div>`).join(\"\")); }\n\n/* ===================== 1-BO'LIM ===================== */\nconst D1 = {h:60, en:60, m:60, tv:0};\nfunction bars(){\n  return [[\"h\",\"Salomatlik\"],[\"en\",\"Energiya\"],[\"m\",\"Kayfiyat\"]].map(([k,n]) => `<div>${n}: <b id=\"t-${k}\">${D1[k]}<\/b>%<\/div><div class=\"bar\"><i id=\"b-${k}\" style=\"width:${D1[k]}%\"><\/i><\/div>`).join(\"\");\n}\nfunction buildS1(){\n  $(\"#v-s1\").innerHTML = `<h1>🌿 Sog'lom turmush tarzi<\/h1>${avHTML(1)}${theory(\"s1\")}\n  <h2>🎮 Mening kunim<\/h2><div class=\"card\">${bars()}<\/div>\n  <h3>Foydali odatlar<\/h3><div class=\"row\" id=\"hab\"><\/div>\n  <h3>Zararli odatlar<\/h3><div class=\"row\" id=\"bad\"><\/div>\n  <h2>🧩 Odatni top<\/h2><div class=\"card\">Kartani \"Foydali\" yoki \"Zararli\" savatiga sudra (yoki kartani bos, keyin savatni bos).<\/div>\n  <div class=\"grid\" id=\"hc\"><\/div>\n  <div class=\"row\" style=\"margin-top:8px\"><div class=\"zone good\" data-k=\"1\" style=\"flex:1\">✅ Foydali<\/div><div class=\"zone badz\" data-k=\"0\" style=\"flex:1\">⚠️ Zararli<\/div><\/div>\n  <div id=\"hmsg\"><\/div>`;\n  HABITS.forEach(h => { const b = document.createElement(\"button\"); b.className = \"btn\"; b.textContent = h.e + \" \" + h.n; b.onclick = () => habit(h); $(\"#hab\").append(b); });\n  BAD.forEach(h => { const b = document.createElement(\"button\"); b.className = \"btn bad\"; b.textContent = h.e + \" \" + h.n; b.onclick = () => habit(h, true); $(\"#bad\").append(b); });\n  shuffle(HABIT_CARDS).forEach(c => {\n    const d = document.createElement(\"div\"); d.className = \"dc\"; d.dataset.g = c.g; d.innerHTML = `<div style=\"font-size:34px\">${c.e}<\/div>${c.n}`; $(\"#hc\").append(d);\n  });\n  wire($$(\"#hc .dc\"), \"#v-s1 .zone\", (el, z) => {\n    if(el.dataset.g === z.dataset.k){ el.remove(); add(10); good(); setAv(1, \"happy\", \"To'g'ri! +10 ball 🎉\", \"jump\", \"⭐\");\n      if(!$(\"#hc .dc\")){ $(\"#hmsg\").innerHTML = `<div class=\"okmsg\">Barcha odatlar to'g'ri joylandi! 🏆<\/div>`; add(0, 1); confetti(); } }\n    else { bad(); el.classList.add(\"wrong\"); setTimeout(() => el.classList.remove(\"wrong\"), 500); setAv(1, \"sad\", \"Yo'q, qaytadan o'ylab ko'r 🤔\", \"shake\"); }\n  });\n  setAv(1, \"happy\", \"Odatlarni bos va nima bo'lishini ko'r!\");\n}\nfunction habit(h, harm){\n  let x = h, msg;\n  if(h.tv){ // telefon/TV: 2 martadan keyin zararli\n    D1.tv++;\n    x = D1.tv > 2 ? {h:-10,en:-10,m:-5,a:\"yawn\",t:\"Juda ko'p ekran! Ko'zlar charchaydi, harakat kam bo'ladi. 2 soatdan oshmasin!\"} : {h:0,en:-3,m:3,a:\"jump\",fx:\"📺\",t:\"1 soat ko'rdim /button>\n  <div class=\"row\"><button class=\"btn bad\" id=\"late\">🍔 Kechasi 22:00 da og'ir ovqat<\/button><button class=\"btn alt\" id=\"snack\">🍬 Tamaddi<\/button><\/div>\n  <div id=\"pie\"><\/div>\n  <h2>🫀 Oshqozon-ichak yo'li<\/h2>\n  <svg viewBox=\"0 0 300 230\" style=\"width:100%;background:#fff;border-radius:16px\">\n    <path id=\"tract\" d=\"M150,20 L150,70 C150,105 105,105 105,130 L195,130 L105,152 L195,152 L105,174 L195,174 L215,180 L215,212 L85,212 L85,192 L60,192\" fill=\"none\" stroke=\"#fbcfe8\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <text x=\"165\" y=\"24\" font-size=\"13\">👄 Og'iz<\/text><text x=\"165\" y=\"60\" font-size=\"13\">Qizilo'ngach<\/text>\n    <text x=\"115\" y=\"118\" font-size=\"13\">Oshqozon<\/text><text x=\"205\" y=\"148\" font-size=\"13\">Ingichka<\/text>\n    <text x=\"30\" y=\"226\" font-size=\"13\">Yo'g'on ichak<\/text>\n    <circle id=\"food\" r=\"9\" fill=\"#f59e0b\" stroke=\"#b45309\" stroke-width=\"2\"/>\n  <\/svg>\n  <div class=\"card\" id=\"stg\"><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"pz\">⏸ To'xtat<\/button><label style=\"flex:1;min-width:150px\">Tezlik <input type=\"range\" id=\"spd\" min=\"1\" max=\"10\" value=\"4\" style=\"width:100%;height:40px\"><\/label><\/div>\n  <h2>⏱ Mini-o'yin: ovqatlanish tartibi<\/h2>\n  <div class=\"card\">Ovqatlarni ertalabdan kechgacha to'g'ri ketma-ketlikda bos. 60 soniya!<\/div>\n  <button class=\"btn big\" id=\"gs\">▶ O'yinni boshlash<\/button><div id=\"gt\" style=\"font-weight:700\"><\/div><div class=\"grid\" id=\"gc\"><\/div>`;\n  // Vaqt chizig'i\n  MEALS.forEach(m => { const s = document.createElement(\"div\"); s.className = \"slot\"; s.dataset.id = m.id; s.innerHTML = `<b>${m.tl}<\/b><br>?`; $(\"#slots\").append(s); });\n  shuffle(MEALS).forEach(m => { const d = document.createElement(\"div\"); d.className = \"dc\"; d.dataset.id = m.id; d.innerHTML = `<div style=\"font-size:32px\">${m.e}<\/div>${m.n}`; $(\"#mc\").append(d); });\n  wire($$(\"#mc .dc\"), \"#slots .slot\", (el, z) => {\n    const m = MEALS.find(x => x.id === el.dataset.id);\n    if(z.dataset.id === el.dataset.id && !placed[m.id]){\n      placed[m.id] = 1; z.classList.add(\"ok\"); z.innerHTML = `<b>${m.tl}<\/b><br>${m.e} ✅`; el.remove(); add(10); good(); confetti();\n      setAv(2, \"happy\", `To'g'ri! ${m.n} soat ${m.tl} da. +10 ball`, \"jump\", \"✅\");\n      if(Object.keys(placed).length === 5) $(\"#pie\").innerHTML = pie();\n    } else { bad(); z.classList.add(\"wrong\"); setTimeout(() => z.classList.remove(\"wrong\"), 500); setAv(2, \"sad\", \"Bu vaqt to'g'ri kelmaydi. Yana urin!\", \"shake\"); }\n  });\n  $(\"#go\").onclick = startDay;\n  $(\"#late\").onclick = () => { bad(); setAv(2, \"heavy\", \"Kechasi og'ir ovqat! Uxlay olmayman, qornim og'riyapti 😣\", \"shake\", \"🤢\"); };\n  $(\"#snack\").onclick = () => { snacks++; if(snacks > 2){ bad(); setAv(2, \"heavy\", \"Juda ko'p tamaddi! Qorin og'ir, asosiy ovqatga ishtaha yo'q.\", \"shake\", \"🍬\"); } else setAv(2, \"happy\", \"Bitta yengil tamaddi zarar qilmaydi 🙂\", \"jump\"); };\n  $(\"#pz\").onclick = () => { digPause = !digPause; $(\"#pz\").textContent = digPause ? \"▶ Davom ettir\" : \"⏸ To'xtat\"; };\n  $(\"#gs\").onclick = startOrder; drawClock(6);\n  startDig(); setAv(2, \"happy\", \"Ovqatlarni vaqtiga qo'yib chiq!\");\n}\n// Soatni chizish: vaqtga qarab osmon, quyosh va oy\nfunction drawClock(t){\n  const H = Math.floor(t), M = Math.floor((t % 1) * 60);\n  $(\"#dt\").textContent = String(H).padStart(2,\"0\") + \":\" + String(M).padStart(2,\"0\");\n  const rot = (id, deg) => $(id).setAttribute(\"transform\", `rotate(${deg} 150 82)`);\n  rot(\"#hh\", (t % 12) / 12 * 360); rot(\"#mh\", (t % 1) * 360);\n  $(\"#skyr\").setAttribute(\"fill\", t < 8 ? \"#fdba74\" : t < 17 ? \"#7dd3fc\" : t < 19.5 ? \"#fb923c\" : \"#1e1b4b\");\n  const f = (t - 6) / 13, g = Math.max(0, (t - 18.5) / 3.5);\n  $(\"#sun\").setAttribute(\"cx\", 20 + 260 * Math.min(1, f)); $(\"#sun\").setAttribute(\"cy\", 115 - 90 * Math.sin(Math.PI * Math.min(1, f)));\n  $(\"#sun\").style.opacity = t < 19.5 ? 1 : 0;\n  $(\"#moon\").setAttribute(\"cx\", 40 + 220 * g); $(\"#moon\").setAttribute(\"cy\", 60 - 30 * Math.sin(Math.PI * g)); $(\"#moon\").style.opacity = t >= 18.5 ? 1 : 0;\n}\nfunction startDay(){\n  stopSims(); T = 6; const chk = {}; let missed = 0; snacks = 0;\n  setAv(2, \"happy\", \"Kun boshlandi! ☀️\");\n  clk = setInterval(() => {\n    T += .1; drawClock(Math.min(T, 22));\n    MEALS.forEach(m => {\n      if(T >= m.t + .4 && !chk[m.id]){\n        chk[m.id] = 1;\n        if(!placed[m.id]){ missed++; bad(); const r = MISS[m.id]; setAv(2, r[0], r[1], \"yawn\", m.id === \"n\" ? \"😵‍💫\" : \"⚠️\"); }\n        else { good(); setAv(2, \"happy\", `${m.n} vaqtida yeyildi. Ajoyib!`, \"jump\", m.e); }\n      }\n    });\n    if(T >= 22){ stopSims(); $(\"#pie\").innerHTML = pie();\n      if(!missed){ setAv(2, \"strong\", \"Kun a'lo o'tdi! Kuchim to'la 💪\", \"jump\", \"🏆\"); add(20, 1); confetti(); }\n      else setAv(2, \"tired\", `${missed} ta ovqat o'tkazib yuborildi. Ertaga tartibga rioya qilaman!`, \"yawn\"); }\n  }, 250);\n}\n// Ovqat ulushi doiraviy diagrammasi\nfunction pie(){\n  let a = 0; const seg = [], leg = [];\n  MEALS.filter(m => placed[m.id]).forEach(m => { seg.push(`${m.c} ${a}% ${a + m.s}%`); a += m.s; leg.push(`<span style=\"color:${m.c}\">■<\/span> ${m.n} ${m.s}%`); });\n  seg.push(`#e5e7eb ${a}% 100%`);\n  return `<div class=\"card\"><h3>📊 Kunlik ovqat ulushi<\/h3><div class=\"pie\" style=\"background:conic-gradient(${seg.join(\",\")})\"><\/div>${leg.join(\"<br>\")}<\/div>`;\n}\n// Hazm qilish animatsiyasi\nfunction startDig(){\n  const path = $(\"#tract\"), L = path.getTotalLength(); cancelAnimationFrame(dig);\n  const step = () => {\n    if($(\"#v-s2\").classList.contains(\"on\") && !digPause){\n      digP += $(\"#spd\").value * .0004; if(digP > 1) digP = 0;\n      const p = path.getPointAtLength(digP * L); $(\"#food\").setAttribute(\"cx\", p.x); $(\"#food\").setAttribute(\"cy\", p.y);\n      const st = [...STAGES].reverse().find(s => digP >= s.p); $(\"#stg\").textContent = st.t;\n    }\n    dig = requestAnimationFrame(step);\n  };\n  step();\n}\n// Mini-o'yin: to'g'ri ketma-ketlik\nfunction startOrder(){\n  clearInterval(gm); let next = 0, left = 60; $(\"#gt\").textContent = \"⏱ 60\"; $(\"#gc\").innerHTML = \"\";\n  shuffle(MEALS).forEach(m => {\n    const d = document.createElement(\"div\"); d.className = \"dc\"; d.innerHTML = `<div style=\"font-size:32px\">${m.e}<\/div>${m.n}`;\n    d.onclick = () => {\n      if(!gm) return;\n      if(MEALS[next].id === m.id){ next++; d.style.background = \"#bbf7d0\"; d.innerHTML += ` ✅${next}`; d.onclick = null; good();\n        if(next === 5){ clearInterval(gm); gm = null; add(20 + left, 1); confetti(); $(\"#gt\").textContent = \"🎉 Ajoyib! Qolgan vaqt uchun bonus oldingiz.\"; } }\n      else { bad(); d.classList.add(\"wrong\"); setTimeout(() => d.classList.remove(\"wrong\"), 500); }\n    };\n    $(\"#gc\").append(d);\n  });\n  gm = setInterval(() => { left--; $(\"#gt\").textContent = \"⏱ \" + left; if(left <= 0){ clearInterval(gm); gm = null; $(\"#gt\").textContent = \"⌛ Vaqt tugadi. Yana urinib ko'r!\"; } }, 1000);\n}\n\n/* ===================== 3-BO'LIM ===================== */\nconst plate = {}; // mahsulot indeksi -> gramm\nlet hpDone = false;\nfunction buildS3(){\n  $(\"#v-s3\").innerHTML = `<h1>🍎 Kaloriyaga e'tibor<\/h1>${avHTML(3)}${theory(\"s3\")}\n  <h2>🧮 Kaloriya hisoblagich<\/h2>\n  <div class=\"card\">Mahsulotni bos yoki likopchaga sudra. Grammni slayder bilan o'zgartir (50–300 g).<\/div>\n  <div class=\"grid\" id=\"fd\"><\/div>\n  <h3>🍽 Mening likopcham<\/h3>\n  <div class=\"zone\" id=\"plate\">Bu yerga tashla<\/div>\n  <div class=\"card\" style=\"margin-top:8px\"><b id=\"kc\">0<\/b> / ${TARGET} kkal <span id=\"zn\"><\/span><div class=\"bar\"><i id=\"kb\" style=\"width:0\"><\/i><\/div>\n    <div class=\"pie\" id=\"mp\" style=\"background:#e5e7eb\"><\/div><div id=\"ml\" style=\"text-align:center\"><\/div><\/div>\n  <div id=\"vt\"><\/div>\n  <label style=\"display:block;margin:8px 0\"><input type=\"checkbox\" id=\"hp\" style=\"width:28px;height:28px;vertical-align:middle\"> 🥗 Sog'lom likopcha rejimi<\/label>\n  <div id=\"hpb\"><\/div>\n  <button class=\"btn big alt\" id=\"cmp\">⚖️ Taqqosla: sog'lom va nosog'lom kun<\/button>`;\n  FOODS.forEach((f, i) => {\n    const d = document.createElement(\"div\"); d.className = \"dc\"; d.dataset.i = i;\n    d.innerHTML = `<div style=\"font-size:34px\">${f.e}<\/div>${f.n}<div style=\"font-size:13px;font-weight:400\">${f.k} kkal · O${f.p} Y${f.f} U${f.c}<\/div>`;\n    d.onclick = () => { if(!d._d) addFood(i); }; drag(d, \"#plate\", () => addFood(i)); $(\"#fd\").append(d);\n  });\n  $(\"#hp\").onchange = calc; $(\"#cmp\").onclick = compare; calc();\n}\nfunction addFood(i){ if(!plate[i]) plate[i] = 100; good(); calc(); }\nfunction calc(){\n  let k = 0, p = 0, f = 0, c = 0; const grp = {v:0, g:0, p:0, o:0};\n  $(\"#plate\").innerHTML = \"\";\n  const keys = Object.keys(plate);\n  if(!keys.length) $(\"#plate\").textContent = \"Bu yerga tashla\";\n  keys.forEach(i => {\n    const x = FOODS[i], g = plate[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; grp[x.t] += g;\n    const r = document.createElement(\"div\"); r.className = \"item\";\n    r.innerHTML = `<span style=\"font-size:28px\">${x.e}<\/span><input type=\"range\" min=\"50\" max=\"300\" step=\"10\" value=\"${g}\"><b style=\"min-width:52px\">${g} g<\/b><button class=\"ib\" style=\"background:#fecaca\">✖<\/button>`;\n    r.querySelector(\"input\").oninput = e => { plate[i] = +e.target.value; calc(); };\n    r.querySelector(\"button\").onclick = () => { delete plate[i]; calc(); };\n    $(\"#plate\").append(r);\n  });\n  k = Math.round(k); $(\"#kc\").textContent = k; $(\"#kb\").style.width = Math.min(100, k / TARGET * 100) + \"%\";\n  // Zona va avatar\n  let z, m, t, an;\n  if(!keys.length){ z = \"\"; m = \"happy\"; t = \"Mahsulot tanla, kaloriyani hisoblaymiz!\"; }\n  else if(k < 1600){ z = \"🔻 Kam\"; m = \"tired\"; t = \"Kaloriya kam — holsizlanyapman.\"; an = \"yawn\"; }\n  else if(k >= 2000 && k <= 2600){ z = \"✅ Me'yorda\"; m = \"strong\"; t = \"Zo'r! Kaloriya me'yorida, kuchim to'la!\"; an = \"jump\"; }\n  else if(k > 2800){ z = \"🔺 Ko'p\"; m = \"heavy\"; t = \"Juda ko'p kaloriya, qorin og'ir...\"; an = \"shake\"; }\n  else { z = \"〰️ Deyarli\"; m = \"happy\"; t = \"Me'yorga yaqin (2000–2600 kkal).\"; }\n  $(\"#zn\").textContent = z; setAv(3, m, t, an);\n  // Oqsil/yog'/uglevod ulushi\n  const tot = p + f + c || 1, pp = Math.round(p / tot * 100), fp = Math.round(f / tot * 100), cp = 100 - pp - fp;\n  $(\"#mp\").style.background = keys.length ? `conic-gradient(#ef4444 0 ${pp}%,#facc15 ${pp}% ${pp + fp}%,#3b82f6 ${pp + fp}% 100%)` : \"#e5e7eb\";\n  $(\"#ml\").innerHTML = keys.length ? `<span style=\"color:#ef4444\">■<\/span> Oqsil ${pp}% <span style=\"color:#ca8a04\">■<\/span> Yog' ${fp}% <span style=\"color:#3b82f6\">■<\/span> Uglevod ${keys.length ? cp : 0}%` : \"\";\n  // Vitamin ko'rsatkichi\n  $(\"#vt\").innerHTML = keys.length ? (grp.v ? `<div class=\"okmsg\">🍊 Vitamin ko'rsatkichi: yaxshi (meva/sabzavot bor)<\/div>` : `<div class=\"warn\">⚠️ Meva yoki sabzavot yo'q — vitamin yetishmaydi!<\/div>`) : \"\";\n  // Sog'lom likopcha rejimi: yarmi meva/sabzavot, choragi don, choragi oqsil\n  const all = grp.v + grp.g + grp.p + grp.o;\n  if($(\"#hp\").checked){\n    const pc = x => all ? Math.round(x / all * 100) : 0, V = pc(grp.v), G = pc(grp.g), P = pc(grp.p);\n    const ok = all >= 300 && V >= 40 && V <= 60 && G >= 15 && G <= 35 && P >= 15 && P <= 35 && !grp.o;\n    $(\"#hpb\").innerHTML = `<div class=\"card\"><div class=\"pie\" style=\"background:conic-gradient(#4ade80 0 50%,#fbbf24 50% 75%,#f87171 75% 100%)\"><\/div>\n      Ko'rsatma: 🥦 50% sabzavot/meva, 🍚 25% don, 🍗 25% oqsil.<br>Seniki: 🥦 ${V}% · 🍚 ${G}% · 🍗 ${P}%<\/div>` + (ok ? `<div class=\"okmsg\">🌟 Sog'lom likopcha! Yulduzcha olding!<\/div>` : \"\");\n    if(ok && !hpDone){ hpDone = true; add(30, 1); confetti(); good(); }\n  } else $(\"#hpb\").innerHTML = \"\";\n}\n// Ikki xil kun menyusini taqqoslash\nfunction compare(){\n  const sum = list => { let k = 0, p = 0, f = 0, c = 0; list.forEach(([i, g]) => { const x = FOODS[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; }); return {k:Math.round(k), p:Math.round(p), f:Math.round(f), c:Math.round(c)}; };\n  const col = (title, list, cl) => { const s = sum(list); return `<div style=\"flex:1;min-width:140px;background:${cl};border-radius:14px;padding:10px\"><h3>${title}<\/h3>${list.map(([i, g]) => `${FOODS[i].e} ${FOODS[i].n} ${g} g`).join(\"<br>\")}<p><b>${s.k} kkal<\/b><br>Oqsil ${s.p} g<br>Yog' ${s.f} g<br>Uglevod ${s.c} g<\/p><\/div>`; };\n  modal(`<h2>⚖️ Taqqoslash<\/h2><div class=\"row\">${col(\"😄 Sog'lom kun\", MENU_GOOD, \"#dcfce7\")}${col(\"🤢 Nosog'lom kun\", MENU_BAD, \"#fee2e2\")}<\/div><p>Nosog'lom menyuda shirinlik, chips va gazli ichimlik ko'p, sabzavot va oqsil kam. Kaloriya ko'p, foyda oz.<\/p>`);\n}\n\n/* ===================== YAKUNIY TEST ===================== */\nlet qi = 0, right = 0; const wrongBy = {1:0, 2:0, 3:0}; let order = [];\nfunction buildTest(){ qi = 0; right = 0; order = shuffle(QUESTIONS); [1,2,3].forEach(k => wrongBy[k] = 0); $(\"#v-t\").innerHTML = `<h1>📝 Yakuniy test<\/h1>${avHTML(\"T\")}<div id=\"tq\"><\/div>`; setAv(\"T\", \"happy\", \"Omad! 10 ta savol.\"); question(); }\nfunction question(){\n  if(qi >= order.length) return result();\n  const q = order[qi];\n  $(\"#tq\").innerHTML = `<div class=\"card\"><b>Savol ${qi + 1}/10<\/b><br>${q.q}<\/div><div class=\"grid\" style=\"grid-template-columns:1fr\" id=\"op\"><\/div><div id=\"ex\"><\/div>`;\n  q.o.forEach((o, i) => { const b = document.createElement(\"button\"); b.className = \"btn alt\"; b.textContent = o; b.onclick = () => answer(i, b); $(\"#op\").append(b); });\n}\nfunction answer(i, b){\n  const q = order[qi]; $$(\"#op button\").forEach((x, j) => { x.disabled = true; if(j === q.a) x.style.background = \"#bbf7d0\"; });\n  if(i === q.a){ right++; add(10); good(); $(\"#ex\").innerHTML = `<div class=\"okmsg\">✅ To'g'ri! ${q.e}<\/div>`; setAv(\"T\", \"strong\", \"Barakalla!\", \"jump\", \"⭐\"); }\n  else { wrongBy[q.s]++; bad(); b.style.background = \"#fecaca\"; $(\"#ex\").innerHTML = `<div class=\"warn\">❌ To'g'ri javob: ${q.o[q.a]}. ${q.e}<\/div>`; setAv(\"T\", \"sad\", \"Xato qilsang ham, o'rganasan!\", \"shake\"); }\n  $(\"#ex\").innerHTML += `<button class=\"btn big\" onclick=\"qi++;question()\">Keyingisi ➡️<\/button>`;\n}\nfunction result(){\n  const st = right >= 9 ? 3 : right >= 7 ? 2 : right >= 5 ? 1 : 0;\n  const weak = [1,2,3].sort((a, b) => wrongBy[b] - wrongBy[a])[0];\n  if(st) { add(0, st); confetti(); }\n  setAv(\"T\", st ? \"strong\" : \"tired\", st ? \"Ajoyib natija!\" : \"Yana urinib ko'r!\", st ? \"jump\" : \"yawn\");\n  $(\"#tq\").innerHTML = `<div class=\"card\" style=\"text-align:center\"><h2>${right} / 10<\/h2><div style=\"font-size:44px\">${st ? \"⭐\".repeat(st) : \"💪\"}<\/div><p>${st ? \"Barakalla!\" : \"Yana urinib ko'r\"}<\/p>\n    ${wrongBy[weak] ? `<p>Eng kuchsiz bo'lim: <b>${SECNAME[weak]}<\/b><\/p><button class=\"btn big\" onclick=\"show('${SECVIEW[weak]}')\">Shu bo'limga o'tish<\/button>` : `<p>Hamma bo'limni yaxshi bilasan! 🏆<\/p>`}\n    <button class=\"btn big alt\" onclick=\"buildTest()\">🔁 Qayta topshirish<\/button><button class=\"btn big alt\" onclick=\"recap()\">💡 Eslab qol!<\/button><\/div>`;\n}\n\n/* ===================== BOSHLASH ===================== */\nshow(\"home\");\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Qon aylanish sistemasi", "i": "❤️", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Qon aylanish sistemasi<\/title>\n<style>\n:root{--green:#16834a;--light:#eaf8ef;--dark:#143d2a;--red:#e94b5b;--blue:#3286d8;--gold:#f0b429}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4faf6;color:#20352a;line-height:1.55}\nheader{background:linear-gradient(120deg,#116b3d,#28a765);color:white;padding:28px 16px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}header p{margin:0 auto;max-width:850px}\nmain{max-width:1100px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #163d2a12;border:1px solid #d9eee0}\nh2{color:#137441;margin-top:0}h3{color:#176b3e}.tag{display:inline-block;background:#dff5e6;color:#12653a;padding:5px 10px;border-radius:20px;font-weight:bold;font-size:13px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.mini{background:#f2fbf5;border:1px solid #d7efdf;border-radius:14px;padding:14px}\n.flow-area{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:center}\nsvg{width:100%;height:auto;max-height:460px;background:#f7fcf8;border-radius:14px;border:1px solid #d9eee0}\n.vessel{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.artery{stroke:#e94b5b}.vein{stroke:#3286d8}\n.pulse{fill:none;stroke:#ffb13b;stroke-width:4;stroke-dasharray:5 13;animation:flow 1.2s linear infinite}\n@keyframes flow{to{stroke-dashoffset:-36}}.heart{transform-origin:190px 200px;animation:beat 1s infinite}.paused .pulse,.paused .heart{animation-play-state:paused}\n@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}25%{transform:scale(1)}}\nbutton,select,input{font:inherit}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:bold;margin:4px}button:hover{background:#0c6135}button.secondary{background:#e3f4e9;color:#155e37}button.orange{background:#e9a31a;color:#392800}\nlabel{display:block;font-weight:bold;margin:10px 0 5px}.meter{height:14px;background:#e4eee7;border-radius:99px;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#34ad67,#f1b82d);width:70%;transition:width .3s}\n.note{border-left:5px solid #28a765;background:#effaf2;padding:12px 15px;border-radius:8px}.warning{border-left-color:#e9a31a;background:#fff8e6}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #d5e8da;padding:10px;text-align:left;vertical-align:top}th{background:#e3f5e9}\n.question{padding:14px;background:#f7fbf8;border-radius:12px;margin:12px 0}.question button{display:block;text-align:left;width:100%;background:white;color:#234b34;border:1px solid #c9e4d1;font-weight:normal}.question button:hover{background:#eaf8ef}.correct{background:#d7f5df!important;border-color:#2b9c51!important}.wrong{background:#ffe0e0!important;border-color:#d94b4b!important}\nfooter{text-align:center;padding:22px;color:#567462;font-size:14px}\n@media(max-width:720px){.flow-area{grid-template-columns:1fr}.card{padding:15px}table{font-size:14px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"tag\">6-sinf • Tabiiy fan<\/span>\n  <h1>🫀 QON AYLANISH SISTEMASI<\/h1>\n  <p>Yurak, qon va qon tomirlari qanday hamkorlikda ishlaydi? Animatsiya, model, taqqoslash va mini-test orqali o‘rganamiz.<\/p>\n<\/header>\n<main>\n<section class=\"card\">\n<h2>📚 Dars rejasi<\/h2>\n<ol>\n<li>Odamning qon aylanish sistemasini va uning funksiyalarini tavsiflaymiz.<\/li>\n<li>Aksariyat umurtqali hayvonlarning qon aylanish sistemasidagi o‘xshash jihatlarni aniqlaymiz.<\/li>\n<li>Ilmiy hodisani tasvirlash va izohlashda modeldan foydalanamiz.<\/li>\n<\/ol>\n<div class=\"note\"><b>Dars maqsadi:<\/b> dars oxirida yurak, qon va qon tomirlarining vazifasini tushuntira olasiz; qonning katta va kichik aylanish yo‘lini modelda kuzatasiz; odam va boshqa umurtqali hayvonlar qon aylanishini taqqoslaysiz.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>1. Qon aylanish sistemasi nima?<\/h2>\n<p><b>Qon aylanish sistemasi<\/b> — yurak va qon tomirlaridan tashkil topgan, qonning tana bo‘ylab harakatlanishini ta’minlaydigan sistema. Qon hujayralarga kislorod va oziq moddalarni yetkazadi, karbonat angidrid hamda ayrim chiqindi moddalarni olib ketadi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><h3>🫀 Yurak — nasos<\/h3><p>Yurak mushaklardan tuzilgan a’zo. U qisqarib qonni tomirlarga haydaydi, bo‘shashganda esa yana qon bilan to‘ladi.<\/p><\/div>\n<div class=\"mini\"><h3>🩸 Qon — tashuvchi<\/h3><p>Qon kislorod, oziq moddalar, gormonlar va issiqlikni tashishda qatnashadi. Himoya vazifasini ham bajaradi.<\/p><\/div>\n<div class=\"mini\"><h3>🛣️ Qon tomirlari — yo‘llar<\/h3><p>Arteriyalar qonni yurakdan olib chiqadi, venalar yurakka olib keladi, kapillyarlarda moddalar almashinuvi sodir bo‘ladi.<\/p><\/div>\n<\/div>\n<h3>Qonning asosiy vazifalari<\/h3>\n<ul>\n<li><b>Tashish:<\/b> kislorod va oziq moddalarni to‘qimalarga yetkazish.<\/li>\n<li><b>Olib ketish:<\/b> karbonat angidrid va ayrim chiqindi moddalarni chiqarish a’zolariga eltish.<\/li>\n<li><b>Himoya:<\/b> oq qon hujayralari organizmni mikroblardan himoya qilishda qatnashadi.<\/li>\n<li><b>Haroratni boshqarish:<\/b> issiqlikni tana bo‘ylab tarqatishga yordam beradi.<\/li>\n<li><b>Muvozanatni saqlash:<\/b> suv va turli moddalar miqdorini me’yorda ushlab turishga ko‘maklashadi.<\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\">\n<h2>2. Qonning yo‘lini animatsiyada kuzating<\/h2>\n<p>Quyidagi chizma — <b>o‘quv modeli<\/b>. U yurak, o‘pka va tana o‘rtasidagi qon yo‘lini soddalashtirib ko‘rsatadi. Harakatlanuvchi chiziqlar qon oqimini ifodalaydi.<\/p>\n<div class=\"flow-area\">\n<div id=\"diagram\" class=\"diagram\">\n<svg viewBox=\"0 0 380 440\" role=\"img\" aria-label=\"Yurak, o‘pka va tana orasidagi qon aylanish modeli\">\n<rect x=\"112\" y=\"25\" width=\"156\" height=\"75\" rx=\"18\" fill=\"#e1f1ff\" stroke=\"#3286d8\" stroke-width=\"2\"/>\n<text x=\"190\" y=\"55\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"bold\" fill=\"#205b91\">O‘PKA<\/text>\n<text x=\"190\" y=\"77\" text-anchor=\"middle\" font-size=\"12\" fill=\"#205b91\">Kislorod qonga o‘tadi<\/text>\n<rect x=\"95\" y=\"325\" width=\"190\" height=\"78\" rx=\"18\" fill=\"#fff0dc\" stroke=\"#e6a03a\" stroke-width=\"2\"/>\n<text x=\"190\" y=\"355\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"bold\" fill=\"#805014\">TANA A’ZOLARI<\/text>\n<text x=\"190\" y=\"377\" text-anchor=\"middle\" font-size=\"12\" fill=\"#805014\">Kislorod sarflanadi<\/text>\n<path class=\"vessel vein\" d=\"M145 325 L145 245 L145 180 L145 100\"/>\n<path class=\"pulse\" stroke=\"#3286d8\" d=\"M145 325 L145 245 L145 180 L145 100\"/>\n<path class=\"vessel artery\" d=\"M235 100 L235 180 L235 245 L235 325\"/>\n<path class=\"pulse\" d=\"M235 100 L235 180 L235 245 L235 325\"/>\n<path class=\"vessel artery\" d=\"M145 100 Q165 130 170 160\"/>\n<path class=\"vessel vein\" d=\"M210 160 Q215 130 235 100\"/>\n<g class=\"heart\">\n<path d=\"M190 160 C165 135 135 157 150 185 L190 225 L230 185 C245 157 215 135 190 160Z\" fill=\"#e94b5b\" stroke=\"#b72b3a\" stroke-width=\"2\"/>\n<path d=\"M190 163 L190 218\" stroke=\"#fff\" stroke-width=\"3\"/>\n<text x=\"190\" y=\"245\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#9b2632\">YURAK<\/text>\n<\/g>\n<text x=\"95\" y=\"275\" font-size=\"11\" fill=\"#286ca8\" transform=\"rotate(-90 95 275)\">Kislorodi kamroq qon<\/text>\n<text x=\"275\" y=\"275\" font-size=\"11\" fill=\"#c33443\" transform=\"rotate(-90 275 275)\">Kislorodga boy qon<\/text>\n<text x=\"190\" y=\"425\" text-anchor=\"middle\" font-size=\"11\" fill=\"#53705e\">Ko‘k va qizil ranglar — sxematik belgi<\/text>\n<\/svg>\n<\/div>\n<div>\n<h3>Model qanday ishlaydi?<\/h3>\n<ol>\n<li>Tana a’zolaridan kislorodi kamaygan qon yurakning o‘ng tomoniga qaytadi.<\/li>\n<li>Yurak qonni o‘pkaga yuboradi.<\/li>\n<li>O‘pkada qon karbonat angidridni chiqarib, kislorod oladi.<\/li>\n<li>Kislorodga boy qon yurakning chap tomoniga qaytadi.<\/li>\n<li>Yurak uni tana a’zolariga haydaydi.<\/li>\n<\/ol>\n<div class=\"note\"><b>Eslab qoling:<\/b> odamda qon odatda yopiq tomirlar tizimi ichida harakatlanadi. Odamning qon aylanishi ikki asosiy doiradan — kichik (o‘pka) va katta (tana) qon aylanish doirasidan iborat.<\/div>\n<div style=\"margin-top:12px\">\n<button onclick=\"toggleFlow()\" id=\"flowBtn\">⏸ Animatsiyani to‘xtatish<\/button>\n<button class=\"secondary\" onclick=\"showPath('small')\">Kichik doirani ko‘rsatish<\/button>\n<button class=\"secondary\" onclick=\"showPath('large')\">Katta doirani ko‘rsatish<\/button>\n<button class=\"secondary\" onclick=\"showPath('all')\">Hammasini ko‘rsatish<\/button>\n<\/div>\n<p id=\"pathText\" aria-live=\"polite\">Hozir umumiy qon aylanish modeli ko‘rsatilmoqda.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>3. Kichik va katta qon aylanish doiralari<\/h2>\n<div class=\"grid\">\n<div class=\"mini\"><h3>🔵 Kichik (o‘pka) doirasi<\/h3><p><b>Yo‘li:<\/b> yurakning o‘ng qorinchasi → o‘pka tomirlari → o‘pka kapillyarlari → o‘pka venalari → yurakning chap bo‘lmachasi.<\/p><p><b>Vazifasi:<\/b> qonni o‘pkada kislorod bilan boyitish va karbonat angidridni chiqarishga yordam berish.<\/p><\/div>\n<div class=\"mini\"><h3>🔴 Katta (tana) doirasi<\/h3><p><b>Yo‘li:<\/b> yurakning chap qorinchasi → aorta va arteriyalar → tana kapillyarlari → venalar → yuqori va pastki kovak venalar → yurakning o‘ng bo‘lmachasi.<\/p><p><b>Vazifasi:<\/b> kislorod va oziq moddalarni tana hujayralariga yetkazish.<\/p><\/div>\n<\/div>\n<div class=\"note warning\"><b>Muhim:<\/b> “arteriya” doim kislorodga boy qon degani emas. Arteriya — qonni yurakdan olib chiqadigan tomir; vena esa qonni yurakka olib keladi. O‘pka arteriyasida kislorodi kamroq, o‘pka venalarida esa kislorodga boy qon oqadi.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>4. Yurak qanday ishlaydi?<\/h2>\n<p>Yurak ko‘krak qafasida, biroz chaproqda joylashgan mushakli a’zo. Inson yuragi to‘rt kamerali: ikkita bo‘lmacha va ikkita qorincha.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><b>O‘ng bo‘lmacha<\/b><p>Tana bo‘ylab kelgan qonni qabul qiladi.<\/p><\/div>\n<div class=\"mini\"><b>O‘ng qorincha<\/b><p>Qonni o‘pkaga haydaydi.<\/p><\/div>\n<div class=\"mini\"><b>Chap bo‘lmacha<\/b><p>O‘pkadan kelgan kislorodga boy qonni qabul qiladi.<\/p><\/div>\n<div class=\"mini\"><b>Chap qorincha<\/b><p>Qonni butun tanaga haydaydi; devori kuchliroq, chunki qonni uzoq masofaga yuboradi.<\/p><\/div>\n<\/div>\n<h3>Yurak urishini o‘lchash — kichik tajriba<\/h3>\n<p>Bilakdagi tomir urishini yoki ko‘krakdagi yurak urishini sezib, 30 soniya sanang va natijani 2 ga ko‘paytiring. Bu bir daqiqadagi taxminiy urishlar sonini beradi. Mashqdan oldin va keyin natijani taqqoslang.<\/p>\n<label for=\"pulse\">O‘lchagan yurak urishingiz (bir daqiqada): <span id=\"pulseVal\">75<\/span><\/label>\n<input id=\"pulse\" type=\"range\" min=\"45\" max=\"160\" value=\"75\" oninput=\"updatePulse(this.value)\" style=\"width:100%\">\n<div class=\"meter\"><div id=\"pulseMeter\"><\/div><\/div>\n<p id=\"pulseText\">75 urish/minut — model ko‘rsatkichi. Odamlarning yurak urishi yosh, faollik va boshqa omillarga qarab farq qiladi.<\/p>\n<div class=\"note warning\">Bu interaktiv ko‘rsatkich tibbiy tekshiruv emas. O‘zingizni yomon his qilsangiz, kattalarga ayting.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>5. Qon nimalardan tashkil topgan?<\/h2>\n<div class=\"grid\">\n<div class=\"mini\"><h3>🔴 Eritrotsitlar<\/h3><p>Qizil qon hujayralari. Gemoglobin yordamida kislorodni tashishda muhim rol o‘ynaydi.<\/p><\/div>\n<div class=\"mini\"><h3>⚪ Leykotsitlar<\/h3><p>Oq qon hujayralari. Organizmni mikroblar va kasallik qo‘zg‘atuvchilaridan himoya qilishda qatnashadi.<\/p><\/div>\n<div class=\"mini\"><h3>🟡 Trombotsitlar<\/h3><p>Qon ivishida qatnashadigan mayda hujayra bo‘lakchalari. Jarohatda qon ketishini to‘xtatishga yordam beradi.<\/p><\/div>\n<div class=\"mini\"><h3>💧 Plazma<\/h3><p>Qonning suyuq qismi. Unda suv, oziq moddalar, tuzlar, oqsillar va boshqa moddalar tashiladi.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>6. Qon tomirlarini farqlaymiz<\/h2>\n<table>\n<thead><tr><th>Tomir turi<\/th><th>Qon harakati<\/th><th>Asosiy xususiyati<\/th><th>Vazifasi<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Arteriya<\/b><\/td><td>Yurakdan a’zolarga<\/td><td>Devori qalin va elastik<\/td><td>Qonni yurakdan olib chiqadi<\/td><\/tr>\n<tr><td><b>Vena<\/b><\/td><td>A’zolardan yurakka<\/td><td>Devori nisbatan yupqaroq; ko‘pchiligida klapanlar bor<\/td><td>Qonni yurakka qaytaradi<\/td><\/tr>\n<tr><td><b>Kapillyar<\/b><\/td><td>Arteriya va venalarni bog‘laydi<\/td><td>Juda ingichka, devori bir hujayra qalinligida<\/td><td>Kislorod, oziq moddalar va chiqindi moddalar almashinuvi<\/td><\/tr>\n<\/tbody><\/table>\n<\/section>\n\n<section class=\"card\">\n<h2>7. Umurtqali hayvonlarda qon aylanishi<\/h2>\n<p>Odam, baliq, amfibiya (masalan, baqa), sudralib yuruvchi (masalan, kaltakesak), qush va sutemizuvchilarning barchasida yurak va qon tomirlari mavjud. Ular tanaga kerakli moddalarni tashishda qon aylanish sistemasidan foydalanadi. Lekin yurak kameralarining soni va qon aylanish doiralari farq qiladi.<\/p>\n<table>\n<thead><tr><th>Hayvonlar guruhi<\/th><th>Yurak tuzilishi<\/th><th>Qon aylanishi<\/th><th>Asosiy xususiyat<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Baliqlar<\/b><\/td><td>2 kamera: 1 bo‘lmacha, 1 qorincha<\/td><td>Bir doirali<\/td><td>Qon yurakdan jabralarga, so‘ng tana bo‘ylab oqadi.<\/td><\/tr>\n<tr><td><b>Amfibiyalar<\/b> (baqa)<\/td><td>3 kamera: 2 bo‘lmacha, 1 qorincha<\/td><td>Ikki doirali, to‘liq ajralmagan<\/td><td>Qonning kislorodga boy va kamroq boy qismlari qorinchada qisman aralashishi mumkin.<\/td><\/tr>\n<tr><td><b>Ko‘pchilik sudralib yuruvchilar<\/b><\/td><td>Odatda 3 kamera, qorincha qisman to‘siqli<\/td><td>Ikki doirali<\/td><td>Qon oqimlari amfibiyalarga qaraganda yaxshiroq ajralgan. Timsohlarda 4 kamerali yurak bor.<\/td><\/tr>\n<tr><td><b>Qushlar<\/b><\/td><td>4 kamera<\/td><td>Ikki doirali<\/td><td>Kislorodga boy va kislorodi kamroq qon to‘liq ajralgan.<\/td><\/tr>\n<tr><td><b>Sutemizuvchilar<\/b> (odam ham)<\/td><td>4 kamera<\/td><td>Ikki doirali<\/td><td>Ikki xil qon yurakda aralashmaydi; to‘qimalarga kislorod yetkazish samarali.<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"note\"><b>O‘xshash jihatlar:<\/b> qon aylanishi moddalarni tashiydi; yurak qonni harakatga keltiradi; qon tomirlari qon oqadigan yo‘l bo‘lib xizmat qiladi. <b>Farqli jihatlar:<\/b> yurak kameralari soni, qon aylanish doiralari va kislorodga boy hamda kamroq boy qonning ajralish darajasi.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>8. Ilmiy hodisani tushuntirishda modeldan foydalanish<\/h2>\n<p><b>Model<\/b> — haqiqiy obyekt yoki jarayonning muhim xususiyatlarini soddalashtirib ko‘rsatuvchi tasvir, maket, chizma yoki kompyuter simulyatsiyasi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><h3>🧩 Model nimani ko‘rsatadi?<\/h3><p>Yurakning nasos vazifasini, qonning tomirlar bo‘ylab yo‘nalishini va o‘pka bilan tana o‘rtasidagi aloqani.<\/p><\/div>\n<div class=\"mini\"><h3>🔎 Nima uchun kerak?<\/h3><p>Qon tananing ichida harakatlangani sababli uni bevosita kuzatish qiyin. Model jarayonni ko‘z oldimizga keltirishga yordam beradi.<\/p><\/div>\n<div class=\"mini\"><h3>⚠️ Modelning cheklovi<\/h3><p>Haqiqiy qon tomirlari juda ko‘p va murakkab. Chizmada ular soddalashtirilgan, ranglar esa qonning kislorod bilan bog‘liq holatini ifodalaydi.<\/p><\/div>\n<\/div>\n<h3>🧪 Simulyatsiya: jismoniy harakat yurak urishiga qanday ta’sir qiladi?<\/h3>\n<p>Quyidagi tugmalar modeldagi faollikni o‘zgartiradi. Bu aniq shaxsiy tibbiy natija emas, faqat o‘quv modeli.<\/p>\n<button onclick=\"activity('tinch')\">🪑 Tinch holat<\/button>\n<button onclick=\"activity('yurish')\">🚶 Yurish<\/button>\n<button onclick=\"activity('yugurish')\">🏃 Yugurish<\/button>\n<div class=\"mini\">\n<p><b>Modeldagi yurak urishi:<\/b> <span id=\"activityValue\">75<\/span> urish/minut<\/p>\n<div class=\"meter\"><div id=\"activityMeter\" style=\"width:38%\"><\/div><\/div>\n<p id=\"activityExplain\">Tinch holatda mushaklarning kislorod va energiyaga ehtiyoji nisbatan kamroq.<\/p>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>9. Kundalik hayot bilan bog‘laymiz<\/h2>\n<ul>\n<li>Nima uchun yugurgandan keyin yurak tezroq ura boshlaydi? Mushaklar ko‘proq kislorod va oziq moddalar talab qiladi, yurak esa qonni tezroq haydaydi.<\/li>\n<li>Nima uchun chuqur nafas olish muhim? O‘pkada qonga kislorod o‘tadi va karbonat angidrid chiqariladi.<\/li>\n<li>Nima uchun kesilgan joydan qon oqadi? Qon tomiri shikastlanadi; trombotsitlar va ivish jarayoni qon ketishini kamaytirishga yordam beradi.<\/li>\n<li>Nima uchun uzoq vaqt harakatsiz o‘tirish o‘rniga tanaffusda harakatlanish foydali? Harakat mushaklar faoliyatini qo‘llab-quvvatlaydi va umumiy salomatlik uchun foydali odat hisoblanadi.<\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\">\n<h2>10. Mustahkamlash uchun mini-test 📝<\/h2>\n<p>Har bir savol uchun bitta javobni tanlang. Oxirida natijangiz chiqadi.<\/p>\n<div id=\"quiz\"><\/div>\n<button onclick=\"checkQuiz()\">Natijani tekshirish<\/button>\n<button class=\"secondary\" onclick=\"resetQuiz()\">Qayta ishlash<\/button>\n<p id=\"quizResult\" aria-live=\"polite\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>11. Dars yakunida eslab qoling<\/h2>\n<ol>\n<li>Qon aylanish sistemasi yurak, qon va qon tomirlaridan tashkil topgan.<\/li>\n<li>Yurak qonni haydaydi; arteriyalar qonni yurakdan olib chiqadi; venalar yurakka qaytaradi; kapillyarlarda moddalar almashadi.<\/li>\n<li>Odamda kichik qon aylanish doirasi o‘pka bilan, katta qon aylanish doirasi esa butun tana bilan bog‘liq.<\/li>\n<li>Umurtqali hayvonlarda qon aylanish sistemasining umumiy vazifasi o‘xshash, ammo yurak tuzilishi va qon aylanish yo‘li farq qiladi.<\/li>\n<li>Model murakkab hodisani tushunishga yordam beradi, lekin haqiqiy jarayonning barcha tafsilotlarini ko‘rsatmaydi.<\/li>\n<\/ol>\n<h3>Uyga vazifa<\/h3>\n<p>1) Yurak, arteriya, vena va kapillyar rasmini chizing va nomlarini yozing. 2) Baliq va odamning qon aylanishini ikki ustunli jadvalda taqqoslang. 3) “Yurakni sog‘lom saqlash uchun nimalar qilaman?” mavzusida 5 ta gap yozing.<\/p>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan • Interaktiv o‘quv materiali • O‘qituvchi rahbarligida foydalanish uchun<\/footer>\n<script>\nlet paused=false;\nfunction toggleFlow(){paused=!paused;document.getElementById('diagram').classList.toggle('paused',paused);document.getElementById('flowBtn').textContent=paused?'▶ Animatsiyani davom ettirish':'⏸ Animatsiyani to‘xtatish'}\nfunction showPath(which){\n const lines=document.querySelectorAll('#diagram .vessel,#diagram .pulse');\n lines.forEach(x=>{x.style.opacity=which==='all'?'1':(which==='small'?(x.getAttribute('d').includes('145')?'1':'.2'):(x.getAttribute('d').includes('235')?'1':'.2'))});\n const t={small:'Kichik doira: yurakning o‘ng qorinchasi → o‘pka → yurakning chap bo‘lmachasi.',large:'Katta doira: yurakning chap qorinchasi → tana a’zolari → yurakning o‘ng bo‘lmachasi.',all:'Hozir umumiy qon aylanish modeli ko‘rsatilmoqda.'};\n document.getElementById('pathText').textContent=t[which];\n}\nfunction updatePulse(v){document.getElementById('pulseVal').textContent=v;document.getElementById('pulseMeter').style.width=((v-45)/115*100)+'%';document.getElementById('pulseText').textContent=v+' urish/minut — model ko‘rsatkichi. Yurak urishi yosh, faollik va boshqa omillarga qarab farq qiladi.'}\nfunction activity(a){\n const vals={tinch:70,yurish:100,yugurish:140},txt={tinch:'Tinch holatda mushaklarning kislorod va energiyaga ehtiyoji nisbatan kamroq.',yurish:'Yurishda mushaklar faolroq ishlaydi, yurak qonni tezroq haydashi mumkin.',yugurish:'Yugurishda energiya va kislorodga ehtiyoj oshadi, shu sabab yurak urishi tezlashishi mumkin.'};\n let v=vals[a];document.getElementById('activityValue').textContent=v;document.getElementById('activityMeter').style.width=(v/160*100)+'%';document.getElementById('activityExplain').textContent=txt[a];\n}\nconst questions=[\n{q:'1. Qon aylanish sistemasining asosiy nasosi qaysi a’zo?',a:['O‘pka','Yurak','Oshqozon'],c:1,e:'Yurak qisqarib qonni qon tomirlariga haydaydi.'},\n{q:'2. Arteriyalar qonni qayerga olib boradi?',a:['Yurakdan tashqariga, a’zolar tomon','Faqat o‘pkaga','A’zolardan yurakka'],c:0,e:'Arteriya qonni yurakdan olib chiqadi.'},\n{q:'3. Moddalar almashinuvi eng faol kechadigan mayda tomirlar qaysi?',a:['Arteriyalar','Venalar','Kapillyarlar'],c:2,e:'Kapillyarlarning yupqa devori moddalar almashinuviga imkon beradi.'},\n{q:'4. Odam yuragi nechta kameradan iborat?',a:['2 ta','3 ta','4 ta'],c:2,e:'Odam yuragida ikki bo‘lmacha va ikki qorincha bor.'},\n{q:'5. Kichik qon aylanish doirasi qaysi a’zo bilan bog‘liq?',a:['O‘pka','Buyrak','Oshqozon'],c:0,e:'Kichik doirada qon yurak va o‘pka orasida harakatlanadi.'},\n{q:'6. Baliq yuragi odatda nechta kamerali?',a:['2 ta','3 ta','4 ta'],c:0,e:'Baliq yuragida bitta bo‘lmacha va bitta qorincha bo‘ladi.'},\n{q:'7. Qaysi qon hujayralari kislorod tashishda muhim?',a:['Eritrotsitlar','Leykotsitlar','Trombotsitlar'],c:0,e:'Eritrotsitlarda kislorod tashishda qatnashuvchi gemoglobin bor.'},\n{q:'8. Modeldan foydalanishning asosiy foydasi nima?',a:['Haqiqiy tanani almashtiradi','Murakkab jarayonni soddalashtirib tushuntiradi','Barcha tafsilotlarni doim aniq ko‘rsatadi'],c:1,e:'Model jarayonning muhim jihatlarini ko‘rsatadi, lekin hamma tafsilotni qamrab olmasligi mumkin.'}\n];\nfunction buildQuiz(){const root=document.getElementById('quiz');root.innerHTML='';questions.forEach((q,i)=>{let d=document.createElement('div');d.className='question';d.innerHTML='<b>'+q.q+'<\/b>';q.a.forEach((a,j)=>{let b=document.createElement('button');b.textContent=a;b.dataset.q=i;b.dataset.a=j;b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add('selected');};d.appendChild(b)});root.appendChild(d)})}\nfunction checkQuiz(){let score=0;document.querySelectorAll('.question').forEach((d,i)=>{let sel=d.querySelector('button.selected');d.querySelectorAll('button').forEach(b=>{if(+b.dataset.a===questions[i].c)b.classList.add('correct');if(b===sel&&+b.dataset.a!==questions[i].c)b.classList.add('wrong')});if(sel&&+sel.dataset.a===questions[i].c)score++});document.getElementById('quizResult').innerHTML='<b>Natija: '+score+' / '+questions.length+'.<\/b> '+(score===questions.length?'Ajoyib! Mavzuni juda yaxshi tushungansiz.':score>=6?'Yaxshi natija! Xato javoblar izohini o‘qib, yana bir bor takrorlang.':'Mavzuni qayta o‘qing va testni yana bajaring.')+'<br>'+questions.map((q,i)=>(i+1)+'. '+q.e).join('<br>')}\nfunction resetQuiz(){buildQuiz();document.getElementById('quizResult').textContent=''}\nbuildQuiz();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Nafas va qon aylanish", "i": "🫁", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Nafas va qon aylanish<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef7f6;--cd:#fff;--tx:#12363d;--ac:#0e8a8a;--rd:#e5484d;--bl:#3b5bdb;--ok:#2b9348;--no:#d62839;--ln:#cfe3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d2226;--cd:#153238;--tx:#e6f4f2;--ac:#4fd1c5;--ln:#24484f}}\n:root[data-theme=\"dark\"]{--bg:#0d2226;--cd:#153238;--tx:#e6f4f2;--ac:#4fd1c5;--ln:#24484f}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:#fff;padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}\nh3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\n.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}\nsvg{width:100%;height:auto;display:block;border-radius:10px}\nlabel{display:block;margin:8px 0 2px}\ninput[type=range]{width:100%;height:32px;accent-color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}\nbutton.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}\n.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.msg{margin:8px 0;font-weight:800}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}\nnav span{display:block;font-size:22px}\n.lung{transform-box:fill-box;transform-origin:center;animation:br var(--bt,3.2s) ease-in-out infinite}\n.dia{animation:dp var(--bt,3.2s) ease-in-out infinite}\n@keyframes br{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}\n@keyframes dp
