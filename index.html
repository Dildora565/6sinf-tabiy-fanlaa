.map((h,i)=>`<button data-i=\"${i}\">${h[0]}<\/button>`).join('');\nfunction showImm(m){\n  $('#imb').style.width=imm+'%';$('#imb').style.background=imm>=70?'#2b9348':imm>=40?'#e9c46a':'#d62839';$('#imv').textContent=imm;\n  $('#av0').textContent=imm>=70?'💪':imm>=45?'🙂':imm>=25?'🤧':'🤒';pop($('#av0'));if(m)$('#hm').textContent=m}\ndocument.querySelectorAll('#hb button').forEach(b=>b.onclick=()=>{const h=H[+b.dataset.i];imm=Math.max(0,Math.min(100,imm+h[1]));showImm(h[0]+': '+h[2])});showImm();\nconst yn=['Foydali ✅','Zararli ⛔'];\nquiz($('#g1'),mk([['🍎 Har kuni meva yeyish',0,'Vitaminlar beradi.'],['🌙 Tun yarmigacha telefon',1,'Uyqu yetishmaydi.'],['🏃 Kuniga 60 daqiqa harakat',0,'Organizm mustahkamlanadi.'],['🥤 Kuniga ko\\'p gazli ichimlik',1,'Shakar ko\\'p, foyda kam.'],['🧼 Ovqatdan oldin qo\\'l yuvish',0,'Mikroblar yuvilib ketadi.'],['🍟 Faqat chips bilan ovqatlanish',1,'Organizm kerakli moddalarni olmaydi.'],['😴 9–10 soat uyqu',0,'Organizm tiklanadi.'],['🪟 Xonani shamollatish',0,'Havo toza bo\\'ladi.']],yn,true));\n\n// ---- 2-bo'lim: tarqalish ----\nlet P,hist;\nfunction resetP(){P=Array(12).fill(0);P[0]=1;hist=[1];drawP();$('#sm').textContent=''}\nfunction drawP(){\n  $('#ppl').innerHTML=P.map(x=>`<span class=\"${x?'in':''}\">${x?'🤒':'🧑'}<\/span>`).join('');\n  $('#cnt').textContent=P.reduce((a,b)=>a+b);\n  const n=Math.max(hist.length-1,1);\n  $('#ch').setAttribute('points',hist.map((v,i)=>`${5+i*290/n},${75-v*5.8}`).join(' '))}\ndocument.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{\n  const imv=+$('#imm1').value;let c=0;\n  for(let j=0;j<+b.dataset.n;j++){const i=R(12);if(!P[i]&&Math.random()>imv/100){P[i]=1;c++}}\n  hist.push(P.reduce((a,b)=>a+b));drawP();\n  $('#sm').textContent=c?`Yangi kasallanganlar: ${c}. Kasal bo'lsang, kattalarga ayt.`:'Hech kim kasallanmadi. Immunitet himoya qildi!'});\n$('#rs1').onclick=resetP;$('#imm1').oninput=e=>{$('#i1v').textContent=e.target.value};resetP();\n\nlet ft;\n$('#imm2').oninput=e=>{$('#i2v').textContent=e.target.value};\n$('#fb').onclick=()=>{\n  clearInterval(ft);let m=10,t=0;const l=Math.max(1,Math.round(+$('#imm2').value/10));\n  $('#fl2').textContent='⚪'.repeat(l);$('#av1').textContent='🙂';$('#fm').textContent='';\n  const draw=()=>{$('#fv').textContent='🦠'.repeat(m)};draw();\n  ft=setInterval(()=>{\n    t++;m=Math.max(0,m-l+Math.floor(m*.3));draw();\n    if(m==0){clearInterval(ft);$('#av1').textContent='🙂';pop($('#av1'));$('#fm').textContent='Leykotsitlar mikroblarni yutib yubordi. Immunitet g\\'alaba qildi!'}\n    else if(t>=8||m>=20){clearInterval(ft);$('#av1').textContent='🤒';pop($('#av1'));$('#fm').textContent='Immunitet kuchsiz edi, mikroblar ko\\'paydi. Kattalarga ayt va shifokorga murojaat qil.'}\n  },700)};\n\nquiz($('#g2'),mk([\n ['Havo-tomchi yo\\'lini uzish uchun?',['Niqob taqish va xonani shamollatish','Yaqin turib gaplashish','Idishni birga ishlatish','Kech uxlash'],0,'Havo-tomchi yo\\'li yopiladi.'],\n ['Iflos qo\\'l orqali yuqishni to\\'xtatish?',['Sovun bilan 20 soniya yuvish','Qo\\'lni kiyimga artish','Yuzga tegish','Tirnoqni tishlash'],0,'Sovun mikroblarni yuvib ketadi.'],\n ['Iflos suv orqali yuqishni to\\'xtatish?',['Qaynatilgan yoki toza suv ichish','Ariq suvidan ichish','Hovuzdan ichish','Ko\\'lmak suvdan ichish'],0,'Qaynatish mikroblarni yo\\'qotadi.'],\n ['Zanjirdagi sog\\'lom odamni nima himoya qiladi?',['Immunitet va emlash','Uyqusizlik','Kam harakat','Ko\\'p shirinlik'],0,'Kuchli immunitet kasallikka yo\\'l qo\\'ymaydi.'],\n ['Kasal odam nima qilishi kerak?',['Uyda dam olib, kattalarga aytish','Maktabga borish','Do\\'stlarni quchoqlash','Dorini o\\'zi tanlash'],0,'Boshqalarga yuqmasligi uchun.'],\n ['Zanjir qachon uziladi?',['Bitta bo\\'g\\'in to\\'xtatilsa','Hech qachon','Faqat hamma kasal bo\\'lsa','Faqat qishda'],0,'Bitta bo\\'g\\'in yetarli.']]));\nquiz($('#g2b'),mk([\n ['🍔 Iflos qo\\'l bilan ovqatlandi. Nima bo\\'lishi mumkin?',['Ichak infeksiyasi xavfi','Kuchli immunitet','Tezroq o\\'sish','Hech narsa'],0,'Mikroblar ovqat bilan kiradi.'],\n ['🤧 Yonidagi odam aksirdi, yuzini yopmadi.',['Havo-tomchi bilan yuqish','Suv orqali yuqish','Hasharot orqali yuqish','Yuqmaydi'],0,'Mikroblar havoga tarqaladi.'],\n ['🛋️ Kam harakat va juda ko\\'p shirinlik.',['Yuqumsiz kasallik xavfi ortadi','Suyaklar mustahkam','Immunitet oshadi','Hech narsa'],0,'Bu yuqumsiz kasalliklar sababi.'],\n ['🚰 Ariq suvidan ichdi.',['Ichak kasalligi xavfi','Salomatlik yaxshilanadi','Kuch oshadi','Hech narsa'],0,'Suvda mikroblar bo\\'lishi mumkin.'],\n ['🌙 Har kuni juda kech yotadi.',['Immunitet susayadi','Immunitet kuchayadi','Bo\\'y o\\'sadi','Hech narsa'],0,'Uyqu yetishmasa organizm holsizlanadi.'],\n ['🪰 Ochiq qolgan ovqatga pashsha qo\\'ndi.',['Mikrob o\\'tishi mumkin','Ovqat foydali bo\\'ladi','Ovqat mazali bo\\'ladi','Hech narsa'],0,'Hasharotlar mikrob tashiydi.']]));\n\n// ---- 3-bo'lim: qo'l yuvish ----\nconst SP=['🖐️ Kaftlar','🤚 Kaft orqasi','🙌 Barmoq orasi','👍 Bosh barmoq','💅 Tirnoqlar','⌚ Bilak'];\nlet ht,hi=0,hr=false;\n$('#hs').onclick=()=>{\n  clearInterval(ht);hi=0;hr=true;let s=20;$('#tm').textContent=s;$('#hw').textContent='Qadamlarni to\\'g\\'ri tartibda bosing!';\n  $('#gm').textContent='🦠'.repeat(6);\n  const o=SP.map((_,k)=>k).sort(()=>Math.random()-.5);\n  $('#stp').innerHTML=o.map(k=>`<button data-k=\"${k}\">${SP[k]}<\/button>`).join('');\n  $('#stp').querySelectorAll('button').forEach(b=>b.onclick=()=>{\n    if(!hr)return;\n    if(+b.dataset.k==hi){hi++;b.disabled=true;b.classList.add('ok');$('#gm').textContent='🦠'.repeat(6-hi);\n      if(hi==6){hr=false;clearInterval(ht);score+=20;upd();$('#hw').textContent='✨ Qo\\'llar toza! Mikroblar yo\\'qoldi.'}}\n    else $('#hw').textContent='Bu hozir emas. Tartib: kaft, kaft orqasi, barmoq orasi, bosh barmoq, tirnoq, bilak.'});\n  ht=setInterval(()=>{s--;$('#tm').textContent=s;if(s<=0){clearInterval(ht);if(hr){hr=false;$('#hw').textContent='⏱️ Vaqt tugadi. Qayta urinib ko\\'ring.'}}},1000)};\nconst vac=(ok)=>{const a=$('#av2');a.textContent='🦠';setTimeout(()=>{a.textContent=ok?'😀':'🤒';pop(a);\n  $('#vm').textContent=ok?'Emlangan bolada leykotsitlar mikrobni tez taniydi va yengadi.':'Emlanmagan bola kasallikka tezroq beriladi va kasallik og\\'ir kechishi mumkin. Shifokorga murojaat qil.'},900)};\n$('#v1').onclick=()=>vac(true);$('#v2').onclick=()=>vac(false);\nquiz($('#g3'),mk([\n ['🌅 Maktabga chiqishdan oldin',['Yuz va qo\\'l yuvish, nonushta qilish','Nonushtasiz chiqish','Tirnoq tishlash','Telefon o\\'ynash'],0,'Gigiyena va ovqat kuch beradi.'],\n ['🏫 Sinfdoshing aksirdi',['Masofa saqlab, qo\\'lni yuvish','Qo\\'l siqish','Bir stakandan ichish','Hech narsa qilmaslik'],0,'Havo-tomchi xavfini kamaytiradi.'],\n ['🍎 Tushlikda olma yeyish',['Yuvib yeyish','Kiyimga artib yeyish','Yerdan olib yeyish','Yuvmay yeyish'],0,'Yuvish mikrob va changni ketkazadi.'],\n ['🌙 Kechqurun',['Xonani shamollatib, vaqtida uxlash','Kech tungacha telefon','Chips yeb yotish','Derazani butunlay yopish'],0,'Toza havo va uyqu immunitetga foyda.']]));\nquiz($('#g4'),mk([['🍏 Yuvilmagan olma',1,'Sirtida mikrob bo\\'lishi mumkin.'],['🫖 Qaynatilgan suv',0,'Mikroblar yo\\'qolgan.'],['🤧 Aksirganda yuzni ochiq qoldirish',1,'Mikroblar tarqaladi.'],['💉 Emlash jadvaliga rioya qilish',0,'Immunitetni oldindan tayyorlaydi.'],['🥛 Muddati o\\'tgan sut',1,'Zararli mikroblar ko\\'payadi.'],['🧼 Sovun bilan qo\\'l yuvish',0,'Mikroblarni yuvib ketadi.'],['🥄 Kasal bilan umumiy qoshiq',1,'Mikrob o\\'tishi mumkin.'],['🪟 Shamollatilgan xona',0,'Havodagi mikroblar kamayadi.']],['Xavfsiz ✅','Xavfli ⛔'],true));\n\n// ---- Yakuniy test ----\nquiz($('#g5'),mk([\n ['Immunitet nima?',['Organizmning kasallikka qarshi kurashish qobiliyati','Dori turi','Mikrob turi','Ovqat turi'],0,'Immunitet organizmni himoya qiladi.'],\n ['Kuniga qancha uxlash kerak (6-sinf)?',['9–10 soat','4 soat','6 soat','14 soat'],0,'Uyqu organizmni tiklaydi.'],\n ['Qaysi biri yuqumli kasallik qo\\'zg\\'atuvchisi?',['Bakteriya','Vitamin','Suv','Tuz'],0,'Bakteriya, virus, zamburug\\' va parazitlar.'],\n ['Qaysi kasallik yuqumsiz?',['Ko\\'p shirinlikdan kelib chiqqan semizlik','Gripp','Ichak infeksiyasi','Qizilcha'],0,'Yuqumsiz kasalliklar boshqalarga yuqmaydi.'],\n ['Havo-tomchi yo\\'liga qaysi biri misol?',['Aksirish va yo\\'tal','Iflos suv','Hasharot','Yaralangan joy'],0,'Mikroblar havo bilan tarqaladi.'],\n ['Kasallik zanjiri nechta bo\\'g\\'indan iborat?',['3','1','5','7'],0,'Manba, yo\\'l, sog\\'lom odam.'],\n ['Leykotsitlarning vazifasi?',['Mikroblardan himoya','Kislorod tashish','Qon ivishi','Suv saqlash'],0,'Ular mikrobni yutadi.'],\n ['Qo\\'lni kamida necha soniya yuvish kerak?',['20','2','5','60 daqiqa'],0,'Sovun bilan 20 soniya.'],\n ['Emlash nima uchun kerak?',['Immunitet kasallikni oldindan o\\'rganadi','Mikrob ko\\'paysin deb','Ovqat o\\'rniga','Uyqu uchun'],0,'Organizm tayyor bo\\'ladi.'],\n ['Meva-sabzavotni yeyishdan oldin nima qilinadi?',['Yuviladi','Yerga tashlanadi','Artilmaydi','Qoldiriladi'],0,'Mikrob va chang ketadi.'],\n ['Kasal bo\\'lganda nima qilish kerak?',['Kattalarga aytib, shifokorga murojaat qilish','Dorini o\\'zi tanlash','Maktabga borish','Hech kimga aytmaslik'],0,'Davolashni shifokor belgilaydi.'],\n ['Zanjirni qanday uzish mumkin?',['Bitta bo\\'g\\'inni to\\'xtatish','Hech qanday','Faqat dori bilan','Kuta turish'],0,'Masalan, qo\\'l yuvish yoki niqob.']]),\n ok=>'<br>'+(ok>=11?'⭐⭐⭐ Ajoyib!':ok>=8?'⭐⭐ Yaxshi!':ok>=5?'⭐ Yomon emas.':'Yana urinib ko\\'r.')+'<br><small>Eslab qol: kasallik zanjiri 3 bo\\'g\\'indan iborat, bitta bo\\'g\\'in uzilsa kasallik tarqalmaydi. Qo\\'l yuvish, emlash va sog\\'lom turmush tarzi eng yaxshi himoya.<\/small>');\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Oziq zanjirlari va oziq to‘rlari", "i": "🌿", "g": "Ekologiya", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Oziq zanjirlari va oziq torlari<\/title>\n<style>\n:root{--green:#217a42;--light:#edf8ed;--ink:#183126;--gold:#ffd45b;--blue:#dff2ff}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f7f0;color:var(--ink);line-height:1.55}\nheader{background:linear-gradient(135deg,#14532d,#3f9b55);color:white;text-align:center;padding:28px 16px}\nheader h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px)}\nheader p{margin:0;font-size:17px}\nmain{max-width:1100px;margin:auto;padding:18px}\nsection{background:white;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 4px 16px #1231}\nh2{color:#176236;margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}\n.card{border:2px solid #d5e8d5;border-radius:12px;padding:14px;text-align:center;background:#fbfffb}\n.icon{font-size:42px;display:block}\n.pill{display:inline-block;background:#e5f5e7;color:#176236;padding:4px 10px;border-radius:20px;font-weight:bold;font-size:13px}\n.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px 0}\n.node{min-width:110px;padding:12px;border:2px solid #8bc59a;border-radius:12px;background:#f4fff4;text-align:center;font-weight:bold}\n.arrow{font-size:28px;color:#287d43}\n.note{background:#fff7d8;border-left:5px solid #e5ad18;padding:12px;border-radius:8px}\n.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}\nbutton{border:0;background:#217a42;color:white;border-radius:9px;padding:11px 16px;font-size:15px;font-weight:bold;cursor:pointer}\nbutton:hover{background:#14532d}\nbutton.secondary{background:#426b8b}\nbutton.warning{background:#a04a36}\n#message{background:#e8f4ff;border-radius:10px;padding:14px;min-height:54px;margin-top:12px}\n.active{animation:pulse 1s ease-in-out 2;border-color:#edaa00!important;background:#fff6c8!important}\n@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 18px #ffd45b}}\n.web{width:100%;min-height:290px;background:#f8fcf8;border-radius:12px;border:1px solid #d5e8d5}\n.web svg{width:100%;height:auto;display:block}\n.nodebox{fill:#fff;stroke:#47945a;stroke-width:2}\n.edge{stroke:#39814c;stroke-width:2.5;fill:none;marker-end:url(#arrow)}\n.quiz-q{padding:13px;margin:12px 0;border:1px solid #dbe8db;border-radius:10px}\n.quiz-q label{display:block;margin:6px 0;cursor:pointer}\n#score{font-weight:bold;font-size:18px;margin-top:12px}\nfooter{text-align:center;color:#54705b;padding:20px}\nsmall{color:#56705d}\n@media(max-width:600px){main{padding:10px}section{padding:15px}.node{min-width:90px}.arrow{font-size:22px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🌱 Oziq zanjirlari va oziq torlari<\/h1>\n  <p>6-sinf Tabiiy fan • Interaktiv dars va simulyatsiya<\/p>\n<\/header>\n<main>\n<section>\n<h2>1. Mavzuning asosiy mazmuni<\/h2>\n<p>Tabiatdagi tirik organizmlar yashashi, o‘sishi va ko‘payishi uchun energiya oladi. Ko‘pchilik ekotizimlarda energiyaning asosiy manbayi — <b>Quyosh<\/b>. Yashil o‘simliklar Quyosh nuri yordamida fotosintez qiladi va oziq modda hosil qiladi. Oziqlanish jarayonida energiya bir organizmdan boshqasiga o‘tadi.<\/p>\n<div class=\"grid\">\n<div class=\"card\"><span class=\"icon\">🌿<\/span><h3>Produtsentlar<\/h3><p>O‘z oziq moddasini hosil qiluvchilar. Masalan: o‘t, daraxt, suvo‘tlar.<\/p><span class=\"pill\">Ishlab chiqaruvchilar<\/span><\/div>\n<div class=\"card\"><span class=\"icon\">🐇<\/span><h3>Konsumentlar<\/h3><p>Tayyor organik moddalar bilan oziqlanadi. Masalan: quyon, chigirtka, qurbaqa, tulki.<\/p><span class=\"pill\">Iste’molchilar<\/span><\/div>\n<div class=\"card\"><span class=\"icon\">🍄<\/span><h3>Redutsentlar<\/h3><p>O‘lik organizmlar qoldiqlarini parchalaydi. Masalan: zamburug‘lar va bakteriyalar.<\/p><span class=\"pill\">Parchalovchilar<\/span><\/div>\n<\/div>\n<div class=\"note\"><b>Eslab qoling:<\/b> oziq zanjiridagi strelka oziqdan uni iste’mol qiluvchi organizmga, ya’ni energiya o‘tadigan yo‘nalishga qarab chiziladi.<\/div>\n<\/section>\n\n<section>\n<h2>2. Oziq zanjiri qanday tuziladi?<\/h2>\n<p>Oziq zanjiri — organizmlarning kim kim bilan oziqlanishini ko‘rsatadigan ketma-ketlik.<\/p>\n<div class=\"chain\" id=\"chain\">\n<div class=\"node\" id=\"n0\">☀️ Quyosh<\/div><span class=\"arrow\">→<\/span>\n<div class=\"node\" id=\"n1\">🌱 O‘t<\/div><span class=\"arrow\">→<\/span>\n<div class=\"node\" id=\"n2\">🦗 Chigirtka<\/div><span class=\"arrow\">→<\/span>\n<div class=\"node\" id=\"n3\">🐸 Qurbaqa<\/div><span class=\"arrow\">→<\/span>\n<div class=\"node\" id=\"n4\">🐍 Ilon<\/div><span class=\"arrow\">→<\/span>\n<div class=\"node\" id=\"n5\">🦅 Burgut<\/div>\n<\/div>\n<div class=\"controls\">\n<button onclick=\"playChain()\">▶ Zanjir animatsiyasini boshlash<\/button>\n<button class=\"secondary\" onclick=\"resetChain()\">↺ Qayta boshlash<\/button>\n<\/div>\n<div id=\"message\" aria-live=\"polite\">Animatsiyani boshlang: energiyaning oziq zanjiri bo‘ylab o‘tishini kuzating.<\/div>\n<p><b>Yana bir misol:<\/b> bug‘doy → sichqon → ilon → burgut.<\/p>\n<\/section>\n\n<section>\n<h2>3. Oziq tori: bir nechta zanjirlar birlashganda<\/h2>\n<p>Tabiatda ko‘plab hayvonlar turli oziqlar bilan oziqlanadi. Bir ekotizimdagi o‘zaro bog‘langan oziq zanjirlari <b>oziq torini<\/b> hosil qiladi.<\/p>\n<div class=\"web\">\n<svg viewBox=\"0 0 900 390\" role=\"img\" aria-label=\"O‘t, chigirtka, sichqon, quyon, qurbaqa, ilon, tulki va burgutdan tashkil topgan oziq tori\">\n<defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#39814c\"/><\/marker><\/defs>\n<!-- arrows: food to eater -->\n<path class=\"edge\" d=\"M130 190 L245 85\"/><path class=\"edge\" d=\"M130 200 L245 190\"/><path class=\"edge\" d=\"M130 210 L245 295\"/>\n<path class=\"edge\" d=\"M335 85 L445 130\"/><path class=\"edge\" d=\"M335 190 L445 130\"/><path class=\"edge\" d=\"M335 295 L445 190\"/>\n<path class=\"edge\" d=\"M535 130 L645 85\"/><path class=\"edge\" d=\"M535 190 L645 190\"/><path class=\"edge\" d=\"M535 130 L645 295\"/>\n<path class=\"edge\" d=\"M335 85 L645 85\"/><path class=\"edge\" d=\"M335 295 L645 295\"/>\n<rect class=\"nodebox\" x=\"30\" y=\"165\" rx=\"12\" width=\"100\" height=\"65\"/><text x=\"80\" y=\"192\" text-anchor=\"middle\" font-size=\"17\">🌿 O‘t<\/text><text x=\"80\" y=\"212\" text-anchor=\"middle\" font-size=\"12\">Produtsent<\/text>\n<rect class=\"nodebox\" x=\"245\" y=\"55\" rx=\"12\" width=\"90\" height=\"60\"/><text x=\"290\" y=\"91\" text-anchor=\"middle\" font-size=\"16\">🦗 Chigirtka<\/text>\n<rect class=\"nodebox\" x=\"245\" y=\"160\" rx=\"12\" width=\"90\" height=\"60\"/><text x=\"290\" y=\"196\" text-anchor=\"middle\" font-size=\"16\">🐭 Sichqon<\/text>\n<rect class=\"nodebox\" x=\"245\" y=\"265\" rx=\"12\" width=\"90\" height=\"60\"/><text x=\"290\" y=\"301\" text-anchor=\"middle\" font-size=\"16\">🐇 Quyon<\/text>\n<rect class=\"nodebox\" x=\"445\" y=\"100\" rx=\"12\" width=\"90\" height=\"60\"/><text x=\"490\" y=\"136\" text-anchor=\"middle\" font-size=\"16\">🐸 Qurbaqa<\/text>\n<rect class=\"nodebox\" x=\"445\" y=\"165\" rx=\"12\" width=\"90\" height=\"60\"/><text x=\"490\" y=\"201\" text-anchor=\"middle\" font-size=\"16\">🐍 Ilon<\/text>\n<rect class=\"nodebox\" x=\"645\" y=\"55\" rx=\"12\" width=\"105\" height=\"60\"/><text x=\"697\" y=\"91\" text-anchor=\"middle\" font-size=\"16\">🦊 Tulki<\/text>\n<rect class=\"nodebox\" x=\"645\" y=\"160\" rx=\"12\" width=\"105\" height=\"60\"/><text x=\"697\" y=\"196\" text-anchor=\"middle\" font-size=\"16\">🦅 Burgut<\/text>\n<rect class=\"nodebox\" x=\"645\" y=\"265\" rx=\"12\" width=\"105\" height=\"60\"/><text x=\"697\" y=\"301\" text-anchor=\"middle\" font-size=\"16\">🦊 Tulki<\/text>\n<text x=\"790\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" fill=\"#56705d\">Strelka: oziq → iste’molchi<\/text>\n<\/svg>\n<\/div>\n<div class=\"note\">Oziq tori murakkab bog‘lanishlarni ko‘rsatadi. Bir tur kamayib ketsa, unga bog‘liq boshqa turlar soni ham o‘zgarishi mumkin. Boshqa oziq manbalari mavjudligi ayrim yirtqichlarga moslashishga yordam beradi.<\/div>\n<\/section>\n\n<section>\n<h2>4. Simulyatsiya: quyonlar kamayib ketsa nima bo‘ladi?<\/h2>\n<p>Quyidagi tugmalar yordamida ekotizimdagi o‘zgarishlarni tasavvur qiling. Bu soddalashtirilgan o‘quv modeli; haqiqiy tabiatdagi o‘zgarishlar ko‘plab omillarga bog‘liq.<\/p>\n<div class=\"grid\">\n<div class=\"card\"><span class=\"icon\">🌿<\/span><h3>O‘simliklar<\/h3><p id=\"plants\">Miqdor: ko‘p<\/p><\/div>\n<div class=\"card\"><span class=\"icon\">🐇<\/span><h3>Quyonlar<\/h3><p id=\"rabbits\">Miqdor: ko‘p<\/p><\/div>\n<div class=\"card\"><span class=\"icon\">🦊<\/span><h3>Tulkilar<\/h3><p id=\"foxes\">Miqdor: o‘rtacha<\/p><\/div>\n<div class=\"card\"><span class=\"icon\">🐭<\/span><h3>Sichqonlar<\/h3><p id=\"mice\">Miqdor: o‘rtacha<\/p><\/div>\n<\/div>\n<div class=\"controls\">\n<button onclick=\"scenario('normal')\">🌳 Muvozanatli holat<\/button>\n<button class=\"warning\" onclick=\"scenario('few')\">🐇 Quyonlar kamayadi<\/button>\n<button class=\"secondary\" onclick=\"scenario('plants')\">🌿 O‘simliklar kamayadi<\/button>\n<\/div>\n<div id=\"simMessage\" class=\"note\">Holatni tanlang va o‘zgarishlarni muhokama qiling.<\/div>\n<\/section>\n\n<section>\n<h2>5. Bilimingizni sinab ko‘ring<\/h2>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Oziq zanjiridagi energiyaning asosiy manbayi nima?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Oy<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Quyosh<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Tuproq<\/label><\/div>\n<div class=\"quiz-q\"><b>2. O‘simliklar oziq zanjirida qanday ataladi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Redutsentlar<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Konsumentlar<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Produtsentlar<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Oziq zanjiridagi strelka nimani bildiradi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Energiya o‘tish yo‘nalishini<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Hayvonning yoshini<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Yashash joyini<\/label><\/div>\n<div class=\"quiz-q\"><b>4. O‘lik qoldiqlarni parchalovchilar qaysilar?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Quyon va kiyik<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Zamburug‘lar va bakteriyalar<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Burgut va tulki<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Oziq tori nima?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Bitta hayvonning uyasi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Faqat o‘simliklar ro‘yxati<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> O‘zaro bog‘langan oziq zanjirlari<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Javoblarni tekshirish<\/button>\n<button type=\"button\" class=\"secondary\" onclick=\"resetQuiz()\">Qayta ishlash<\/button>\n<div id=\"score\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n\n<section>\n<h2>6. Mustahkamlash uchun savollar<\/h2>\n<ol>\n<li>Agar ekotizimdagi barcha yashil o‘simliklar yo‘qolsa, nima yuz beradi? Nega?<\/li>\n<li>Redutsentlar tabiat uchun nima sababdan muhim?<\/li>\n<li>Oziq zanjiri va oziq tori o‘rtasidagi farqni tushuntiring.<\/li>\n<li>O‘t → quyon → tulki zanjirida energiya qaysi yo‘nalishda o‘tadi?<\/li>\n<li>Mahalliy tabiatdan misol keltirib, kamida to‘rtta organizmdan iborat oziq zanjiri tuzing.<\/li>\n<\/ol>\n<\/section>\n<section>\n<h2>7. Qisqa xulosa<\/h2>\n<ul>\n<li><b>Oziq zanjiri<\/b> — oziqlanish orqali energiyaning bir organizmdan boshqasiga o‘tish ketma-ketligi.<\/li>\n<li><b>Oziq tori<\/b> — bir ekotizimdagi o‘zaro bog‘langan bir nechta oziq zanjirlari.<\/li>\n<li><b>Produtsentlar<\/b> oziq modda hosil qiladi, <b>konsumentlar<\/b> tayyor oziqni iste’mol qiladi, <b>redutsentlar<\/b> qoldiqlarni parchalaydi.<\/li>\n<li>Tabiatdagi barcha organizmlar o‘zaro bog‘langan; bir tur sonining o‘zgarishi boshqalariga ham ta’sir qilishi mumkin.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan • O‘qituvchi uchun interaktiv ko‘rgazmali material<\/footer>\n<script>\nconst descriptions=[\n\"Quyosh energiyasi o‘simliklarga yetib boradi. O‘simliklar fotosintez orqali organik modda hosil qiladi.\",\n\"Chigirtka o‘simlik bilan oziqlanadi. Energiya o‘simlikdan chigirtkaga o‘tadi.\",\n\"Qurbaqa chigirtkani yeydi. Energiya qurbaqaga o‘tadi.\",\n\"Ilon qurbaqa bilan oziqlanishi mumkin. Energiya ilonga o‘tadi.\",\n\"Burgut ilon kabi hayvonlarni ovlashi mumkin. Energiya oziq orqali burgutga o‘tadi.\",\n\"Organizm qoldiqlari zamburug‘lar va bakteriyalar tomonidan parchalanadi. Mineral moddalar tabiatga qaytadi.\"\n];\nlet chainTimer=[];\nfunction playChain(){\n resetChain();\n const ids=[\"n0\",\"n1\",\"n2\",\"n3\",\"n4\",\"n5\"];\n ids.forEach((id,i)=>{chainTimer.push(setTimeout(()=>{\n document.getElementById(id).classList.add(\"active\");\n document.getElementById(\"message\").textContent=(i===0?descriptions[0]:i===1?\"O‘simlik oziq modda hosil qildi. Keyingi bosqichda uni o‘txo‘r iste’mol qiladi.\":i===2?descriptions[1]:i===3?descriptions[2]:i===4?descriptions[3]:descriptions[4]);\n if(i>0) document.getElementById(ids[i-1]).classList.remove(\"active\");\n if(i===5) chainTimer.push(setTimeout(()=>{document.getElementById(\"message\").textContent=descriptions[5];document.getElementById(\"n5\").classList.remove(\"active\");},1800));\n },i*1500));});\n}\nfunction resetChain(){chainTimer.forEach(clearTimeout);chainTimer=[];document.querySelectorAll(\".node\").forEach(n=>n.classList.remove(\"active\"));document.getElementById(\"message\").textContent=\"Animatsiyani boshlang: energiyaning oziq zanjiri bo‘ylab o‘tishini kuzating.\"}\nfunction scenario(type){\n const data={\n normal:[\"Miqdor: ko‘p\",\"Miqdor: ko‘p\",\"Miqdor: o‘rtacha\",\"Miqdor: o‘rtacha\",\"Ekotizimda turlar o‘zaro bog‘langan. Bu boshlang‘ich, soddalashtirilgan holat.\"],\n few:[\"Miqdor: ko‘payishi mumkin\",\"Miqdor: kam\",\"Miqdor: boshqa oziqqa o‘tishi mumkin\",\"Miqdor: o‘zgarishi mumkin\",\"Quyonlar kamayganda o‘simliklarga bosim kamayishi mumkin. Tulkilar boshqa oziqni izlaydi; sichqonlar va boshqa turlarning soni ham o‘zgarishi mumkin.\"],\n plants:[\"Miqdor: kam\",\"Miqdor: kamayishi mumkin\",\"Miqdor: oziq kamaygani uchun o‘zgaradi\",\"Miqdor: oziq kamaygani uchun o‘zgaradi\",\"O‘simliklar kamayishi o‘txorlarga oziq yetishmasligiga olib keladi. Bu holat keyingi darajadagi iste’molchilarga ham ta’sir ko‘rsatadi.\"]\n };\n let d=data[type];[\"plants\",\"rabbits\",\"foxes\",\"mice\"].forEach((id,i)=>document.getElementById(id).textContent=d[i]);document.getElementById(\"simMessage\").textContent=d[4];\n}\nfunction checkQuiz(){\n const answers={q1:\"b\",q2:\"c\",q3:\"a\",q4:\"b\",q5:\"c\"};let score=0,missing=0;\n for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(!chosen)missing++;else if(chosen.value===a)score++;}\n document.getElementById(\"score\").textContent=\"Natija: \"+score+\"/5 ta to‘g‘ri.\"+(missing?\" Javob berilmagan savollar: \"+missing+\".\":score===5?\" A’lo! Mavzuni yaxshi tushunibsiz.\":\" Javoblarni qayta ko‘rib chiqing.\");\n}\nfunction resetQuiz(){document.getElementById(\"quiz\").reset();document.getElementById(\"score\").textContent=\"\"}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Energiya va zaharli moddalar oqimi", "i": "⚡", "g": "Ekologiya", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Energiya va zaharli moddalar oqimi<\/title>\n<style>\n:root{--bg:#071b2b;--panel:#102b40;--panel2:#15384e;--text:#eef8ff;--muted:#b6cbd8;--green:#63e6a4;--yellow:#ffd166;--red:#ff667a;--blue:#65c9ff}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#071b2b,#0b2b3c 55%,#123b45);color:var(--text);line-height:1.55}\nheader{padding:30px 18px 24px;text-align:center;background:radial-gradient(circle at top,#20536a,#0b2538 68%);border-bottom:1px solid #2e596d}\nheader .tag{display:inline-block;padding:6px 12px;border-radius:99px;background:#19465b;color:#a8f3d0;font-weight:bold;font-size:.85rem}\nh1{font-size:clamp(1.8rem,5vw,3rem);margin:12px auto 8px;max-width:900px;line-height:1.15}header p{max-width:850px;margin:0 auto;color:var(--muted)}\nmain{max-width:1120px;margin:auto;padding:18px}\nnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 22px}\nbutton{border:0;border-radius:12px;padding:10px 15px;font-weight:bold;cursor:pointer;transition:.2s}\nbutton:hover{transform:translateY(-1px);filter:brightness(1.08)}button:focus-visible{outline:3px solid white;outline-offset:2px}\n.navbtn{background:#17394e;color:var(--text);border:1px solid #2c5a70}.navbtn.active{background:var(--green);color:#07291e}\nsection.card{background:rgba(16,43,64,.94);border:1px solid #28516a;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 12px 28px #0002}\nh2{margin:0 0 10px;font-size:1.45rem}h3{margin:12px 0 6px;color:#aeeed0}.lead{color:var(--muted);margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}\n.tile{padding:15px;background:#15384e;border-radius:15px;border:1px solid #2c566a}\n.icon{font-size:2rem}.tile p{margin:5px 0 0;color:var(--muted)}\n.flow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px 0}\n.organism{min-width:112px;text-align:center;background:#183e52;border:1px solid #397086;border-radius:16px;padding:12px}\n.organism b{display:block;font-size:1.08rem}.arrow{color:var(--yellow);font-size:1.6rem;font-weight:bold}\n.callout{padding:13px 15px;border-left:4px solid var(--yellow);background:#263d47;border-radius:8px;margin:12px 0}\n.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}\n.controls label{font-weight:bold}.controls input[type=range]{width:min(330px,100%)}\n.action{background:var(--green);color:#082b20}.secondary{background:#234c63;color:white}.danger{background:#7e3044;color:white}\n.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}\n.stat{background:#0a2335;border-radius:12px;padding:12px;text-align:center}.stat strong{font-size:1.5rem;display:block;color:var(--yellow)}\n.barwrap{height:22px;background:#25475a;border-radius:99px;overflow:hidden;margin:7px 0 12px}.bar{height:100%;width:100%;border-radius:99px;transition:width .7s;background:linear-gradient(90deg,#55d98b,#d5f879)}\n.energy-stage{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}\n.energy-box{padding:13px 8px;text-align:center;border-radius:12px;background:#0a2335;border:1px solid #2d566a}\n.cubes{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:28px;margin:8px 0}\n.cube{width:10px;height:10px;background:var(--yellow);border-radius:2px;box-shadow:0 0 7px #ffd16699}\n.muted{color:var(--muted);font-size:.94rem}.result{font-weight:bold;margin-top:10px;min-height:24px}\n.toxin-water{background:linear-gradient(#17617b,#0c354b);border-radius:16px;padding:14px;border:1px solid #39748b}\n.toxin-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}\n.toxin-creature{background:#0b2b40;border:1px solid #397086;border-radius:12px;padding:12px;text-align:center}\n.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:22px;margin:8px auto}\n.dot{height:9px;width:9px;border-radius:50%;background:var(--red);box-shadow:0 0 7px #ff667a99}\n.warning{color:#ffd5dc}.quizq{padding:14px;background:#15384e;border-radius:13px;margin:12px 0}.quizq label{display:block;padding:5px;cursor:pointer}.quizq input{margin-right:8px}\nfooter{text-align:center;color:var(--muted);padding:25px}\n.hidden{display:none!important}\n@media(max-width:620px){main{padding:12px}.energy-stage{grid-template-columns:repeat(2,1fr)}section.card{padding:15px}.flow{gap:5px}.organism{min-width:90px;padding:9px}.arrow{font-size:1.2rem}}\n<\/style>\n<\/head>\n<body>\n<header>\n <span class=\"tag\">6-SINF · TABIIY FAN<\/span>\n <h1>🌿 Energiya va zaharli moddalar oqimi<\/h1>\n <p>Ekotizimda energiya qanday uzatiladi va zaharli moddalar oziq zanjirida nima sababdan to‘planadi? O‘rganing, simulyatsiya qiling va bilimingizni sinang.<\/p>\n<\/header>\n<main>\n<nav>\n <button class=\"navbtn active\" data-target=\"nazariya\">📘 Nazariya<\/button>\n <button class=\"navbtn\" data-target=\"energiya\">☀️ Energiya simulyatsiyasi<\/button>\n <button class=\"navbtn\" data-target=\"zahar\">☣️ Zahar oqimi<\/button>\n <button class=\"navbtn\" data-target=\"test\">🧠 Mini-test<\/button>\n<\/nav>\n\n<div id=\"nazariya\" class=\"page\">\n<section class=\"card\">\n<h2>1. Oziq zanjiri bo‘ylab energiya qanday uzatiladi?<\/h2>\n<p class=\"lead\">Ekotizimdagi energiyaning asosiy manbai — Quyosh. Energiya oziq orqali bir organizmdan boshqasiga o‘tadi.<\/p>\n<div class=\"flow\">\n <div class=\"organism\"><span class=\"icon\">☀️<\/span><b>Quyosh<\/b><small>yorug‘lik<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🌿<\/span><b>O‘simlik<\/b><small>produtsent<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🐇<\/span><b>Quyon<\/b><small>1-darajali konsument<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🦊<\/span><b>Tulki<\/b><small>yirtqich<\/small><\/div>\n<\/div>\n<div class=\"grid\">\n<div class=\"tile\"><div class=\"icon\">🌱<\/div><h3>Produtsentlar<\/h3><p>Yashil o‘simliklar va suvo‘tlar fotosintez orqali Quyosh energiyasini kimyoviy energiyaga aylantiradi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🐛<\/div><h3>Konsumentlar<\/h3><p>Hayvonlar boshqa organizmlarni yeyish orqali energiya oladi. O‘txo‘rlar o‘simlik bilan, yirtqichlar esa boshqa hayvonlar bilan oziqlanadi.<\/p><\/div>\n<div class=\"tile\"><div class=\"icon\">🍄<\/div><h3>Redutsentlar<\/h3><p>Zamburug‘lar va ko‘plab bakteriyalar o‘lik organizmlar hamda chiqindilarni parchalaydi, moddalarni muhitga qaytaradi.<\/p><\/div>\n<\/div>\n<div class=\"callout\"><b>10% qoidasi:<\/b> soddalashtirilgan modelda bir trofik darajadagi energiyaning taxminan 10 foizi keyingi darajada yangi biomassa hosil qilishga o‘tadi. Qolgan qismi organizmning hayotiy faoliyatiga sarflanadi va issiqlik sifatida tarqaladi. Bu aniq, hamma holatda bir xil qonun emas — taxminiy qoidadir.<\/div>\n<h3>Oziq zanjiri va oziq to‘ri<\/h3>\n<div class=\"grid\">\n<div class=\"tile\"><b>➡️ Oziq zanjiri<\/b><p>Organizmlar orasidagi oziqlanishning bitta ketma-ket yo‘li: o‘t → chigirtka → qurbaqa → ilon.<\/p><\/div>\n<div class=\"tile\"><b>🕸️ Oziq to‘ri<\/b><p>Bir-biriga bog‘langan ko‘plab oziq zanjirlari. Tabiatda bir hayvon bir necha turdagi ozuqani yeyishi mumkin.<\/p><\/div>\n<\/div>\n<\/section>\n<section class=\"card\">\n<h2>2. Zaharli moddalar oziq zanjiri bo‘ylab uzatiladimi?<\/h2>\n<p>Ha. Ayrim zaharli moddalar, masalan simobning ayrim shakllari va ba’zi uzoq saqlanuvchi pestitsidlar, organizmlarda to‘planishi mumkin.<\/p>\n<div class=\"flow\">\n <div class=\"organism\"><span class=\"icon\">💧<\/span><b>Suv<\/b><small>ifloslanish<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🦠<\/span><b>Plankton<\/b><small>modda yutiladi<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🐟<\/span><b>Mayda baliq<\/b><small>ko‘p plankton yeydi<\/small><\/div><span class=\"arrow\">→<\/span>\n <div class=\"organism\"><span class=\"icon\">🦅<\/span><b>Baliqxo‘r qush<\/b><small>yuqori daraja<\/small><\/div>\n<\/div>\n<div class=\"callout\"><b>Biomagnifikatsiya<\/b> — ayrim zaharli moddalarning oziq zanjirining yuqori trofik darajalarida konsentratsiyasi ortib borishi. Har bir modda ham shunday tutmaydi: bu uning xususiyatlari va organizmlarning modda almashinuviga bog‘liq.<\/div>\n<p class=\"muted\">Eslab qoling: energiya oqimi bir yo‘nalishda bo‘lib, oxir-oqibat issiqlik sifatida tarqaladi. Moddalar esa tabiatda aylanishi mumkin; ayrim zaharli moddalar uzoq vaqt saqlanib, organizmlarda yig‘iladi.<\/p>\n<\/section>\n<\/div>\n\n<div id=\"energiya\" class=\"page hidden\">\n<section class=\"card\">\n<h2>☀️ Interaktiv simulyatsiya: energiya piramidasi<\/h2>\n<p class=\"lead\">Boshlang‘ich energiya miqdorini o‘zgartiring. Har bir keyingi bosqichga 10% o‘tishini kuzating.<\/p>\n<div class=\"controls\"><label for=\"energyInput\">O‘simlikdagi energiya:<\/label><input id=\"energyInput\" type=\"range\" min=\"100\" max=\"10000\" step=\"100\" value=\"1000\"><strong id=\"energyValue\">1000 birlik<\/strong><\/div>\n<div class=\"energy-stage\">\n <div class=\"energy-box\"><div class=\"icon\">🌿<\/div><b>O‘simlik<\/b><div class=\"cubes\" id=\"c0\"><\/div><strong id=\"e0\">1000<\/strong><small>birlik<\/small><\/div>\n <div class=\"energy-box\"><div class=\"icon\">🐛<\/div><b>Chigirtka<\/b><div class=\"cubes\" id=\"c1\"><\/div><strong id=\"e1\">100<\/strong><small>birlik<\/small><\/div>\n <div class=\"energy-box\"><div class=\"icon\">🐸<\/div><b>Qurbaqa<\/b><div class=\"cubes\" id=\"c2\"><\/div><strong id=\"e2\">10<\/strong><small>birlik<\/small><\/div>\n <div class=\"energy-box\"><div class=\"icon\">🐍<\/div><b>Ilon<\/b><div class=\"cubes\" id=\"c3\"><\/div><strong id=\"e3\">1<\/strong><small>birlik<\/small><\/div>\n<\/div>\n<div id=\"energyBars\"><\/div>\n<div class=\"controls\"><button class=\"action\" id=\"energyPlay\">▶ Energiya oqimini ko‘rsat<\/button><button class=\"secondary\" id=\"energyReset\">↺ Qayta boshlash<\/button><\/div>\n<p class=\"result\" id=\"energyMessage\" aria-live=\"polite\">Simulyatsiyani boshlash uchun tugmani bosing.<\/p>\n<p class=\"muted\">Kubiklar ko‘rgazmali tasvir: juda katta sonlarda hammasi alohida chizilmaydi. Hisob-kitob 10% qoidasining soddalashtirilgan modeliga asoslangan.<\/p>\n<\/section>\n<\/div>\n\n<div id=\"zahar\" class=\"page hidden\">\n<section class=\"card\">\n<h2>☣️ Interaktiv simulyatsiya: zaharning sayohati<\/h2>\n<p class=\"lead\">Shartli zahar birliklari oziq zanjiri bo‘ylab qanday to‘planishini ko‘ring. Bu haqiqiy tabiatdagi aniq o‘lchov emas, tushuntirish uchun yaratilgan model.<\/p>\n<div class=\"toxin-water\">\n <div style=\"text-align:center;font-size:1.2rem\">💧 Ko‘l suvi — shartli ifloslanish<\/div>\n <div class=\"controls\" style=\"justify-content:center\"><label for=\"toxinInput\">Suvdagi ifloslanish darajasi:<\/label><input id=\"toxinInput\" type=\"range\" min=\"1\" max=\"5\" value=\"2\"><strong id=\"toxinValue\">2<\/strong><\/div>\n <div class=\"toxin-levels\">\n  <div class=\"toxin-creature\"><div class=\"icon\">🌿<\/div><b>Suv o‘tlari<\/b><div class=\"dots\" id=\"d0\"><\/div><strong id=\"t0\">2<\/strong><small>shartli birlik<\/small><\/div>\n  <div class=\"toxin-creature\"><div class=\"icon\">🐟<\/div><b>Mayda baliq<\/b><div class=\"dots\" id=\"d1\"><\/div><strong id=\"t1\">20<\/strong><small>shartli birlik<\/small><\/div>\n  <div class=\"toxin-creature\"><div class=\"icon\">🐠<\/div><b>Yirik baliq<\/b><div class=\"dots\" id=\"d2\"><\/div><strong id=\"t2\">200<\/strong><small>shartli birlik<\/small><\/div>\n  <div class=\"toxin-creature\"><div class=\"icon\">🦅<\/div><b>Baliqxo‘r qush<\/b><div class=\"dots\" id=\"d3\"><\/div><strong id=\"t3\">2000<\/strong><small>shartli birlik<\/small><\/div>\n <\/div>\n<\/div>\n<div class=\"controls\"><button class=\"action\" id=\"toxinPlay\">▶ Zaharning harakatini ko‘rsat<\/button><button class=\"secondary\" id=\"toxinReset\">↺ Qayta boshlash<\/button><\/div>\n<p class=\"result warning\" id=\"toxinMessage\" aria-live=\"polite\">Suvdagi darajani tanlab, simulyatsiyani boshlang.<\/p>\n<div class=\"callout\"><b>Muhim:<\/b> zaharli moddalarni tabiatga tashlamang. Batareya, elektron chiqindi, moy va kimyoviy moddalarni tegishli yig‘ish joylariga topshirish kerak.<\/div>\n<\/section>\n<\/div>\n\n<div id=\"test\" class=\"page hidden\">\n<section class=\"card\">\n<h2>🧠 Bilimingizni sinang<\/h2>\n<p class=\"lead\">Har bir savol uchun bitta javobni belgilang, so‘ng natijani tekshiring.<\/p>\n<form id=\"quiz\">\n<div class=\"quizq\"><b>1. Ekotizimdagi energiyaning asosiy manbai nima?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Oy<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Quyosh<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Tuproq<\/label><\/div>\n<div class=\"quizq\"><b>2. O‘simliklar oziq zanjirida qanday ataladi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Produtsentlar<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Yirtqichlar<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Redutsentlar<\/label><\/div>\n<div class=\"quizq\"><b>3. 10% qoidasiga ko‘ra, 1000 birlik energiyadan keyingi darajaga taxminan qancha o‘tadi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> 900 birlik<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> 500 birlik<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> 100 birlik<\/label><\/div>\n<div class=\"quizq\"><b>4. Oziq to‘ri nima?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Faqat bitta oziq zanjiri<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> O‘zaro bog‘langan oziq zanjirlari<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Faqat o‘simliklar to‘plami<\/label><\/div>\n<div class=\"quizq\"><b>5. Biomagnifikatsiya nimani anglatadi?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Quyosh energiyasining ko‘payishi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Ayrim zaharli moddalarning yuqori oziq darajalarida konsentratsiyasi ortishi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> O‘simliklarning tez o‘sishi<\/label><\/div>\n<div class=\"quizq\"><b>6. Redutsentlar qanday vazifani bajaradi?<\/b>\n<label><input type=\"radio\" name=\"q6\" value=\"a\"> Quyosh nurini qaytaradi<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> Barcha hayvonlarni ovlaydi<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> O‘lik qoldiqlarni parchalaydi<\/label><\/div>\n<button class=\"action\" type=\"submit\">Natijani tekshirish<\/button> <button class=\"secondary\" type=\"reset\" id=\"quizReset\">Tozalash<\/button>\n<\/form>\n<div class=\"result\" id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/section>\n<\/div>\n<footer>🌍 Tabiatni asraylik — energiya oqimini tushunaylik, ifloslanishning oldini olaylik!<\/footer>\n<\/main>\n<script>\nconst navButtons=document.querySelectorAll('.navbtn');\nnavButtons.forEach(btn=>btn.addEventListener('click',()=>{\n navButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');\n document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));\n document.getElementById(btn.dataset.target).classList.remove('hidden');\n}));\nconst energyInput=document.getElementById('energyInput');\nfunction renderEnergy(){\n const base=Number(energyInput.value),vals=[base,base*.1,base*.01,base*.001];\n document.getElementById('energyValue').textContent=base.toLocaleString('uz-UZ')+' birlik';\n vals.forEach((v,i)=>{\n  document.getElementById('e'+i).textContent=Number(v.toFixed(3)).toLocaleString('uz-UZ');\n  const cubes=document.getElementById('c'+i);cubes.innerHTML='';\n  const n=Math.max(1,Math.min(40,Math.round(v/base*40)));\n  for(let j=0;j<n;j++){const s=document.createElement('span');s.className='cube';cubes.appendChild(s)}\n });\n document.getElementById('energyBars').innerHTML=vals.map((v,i)=>`<div><b>${['O‘simlik','Chigirtka','Qurbaqa','Ilon'][i]} — ${Number(v.toFixed(3)).toLocaleString('uz-UZ')} birlik<\/b><div class=\"barwrap\"><div class=\"bar\" style=\"width:${Math.max(.5,v/base*100)}%\"><\/div><\/div><\/div>`).join('');\n}\nenergyInput.addEventListener('input',()=>{renderEnergy();document.getElementById('energyMessage').textContent='Yangi energiya miqdori hisoblandi. Oqimni kuzatish uchun tugmani bosing.'});\nrenderEnergy();\nlet energyTimer;\ndocument.getElementById('energyPlay').addEventListener('click',()=>{\n clearInterval(energyTimer);const msg=document.getElementById('energyMessage');let i=0;\n const stages=['Quyosh energiyasi o‘simlikda kimyoviy energiyaga aylanadi.','Chigirtka o‘simlik bilan oziqlanadi: energiyaning taxminan 10% i keyingi darajaga o‘tadi.','Qurbaqa chigirtkani yeydi: energiya yana kamayadi.','Ilon qurbaqani yeydi: keyingi darajaga juda kam energiya yetib boradi.'];\n msg.textContent=stages[0];energyTimer=setInterval(()=>{i++;if(i>=stages.length){clearInterval(energyTimer);msg.textContent='Xulosa: oziq zanjiri bo‘ylab foydalanish mumkin bo‘lgan energiya kamayib boradi.'}else msg.textContent=stages[i]},1500);\n});\ndocument.getElementById('energyReset').addEventListener('click',()=>{clearInterval(energyTimer);energyInput.value=1000;renderEnergy();document.getElementById('energyMessage').textContent='Simulyatsiyani boshlash uchun tugmani bosing.'});\n\nconst toxinInput=document.getElementById('toxinInput');\nfunction renderToxin(){\n const v=Number(toxinInput.value),vals=[v,v*10,v*100,v*1000];\n document.getElementById('toxinValue').textContent=v;\n vals.forEach((n,i)=>{\n  document.getElementById('t'+i).textContent=n.toLocaleString('uz-UZ');\n  const box=document.getElementById('d'+i);box.innerHTML='';\n  const count=Math.min(36,Math.max(1,Math.round(n/Math.max(1,v*1000)*36)));\n  for(let j=0;j<count;j++){let dot=document.createElement('span');dot.className='dot';box.appendChild(dot)}\n });\n}\ntoxinInput.addEventListener('input',renderToxin);renderToxin();\nlet toxinTimer;\ndocument.getElementById('toxinPlay').addEventListener('click',()=>{\n clearInterval(toxinTimer);let i=0;const msg=document.getElementById('toxinMessage');\n const stages=['Suvdagi ayrim zaharli moddalarni plankton va suv o‘tlari yutishi mumkin.','Mayda baliqlar ko‘plab planktonlarni yegani uchun modda ularning tanasiga o‘tadi.','Yirik baliq ko‘plab mayda baliqlar bilan oziqlanadi; ayrim moddalar unda ko‘proq to‘planishi mumkin.','Baliqxo‘r qush ko‘p baliq yeydi. Ayrim barqaror moddalar yuqori oziq darajasida yuqori konsentratsiyaga yetishi mumkin.'];\n msg.textContent=stages[0];toxinTimer=setInterval(()=>{i++;if(i>=stages.length){clearInterval(toxinTimer);msg.textContent='Xulosa: ayrim zaharli moddalar oziq zanjiri bo‘ylab o‘tib, yuqori darajalarda ko‘proq to‘planishi mumkin.'}else msg.textContent=stages[i]},1700);\n});\ndocument.getElementById('toxinReset').addEventListener('click',()=>{clearInterval(toxinTimer);toxinInput.value=2;renderToxin();document.getElementById('toxinMessage').textContent='Suvdagi darajani tanlab, simulyatsiyani boshlang.'});\n\nconst answers={q1:'b',q2:'a',q3:'c',q4:'b',q5:'b',q6:'c'};\ndocument.getElementById('quiz').addEventListener('submit',e=>{\n e.preventDefault();let score=0,missing=0;\n Object.entries(answers).forEach(([q,a])=>{const picked=document.querySelector(`input[name=\"${q}\"]:checked`);if(!picked)missing++;else if(picked.value===a)score++});\n const result=document.getElementById('quizResult');\n result.textContent=`Natija: ${score}/6 ta to‘g‘ri javob (${Math.round(score/6*100)}%).`+(missing?` ${missing} ta savol javobsiz qoldi.`:'')+(score===6?' Ajoyib! Barcha savollar to‘g‘ri.':score>=4?' Yaxshi! Xatolarni ham ko‘rib chiqing.':' Nazariyani qayta o‘qib, yana urinib ko‘ring.');\n result.style.color=score>=4?'#63e6a4':'#ffd166';\n});\ndocument.getElementById('quizReset').addEventListener('click',()=>document.getElementById('quizResult').textContent='');\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Moddalarning xossalari (1)", "i": "🧪", "g": "Moddalar", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Moddalarning xossalari<\/title>\n<style>\n:root{--bg:#eef5ff;--ink:#17233c;--blue:#2463eb;--teal:#0f9f91;--gold:#f5a623;--card:#fff;--muted:#61708b}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(140deg,#eaf2ff,#effcf8);color:var(--ink);line-height:1.6}\nheader{background:linear-gradient(120deg,#1747b8,#0d9488);color:#fff;padding:30px 18px;text-align:center}\nheader h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem)}header p{max-width:850px;margin:10px auto 0}\nnav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #10264b18}\nnav a{padding:8px 12px;border-radius:22px;background:#eaf0ff;color:#1747b8;text-decoration:none;font-weight:bold;font-size:.92rem}\nmain{max-width:1100px;margin:24px auto;padding:0 15px}.card{background:var(--card);padding:22px;border-radius:18px;margin:18px 0;box-shadow:0 7px 25px #233b6010;border:1px solid #e5ebf5}\nh2{margin-top:0;color:#1747b8}h3{color:#087f76}.tag{display:inline-block;background:#e5f8f5;color:#087f76;padding:4px 10px;border-radius:20px;font-weight:bold;font-size:.85rem}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.mini{background:#f5f8ff;padding:15px;border-radius:13px}.emoji{font-size:2rem}\nbutton,select,input{font:inherit}button{border:0;background:var(--blue);color:#fff;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:bold}button:hover{filter:brightness(.93)}button.secondary{background:#e6edff;color:#1747b8}button.green{background:var(--teal)}.control{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.readout{font-size:1.15rem;font-weight:bold;color:#087f76}.stage{background:#f4f8ff;border:1px solid #dbe6fa;border-radius:14px;padding:18px;text-align:center;min-height:150px}\n.balloon{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ff9db4,#ed3970 65%,#ad1748);color:white;font-weight:bold;box-shadow:inset -8px -8px 14px #700b3040;transition:width .3s,height .3s}\n.scale{height:16px;background:#dce5f5;border-radius:20px;overflow:hidden;max-width:420px;margin:12px auto}.scale span{display:block;height:100%;width:10%;background:linear-gradient(90deg,#2b73f6,#0fbd9f);transition:width .3s}\n.particles{height:115px;position:relative;background:#eaf2ff;border-radius:12px;overflow:hidden;margin:12px 0}.particle{position:absolute;width:9px;height:9px;background:#f5a623;border-radius:50%;animation:move 2s infinite alternate ease-in-out}\n@keyframes move{from{transform:translate(0,0)}to{transform:translate(22px,17px)}}\n.thermo{height:18px;background:linear-gradient(90deg,#7dd3fc,#facc15,#f97316,#dc2626);border-radius:20px;margin:15px 0;position:relative}.marker{position:absolute;top:-6px;width:4px;height:30px;background:#17233c;left:1%;transition:left .25s}\n.material{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f6f8fc;padding:10px 12px;border-radius:10px;margin:7px 0}.bulb{font-size:3.8rem;filter:grayscale(1);transition:.2s}.bulb.on{filter:none;text-shadow:0 0 22px #ffd43b}.circuit{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px;background:#f4f8ff;border-radius:12px}.wire{height:4px;width:35px;background:#64748b}.quiz-q{padding:14px;border-bottom:1px solid #e7edf6}.quiz-q label{display:block;margin:5px 0;cursor:pointer}.result{font-size:1.15rem;font-weight:bold;margin-top:12px}\nfooter{text-align:center;padding:25px;color:var(--muted)}.note{background:#fff7df;border-left:5px solid var(--gold);padding:12px 15px;border-radius:8px}.good{color:#087f44}.bad{color:#c62828}\n@media(max-width:600px){.card{padding:16px}nav a{font-size:.8rem;padding:7px 9px}.material{align-items:flex-start;flex-direction:column}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"tag\">6-SINF • TABIIY FAN<\/div>\n  <h1>🔬 Moddalarning xossalari<\/h1>\n  <p>Hayotiy misollar, zarrachalar modeli va uchta interaktiv virtual tajriba bilan mavzuni o‘rganamiz.<\/p>\n<\/header>\n<nav>\n  <a href=\"#nazariya\">Nazariya<\/a><a href=\"#gaz\">Gazlar massasi<\/a><a href=\"#holat\">Agregat holat<\/a><a href=\"#issiqlik\">Issiqlik<\/a><a href=\"#elektr\">Elektr<\/a><a href=\"#test\">Mini-test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"nazariya\">\n<h2>📘 1. Modda va uning xossalari<\/h2>\n<p><b>Modda<\/b> — jismlarni tashkil etadigan material. Masalan, qoshiq po‘latdan, stakan shishadan, daftar qog‘ozdan tayyorlanadi.<\/p>\n<div class=\"grid\">\n <div class=\"mini\"><div class=\"emoji\">🧊<\/div><b>Fizik xossalar<\/b><p>Rang, hid, qattiqlik, zichlik, erish harorati, issiqlik va elektr o‘tkazuvchanlik. Moddaning tarkibi o‘zgarmaydi.<\/p><\/div>\n <div class=\"mini\"><div class=\"emoji\">🧪<\/div><b>Kimyoviy xossalar<\/b><p>Moddaning boshqa moddalarga aylanish qobiliyati. Masalan, temirning zanglashi yoki yog‘ochning yonishi.<\/p><\/div>\n <div class=\"mini\"><div class=\"emoji\">⚖️<\/div><b>Massa va hajm<\/b><p>Moddalar massaga ega va joy egallaydi. Gazlar ham bundan mustasno emas.<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Xavfsizlik:<\/b> darsdagi virtual tajribalar kompyuter simulyatsiyasidir. Uyda elektr tarmog‘i, olov yoki qaynoq suv bilan tajriba qilmang; faqat kattalar nazoratida ishlang.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"gaz\">\n<h2>🎈 2. Gazlar ham massaga egami?<\/h2>\n<p>Ha. Havo gazlar aralashmasi bo‘lib, massa va hajmga ega. To‘pni damlaganda ichiga qo‘shimcha havo kiradi, shuning uchun uning massasi ortadi. Gaz zarrachalari doimo tartibsiz harakat qiladi va idish devorlariga urilib bosim hosil qiladi.<\/p>\n<div class=\"stage\">\n <div id=\"balloon\" class=\"balloon\" style=\"width:70px;height:70px\">🎈<\/div>\n <div class=\"readout\" id=\"massText\">Shartli massa: 1.2 g<\/div>\n <div class=\"scale\"><span id=\"massBar\"><\/span><\/div>\n <div class=\"particles\" id=\"gasParticles\" aria-label=\"Gaz zarrachalari animatsiyasi\"><\/div>\n <div class=\"control\" style=\"justify-content:center\"><button id=\"pump\">➕ Havo kiriting<\/button><button class=\"secondary\" id=\"release\">➖ Havoni chiqaring<\/button><button class=\"secondary\" id=\"resetGas\">Qayta boshlash<\/button><\/div>\n <p id=\"gasExplain\">Sharchada havo kam. Nasos tugmasini bosing!<\/p>\n<\/div>\n<p><b>Hayotiy misol:<\/b> futbol to‘pi yoki velosiped shinasi damlanganda ichiga ko‘proq havo kiradi. Shuning uchun massasi biroz ortadi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"holat\">\n<h2>🌡️ 3. Bir xil haroratda moddalar turli holatda bo‘lishi mumkin<\/h2>\n<p>Moddalar asosan uch agregat holatda uchraydi: <b>qattiq, suyuq va gazsimon<\/b>. Har bir moddaning erish va qaynash harorati har xil.<\/p>\n<div class=\"grid\">\n <div class=\"mini\"><div class=\"emoji\">🧊<\/div><b>Suv<\/b><p>Normal atmosfera bosimida 0°C da muz eriydi, 100°C da suv qaynaydi.<\/p><\/div>\n <div class=\"mini\"><div class=\"emoji\">🍫<\/div><b>Shokolad<\/b><p>Tarkibiga qarab taxminan 30–40°C atrofida yumshab, erishi mumkin.<\/p><\/div>\n <div class=\"mini\"><div class=\"emoji\">🔩<\/div><b>Temir<\/b><p>Taxminan 1538°C da eriydi.<\/p><\/div>\n<\/div>\n<div class=\"stage\">\n <label for=\"temp\"><b>Haroratni o‘zgartiring:<\/b> <span id=\"tempVal\" class=\"readout\">20°C<\/span><\/label>\n <input id=\"temp\" type=\"range\" min=\"-20\" max=\"1600\" value=\"20\" style=\"width:100%\">\n <div class=\"thermo\"><span class=\"marker\" id=\"marker\"><\/span><\/div>\n <div class=\"grid\">\n  <div class=\"mini\"><div class=\"emoji\" id=\"waterIcon\">💧<\/div><b>Suv:<\/b> <span id=\"waterState\">suyuq<\/span><\/div>\n  <div class=\"mini\"><div class=\"emoji\" id=\"chocIcon\">🍫<\/div><b>Shokolad:<\/b> <span id=\"chocState\">qattiq<\/span><\/div>\n  <div class=\"mini\"><div class=\"emoji\" id=\"ironIcon\">🔩<\/div><b>Temir:<\/b> <span id=\"ironState\">qattiq<\/span><\/div>\n <\/div>\n <p id=\"tempExplain\">Xona haroratida suv suyuq, shokolad odatda qattiq, temir esa qattiq holatda bo‘ladi.<\/p>\n<\/div>\n<p class=\"note\">Eslatma: suvning erish/qaynash harorati bosimga bog‘liq. Bu simulyatsiyada odatiy atmosfera bosimi qabul qilingan. Juda yuqori haroratdagi holatlar soddalashtirilgan modeldir.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"issiqlik\">\n<h2>🔥 4. Issiqlik o‘tkazuvchanlik<\/h2>\n<p><b>Issiqlik o‘tkazuvchanlik<\/b> — issiqlikning modda orqali uzatilish xususiyati. Mis va alyuminiy kabi metallar odatda yaxshi o‘tkazuvchi; yog‘och, jun, plastmassa va havo esa yomonroq o‘tkazadi.<\/p>\n<div class=\"grid\">\n <div class=\"mini\"><div class=\"emoji\">🥄<\/div><b>Metall qoshiq<\/b><p>Issiqlikni tez uzatadi. Shu sababli qizigan metall dastakka ehtiyot bo‘lish kerak.<\/p><\/div>\n <div class=\"mini\"><div class=\"emoji\">🥢<\/div><b>Yog‘och qoshiq<\/b><p>Issiqlikni sekinroq uzatadi. Shu sababli ko‘plab oshxona anjomlari yog‘och yoki issiqqa chidamli plastmassadan tayyorlanadi.<\/p><\/div>\n<\/div>\n<div class=\"stage\">\n <p>Virtual issiq suv idishiga qoshiq uchlarini joylashtiring.<\/p>\n <div class=\"grid\">\n  <div class=\"mini\"><div class=\"emoji\">♨️<\/div>Issiq suv<br><span class=\"readout\">80°C<\/span><\/div>\n  <div class=\"mini\"><div class=\"emoji\">🥄<\/div>Metall qoshiq<br><div class=\"scale\"><span id=\"metalBar\" style=\"width:10%\"><\/span><\/div><b id=\"metalTemp\">20°C<\/b><\/div>\n  <div class=\"mini\"><div class=\"emoji\">🥢<\/div>Yog‘och qoshiq<br><div class=\"scale\"><span id=\"woodBar\" style=\"width:10%\"><\/span><\/div><b id=\"woodTemp\">20°C<\/b><\/div>\n <\/div>\n <div class=\"control\" style=\"justify-content:center\"><button class=\"green\" id=\"heatBtn\">▶ Isitishni boshlash<\/button><button class=\"secondary\" id=\"heatReset\">Qayta boshlash<\/button><\/div>\n <p id=\"heatExplain\">Metall qoshiqning harorati tezroq ortadi. Bu sifat jihatidan ko‘rsatilgan model.<\/p>\n<\/div>\n<p><b>Nima uchun qishda qalin kiyim issiq tutadi?<\/b> Kiyim tolalari orasida qolgan havo issiqlikni yomon o‘tkazadi. Qushlar patlarini hurpaytirganda ham patlar orasida havo qatlami hosil bo‘ladi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"elektr\">\n<h2>⚡ 5. Elektr o‘tkazuvchanlik<\/h2>\n<p><b>Elektr o‘tkazuvchanlik<\/b> — moddaning elektr tokini o‘tkazish qobiliyati. Ko‘plab metallar elektr tokini yaxshi o‘tkazadi. Rezina, shisha va quruq plastmassa esa odatda izolyator hisoblanadi.<\/p>\n<div class=\"stage\">\n <p>Batareya va lampochka orasiga tekshiriladigan materialni ulang:<\/p>\n <div class=\"circuit\">\n  <div class=\"mini\"><div class=\"emoji\">🔋<\/div>Batareya<\/div><div class=\"wire\"><\/div>\n  <div><div class=\"bulb\" id=\"bulb\">💡<\/div><b id=\"bulbStatus\">Lampochka o‘chiq<\/b><\/div><div class=\"wire\"><\/div>\n  <div class=\"mini\"><div class=\"emoji\">🧩<\/div><span id=\"sampleName\">Mis sim<\/span><\/div>\n <\/div>\n <div class=\"control\" style=\"justify-content:center\"><label for=\"material\">Material:<\/label>\n <select id=\"material\"><option value=\"copper\">Mis sim<\/option><option value=\"iron\">Temir mix<\/option><option value=\"aluminum\">Alyuminiy folga<\/option><option value=\"plastic\">Plastmassa<\/option><option value=\"rubber\">Rezina<\/option><option value=\"wood\">Quruq yog‘och<\/option><option value=\"glass\">Shisha<\/option><\/select><\/div>\n <div class=\"particles\" id=\"electronArea\"><\/div>\n <p id=\"electricExplain\">Mis elektr tokini yaxshi o‘tkazadi, shuning uchun zanjir yopiq bo‘lsa lampochka yonadi.<\/p>\n<\/div>\n<div class=\"note\"><b>Muhim:<\/b> bu faqat past kuchlanishli virtual model. Haqiqiy elektr rozetkasi bilan tajriba qilmang. Tuzli suv va inson tanasi ham elektr tokini o‘tkazishi mumkin — bu xavf tug‘diradi.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>🧠 6. Bilimingizni sinab ko‘ring<\/h2>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Gazlar haqida qaysi fikr to‘g‘ri?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Gazning massasi bo‘lmaydi<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"b\"> Gaz massaga va hajmga ega<\/label>\n<label><input type=\"radio\" name=\"q1\" value=\"c\"> Gaz faqat ko‘rinadigan bo‘ladi<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Xona haroratida qaysi modda gaz holatida bo‘ladi?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Temir<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"b\"> Suv<\/label>\n<label><input type=\"radio\" name=\"q2\" value=\"c\"> Kislorod<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Qaysi material elektr tokini odatda yaxshi o‘tkazadi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Mis<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"b\"> Rezina<\/label>\n<label><input type=\"radio\" name=\"q3\" value=\"c\"> Quruq plastmassa<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Qalin kiyimning issiq tutishiga nima yordam beradi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Kiyim ichidagi havo qatlami<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"b\"> Kiyimning elektr toki chiqarishi<\/label>\n<label><input type=\"radio\" name=\"q4\" value=\"c\"> Kiyimning suvga aylanishi<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Temir taxminan nechchi °C da eriydi?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> 0°C<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"b\"> 100°C<\/label>\n<label><input type=\"radio\" name=\"q5\" value=\"c\"> 1538°C<\/label><\/div>\n<button type=\"submit\">Javoblarni tekshirish<\/button> <button type=\"button\" class=\"secondary\" id=\"clearQuiz\">Tozalash<\/button>\n<div class=\"result\" id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n\n<section class=\"card\">\n<h2>🏠 Uyga vazifa<\/h2>\n<ol>\n<li>Uyda uchta qattiq, ikkita suyuq va ikkita gazsimon moddaga misol yozing.<\/li>\n<li>Nima uchun qozonlar ko‘pincha metalldan, dastaklari esa issiqlikni yomon o‘tkazuvchi materiallardan tayyorlanadi?<\/li>\n<li>Mis sim va plastmassa nima sababdan elektr o‘tkazuvchanligi bo‘yicha farq qiladi?<\/li>\n<li>O‘zingiz tanlagan moddaning rangi, qattiqligi, eruvchanligi yoki elektr/issiqlik o‘tkazuvchanligi haqida kuzatuv yozing. Xavfli tajribalar o‘tkazmang.<\/li>\n<\/ol>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan • Interaktiv o‘quv materiali<\/footer>\n<script>\nconst gasParticles=document.getElementById('gasParticles');\nfor(let i=0;i<22;i++){let p=document.createElement('span');p.className='particle';p.style.left=(Math.random()*94)+'%';p.style.top=(Math.random()*80)+'%';p.style.animationDelay=(Math.random()*2)+'s';p.style.animationDuration=(1+Math.random()*2)+'s';gasParticles.appendChild(p)}\nlet air=0;\nfunction renderGas(){let size=70+air*12;document.getElementById('balloon').style.width=size+'px';document.getElementById('balloon').style.height=size+'px';document.getElementById('massText').textContent='Shartli massa: '+(1.2+air*.45).toFixed(2)+' g';document.getElementById('massBar').style.width=Math.min(100,10+air*9)+'%';document.getElementById('gasExplain').textContent=air===0?'Sharchada havo kam. Nasos tugmasini bosing!':`Havo miqdori ${air} bosqichga oshdi. Shartli massa ortdi, zarrachalar devorlarga urilib bosim hosil qiladi.`}\ndocument.getElementById('pump').onclick=()=>{air=Math.min(10,air+1);renderGas()};document.getElementById('release').onclick=()=>{air=Math.max(0,air-1);renderGas()};document.getElementById('resetGas').onclick=()=>{air=0;renderGas()};\nconst temp=document.getElementById('temp');\nfunction renderTemp(){let t=+temp.value;document.getElementById('tempVal').textContent=t+'°C';document.getElementById('marker').style.left=((t+20)/1620*98)+'%';\nlet ws=t<0?'qattiq (muz)':t<100?'suyuq':'gaz (bug‘)';let cs=t<32?'qattiq':t<40?'yumshayotgan / eriyotgan':'erigan';let is=t<1538?'qattiq':'suyuq';\ndocument.getElementById('waterState').textContent=ws;document.getElementById('chocState').textContent=cs;document.getElementById('ironState').textContent=is;\ndocument.getElementById('waterIcon').textContent=t<0?'🧊':t<100?'💧':'☁️';document.getElementById('chocIcon').textContent=t<32?'🍫':t<40?'🍫':'🥣';document.getElementById('ironIcon').textContent=t<1538?'🔩':'🌋';\ndocument.getElementById('tempExplain').textContent=t<0?'Suv muz holatida. Harorat 0°C ga yaqinlashganda muz eriy boshlaydi.':t<32?'Suv suyuq, shokolad odatda qattiq, temir qattiq holatda.':t<40?'Shokolad yumshab, eriy boshlashi mumkin; suv suyuq, temir qattiq.':t<100?'Shokolad erigan; suv suyuq, temir esa qattiq.':t<1538?'Normal bosimda suv bug‘ holatida, temir esa qattiq holatda.':'Temir erish haroratiga yetdi va suyuq holatga o‘tadi. Model soddalashtirilgan.'}\ntemp.addEventListener('input',renderTemp);renderTemp();\nlet heating=false,heat=0,timer=null;\nfunction renderHeat(){document.getElementById('metalTemp').textContent=Math.round(20+heat*.6)+'°C';document.getElementById('woodTemp').textContent=Math.round(20+heat*.18)+'°C';document.getElementById('metalBar').style.width=Math.min(100,10+heat*1.4)+'%';document.getElementById('woodBar').style.width=Math.min(100,10+heat*.5)+'%';document.getElementById('heatExplain').textContent=heat===0?'Metall qoshiqning harorati tezroq ortadi. Bu sifat jihatidan ko‘rsatilgan model.':'Metall qoshiq yog‘ochga qaraganda tezroq qizimoqda. Raqamlar tushuntirish uchun shartli ko‘rsatkichlardir.'}\ndocument.getElementById('heatBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('heatBtn').textContent='▶ Davom ettirish';return}document.getElementById('heatBtn').textContent='⏸ To‘xtatish';timer=setInterval(()=>{heat=Math.min(100,heat+2);renderHeat();if(heat>=100){clearInterval(timer);timer=null;document.getElementById('heatBtn').textContent='▶ Qayta isitish'}},150)};\ndocument.getElementById('heatReset').onclick=()=>{clearInterval(timer);timer=null;heat=0;renderHeat();document.getElementById('heatBtn').textContent='▶ Isitishni boshlash'};renderHeat();\nconst mat=document.getElementById('material');const electronArea=document.getElementById('electronArea');\nfor(let i=0;i<18;i++){let p=document.createElement('span');p.className='particle';p.style.left=(Math.random()*94)+'%';p.style.top=(Math.random()*80)+'%';p.style.animationDelay=(Math.random()*2)+'s';electronArea.appendChild(p)}\nfunction renderElectric(){let names={copper:'Mis sim',iron:'Temir mix',aluminum:'Alyuminiy folga',plastic:'Plastmassa',rubber:'Rezina',wood:'Quruq yog‘och',glass:'Shisha'};let conductive=['copper','iron','aluminum'].includes(mat.value);document.getElementById('sampleName').textContent=names[mat.value];document.getElementById('bulb').classList.toggle('on',conductive);document.getElementById('bulbStatus').textContent=conductive?'Lampochka yondi':'Lampochka o‘chiq';document.getElementById('electricExplain').textContent=conductive?names[mat.value]+' elektr tokini yaxshi o‘tkazadi, shuning uchun virtual zanjirda lampochka yonadi.':'Bu modelda '+names[mat.value].toLowerCase()+' izolyator sifatida ko‘rsatilgan, shuning uchun zanjirda tok o‘tmaydi.';electronArea.style.opacity=conductive?'1':'.25';}\nmat.addEventListener('change',renderElectric);renderElectric();\ndocument.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();let ans={q1:'b',q2:'c',q3:'a',q4:'a',q5:'c'},score=0;for(let q in ans){let el=document.querySelector(`input[name=\"${q}\"]:checked`);if(el&&el.value===ans[q])score++}let r=document.getElementById('quizResult');r.textContent=`Natija: ${score}/5 ta to‘g‘ri javob. `+(score===5?'Ajoyib! Mavzuni juda yaxshi tushunibsiz.':score>=3?'Yaxshi! Noto‘g‘ri javoblarni qayta ko‘rib chiqing.':'Nazariyani yana bir bor o‘qing va qayta urinib ko‘ring.');r.className='result '+(score>=4?'good':'bad')});\ndocument.getElementById('clearQuiz').onclick=()=>{document.getElementById('quiz').reset();document.getElementById('quizResult').textContent='';};\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Moddalarning xossalari (2)", "i": "🧪", "g": "Moddalar", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Moddalarning xossalari<\/title>\n<style>\n:root{--blue:#155eef;--navy:#13213c;--bg:#f3f7fc;--green:#12805c;--orange:#f59e0b;--red:#d92d20}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#182230;line-height:1.6}\nheader{background:linear-gradient(135deg,#123a72,#1778c8);color:white;padding:28px 18px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}header p{margin:0 auto;max-width:850px}\nmain{max-width:1100px;margin:22px auto;padding:0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}\nbutton{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#e5edff;color:#153b78}\nbutton:hover{filter:brightness(.96)}button.active{background:var(--blue);color:white}\n.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17365d12}\nh2{color:#174a8b;margin-top:0}h3{margin-bottom:6px;color:#174a8b}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}\n.fact{background:#f0f6ff;padding:13px;border-left:4px solid #4b8df8;border-radius:8px}\n.sim{background:#f8fbff;border:1px solid #d7e5fb;border-radius:14px;padding:16px;margin-top:12px}\n.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}\ninput[type=range]{width:min(330px,100%)}select{padding:9px;border-radius:8px;border:1px solid #bdcce0}\n.readout{font-size:1.15rem;font-weight:700;color:#174a8b}\n.balloon-row{display:flex;align-items:end;justify-content:center;gap:45px;min-height:180px;flex-wrap:wrap}\n.balloon{width:95px;height:120px;border-radius:52% 48% 48% 52%;background:radial-gradient(circle at 30% 25%,#fff9,transparent 22%),linear-gradient(135deg,#65c5ff,#2764d9);position:relative;transition:transform .25s}\n.balloon:after{content:\"\";position:absolute;bottom:-10px;left:42px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #2764d9}\n.balloon:before{content:\"\";position:absolute;top:18px;left:18px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:17px 9px #fff,30px 27px #fff,12px 52px #fff,42px 49px #fff,23px 72px #fff}\n.scale{width:130px;height:65px;background:#e7edf5;border:3px solid #75859a;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px auto;font-weight:bold}\n.particlebox{height:120px;border:2px solid #8ba4c8;border-radius:10px;background:#eef6ff;position:relative;overflow:hidden;margin:12px 0}\n.particle{position:absolute;width:10px;height:10px;background:#2581e8;border-radius:50%;animation:move 2s infinite alternate ease-in-out}\n@keyframes move{from{transform:translate(0,0)}to{transform:translate(18px,22px)}}\n.tempbar{height:22px;background:linear-gradient(90deg,#6eb5ff,#ffc857,#ed5a42);border-radius:20px;margin:12px 0}\n.state{font-size:1.2rem;font-weight:bold;padding:8px 12px;border-radius:8px;background:#eaf2ff;display:inline-block}\n.rod{height:28px;border-radius:8px;margin:12px 0;position:relative;background:linear-gradient(90deg,#f04438,#fda29b,#cbd5e1)}\n.wood{background:linear-gradient(90deg,#f59e0b,#e7c58a,#b9854a)}\n.lamp{width:55px;height:55px;border-radius:50%;border:4px solid #7b8794;margin:10px auto;background:#dce2e8;transition:.2s}\n.lamp.on{background:#ffe66d;box-shadow:0 0 28px #ffc400;border-color:#e6a700}\n.circuit{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}\n.wire{height:5px;width:42px;background:#64748b;border-radius:5px}\n.quiz-q{padding:13px;border-bottom:1px solid #e5eaf2}.quiz-q label{display:block;margin:5px 0;cursor:pointer}\n.feedback{font-weight:bold;margin-top:12px}.correct{color:var(--green)}.wrong{color:var(--red)}\nfooter{text-align:center;color:#667085;padding:22px}\n@media(max-width:550px){.card{padding:15px}.balloon-row{gap:25px}}\n<\/style>\n<\/head>\n<body>\n<header>\n<h1>🔬 Moddalarning xossalari<\/h1>\n<p>6-sinf Tabiiy fan • Nazariya, hayotiy misollar va interaktiv virtual laboratoriya<\/p>\n<\/header>\n<main>\n<div class=\"tabs\">\n<button class=\"active\" onclick=\"showTab('lesson',this)\">📘 Dars<\/button>\n<button onclick=\"showTab('gas',this)\">🎈 Gazlar massasi<\/button>\n<button onclick=\"showTab('temp',this)\">🌡️ Harorat va holat<\/button>\n<button onclick=\"showTab('conduct',this)\">⚡ O‘tkazuvchanlik<\/button>\n<button onclick=\"showTab('quiz',this)\">📝 Test<\/button>\n<\/div>\n\n<section id=\"lesson\" class=\"tab\">\n<div class=\"card\">\n<h2>Dars maqsadi<\/h2>\n<p>O‘quvchi gazlar ham massaga ega ekanini tushuntiradi, moddalarning bir xil haroratda turli agregat holatda bo‘lishini misollar bilan izohlaydi hamda issiqlik va elektr o‘tkazuvchanlikni farqlaydi.<\/p>\n<div class=\"grid\">\n<div class=\"fact\"><b>1. Gazlar ham massaga ega.<\/b><br>Havo ko‘rinmasa ham, uning massasi bor. Havo bilan to‘ldirilgan to‘p bo‘sh to‘pdan og‘irroq bo‘ladi.<\/div>\n<div class=\"fact\"><b>2. Moddalarning holati.<\/b><br>Holat haroratga va moddaning xususiyatlariga bog‘liq. Xona haroratida suv suyuq, temir qattiq, kislorod esa gazdir.<\/div>\n<div class=\"fact\"><b>3. O‘tkazuvchanlik.<\/b><br>Metallar odatda issiqlik va elektr tokini yaxshi o‘tkazadi. Yog‘och, rezina va plastmassa esa ko‘pincha yomon o‘tkazadi.<\/div>\n<\/div>\n<\/div>\n<div class=\"card\">\n<h2>Asosiy tushunchalar<\/h2>\n<h3>Modda va uning xossalari<\/h3>\n<p><b>Modda<\/b> — jismlarni tashkil etuvchi material. Moddalarni rang, hid, qattiqlik, eruvchanlik, zichlik, elektr va issiqlik o‘tkazuvchanlik kabi xossalari orqali tavsiflash mumkin.<\/p>\n<h3>Agregat holatlar<\/h3>\n<ul><li><b>Qattiq:<\/b> shakli va hajmi odatda saqlanadi. Misol: muz, tosh, temir.<\/li><li><b>Suyuq:<\/b> hajmi saqlanadi, idish shaklini oladi. Misol: suv, o‘simlik yog‘i.<\/li><li><b>Gaz:<\/b> idishning mavjud hajmini egallab, tarqaladi. Misol: havo, kislorod.<\/li><\/ul>\n<h3>Issiqlik va elektr o‘tkazuvchanlik<\/h3>\n<p>Issiqlik o‘tkazuvchanlik — issiqlikning modda ichida uzatilish xususiyati. Elektr o‘tkazuvchanlik — moddaning elektr tokini o‘tkazish qobiliyati. Elektr tajribalarini faqat xavfsiz, past kuchlanishli batareya bilan bajarish kerak; rozetka elektridan foydalanmang.<\/p>\n<\/div>\n<div class=\"card\">\n<h2>Hayot bilan bog‘laymiz<\/h2>\n<ul><li>Futbol to‘piga havo damlanganda uning massasi ortadi.<\/li><li>Qishda jun kiyim tanani iliq saqlaydi, chunki uning orasida qolgan havo issiqlikni yomon o‘tkazadi.<\/li><li>Kastryulka metaldan, tutqichi esa ko‘pincha plastmassa yoki yog‘ochdan tayyorlanadi.<\/li><li>Elektr simining tashqi qavati plastmassa yoki rezinadan bo‘ladi, chunki ular elektr tokini yomon o‘tkazadi.<\/li><\/ul>\n<\/div>\n<\/section>\n\n<section id=\"gas\" class=\"tab\" hidden>\n<div class=\"card\">\n<h2>🎈 Virtual tajriba: Havo tarozisi<\/h2>\n<p>Nasos tugmasini bosib sharga havo kiriting. Havo miqdori ortgani sari shar ichidagi zarrachalar soni va gaz massasi ham ortadi. Quyidagi sonlar tushuntirish uchun mo‘ljallangan model qiymatlaridir.<\/p>\n<div class=\"balloon-row\">\n<div style=\"text-align:center\"><div class=\"balloon\" style=\"transform:scale(.72)\"><\/div><b>Bo‘shroq shar<\/b><div class=\"readout\">0 g qo‘shimcha<\/div><\/div>\n<div style=\"text-align:center\"><div id=\"filledBalloon\" class=\"balloon\"><\/div><b>Havo kiritilayotgan shar<\/b><div id=\"addedMass\" class=\"readout\">0.0 g qo‘shimcha<\/div><\/div>\n<\/div>\n<div class=\"scale\" id=\"scaleDisplay\">0.0 g<\/div>\n<div class=\"controls\"><button onclick=\"pump()\">➕ Havo kiriting<\/button><button onclick=\"releaseAir()\">Havoni chiqaring<\/button><button onclick=\"resetGas()\">Qayta boshlash<\/button><\/div>\n<div class=\"particlebox\" id=\"particles\" aria-label=\"Havo molekulalari animatsiyasi\"><\/div>\n<p id=\"gasNote\" class=\"fact\">Kuzating: gaz ko‘rinmasa ham, u zarrachalardan tashkil topgan va massaga ega.<\/p>\n<\/div>\n<\/section>\n\n<section id=\"temp\" class=\"tab\" hidden>\n<div class=\"card\">\n<h2>🌡️ Virtual tajriba: Termo-laboratoriya<\/h2>\n<p>Haroratni o‘zgartiring va moddalar holatini solishtiring. Modelda suvning muzlash/erish nuqtasi 0°C, etil spirtining qaynash nuqtasi taxminan 78°C, temirning erish nuqtasi taxminan 1538°C deb olingan. Bu oddiy model bosimni o‘zgarmas deb hisoblaydi.<\/p>\n<div class=\"controls\"><label for=\"temperature\"><b>Harorat:<\/b><\/label><input id=\"temperature\" type=\"range\" min=\"-200\" max=\"1600\" value=\"20\" oninput=\"updateTemp()\"><span class=\"readout\" id=\"tempValue\">20°C<\/span><\/div>\n<div class=\"tempbar\"><\/div>\n<div class=\"grid\">\n<div class=\"fact\"><h3>💧 Suv<\/h3><p id=\"waterState\" class=\"state\">Suyuq<\/p><p>0°C dan pastda muz, odatdagi bosimda 0–100°C oralig‘ida suyuq, 100°C dan yuqorida bug‘ holati ustun.<\/p><\/div>\n<div class=\"fact\"><h3>🧪 Etil spirti<\/h3><p id=\"alcoholState\" class=\"state\">Suyuq<\/p><p>Taxminan −114°C da muzlaydi, 78°C atrofida qaynaydi. Olov yaqinida spirt bilan tajriba qilmang.<\/p><\/div>\n<div class=\"fact\"><h3>🔩 Temir<\/h3><p id=\"ironState\" class=\"state\">Qattiq<\/p><p>Oddiy sharoitda qattiq. Taxminan 1538°C da eriydi.<\/p><\/div>\n<div class=\"fact\"><h3>🌬️ Kislorod<\/h3><p id=\"oxygenState\" class=\"state\">Gaz<\/p><p>Odatiy atmosfera bosimida −183°C atrofida qaynaydi; undan sovuqroq sharoitda suyuqlanishi mumkin.<\/p><\/div>\n<\/div>\n<p class=\"fact\">Muhim: moddalar bir xil haroratda turli holatda bo‘lishi mumkin. Holat o‘zgarish harorati modda turiga va bosimga bog‘liq.<\/p>\n<\/div>\n<\/section>\n\n<section id=\"conduct\" class=\"tab\" hidden>\n<div class=\"card\">\n<h2>⚡ Virtual tajriba: Tok va issiqlik sinovi<\/h2>\n<h3>1-qism. Issiqlik o‘tkazuvchanlik<\/h3>\n<p>Qizdirish modelini ishga tushiring. Misda issiqlik tezroq tarqaladi, yog‘ochda esa sekinroq.<\/p>\n<div class=\"controls\"><button onclick=\"heatUp()\">🔥 Qizdirish<\/button><button onclick=\"resetHeat()\">Qayta boshlash<\/button><span id=\"heatStatus\" class=\"readout\">Tayoqchalar sovuq<\/span><\/div>\n<p>Mis tayoqcha<\/p><div class=\"rod\" id=\"copperRod\" style=\"background:linear-gradient(90deg,#c65d27,#d8a17c,#cbd5e1)\"><\/div>\n<p>Yog‘och tayoqcha<\/p><div class=\"rod wood\" id=\"woodRod\"><\/div>\n<p class=\"fact\">Bu rangli tasvir issiqlikning tarqalishini shartli ko‘rsatadi; haqiqiy material va o‘lchamlarda natija farq qilishi mumkin.<\/p>\n<hr>\n<h3>2-qism. Elektr o‘tkazuvchanlik<\/h3>\n<p>Sinov uchun material tanlang. Model batareya, sim va lampochkadan iborat oddiy zanjirni ko‘rsatadi.<\/p>\n<div class=\"controls\"><label for=\"material\">Material:<\/label><select id=\"material\" onchange=\"testMaterial()\"><option value=\"copper\">Mis sim<\/option><option value=\"iron\">Temir mix<\/option><option value=\"graphite\">Grafit<\/option><option value=\"rubber\">Rezina<\/option><option value=\"plastic\">Plastmassa<\/option><option value=\"wood\">Quruq yog‘och<\/option><option value=\"glass\">Shisha<\/option><\/select><\/div>\n<div class=\"circuit\"><span>🔋 Batareya<\/span><div class=\"wire\"><\/div><div class=\"lamp\" id=\"lamp\"><\/div><div class=\"wire\"><\/div><span id=\"sample\">Mis sim<\/span><\/div>\n<p id=\"electricResult\" class=\"fact\">Lampochka yonadi: mis elektr tokini yaxshi o‘tkazadi.<\/p>\n<p><b>Xavfsizlik:<\/b> bu faqat ekran simulyatsiyasi. Haqiqiy tajribada rozetka yoki elektr tarmog‘idan foydalanmang.<\/p>\n<\/div>\n<\/section>\n\n<section id=\"quiz\" class=\"tab\" hidden>\n<div class=\"card\">\n<h2>📝 Bilimingizni tekshiring<\/h2>\n<p>Har bir savol uchun bitta javobni belgilang va “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quizForm\">\n<div class=\"quiz-q\"><b>1. Havo massaga egami?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> Yo‘q, havo ko‘rinmaydi<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Ha, havo massaga ega<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Faqat sovuq havo<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Xona haroratida temir qanday holatda?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> Gaz<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Suyuq<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Qattiq<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Qaysi material elektr tokini odatda yaxshi o‘tkazadi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Mis<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Rezina<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Quruq yog‘och<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Choynak tutqichi nima uchun ko‘pincha plastmassadan qilinadi?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> Plastmassa issiqlikni juda yaxshi o‘tkazadi<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Plastmassa issiqlikni yomon o‘tkazadi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Plastmassa doim sovuq bo‘ladi<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Bir xil haroratda suv va temir nega turli holatda bo‘lishi mumkin?<\/b><label><input type=\"radio\" name=\"q5\" value=\"a\"> Chunki ularning xossalari va erish haroratlari farq qiladi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Chunki temirning massasi yo‘q<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Chunki harorat ta’sir qilmaydi<\/label><\/div>\n<div class=\"quiz-q\"><b>6. Elektr simi tashqi tomondan nima bilan qoplanadi?<\/b><label><input type=\"radio\" name=\"q6\" value=\"a\"> Mis bilan<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> Tuz bilan<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> Plastmassa yoki rezina bilan<\/label><\/div>\n<\/form>\n<div class=\"controls\"><button onclick=\"checkQuiz()\">Natijani tekshirish<\/button><button onclick=\"document.getElementById('quizForm').reset();document.getElementById('quizResult').textContent=''\">Qayta ishlash<\/button><\/div>\n<div id=\"quizResult\" class=\"feedback\" aria-live=\"polite\"><\/div>\n<\/div>\n<\/section>\n<footer>6-si
