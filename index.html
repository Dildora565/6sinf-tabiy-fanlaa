{0%,100%{transform:translateY(-4px)}50%{transform:translateY(6px)}}\n.smoky .lung{fill:#8a8f98}\n@media(prefers-reduced-motion:reduce){.lung,.dia{animation-duration:8s}}\n.st{font-size:32px;text-align:center;margin:8px 0}\n<\/style>\n<\/head>\n<body>\n<header><h1>🫁 Nafas va qon aylanish<\/h1><div id=\"sb\">⭐ <span id=\"sc\">0<\/span><\/div><\/header>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<h2>1. Tashqi muhit ta'siri<\/h2>\n<div class=\"c\"><b>Tashqi muhit:<\/b> havo, suv, tuproq, harorat, yorug'lik, oziq-ovqat.<\/div>\n<div class=\"c\"><b>Havo tarkibi:<\/b> azot ~78%, kislorod ~21%, karbonat angidrid ~0,04%, boshqa gazlar va suv bug'i.<\/div>\n<div class=\"c\">Toza havo salomatlikka foydali. Tutun va chang nafas yo'llariga zarar qiladi. Inson muhitni asraydi: daraxt ekadi, chiqindini saralaydi, filtr qo'yadi.<\/div>\n<h3>Shahar va havo sifati<\/h3>\n<div class=\"box\">\n<svg id=\"sc1\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Shahar manzarasi\"><\/svg>\n<label>🌳 Daraxtlar: <b id=\"vt\">5<\/b><input id=\"tr\" type=\"range\" min=\"0\" max=\"10\" value=\"5\"><\/label>\n<label>🚗 Mashinalar: <b id=\"vc\">3<\/b><input id=\"cr\" type=\"range\" min=\"0\" max=\"10\" value=\"3\"><\/label>\n<label>🏭 Zavod tutuni: <b id=\"vf\">3<\/b><input id=\"fa\" type=\"range\" min=\"0\" max=\"10\" value=\"3\"><\/label>\n<div class=\"bar\"><i id=\"aqb\"><\/i><\/div>\n<div class=\"st\" id=\"av\">🙂<\/div>\n<div class=\"msg\" id=\"aqm\"><\/div>\n<\/div>\n<h3>O'yin: foydali yoki zararli?<\/h3>\n<div class=\"box\" id=\"g1\"><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>2. Tirik organizm uchun yashash muhiti<\/h2>\n<div class=\"c\"><b>Yashash muhitlari:<\/b> quruqlik-havo, suv, tuproq va tirik organizm ichi.<\/div>\n<div class=\"c\">Har muhitning o'z sharoiti bor: yorug'lik, harorat, namlik, kislorod. Organizm shunga <b>moslashadi<\/b> (adaptatsiya).<\/div>\n<div class=\"c\">Misollar: baliqda jabra va suzgich, tuyada yog' saqlaydigan bo'rtiq, qutb ayig'ida qalin mo'yna, kaktusda suv saqlaydigan poya.<\/div>\n<h3>O'yin: kim qayerda yashaydi?<\/h3>\n<div class=\"box\" id=\"g2\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>3. Nafas va qon aylanish<\/h2>\n<h3>Nafas sistemasi<\/h3>\n<div class=\"c\"><b>Yo'l:<\/b> burun → halqum → hiqildoq → kekirdak → bronxlar → o'pka (alveolalar).<\/div>\n<div class=\"c\">Burun havoni isitadi, namlaydi va changdan tozalaydi. <b>Alveolalarda<\/b> gaz almashinuvi bo'ladi: kislorod qonga o'tadi, karbonat angidrid chiqadi.<\/div>\n<div class=\"c\">Nafas olganda diafragma va qovurg'a mushaklari qisqaradi, ko'krak qafasi kengayadi. Dam olganda 11–12 yoshli bola daqiqasiga taxminan 18–20 marta nafas oladi.<\/div>\n<div class=\"box\">\n<svg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"O'pka sxemasi (soddalashtirilgan)\">\n<rect width=\"300\" height=\"170\" fill=\"#ffeef0\" opacity=\".35\"/>\n<rect x=\"144\" y=\"8\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#f4a261\"/>\n<path d=\"M150 70 L112 100 M150 70 L188 100\" stroke=\"#f4a261\" stroke-width=\"7\" fill=\"none\"/>\n<ellipse class=\"lung\" cx=\"105\" cy=\"105\" rx=\"46\" ry=\"52\" fill=\"#f08a9b\"/>\n<ellipse class=\"lung\" cx=\"195\" cy=\"105\" rx=\"46\" ry=\"52\" fill=\"#f08a9b\"/>\n<g class=\"dia\"><path d=\"M40 160 Q150 140 260 160\" stroke=\"#7c4a2d\" stroke-width=\"7\" fill=\"none\"/><\/g>\n<text x=\"8\" y=\"16\" font-size=\"11\" fill=\"currentColor\">sxema<\/text>\n<\/svg>\n<label>Faollik: <b id=\"an\">Dam olish<\/b><input id=\"ac\" type=\"range\" min=\"0\" max=\"2\" value=\"0\"><\/label>\n<div class=\"msg\">💨 Nafas: <b id=\"nb\">19<\/b> marta/daqiqa &nbsp; ❤️ Puls: <b id=\"pb\">80<\/b> urish/daqiqa<\/div>\n<button id=\"sm\">🌫️ Chang va tutun<\/button>\n<div class=\"msg\" id=\"sm2\"><\/div>\n<\/div>\n\n<h3>Qon aylanish sistemasi<\/h3>\n<div class=\"c\"><b>Yurak<\/b> mushakli a'zo, 4 kamerali (2 bo'lmacha, 2 qorincha), qonni haydaydi.<\/div>\n<div class=\"c\"><b>Tomirlar:<\/b> arteriya (yurakdan chiqaradi), vena (yurakka olib keladi), kapillyar (eng ingichka, almashinuv shu yerda).<\/div>\n<div class=\"c\"><b>Katta doira:<\/b> chap qorincha → aorta → tana → o'ng bo'lmacha. <b>Kichik doira:<\/b> o'ng qorincha → o'pka → chap bo'lmacha (qon kislorodga boyiydi).<\/div>\n<div class=\"box\">\n<svg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Qon aylanishi sxemasi (soddalashtirilgan)\">\n<circle cx=\"80\" cy=\"85\" r=\"52\" fill=\"none\" stroke=\"#3b5bdb\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"220\" cy=\"85\" r=\"52\" fill=\"none\" stroke=\"#e5484d\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/>\n<text x=\"80\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">🫁 kichik doira<\/text>\n<text x=\"220\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">🧍 katta doira<\/text>\n<text x=\"150\" y=\"98\" font-size=\"34\" text-anchor=\"middle\" id=\"ht\">🫀<\/text>\n<g id=\"dots\"><\/g>\n<text x=\"150\" y=\"162\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">🔴 kislorodli qon &nbsp; 🔵 kislorodsiz qon<\/text>\n<\/svg>\n<div class=\"msg\">Slayder yuqoridagi \"Faollik\" bilan birga puls va qon oqimini tezlashtiradi.<\/div>\n<\/div>\n<h3>Qon tarkibi<\/h3>\n<div class=\"box\">\n<button data-b=\"🔴 Eritrotsit: kislorod tashiydi (gemoglobin bilan).\">🔴 Eritrotsit<\/button>\n<button data-b=\"⚪ Leykotsit: mikroblarni yutib, tanani himoya qiladi.\">⚪ Leykotsit<\/button>\n<button data-b=\"🩹 Trombotsit: yarada to'planib, qon ivishini ta'minlaydi.\">🩹 Trombotsit<\/button>\n<button data-b=\"💧 Plazma: qonning suyuq qismi, moddalarni tashiydi.\">💧 Plazma<\/button>\n<div class=\"msg\" id=\"bm\">Birini bosing.<\/div>\n<\/div>\n<div class=\"c\"><b>Yurakni asrash:<\/b> harakat, sog'lom ovqat, uyqu, chekmaslik.<\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>Yakuniy test<\/h2>\n<div class=\"box\" id=\"g3\"><\/div>\n<\/section>\n<\/main>\n\n<nav>\n<button class=\"on\" data-t=\"0\"><span>🌍<\/span>Muhit<\/button>\n<button data-t=\"1\"><span>🐪<\/span>Yashash<\/button>\n<button data-t=\"2\"><span>🫁<\/span>Nafas, qon<\/button>\n<button data-t=\"3\"><span>📝<\/span>Test<\/button>\n<\/nav>\n\n<script>\n// ---- Umumiy holat va menyu ----\nlet score=0;const $=s=>document.querySelector(s);\nconst upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));\n  window.scrollTo(0,0);\n});\n\n// ---- Universal savol-javob funksiyasi ----\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`<p class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}<\/p><button class=\"rs\">Qayta boshlash<\/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return;\n    }\n    const t=items[i];\n    box.innerHTML=`<p class=\"q\">${t.q}<\/p>`+t.o.map((x,k)=>`<button data-k=\"${k}\">${x}<\/button>`).join('')+'<div class=\"msg fb\"><\/div>';\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;\n      box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}\n      else{b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();\n      box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'<br><button class=\"nx\">Keyingisi<\/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()};\n    });\n  };go();\n}\n\n// ---- 1-bo'lim: shahar simulyatsiyasi ----\nfunction scene(){\n  const t=+$('#tr').value,c=+$('#cr').value,f=+$('#fa').value;\n  $('#vt').textContent=t;$('#vc').textContent=c;$('#vf').textContent=f;\n  const aq=Math.max(0,Math.min(100,60+t*5-c*4-f*5));\n  const sky=`hsl(${aq>66?200:aq>33?45:20},${25+aq*.4}%,${88-(100-aq)*.45}%)`;\n  let s=`<rect width=\"300\" height=\"150\" fill=\"${sky}\"/><rect y=\"118\" width=\"300\" height=\"32\" fill=\"#6b8f71\"/><rect y=\"132\" width=\"300\" height=\"18\" fill=\"#59616b\"/>`;\n  s+=`<text x=\"235\" y=\"118\" font-size=\"38\">🏭<\/text>`;\n  for(let j=0;j<f;j++)s+=`<text x=\"${215+j*8}\" y=\"${90-j*7}\" font-size=\"18\" opacity=\".8\">☁️<\/text>`;\n  for(let j=0;j<t;j++)s+=`<text x=\"${6+j*22}\" y=\"118\" font-size=\"24\">🌳<\/text>`;\n  for(let j=0;j<c;j++)s+=`<text x=\"${8+j*28}\" y=\"146\" font-size=\"18\">🚗<\/text>`;\n  $('#sc1').innerHTML=s;\n  $('#aqb').style.width=aq+'%';\n  $('#aqb').style.background=aq>66?'#2b9348':aq>33?'#e9c46a':'#d62839';\n  $('#av').textContent=aq>66?'🙂':aq>33?'😐':'😷';\n  $('#aqm').textContent=aq>66?'Havo toza. Daraxtlar kislorod beradi, nafas olish yengil.':aq>33?'Havo o\\'rtacha. Tutun va mashinalar ko\\'paysa, yomonlashadi.':'Havo ifloslangan! Nafas yo\\'llariga zarar. Daraxt ko\\'paytiring, tutunni kamaytiring.';\n}\n['tr','cr','fa'].forEach(id=>$('#'+id).oninput=scene);scene();\n\nconst yes=['Foydali ✅','Zararli ⛔'];\nquiz($('#g1'),[\n ['🌳 Daraxt ekish',0,'Daraxtlar kislorod beradi va havoni tozalaydi.'],\n ['🏭 Filtrsiz zavod tutuni',1,'Tutun havoni ifloslaydi.'],\n ['🪟 Xonani shamollatish',0,'Toza havo kirib, karbonat angidrid chiqadi.'],\n ['🚬 Tutun ichida bo\\'lish',1,'Tutun o\\'pkaga zarar qiladi.'],\n ['🏃 Toza havoda yugurish',0,'Nafas va yurak mushaklari mustahkamlanadi.'],\n ['🗑️ Chiqindini yoqish',1,'Zaharli gazlar havoga chiqadi.'],\n ['🚲 Velosipedda yurish',0,'Havoni ifloslantirmaydi, sog\\'liq uchun foydali.'],\n ['🚗 Juda ko\\'p mashina',1,'Chiqindi gazlar havoni ifloslaydi.']\n].map(x=>({q:x[0],o:yes,a:x[1],e:x[2]})));\n\n// ---- 2-bo'lim: yashash muhiti ----\nconst env=['🏜️ Cho\\'l','🌊 Dengiz','🌲 O\\'rmon','🧊 Qutb'];\nquiz($('#g2'),[\n ['🐪 Tuya',0,'Bo\\'rtig\\'ida yog\\' to\\'playdi, suvsiz uzoq yura oladi.'],\n ['🐟 Baliq',1,'Jabra bilan suvda nafas oladi, suzgichi bor.'],\n ['🐻‍❄️ Qutb ayig\\'i',3,'Qalin mo\\'yna va yog\\' qatlami sovuqdan asraydi.'],\n ['🌵 Kaktus',0,'Poyasida suv saqlaydi, tikanlari suvni tejaydi.'],\n ['🐸 Qurbaqa',2,'Nam joyni yaxshi ko\\'radi, terisi orqali ham nafas oladi.'],\n ['🍄 Qo\\'ziqorin',2,'Nam va soyali o\\'rmon tuprog\\'ida o\\'sadi.'],\n ['🐧 Pingvin',3,'Yog\\' qatlami va zich patlar sovuqda isitadi.'],\n ['🦈 Akula',1,'Suvda yashaydi, jabra bilan nafas oladi.']\n].map(x=>({q:x[0]+' qayerda yashaydi?',o:env,a:x[1],e:x[2]})));\n\n// ---- 3-bo'lim: nafas va qon simulyatsiyasi ----\nconst lv=[['Dam olish',19,80,3.2,4],['Yurish',26,105,2.2,2.8],['Yugurish',40,150,1.4,1.6]];\nfunction mkDots(){\n  let s='';\n  // katta doira: qizil -> ko'k; kichik doira: ko'k -> qizil\n  [[220,'#e5484d','#3b5bdb'],[80,'#3b5bdb','#e5484d']].forEach(([cx,c1,c2])=>{\n    for(let j=0;j<4;j++){\n      const p=`M ${cx} 33 a52 52 0 1 1 -0.1 0`;\n      s+=`<circle r=\"6\"><animateMotion class=\"am\" dur=\"4s\" begin=\"${-j}s\" repeatCount=\"indefinite\" path=\"${p}\"/><animate attributeName=\"fill\" values=\"${c1};${c1};${c2};${c2}\" keyTimes=\"0;.5;.5;1\" calcMode=\"discrete\" dur=\"4s\" begin=\"${-j}s\" repeatCount=\"indefinite\" class=\"am\"/><\/circle>`;\n    }\n  });\n  $('#dots').innerHTML=s;\n}\nmkDots();\nfunction act(){\n  const a=lv[+$('#ac').value];\n  $('#an').textContent=a[0];$('#nb').textContent=a[1];$('#pb').textContent=a[2];\n  document.documentElement.style.setProperty('--bt',a[3]+'s');\n  document.querySelectorAll('.am').forEach(e=>e.setAttribute('dur',a[4]+'s'));\n}\n$('#ac').oninput=act;act();\n$('#sm').onclick=()=>{\n  const on=document.body.classList.toggle('smoky');\n  $('#sm2').textContent=on?'😷 Chang va tutun bronxlarni toraytiradi, nafas qiyinlashadi va yo\\'tal paydo bo\\'ladi.':'';\n};\ndocument.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{$('#bm').textContent=b.dataset.b});\n\n// ---- Yakuniy test ----\nconst T=[\n ['Havoda eng ko\\'p gaz qaysi?',['Kislorod','Azot','Karbonat angidrid','Vodorod'],1,'Havoning ~78% qismi azot.'],\n ['Havoni tozalab, kislorod beradigan?',['Daraxtlar','Mashinalar','Zavod tutuni','Chang'],0,'O\\'simliklar kislorod chiqaradi.'],\n ['Havoni isitib, namlab, changdan tozalaydigan a\\'zo?',['Oshqozon','Burun','Yurak','Jigar'],1,'Burun bo\\'shlig\\'i shu vazifani bajaradi.'],\n ['Tuyaning bo\\'rtig\\'ida nima to\\'planadi?',['Suv','Havo','Yog\\'','Qon'],2,'Yog\\' energiya manbai.'],\n ['Baliq suvda nima bilan nafas oladi?',['O\\'pka','Jabra','Teri','Burun'],1,'Jabra suvdagi kislorodni oladi.'],\n ['Qutb ayig\\'i sovuqqa qanday moslashgan?',['Ingichka teri','Qalin mo\\'yna','Tikan','Qanot'],1,'Qalin mo\\'yna isitadi.'],\n ['Gaz almashinuvi qayerda bo\\'ladi?',['Kekirdakda','Burunda','Alveolalarda','Og\\'izda'],2,'Alveolalar mayda pufakchalar.'],\n ['Nafas olganda ko\\'krak qafasi qanday o\\'zgaradi?',['Kengayadi','Torayadi','O\\'zgarmaydi','Qotadi'],0,'Diafragma va qovurg\\'a mushaklari qisqaradi.'],\n ['Yurak necha kamerali?',['2','3','4','5'],2,'2 bo\\'lmacha va 2 qorincha.'],\n ['Kislorodni tashiydigan qon hujayrasi?',['Leykotsit','Trombotsit','Eritrotsit','Plazma'],2,'Eritrotsitdagi gemoglobin kislorodni biriktiradi.'],\n ['Mikroblardan himoya qiladigan hujayra?',['Eritrotsit','Leykotsit','Trombotsit','Kapillyar'],1,'Leykotsitlar mikrobni yutadi.'],\n ['Yurakdan qon olib chiqadigan tomir?',['Vena','Kapillyar','Arteriya','Bronx'],2,'Arteriya yurakdan tanaga qon olib boradi.']\n].map(x=>({q:x[0],o:x[1],a:x[2],e:x[3]}));\nquiz($('#g3'),T,ok=>'<br>'+(ok>=11?'⭐⭐⭐ Ajoyib!':ok>=8?'⭐⭐ Yaxshi!':ok>=5?'⭐ Yomon emas.':'Yana urinib ko\\'r.')+'<br><small>Eslab qol: alveolalarda gaz almashinuvi bo\\'ladi, yurak qonni katta va kichik doira bo\\'ylab haydaydi.<\/small>');\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Yuqumli kasalliklar", "i": "🦠", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Yuqumli kasalliklar<\/title>\n<style>\n:root{--navy:#16324f;--blue:#2878b5;--teal:#13a89e;--gold:#ffd166;--bg:#f3f8fc;--ink:#203247;--red:#e85d75;--green:#2a9d68}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}\nheader{background:linear-gradient(135deg,#16324f,#2878b5 65%,#13a89e);color:white;padding:34px 18px;text-align:center}\nheader h1{font-size:clamp(1.8rem,5vw,3rem);margin:8px 0}header p{max-width:850px;margin:8px auto}\n.badge{display:inline-block;background:var(--gold);color:#25364a;border-radius:30px;padding:5px 13px;font-weight:bold}\nnav{position:sticky;top:0;z-index:5;background:#fff;display:flex;gap:8px;overflow:auto;padding:10px;box-shadow:0 3px 12px #17324f18}\nnav a{white-space:nowrap;text-decoration:none;color:var(--navy);font-weight:bold;padding:8px 12px;border-radius:10px}nav a:hover{background:#e8f5ff}\nmain{max-width:1100px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 25px #193b5a0c;border:1px solid #e2edf5}\nh2{color:var(--navy);margin-top:0}h3{color:#236c91}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}\n.tile{border-radius:14px;padding:16px;background:#eef7ff;border-left:5px solid var(--blue)}.tile:nth-child(2){background:#effbf7;border-color:var(--teal)}.tile:nth-child(3){background:#fff7e5;border-color:#f3b63f}.tile:nth-child(4){background:#fff0f2;border-color:var(--red)}\n.icon{font-size:2rem}.pill{display:inline-block;border-radius:20px;background:#e9f6f2;color:#176a53;padding:3px 10px;font-size:.9rem;font-weight:bold}\n.note{background:#fff8df;border-left:5px solid #f2bc42;padding:13px 16px;border-radius:10px}\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.step{background:#f2f7fb;border-radius:12px;padding:12px;text-align:center}\nbutton{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 15px;font-size:1rem;font-weight:bold;cursor:pointer}button:hover{filter:brightness(.92)}button.secondary{background:#536579}button.good{background:var(--green)}\nlabel{display:block;padding:8px;margin:5px 0;border-radius:9px;background:#f4f8fb;cursor:pointer}input[type=radio]{margin-right:8px}\n#quizResult{font-weight:bold;margin-top:12px}.sim-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}\n.people{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.person{padding:12px 2px;text-align:center;background:#dff4e9;border-radius:12px;font-size:1.5rem;border:2px solid transparent;transition:.3s}.person small{display:block;font-size:.65rem}.person.infected{background:#ffe1e6;border-color:var(--red);animation:pulse 1s infinite alternate}\n@keyframes pulse{to{transform:scale(1.06)}}.bar{height:15px;background:#e5edf3;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--teal),var(--red));transition:width .4s}\ncanvas{width:100%;max-width:450px;height:auto;background:#eff8ff;border-radius:16px;border:1px solid #d8eaf5}\nfooter{text-align:center;padding:25px;color:#60758a}\n@media(max-width:650px){.sim-layout{grid-template-columns:1fr}.card{padding:16px}.people{grid-template-columns:repeat(5,1fr)}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"badge\">6-sinf • Tabiiy fan<\/span>\n  <h1>🦠 Yuqumli kasalliklar<\/h1>\n  <p>Kasalliklarning kelib chiqish sabablari, tarqalish yo‘llari va ulardan himoyalanishni o‘rganamiz.<\/p>\n  <p><strong>O‘rganamiz • Kuzatamiz • Sinab ko‘ramiz • Bilimimizni tekshiramiz<\/strong><\/p>\n<\/header>\n<nav>\n  <a href=\"#reja\">Dars rejasi<\/a><a href=\"#mikroblar\">Kasallik sabablari<\/a><a href=\"#tarqalish\">Tarqalish yo‘llari<\/a><a href=\"#simulyatsiya\">Simulyatsiya<\/a><a href=\"#himoya\">Himoyalanish<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"reja\">\n<h2>📋 Dars maqsadi va rejasi<\/h2>\n<p><strong>Dars maqsadi:<\/strong> o‘quvchilar yuqumli kasalliklarni keltirib chiqaruvchi omillarni, ularning tarqalish yo‘llarini va profilaktika choralarini tushuntira oladi.<\/p>\n<div class=\"grid\">\n<div class=\"tile\"><span class=\"icon\">🔬<\/span><h3>1. Kasallik sabablari<\/h3><p>Viruslar, bakteriyalar, zamburug‘lar va parazitlar haqida bilib olamiz.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🌬️<\/span><h3>2. Tarqalish yo‘llari<\/h3><p>Havo orqali, iflos suv va oziq-ovqat, aloqa hamda ayrim hasharotlar orqali yuqishni ko‘rib chiqamiz.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🛡️<\/span><h3>3. Himoyalanish<\/h3><p>Gigiyena, toza suv, emlash va kasallik alomatlarida kattalarga murojaat qilishni o‘rganamiz.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"mikroblar\">\n<h2>1. Yuqumli kasalliklar nimadan kelib chiqadi?<\/h2>\n<p><strong>Yuqumli kasalliklar<\/strong> — ayrim kasallik qo‘zg‘atuvchilar sababli yuzaga keladigan va ma’lum sharoitlarda bir odamdan boshqasiga yoki hayvonlardan odamga yuqishi mumkin bo‘lgan kasalliklardir. Ko‘plab mikroorganizmlar esa foydali yoki zararsiz bo‘ladi.<\/p>\n<div class=\"grid\">\n<div class=\"tile\"><span class=\"icon\">🧬<\/span><h3>Viruslar<\/h3><p>Ko‘payish uchun tirik hujayraga muhtoj bo‘lgan juda mayda zarrachalar. <strong>Misol:<\/strong> gripp, qizamiq, suvchechak viruslari.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🦠<\/span><h3>Bakteriyalar<\/h3><p>Bir hujayrali mikroorganizmlar. Ayrim turlari kasallik keltirib chiqaradi. <strong>Misol:<\/strong> sil va vabo qo‘zg‘atuvchi bakteriyalar.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🍄<\/span><h3>Zamburug‘lar<\/h3><p>Ayrim turlari teri va tirnoqlarda infeksiya keltirib chiqarishi mumkin.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🪱<\/span><h3>Parazitlar<\/h3><p>Boshqa organizm hisobiga yashaydi. Ayrim ichak qurtlari iflos qo‘l, suv yoki oziq-ovqat orqali yuqishi mumkin.<\/p><\/div>\n<\/div>\n<div class=\"note\"><strong>Esda tuting:<\/strong> antibiotiklar bakteriyalarga qarshi qo‘llanadi, viruslarga esa ta’sir qilmaydi. Dori vositalarini faqat tibbiyot mutaxassisi tavsiyasi bilan ishlatish kerak.<\/div>\n<h3>🔎 Tezkor savol<\/h3>\n<p>Quyidagilardan qaysi biri kasallik qo‘zg‘atuvchisi bo‘lishi mumkin?<\/p>\n<div id=\"quickOptions\">\n<label><input type=\"radio\" name=\"quick\" value=\"a\"> Faqat kitoblar<\/label>\n<label><input type=\"radio\" name=\"quick\" value=\"b\"> Ayrim viruslar va bakteriyalar<\/label>\n<label><input type=\"radio\" name=\"quick\" value=\"c\"> Quyosh nuri<\/label>\n<\/div>\n<button onclick=\"checkQuick()\">Javobni tekshirish<\/button><span id=\"quickResult\" style=\"margin-left:10px\"><\/span>\n<\/section>\n\n<section class=\"card\" id=\"tarqalish\">\n<h2>2. Kasalliklar qanday tarqaladi?<\/h2>\n<div class=\"grid\">\n<div class=\"tile\"><span class=\"icon\">🌬️<\/span><h3>Havo orqali<\/h3><p>Ba’zi infeksiyalar kasallangan odam nafas chiqarganda, yo‘talganda yoki aksirganda havoga tarqalgan zarrachalar orqali yuqadi. <strong>Misol:<\/strong> gripp, qizamiq.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🚰<\/span><h3>Suv va oziq-ovqat orqali<\/h3><p>Ifloslangan suv yoki yaxshi yuvilmagan mahsulotlar orqali ayrim infeksiyalar yuqishi mumkin.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🤝<\/span><h3>Aloqa orqali<\/h3><p>Ba’zi infeksiyalar teri bilan bevosita aloqa yoki ifloslangan buyumlar orqali tarqaladi. Barcha kasalliklar qo‘l berib ko‘rishishdan yuqmaydi.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🦟<\/span><h3>Hasharot yoki hayvon orqali<\/h3><p>Ayrim kasalliklar chivin, kana yoki kasallangan hayvon orqali yuqishi mumkin. Hayvon tishlasa, darhol kattalarga aytib, tibbiy yordam olish kerak.<\/p><\/div>\n<\/div>\n<h3>🔗 Yuqish zanjiri<\/h3>\n<div class=\"steps\">\n<div class=\"step\">👤<br><strong>1. Manba<\/strong><br>Kasallangan odam yoki hayvon<\/div><div class=\"step\">💨<br><strong>2. Tarqalish<\/strong><br>Havo, suv, aloqa yoki tashuvchi<\/div><div class=\"step\">🧒<br><strong>3. Yangi odam<\/strong><br>Qo‘zg‘atuvchi organizmga kiradi<\/div><div class=\"step\">🧼<br><strong>4. Zanjirni uzish<\/strong><br>Gigiyena va profilaktika<\/div>\n<\/div>\n<p class=\"note\">Kasallikning tarqalishi qo‘zg‘atuvchi turiga va sharoitga bog‘liq. Har bir infeksiya barcha yo‘llar bilan yuqavermaydi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"simulyatsiya\">\n<h2>🎮 Simulyatsiya: “Infeksiya tarqalishi”<\/h2>\n<p>Bu soddalashtirilgan o‘quv modeli. U haqiqiy epidemiyani aniq bashorat qilmaydi, faqat ehtiyot choralarining tarqalishga ta’sirini ko‘rsatadi.<\/p>\n<div class=\"sim-layout\">\n<div>\n<label><input type=\"checkbox\" id=\"wash\"> Qo‘l gigiyenasi va tozalik qoidalariga amal qilish<\/label>\n<label><input type=\"checkbox\" id=\"distance\"> Kasal bo‘lganda uyda qolish va yaqin aloqani kamaytirish<\/label>\n<label><input type=\"checkbox\" id=\"ventilate\"> Xonani shamollatish<\/label>\n<p><strong>Modeldagi tarqalish ehtimoli:<\/strong><\/p><div class=\"bar\"><span id=\"riskBar\"><\/span><\/div><p id=\"riskText\">Himoya choralarini tanlang, so‘ng simulyatsiyani boshlang.<\/p>\n<button onclick=\"runSimulation()\">▶ Simulyatsiyani boshlash<\/button>\n<button class=\"secondary\" onclick=\"resetSimulation()\">↺ Qayta boshlash<\/button>\n<\/div>\n<div>\n<div class=\"people\" id=\"people\">\n<div class=\"person infected\">🤒<small>1-manba<\/small><\/div>\n<div class=\"person\">🙂<small>2<\/small><\/div><div class=\"person\">🙂<small>3<\/small><\/div><div class=\"person\">🙂<small>4<\/small><\/div><div class=\"person\">🙂<small>5<\/small><\/div>\n<div class=\"person\">🙂<small>6<\/small><\/div><div class=\"person\">🙂<small>7<\/small><\/div><div class=\"person\">🙂<small>8<\/small><\/div><div class=\"person\">🙂<small>9<\/small><\/div><div class=\"person\">🙂<small>10<\/small><\/div>\n<\/div><p id=\"simResult\" aria-live=\"polite\">Hozircha 1 ta manba ko‘rsatilgan. Himoya choralarini sinab ko‘ring.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"himoya\">\n<h2>3. Yuqumli kasalliklardan himoyalanish<\/h2>\n<div class=\"grid\">\n<div class=\"tile\"><span class=\"icon\">🧼<\/span><h3>Qo‘lni yuvish<\/h3><p>Ovqatdan oldin, hojatxonadan keyin va ko‘chadan kelgach qo‘llarni sovun bilan yaxshilab yuving.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🍎<\/span><h3>Oziq-ovqat tozaligi<\/h3><p>Meva-sabzavotlarni yuving, ovqatni toza saqlang va xavfsiz ichimlik suvidan foydalaning.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🤧<\/span><h3>Yo‘tal odobi<\/h3><p>Yo‘talganda yoki aksirganda og‘iz-burunni salfetka yoki tirsak bukilmasi bilan yoping.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">💉<\/span><h3>Emlash<\/h3><p>Tavsiya etilgan emlashlar ayrim xavfli infeksiyalardan himoyalanishga yordam beradi.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🌬️<\/span><h3>Toza havo<\/h3><p>Yopiq xonalarni muntazam shamollating. Kasallik alomatlari bo‘lsa, kattalarga ayting.<\/p><\/div>\n<div class=\"tile\"><span class=\"icon\">🩺<\/span><h3>Tibbiy maslahat<\/h3><p>O‘zboshimchalik bilan dori ichmang. Zarur bo‘lsa, ota-ona yoki tibbiyot xodimiga murojaat qiling.<\/p><\/div>\n<\/div>\n<h3>🧪 Sinf tajribasi: “Mikroblar qanday tarqalishi mumkin?”<\/h3>\n<p>O‘qituvchi qo‘lga ozgina yuviladigan yaltiroq kukun yoki yuviladigan bo‘yoq surtib, buyumlarga tekkizadi. Izlarning bir qo‘ldan boshqasiga o‘tishi kuzatiladi. Bu mikroblarning o‘zi emas, balki aloqa orqali tarqalishni ko‘rsatuvchi modeldir. Material ko‘zga tushmasin, allergiya bo‘lsa ishlatilmasin; tajribadan keyin qo‘llar yuviladi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>📝 Bilimingizni tekshiring<\/h2>\n<p>Har bir savolda bitta to‘g‘ri javobni tanlang.<\/p>\n<form id=\"quiz\">\n<div class=\"question\"><p><strong>1. Viruslar ko‘payishi uchun odatda nima kerak?<\/strong><\/p><label><input type=\"radio\" name=\"q1\" value=\"a\"> Tirik hujayra<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Tosh<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Quruq qum<\/label><\/div>\n<div class=\"question\"><p><strong>2. Qo‘lni qachon sovunlab yuvish kerak?<\/strong><\/p><label><input type=\"radio\" name=\"q2\" value=\"a\"> Faqat haftada bir marta<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Ovqatdan oldin va hojatxonadan keyin<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Hech qachon<\/label><\/div>\n<div class=\"question\"><p><strong>3. Aksirganda nima qilish to‘g‘ri?<\/strong><\/p><label><input type=\"radio\" name=\"q3\" value=\"a\"> Boshqalarga qarab aksirish<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Og‘iz-burunni salfetka yoki tirsak bukilmasi bilan yopish<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Qo‘lni yuvmaslik<\/label><\/div>\n<div class=\"question\"><p><strong>4. Iflos suv orqali qanday xavf yuzaga kelishi mumkin?<\/strong><\/p><label><input type=\"radio\" name=\"q4\" value=\"a\"> Ayrim ichak infeksiyalari<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Faqat suyak sinishi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Sochning o‘sishi<\/label><\/div>\n<div class=\"question\"><p><strong>5. Antibiotiklar haqida qaysi fikr to‘g‘ri?<\/strong><\/p><label><input type=\"radio\" name=\"q5\" value=\"a\"> Har qanday virusni davolaydi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Faqat shirinlik bilan ichiladi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Ayrim bakterial infeksiyalarda qo‘llanadi, mutaxassis tavsiyasi zarur<\/label><\/div>\n<div class=\"question\"><p><strong>6. Yuqumli kasalliklardan himoyalanishga nima yordam beradi?<\/strong><\/p><label><input type=\"radio\" name=\"q6\" value=\"a\"> Toza suv, gigiyena va tavsiya etilgan emlashlar<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> Yuvilmagan meva yeyish<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> Kasal bo‘lganda boshqalar bilan yaqin aloqada bo‘lish<\/label><\/div>\n<button type=\"button\" onclick=\"gradeQuiz()\">Natijani hisoblash<\/button>\n<button type=\"button\" class=\"secondary\" onclick=\"document.getElementById('quiz').reset();document.getElementById('quizResult').textContent=''\">Qayta ishlash<\/button>\n<\/form>\n<div id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>💬 Dars yakuni — muhokama<\/h2>\n<ul>\n<li>Yuqumli kasalliklarni qaysi qo‘zg‘atuvchilar keltirib chiqarishi mumkin?<\/li>\n<li>Kasallik tarqalish zanjirini uzish uchun nimalar qilish mumkin?<\/li>\n<li>Nima uchun faqat toza ichimlik suvidan foydalanish muhim?<\/li>\n<li>Bugundan boshlab qaysi gigiyena qoidasiga alohida amal qilasiz?<\/li>\n<\/ul>\n<div class=\"note\"><strong>Asosiy xulosa:<\/strong> qo‘l gigiyenasi, xavfsiz suv va oziq-ovqat, yo‘tal odobi, shamollatish hamda tavsiya etilgan emlashlar ko‘plab infeksiyalar xavfini kamaytiradi.<\/div>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan • “Yuqumli kasalliklar” interaktiv dars materiali<\/footer>\n<script>\nfunction checkQuick(){\n const v=document.querySelector('input[name=\"quick\"]:checked');const out=document.getElementById('quickResult');\n if(!v){out.textContent='Avval javob tanlang.';out.style.color='#b45309';return}\n out.textContent=v.value==='b'?'To‘g‘ri! Ayrim viruslar va bakteriyalar kasallik qo‘zg‘atadi.':'Qayta urinib ko‘ring.';\n out.style.color=v.value==='b'?'#218653':'#c03955';\n}\nfunction risk(){\n let r=100;\n if(document.getElementById('wash').checked)r-=25;\n if(document.getElementById('distance').checked)r-=35;\n if(document.getElementById('ventilate').checked)r-=20;\n return Math.max(10,r);\n}\nfunction updateRisk(){\n let r=risk();document.getElementById('riskBar').style.width=r+'%';\n document.getElementById('riskText').textContent='Modeldagi shartli tarqalish ko‘rsatkichi: '+r+'% (bu haqiqiy tibbiy ehtimol emas).';\n}\n['wash','distance','ventilate'].forEach(id=>document.getElementById(id).addEventListener('change',updateRisk));\nfunction runSimulation(){\n let r=risk(), people=[...document.querySelectorAll('.person')], count=Math.max(1,Math.round(1+(r/100)*8));\n people.forEach((p,i)=>{p.classList.toggle('infected',i<count);p.innerHTML=(i<count?'🤒':'🙂')+'<small>'+(i===0?'1-manba':i+1)+'<\/small>'});\n document.getElementById('simResult').textContent='Model natijasi: '+count+' ta belgi infeksiya bilan bog‘liq holatni ifodalaydi. Himoya choralarini ko‘paytirib, qayta sinab ko‘ring.';\n}\nfunction resetSimulation(){\n document.getElementById('wash').checked=false;document.getElementById('distance').checked=false;document.getElementById('ventilate').checked=false;\n [...document.querySelectorAll('.person')].forEach((p,i)=>{p.classList.toggle('infected',i===0);p.innerHTML=(i===0?'🤒':'🙂')+'<small>'+(i===0?'1-manba':i+1)+'<\/small>'});\n document.getElementById('simResult').textContent='Hozircha 1 ta manba ko‘rsatilgan. Himoya choralarini sinab ko‘ring.';updateRisk();\n}\nfunction gradeQuiz(){\n const answers={q1:'a',q2:'b',q3:'b',q4:'a',q5:'c',q6:'a'};let score=0,missing=0;\n for(const [q,a] of Object.entries(answers)){const s=document.querySelector('input[name=\"'+q+'\"]:checked');if(!s)missing++;else if(s.value===a)score++}\n const out=document.getElementById('quizResult');\n if(missing){out.textContent='Barcha savollarga javob bering. Hali '+missing+' ta savol qolgan.';out.style.color='#b45309';return}\n let msg=score===6?'A’lo!':score>=4?'Yaxshi natija!':'Mavzuni yana bir bor takrorlang.';\n out.textContent=msg+' Natija: '+score+'/6 ('+Math.round(score/6*100)+'%).';out.style.color=score>=4?'#218653':'#c03955';\n}\nupdateRisk();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Kasallik tarqalishining oldini olish", "i": "🧼", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Kasallik tarqalishining oldini olish<\/title>\n<style>\n:root{--blue:#1769aa;--teal:#14b8a6;--ink:#19324d;--bg:#f3f8fc;--orange:#ffb547;--red:#e85d75;--green:#159b72}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}\nheader{background:linear-gradient(120deg,#135ba1,#18a999);color:white;padding:28px 18px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}header p{margin:0;font-size:17px}\nmain{max-width:1100px;margin:auto;padding:18px}\n.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}\nbutton{border:0;border-radius:12px;padding:11px 15px;background:#e0ebf5;color:var(--ink);font-weight:700;cursor:pointer;transition:.2s}\nbutton:hover{transform:translateY(-1px)}button.active,.primary{background:var(--blue);color:white}\n.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #153b5b12}\nh2{margin-top:0;color:#135ba1}h3{margin-bottom:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.tile{border:1px solid #e1ebf4;border-radius:15px;padding:16px;background:#fbfdff}\n.icon{font-size:38px;display:block;margin-bottom:5px}\n.pill{display:inline-block;background:#e4f8f3;color:#087d68;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:bold}\n.notice{background:#fff5df;border-left:5px solid var(--orange);padding:12px 15px;border-radius:10px}\n.good{color:#087d68;font-weight:bold}.bad{color:#c63d55;font-weight:bold}\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}\n.step{background:#eef7ff;border-radius:12px;padding:12px;text-align:center}\n.step b{display:block;font-size:25px}\n.sim-area{background:linear-gradient(#eaf7ff,#f7fcff);border-radius:15px;padding:18px;overflow:hidden}\n.people{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:18px 0}\n.person{width:105px;min-height:112px;border:2px solid #bdd7eb;border-radius:14px;background:white;text-align:center;padding:9px;position:relative}\n.person .face{font-size:38px}.person small{display:block}\n.germ{display:inline-block;font-size:22px;animation:float 1s infinite alternate}\n@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}\n.status{font-weight:bold;min-height:30px;margin:10px 0}\n.bar{height:14px;background:#dbe8f3;border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;width:0;background:var(--teal);transition:width .5s}\n.quiz-question{font-size:18px;font-weight:bold;margin:10px 0}\n.answer{display:block;width:100%;text-align:left;margin:7px 0;background:#f0f6fb}\n.answer.correct{background:#d8f7e8;color:#086b4b}.answer.wrong{background:#ffe1e5;color:#9f2437}\n#feedback{font-weight:bold;min-height:28px}\nfooter{text-align:center;color:#637b91;padding:25px}\nlabel{font-weight:bold}input[type=range]{width:100%}\n@media(max-width:600px){main{padding:10px}.card{padding:15px}.person{width:85px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div style=\"font-size:42px\">🧼 🦠 🛡️<\/div>\n  <h1>Kasallik tarqalishining oldini olish<\/h1>\n  <p>6-sinf · Tabiiy fan · Interaktiv dars va simulyatsiyalar<\/p>\n<\/header>\n<main>\n  <div class=\"tabs\" role=\"tablist\">\n    <button class=\"active\" onclick=\"showTab('lesson',this)\">📘 Dars materiali<\/button>\n    <button onclick=\"showTab('microbes',this)\">🦠 Mikrob zanjiri<\/button>\n    <button onclick=\"showTab('insects',this)\">🦟 Hasharotlardan himoya<\/button>\n    <button onclick=\"showTab('quiz',this)\">🧠 Viktorina<\/button>\n  <\/div>\n\n  <section id=\"lesson\" class=\"tab\">\n    <div class=\"card\">\n      <span class=\"pill\">Dars maqsadi<\/span>\n      <h2>Bugun nimalarni o‘rganamiz?<\/h2>\n      <ul>\n        <li>Yuqumli kasalliklar qanday yo‘llar bilan tarqalishini tushuntirish.<\/li>\n        <li>Shaxsiy gigiyena va yo‘talish-aksirish odobini qo‘llash.<\/li>\n        <li>Hasharotlar chaqishidan himoyalanish usullarini bilish.<\/li>\n        <li>Vaziyatlarni tahlil qilib, xavfsiz xulosa chiqarish.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h2>1. Kasalliklar qanday tarqaladi?<\/h2>\n      <div class=\"grid\">\n        <div class=\"tile\"><span class=\"icon\">🤧<\/span><h3>Havo orqali<\/h3>Yo‘talish, aksirish yoki yaqin muloqot vaqtida ayrim mikroblar nafas yo‘llari orqali tarqalishi mumkin.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🖐️<\/span><h3>Kontakt orqali<\/h3>Iflos qo‘l yoki tez-tez tegiladigan buyumlar orqali ayrim mikroblar boshqa odamga o‘tishi mumkin.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🥤<\/span><h3>Suv va oziq-ovqat orqali<\/h3>Iflos suv yoki gigiyena qoidalariga rioya qilinmay tayyorlangan ovqat ayrim kasalliklarni tarqatishi mumkin.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>2. Kasallik tarqalishini kamaytirishning oltin qoidalari<\/h2>\n      <div class=\"grid\">\n        <div class=\"tile\"><span class=\"icon\">🧼<\/span><h3>Qo‘llarni yuvish<\/h3>Qo‘llarni sovun va suv bilan kamida 20 soniya yuving. Kaft, qo‘l usti, barmoqlar orasi va tirnoq atroflarini unutmang.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🪟<\/span><h3>Xonani shamollatish<\/h3>Xonani muntazam shamollating. Imkon bo‘lsa, har kuni 10–15 daqiqa yoki maktab qoidalariga muvofiq havo almashtiring.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🤧<\/span><h3>Yo‘talish odobi<\/h3>Yo‘tal yoki aksirishda og‘iz-burunni tirsak bukilmasi yoki bir martalik salfetka bilan yoping. Salfetkani tashlab, qo‘lni yuving.<\/div>\n        <div class=\"tile\"><span class=\"icon\">💉<\/span><h3>Emlanish<\/h3>Tavsiya etilgan vaksinalar ayrim yuqumli kasalliklardan himoya qiladi. Emlash masalasida tibbiyot xodimlari tavsiyasiga amal qiling.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🥗<\/span><h3>Sog‘lom turmush<\/h3>Muvozanatli ovqatlanish, yetarli uyqu va jismoniy faollik salomatlikni qo‘llab-quvvatlaydi.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🚰<\/span><h3>Toza suv va ovqat<\/h3>Ichimlik suvining xavfsizligiga e’tibor bering, meva-sabzavotni yuving va ovqatni toza sharoitda tayyorlang.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Qo‘l yuvish algoritmi<\/h2>\n      <div class=\"steps\">\n        <div class=\"step\"><b>1 💧<\/b>Qo‘llarni suv bilan ho‘llang<\/div>\n        <div class=\"step\"><b>2 🧼<\/b>Sovun surting<\/div>\n        <div class=\"step\"><b>3 🤲<\/b>Kaft va qo‘l ustini ishqalang<\/div>\n        <div class=\"step\"><b>4 🖐️<\/b>Barmoqlar oralari va tirnoq atroflarini yuving<\/div>\n        <div class=\"step\"><b>5 🚿<\/b>Suv bilan chaying<\/div>\n        <div class=\"step\"><b>6 🧻<\/b>Toza sochiq bilan quriting<\/div>\n      <\/div>\n      <p class=\"notice\">Sovunlab ishqalash taxminan 20 soniya davom etsin. Qo‘l ko‘rinib turgan darajada kir bo‘lsa, ayniqsa sovun va suv bilan yuvish muhim.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>3. Hasharot chaqishidan qanday himoyalanamiz?<\/h2>\n      <div class=\"grid\">\n        <div class=\"tile\"><span class=\"icon\">👕<\/span><h3>Yopiq kiyim<\/h3>O‘tloq yoki butazor joylarda yengli kiyim, uzun shim va yopiq poyabzal kiying. Och rangli kiyim kanani ko‘rishni osonlashtiradi.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🧴<\/span><h3>Repellent<\/h3>Chivin va kanalarni qaytaruvchi vositani yorlig‘idagi ko‘rsatma bo‘yicha ishlating. Bolalarda kattalar nazorati zarur.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🪟<\/span><h3>Deraza to‘ri<\/h3>Deraza va eshiklardagi moskit to‘rlari hasharotlarning xonaga kirishini kamaytiradi.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🪣<\/span><h3>Turg‘un suvni yo‘qotish<\/h3>Hovlida suv to‘planadigan ochiq idishlarni bo‘shating va chivin ko‘payishi mumkin bo‘lgan joylarni kamaytiring.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🔎<\/span><h3>Sayrdan keyin tekshirish<\/h3>O‘tloq yoki butazor joydan qaytgach, kiyim va tanani, ayniqsa teri burmalarini tekshiring.<\/div>\n        <div class=\"tile\"><span class=\"icon\">🩹<\/span><h3>Chaqilganda<\/h3>Joyni sovunli suv bilan yuving, qichishsa sovuq kompress qo‘ying. Nafas qisishi yoki yuz-tomoq shishi bo‘lsa, zudlik bilan tez yordam chaqiring.<\/div>\n      <\/div>\n      <p class=\"notice\"><b>Kana haqida:<\/b> tanaga yopishgan kanani imkon qadar tez, ingichka uchli pinset bilan teriga yaqin joyidan ushlab, tekis tortib oling. Ezib yubormang, yog‘ yoki olov ishlatmang. Olish qiyin bo‘lsa, tibbiy yordamga murojaat qiling; keyin joyni tozalang va o‘zingizni kuzating.<\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"microbes\" class=\"tab\" hidden>\n    <div class=\"card\">\n      <h2>🦠 Simulyatsiya: “Mikrob zanjiri”<\/h2>\n      <p>Bu soddalashtirilgan model. U mikroblar tarqalishi mumkinligini ko‘rsatadi; haqiqiy hayotda yuqish ehtimoli kasallik va sharoitga bog‘liq.<\/p>\n      <div class=\"sim-area\">\n        <label for=\"method\">Himoya usulini tanlang:<\/label>\n        <select id=\"method\" style=\"width:100%;padding:12px;border-radius:10px;border:1px solid #bcd0e0;margin:8px 0 12px\">\n          <option value=\"none\">Himoyasiz aksirish<\/option>\n          <option value=\"elbow\">Tirsak bukilmasiga aksirish<\/option>\n          <option value=\"tissue\">Salfetka bilan yopish<\/option>\n          <option value=\"vent\">Xonani shamollatish<\/option>\n        <\/select>\n        <div class=\"people\" id=\"people\">\n          <div class=\"person\"><div class=\"face\">🤧<\/div><b>1-o‘quvchi<\/b><small>Boshlovchi<\/small><\/div>\n          <div class=\"person\"><div class=\"face\">🙂<\/div><b>2-o‘quvchi<\/b><small>Yaqinda<\/small><\/div>\n          <div class=\"person\"><div class=\"face\">🙂<\/div><b>3-o‘quvchi<\/b><small>Yaqinda<\/small><\/div>\n          <div class=\"person\"><div class=\"face\">🙂<\/div><b>4-o‘quvchi<\/b><small>Uzoqroqda<\/small><\/div>\n        <\/div>\n        <div class=\"status\" id=\"simStatus\">Tajriba boshlash uchun tugmani bosing.<\/div>\n        <div class=\"bar\"><span id=\"spreadBar\"><\/span><\/div>\n        <button class=\"primary\" onclick=\"runSimulation()\">▶ Tajribani boshlash<\/button>\n        <button onclick=\"resetSimulation()\">↺ Qayta boshlash<\/button>\n      <\/div>\n      <p class=\"notice\">Muhim: tirsak bukilmasi yoki salfetka mikroblarning tarqalish xavfini kamaytiradi, ammo barcha xavfni yo‘q qilmaydi. Qo‘l yuvish va xonani shamollatish ham muhim.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Sinfxona muhokamasi<\/h2>\n      <ol>\n        <li>Qaysi himoya usuli tarqalishni kamaytirdi?<\/li>\n        <li>Nega yo‘talganidan keyin qo‘lni yuvish kerak?<\/li>\n        <li>Haqiqiy hayotda yana qanday choralar yordam beradi?<\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <section id=\"insects\" class=\"tab\" hidden>\n    <div class=\"card\">\n      <h2>🦟 Simulyatsiya: “Hasharotlardan himoya zirhi”<\/h2>\n      <p>Sayrga chiqayotgan qahramonga mos himoya vositalarini tanlang.<\/p>\n      <div class=\"sim-area\">\n        <div style=\"font-size:72px;text-align:center\" id=\"hero\">🧒<\/div>\n        <div class=\"grid\">\n          <label class=\"tile\"><input type=\"checkbox\" class=\"protect\" value=\"clothes\"> 👕 Uzun yengli, yopiq kiyim<\/label>\n          <label class=\"tile\"><input type=\"checkbox\" class=\"protect\" value=\"repellent\"> 🧴 Yorliq bo‘yicha repellent<\/label>\n          <label class=\"tile\"><input type=\"checkbox\" class=\"protect\" value=\"net\"> 🪟 Moskit to‘ri<\/label>\n          <label class=\"tile\"><input type=\"checkbox\" class=\"protect\" value=\"water\"> 🪣 Turg‘un suvni yo‘qotish<\/label>\n          <label class=\"tile\"><input type=\"checkbox\" class=\"protect\" value=\"check\"> 🔎 Sayrdan keyin tanani tekshirish<\/label>\n        <\/div>\n        <button class=\"primary\" onclick=\"checkProtection()\">🛡️ Himoyani tekshirish<\/button>\n        <div class=\"status\" id=\"protectStatus\" aria-live=\"polite\"><\/div>\n        <div class=\"bar\"><span id=\"protectBar\"><\/span><\/div>\n      <\/div>\n      <p class=\"notice\">Himoya choralarini birgalikda qo‘llash samaraliroq. Hech bir vosita barcha hasharot chaqishining oldini 100% kafolatlamaydi.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Chaqilganda esda tuting<\/h2>\n      <ul>\n        <li>Oddiy chaqish joyini sovunli suv bilan yuvib, sovuq kompress qo‘yish mumkin.<\/li>\n        <li>Qashimaslikka harakat qiling.<\/li>\n        <li>Kana yopishgan bo‘lsa, xavfsiz olib tashlashga ishonchingiz komil bo‘lmasa tibbiy yordam so‘rang.<\/li>\n        <li>Nafas olish qiyinlashishi, hushdan ketish yoki yuz/tomoq shishi — shoshilinch holat.<\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <section id=\"quiz\" class=\"tab\" hidden>\n    <div class=\"card\">\n      <h2>🧠 Bilimingizni sinab ko‘ring!<\/h2>\n      <div class=\"bar\"><span id=\"quizBar\"><\/span><\/div>\n      <p id=\"quizCount\">1-savol<\/p>\n      <div class=\"quiz-question\" id=\"question\"><\/div>\n      <div id=\"answers\"><\/div>\n      <div id=\"feedback\" aria-live=\"polite\"><\/div>\n      <button class=\"primary\" id=\"nextBtn\" onclick=\"nextQuestion()\" hidden>Keyingi savol →<\/button>\n      <button onclick=\"restartQuiz()\">⟲ Viktorina boshidan<\/button>\n    <\/div>\n  <\/section>\n<\/main>\n<footer>6-sinf Tabiiy fan · O‘rganamiz, sinab ko‘ramiz, sog‘lom bo‘lamiz! 🌱<\/footer>\n<script>\nfunction showTab(id,btn){\n document.querySelectorAll('.tab').forEach(x=>x.hidden=true);\n document.getElementById(id).hidden=false;\n document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));\n btn.classList.add('active');\n}\nfunction runSimulation(){\n const method=document.getElementById('method').value;\n const people=[...document.querySelectorAll('#people .person')];\n people.forEach((p,i)=>{p.style.borderColor='#bdd7eb';p.style.background='white';p.querySelector('.face').textContent=i===0?'🤧':'🙂';p.querySelector('small').textContent=i===0?'Boshlovchi':(i===3?'Uzoqroqda':'Yaqinda');});\n let infected=1, message='';\n if(method==='none'){\n   infected=4; message='Model: himoyasiz aksirishda tarqalish ehtimoli ko‘proq deb ko‘rsatiladi.';\n   people.slice(1).forEach(p=>{p.style.borderColor='#e85d75';p.style.background='#fff0f2';p.querySelector('.face').textContent='😷';p.querySelector('small').textContent='Xavf bor';});\n }else if(method==='elbow'){\n   infected=2; message='Model: tirsak bukilmasi tomchilar tarqalishini kamaytiradi, lekin xavfni butunlay yo‘q qilmaydi.';\n   people[1].style.borderColor='#ffb547';people[1].querySelector('small').textContent='Kamaygan xavf';\n }else if(method==='tissue'){\n   infected=2; message='Model: salfetka tomchilar tarqalishini kamaytirishga yordam beradi. Ishlatilgan salfetkani tashlang va qo‘lni yuving.';\n   people[1].style.borderColor='#ffb547';people[1].querySelector('small').textContent='Kamaygan xavf';\n }else{\n   infected=2;message='Model: shamollatish havodagi zarrachalar miqdorini kamaytirishga yordam beradi; boshqa choralar ham zarur.';\n   people[1].style.borderColor='#ffb547';people[1].querySelector('small').textContent='Kamaygan xavf';\n }\n document.getElementById('simStatus').textContent=message;\n document.getElementById('spreadBar').style.width=(infected/4*100)+'%';\n}\nfunction resetSimulation(){\n document.querySelectorAll('#people .person').forEach((p,i)=>{p.style.borderColor='#bdd7eb';p.style.background='white';p.querySelector('.face').textContent=i===0?'🤧':'🙂';p.querySelector('small').textContent=i===0?'Boshlovchi':(i===3?'Uzoqroqda':'Yaqinda');});\n document.getElementById('simStatus').textContent='Tajriba boshlash uchun tugmani bosing.';\n document.getElementById('spreadBar').style.width='0';\n}\nfunction checkProtection(){\n const chosen=[...document.querySelectorAll('.protect:checked')].map(x=>x.value);\n const score=chosen.length;\n document.getElementById('protectBar').style.width=(score/5*100)+'%';\n let msg=score>=4?'Ajoyib! Siz bir nechta muhim himoya choralarini tanladingiz.':score>=2?'Yaxshi boshlanish! Yana himoya choralarini qo‘shing.':'Himoya yetarli emas. Bir nechta chorani birga tanlang.';\n document.getElementById('protectStatus').textContent=`Tanlangan choralar: ${score}/5. ${msg}`;\n document.getElementById('hero').textContent=score>=4?'🧒🛡️':'🧒';\n}\nconst questions=[\n {q:'Qo‘llarni sovunlab kamida qancha vaqt ishqalash tavsiya etiladi?',a:['5 soniya','20 soniya','2 soniya'],c:1,e:'Sovunlab ishqalash taxminan 20 soniya davom etishi kerak.'},\n {q:'Yo‘tal yoki aksirishda og‘iz-burunni nima bilan yopish ma’qul?',a:['Kaft bilan','Tirsak bukilmasi yoki salfetka bilan','Hech narsa bilan yopmaslik'],c:1,e:'Tirsak bukilmasi yoki bir martalik salfetka mikroblarning qo‘lga tarqalishini kamaytiradi.'},\n {q:'Xonani shamollatish nima uchun foydali?',a:['Havo almashinadi','Xona qorong‘ilashadi','Mikroblar ko‘payadi'],c:0,e:'Shamollatish yopiq xonadagi havoni almashtirishga yordam beradi.'},\n {q:'Chivinlar ko‘payishiga qaysi joy yordam berishi mumkin?',a:['Quruq qum','Turg‘un suv to‘plangan idish','Toza, quruq pol'],c:1,e:'Ayrim chivinlar turg‘un suvda ko‘payadi.'},\n {q:'O‘tloqdan qaytgach, nima qilish kerak?',a:['Tanani va kiyimni tekshirish','Kiyimni tekshirmaslik','Faqat oyoq kiyimni yechish'],c:0,e:'Tana va kiyimni tekshirish kanani erta aniqlashga yordam beradi.'},\n {q:'Vaksinalar nima uchun qo‘llanadi?',a:['Ayrim kasalliklarga qarshi himoya hosil qilish uchun','Har qanday kasallikni darhol davolash uchun','Qo‘l yuvish o‘rniga'],c:0,e:'Vaksinalar muayyan infeksiyalarga qarshi immun himoya hosil qilishga yordam beradi.'},\n {q:'Iflos suv va noto‘g‘ri saqlangan ovqat nimaga sabab bo‘lishi mumkin?',a:['Ayrim yuqumli kasalliklarga','Faqat shamollashga','Hech qanday xavf yo‘q'],c:0,e:'Xavfsiz suv va oziq-ovqat gigiyenasi muhim.'},\n {q:'Kana yopishib qolsa, qaysi usul xavfsizroq?',a:['Yog‘ quyish yoki kuydirish','Ezib tashlash','Ingichka uchli pinset bilan teriga yaqin joyidan tekis tortib olish'],c:2,e:'Kanani ezmang va kuydirmang; to‘g‘ri olib tashlang yoki tibbiy yordam so‘rang.'}\n];\nlet qi=0,score=0,answered=false;\nfunction renderQuestion(){\n answered=false;\n const q=questions[qi];\n document.getElementById('quizCount').textContent=`${qi+1}-savol / ${questions.length}`;\n document.getElementById('question').textContent=q.q;\n document.getElementById('feedback').textContent='';\n document.getElementById('nextBtn').hidden=true;\n document.getElementById('quizBar').style.width=(qi/questions.length*100)+'%';\n const box=document.getElementById('answers');box.innerHTML='';\n q.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.onclick=()=>chooseAnswer(i,b);box.appendChild(b);});\n}\nfunction chooseAnswer(i,btn){\n if(answered)return;answered=true;\n const q=questions[qi];\n [...document.querySelectorAll('.answer')].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');});\n if(i===q.c){score++;document.getElementById('feedback').textContent='✅ To‘g‘ri! '+q.e;}\n else{btn.classList.add('wrong');document.getElementById('feedback').textContent='❌ Bu safar xato. '+q.e;}\n document.getElementById('nextBtn').hidden=false;\n document.getElementById('nextBtn').textContent=qi===questions.length-1?'Natijani ko‘rish':'Keyingi savol →';\n}\nfunction nextQuestion(){\n if(!answered)return;\n qi++;\n if(qi<questions.length){renderQuestion();return;}\n document.getElementById('quizCount').textContent='Viktorina yakunlandi';\n document.getElementById('question').textContent=`Natija: ${score}/${questions.length}`;\n document.getElementById('answers').innerHTML=`<p>${score>=7?'🌟 A’lo!':score>=5?'👏 Yaxshi!':'📘 Mavzuni yana bir bor takrorlang.'}<\/p><p>To‘g‘ri javoblar: ${Math.round(score/questions.length*100)}%<\/p>`;\n document.getElementById('feedback').textContent='Asosiy qoidalarni kundalik hayotda qo‘llashni unutmang.';\n document.getElementById('nextBtn').hidden=true;document.getElementById('quizBar').style.width='100%';\n}\nfunction restartQuiz(){qi=0;score=0;renderQuestion();}\nrenderQuestion();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Organizmning himoya mexanizmlari", "i": "🛡️", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fanlar — Odam organizmining himoya mexanizmlari<\/title>\n<style>\n:root{--navy:#12304a;--blue:#1976d2;--teal:#12a89d;--pink:#ef6b79;--gold:#ffca58;--bg:#f3f8fc;--ink:#183247}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}\nheader{background:linear-gradient(130deg,#12304a,#1976d2 65%,#12a89d);color:white;padding:34px 18px 28px;text-align:center}\nheader .tag{display:inline-block;background:#ffffff24;border:1px solid #ffffff55;padding:5px 12px;border-radius:30px;font-size:.9rem}\nh1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.15;margin:15px auto;max-width:900px}\nheader p{max-width:760px;margin:auto}\nmain{max-width:1100px;margin:auto;padding:20px}\nnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px auto}\nnav a{background:white;color:var(--navy);padding:8px 13px;border-radius:20px;text-decoration:none;border:1px solid #d9e7f1;font-weight:bold;font-size:.9rem}\nsection,.card{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #163b5510}\nh2{color:var(--navy);margin-top:0}h3{margin-bottom:6px;color:#176c91}\n.intro{font-size:1.08rem}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.stage{border-top:5px solid var(--blue)}.stage:nth-child(2){border-color:var(--teal)}.stage:nth-child(3){border-color:var(--pink)}\n.icon{font-size:2.4rem;line-height:1.3}.pill{display:inline-block;background:#e9f6ff;color:#125783;border-radius:20px;padding:3px 9px;font-size:.85rem;font-weight:bold}\n.diagram{background:#eaf5fb;border-radius:15px;padding:16px;text-align:center;margin:15px 0}\n.defense{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.15rem;font-weight:bold}\n.arrow{color:var(--pink);font-size:1.6rem}\nbutton{border:0;background:var(--blue);color:white;padding:11px 16px;border-radius:10px;font-weight:bold;cursor:pointer;margin:4px}\nbutton:hover{filter:brightness(.92)}button.secondary{background:#e5f2fa;color:var(--navy)}button.green{background:#0b9888}\n.simulator{background:#102d43;color:white;border-radius:18px;padding:20px;overflow:hidden}\n.simulator h2{color:white}.arena{position:relative;min-height:200px;background:radial-gradient(ellipse at center,#204d66,#0d2335);border:2px solid #4d829b;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px}\n.cell{font-size:3.3rem;animation:float 2.2s ease-in-out infinite}.microbe{filter:drop-shadow(0 0 6px #ff6d6d)}.whitecell{filter:drop-shadow(0 0 9px #9de5ff)}\n@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}\n#simStatus{font-size:1.05rem;min-height:52px;margin:13px 0}.progress{height:10px;background:#28485b;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .5s}\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}.step{padding:10px;background:#1b4057;border-radius:10px;font-size:.9rem}\ntable{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2ebf1;vertical-align:top}th{background:#eaf5fb;color:var(--navy)}\n.note{border-left:5px solid var(--gold);background:#fff8df;padding:13px 15px;border-radius:8px}\n.good{border-left:5px solid var(--teal);background:#e9fbf7;padding:13px 15px;border-radius:8px}\n.quiz-q{padding:15px;border:1px solid #e0eaf1;border-radius:12px;margin:12px 0}.quiz-q p{font-weight:bold;margin:0 0 9px}.quiz-q label{display:block;padding:5px 0;cursor:pointer}.result{font-weight:bold;padding:12px;border-radius:10px;margin-top:12px}\ninput[type=radio]{margin-right:8px}footer{text-align:center;padding:25px;color:#60798b}\n.small{font-size:.92rem;color:#5e7381}\n@media(max-width:600px){main{padding:12px}section,.card{padding:16px}th,td{padding:7px;font-size:.92rem}.arena{min-height:180px}}\n@media print{nav,.sim-controls,button{display:none!important}body{background:white}section,.card{box-shadow:none;break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"tag\">6-SINF • TABIIY FANLAR • INTERAKTIV DARS<\/span>\n  <h1>Odam organizmining himoya mexanizmlari<\/h1>\n  <p>Organizmimizni qal’aga o‘xshatamiz: teri — devor, leykotsitlar — himoyachilar, antitelolar esa aniq nishonni topuvchi maxsus vositalar.<\/p>\n<\/header>\n<main>\n<nav>\n<a href=\"#maqsad\">Dars maqsadi<\/a><a href=\"#uchbosqich\">3 bosqich<\/a><a href=\"#sim\">Simulyatsiya<\/a><a href=\"#lugat\">Atamalar<\/a><a href=\"#test\">Mini-test<\/a>\n<\/nav>\n<section id=\"maqsad\">\n<h2>🎯 Dars maqsadi<\/h2>\n<p class=\"intro\">O‘quvchilar organizmning kasallik qo‘zg‘atuvchilaridan qanday himoyalanishini tushuntiradi, tug‘ma va orttirilgan immunitetni farqlaydi hamda sog‘lom turmush odatlari ahamiyatini izohlaydi.<\/p>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"icon\">🧱<\/div><h3>1. Tashqi to‘siqlar<\/h3><p>Teri, shilliq qavat, ko‘z yoshi va boshqa himoya vositalari mikroblarning kirishiga to‘sqinlik qiladi.<\/p><\/div>\n<div class=\"card\"><div class=\"icon\">🛡️<\/div><h3>2. Tug‘ma himoya<\/h3><p>Organizmga kirgan ko‘plab zararli mikroblarga tez javob beradi. Fagotsitlar ularni yutib parchalashi mumkin.<\/p><\/div>\n<div class=\"card\"><div class=\"icon\">🎯<\/div><h3>3. Orttirilgan himoya<\/h3><p>Immun tizim muayyan qo‘zg‘atuvchini taniydi; antitelolar va xotira hujayralari javobda qatnashadi.<\/p><\/div>\n<\/div>\n<\/section>\n<section id=\"uchbosqich\">\n<h2>🏰 Organizmning uch bosqichli himoya tizimi<\/h2>\n<div class=\"grid\">\n<article class=\"card stage\"><span class=\"pill\">1-BOSQICH<\/span><div class=\"icon\">🧱 🧴 💧<\/div><h3>Tashqi himoya to‘siqlari<\/h3>\n<ul><li><b>Teri:<\/b> mikroblarning tanaga kirishini qiyinlashtiradigan jismoniy to‘siq.<\/li><li><b>Shilliq va tukchalar:<\/b> nafas yo‘llaridagi zarrachalarni ushlab, tashqariga chiqarishga yordam beradi.<\/li><li><b>Ko‘z yoshi va so‘lak:<\/b> tarkibidagi lizotsim kabi moddalar ayrim bakteriyalarga qarshi ta’sir ko‘rsatadi.<\/li><li><b>Oshqozon kislotasi:<\/b> yutilgan ko‘plab mikroblarni zararsizlantirishga yordam beradi.<\/li><\/ul><\/article>\n<article class=\"card stage\"><span class=\"pill\">2-BOSQICH<\/span><div class=\"icon\">🩸 🥷<\/div><h3>Tug‘ma, umumiy himoya<\/h3>\n<ul><li><b>Leykotsitlar:<\/b> oq qon hujayralarining ayrim turlari mikroblarni aniqlab, yutib parchalashi mumkin.<\/li><li><b>Fagotsitoz:<\/b> hujayraning zarrachani o‘rab olib yutishi va parchalashi.<\/li><li><b>Yallig‘lanish:<\/b> shikastlangan joyda qizarish, issiqlik, shish va og‘riq kuzatilishi mumkin.<\/li><li><b>Isitma:<\/b> ayrim infeksiyalarda yuz beradigan javob; juda yuqori isitma xavfli bo‘lishi mumkin.<\/li><\/ul><\/article>\n<article class=\"card stage\"><span class=\"pill\">3-BOSQICH<\/span><div class=\"icon\">🎯 🔑 🧠<\/div><h3>Orttirilgan, maxsus himoya<\/h3>\n<ul><li><b>Antitelolar:<\/b> ma’lum antigenni tanib bog‘lanadigan maxsus oqsillar.<\/li><li><b>Limfotsitlar:<\/b> immun javobni boshqarish va aniq qo‘zg‘atuvchiga qarshi kurashishda qatnashadi.<\/li><li><b>Xotira hujayralari:<\/b> oldin uchragan qo‘zg‘atuvchini eslab qolib, keyingi javobni tezlashtirishi mumkin.<\/li><li><b>Vaksina:<\/b> immun tizimni xavfsiz tarzda tayyorlashga yordam beradi.<\/li><\/ul><\/article>\n<\/div>\n<div class=\"note\"><b>Eslab qoling:<\/b> isitma har doim ham “mikrob o‘lyapti” degani emas. Bu organizm javobining belgisi bo‘lishi mumkin. Isitmani ataylab ko‘tarish yoki davolanishni kechiktirish mumkin emas.<\/div>\n<\/section>\n<section>\n<h2>🔍 Himoya qanday ishlaydi?<\/h2>\n<div class=\"diagram\"><div class=\"defense\"><span>🦠 Mikrob<\/span><span class=\"arrow\">→<\/span><span>🧱 Teri to‘sig‘i<\/span><span class=\"arrow\">→<\/span><span>🛡️ Tug‘ma himoya<\/span><span class=\"arrow\">→<\/span><span>🎯 Maxsus javob<\/span><\/div><\/div>\n<p>Agar teri butun bo‘lsa, ko‘plab mikroblar ichkariga kira olmaydi. Teri shikastlansa, tug‘ma immun javob faollashishi mumkin. Zarurat tug‘ilganda, orttirilgan immun tizim muayyan qo‘zg‘atuvchini taniydi va unga mos javob hosil qiladi.<\/p>\n<\/section>\n<section id=\"sim\">\n<div class=\"simulator\">\n<h2>🎮 Interaktiv simulyatsiya: “Qal’ani himoya qil!”<\/h2>\n<p>Har bir bosqich tugmasini bosing va organizm himoyasi qanday javob berishini kuzating.<\/p>\n<div class=\"arena\" id=\"arena\"><span class=\"cell\">🧱<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell\">🛡️<\/span><\/div>\n<div id=\"simStatus\" aria-live=\"polite\">Boshlash uchun “1. Tashqi to‘siq” tugmasini bosing.<\/div>\n<div class=\"progress\"><span id=\"bar\"><\/span><\/div>\n<div class=\"steps\">\n<div class=\"step\"><b>1-bosqich<\/b><br>🧱 Tashqi to‘siq<\/div><div class=\"step\"><b>2-bosqich<\/b><br>🛡️ Fagotsitoz<\/div><div class=\"step\"><b>3-bosqich<\/b><br>🎯 Antitelo va xotira<\/div>\n<\/div>\n<div class=\"sim-controls\" style=\"margin-top:14px\">\n<button onclick=\"showStage(1)\">1. Tashqi to‘siq<\/button>\n<button onclick=\"showStage(2)\">2. Fagotsitoz<\/button>\n<button onclick=\"showStage(3)\">3. Maxsus himoya<\/button>\n<button class=\"secondary\" onclick=\"resetSim()\">Qayta boshlash<\/button>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"lugat\">\n<h2>📘 Muhim atamalar<\/h2>\n<table><thead><tr><th>Atama<\/th><th>Sodda izoh<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Immunitet<\/b><\/td><td>Organizmning infeksiya va yot moddalarga qarshi himoyalanish qobiliyati.<\/td><\/tr>\n<tr><td><b>Leykotsit<\/b><\/td><td>Oq qon hujayrasi; ayrim turlari mikroblarga qarshi kurashadi.<\/td><\/tr>\n<tr><td><b>Fagotsitoz<\/b><\/td><td>Hujayraning zarrachani o‘rab olib yutishi va parchalashi.<\/td><\/tr>\n<tr><td><b>Antitelo<\/b><\/td><td>Muayyan antigenni taniydigan va unga bog‘lanadigan oqsil.<\/td><\/tr>\n<tr><td><b>Antigen<\/b><\/td><td>Immun tizim taniy oladigan modda yoki tuzilma.<\/td><\/tr>\n<tr><td><b>Vaksina<\/b><\/td><td>Immun tizimni ma’lum infeksiyaga qarshi tayyorlashga yordam beradigan vosita.<\/td><\/tr>\n<tr><td><b>Xotira hujayrasi<\/b><\/td><td>Oldin uchragan antigenni eslab qolib, keyingi javobga yordam beradigan hujayra.<\/td><\/tr>\n<tr><td><b>Yallig‘lanish<\/b><\/td><td>Shikast yoki infeksiyaga javoban yuzaga keladigan mahalliy himoya jarayoni.<\/td><\/tr>\n<\/tbody><\/table>\n<\/section>\n<section>\n<h2>💡 Kundalik hayotda himoyaga yordam berish<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"icon\">🧼<\/div><h3>Qo‘lni yuvish<\/h3><p>Ovqatdan oldin va hojatxonadan keyin qo‘llarni sovun bilan yaxshilab yuving.<\/p><\/div>\n<div class=\"card\"><div class=\"icon\">🥗<\/div><h3>Muvozanatli ovqatlanish<\/h3><p>Turli meva-sabzavotlar, oqsil manbalari va yetarli suv organizmning normal ishlashini qo‘llab-quvvatlaydi.<\/p><\/div>\n<div class=\"card\"><div class=\"icon\">😴<\/div><h3>Uyqu va harakat<\/h3><p>Yoshga mos yetarli uyqu va muntazam jismoniy faollik salomatlik uchun muhim.<\/p><\/div>\n<div class=\"card\"><div class=\"icon\">💉<\/div><h3>Emlanish<\/h3><p>Tavsiya etilgan vaksinalar ayrim xavfli infeksiyalardan himoyalanishga yordam beradi. Vaksinalar turiga qarab tarkibi farq qiladi; ularning barchasi tirik mikrob saqlamaydi.<\/p><\/div>\n<\/div>\n<div class=\"good\"><b>Ilmiy eslatma:<\/b> immunitetni bir zumda “kuchaytiradigan” sehrli mahsulot yo‘q. To‘g‘ri ovqatlanish, uyqu, gigiyena va emlash — salomatlikni asrashning muhim qismlari.<\/div>\n<\/section>\n<section id=\"test\">\n<h2>🧠 Mini-test<\/h2>\n<p>Har bir savol uchun bitta javobni tanlang, so‘ng “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"quiz-q\"><p>1. Mikroblarning tanaga kirishiga birinchi bo‘lib nima to‘sqinlik qiladi?<\/p>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Antitelolar<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Teri va shilliq qavatlar<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Xotira hujayralari<\/label><\/div>\n<div class=\"quiz-q\"><p>2. Fagotsitoz nima?<\/p>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Hujayraning zarrachani yutib parchalashi<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Yurakning qon haydashi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Oziqning oshqozonda hazm bo‘lishi<\/label><\/div>\n<div class=\"quiz-q\"><p>3. Antitelolar nimani taniydi?<\/p>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Har qanday narsani bir xil taniydi<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Muayyan antigenni<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Faqat suvni<\/label><\/div>\n<div class=\"quiz-q\"><p>4. Vaksinaning asosiy vazifasi nima?<\/p>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Har qanday kasallikni darhol davolash<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Immun tizimni ma’lum infeksiyaga qarshi tayyorlash<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Teri qatlamini qalinlashtirish<\/label><\/div>\n<div class=\"quiz-q\"><p>5. Xotira hujayralari nima uchun kerak?<\/p>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Oldin uchragan antigenni eslab, keyingi javobga yordam berish<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Ovqatni maydalash<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Kislorod tashish<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button><button type=\"button\" class=\"secondary\" onclick=\"resetQuiz()\">Qayta ishlash<\/button>\n<div id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n<section>\n<h2>🏠 Uyga vazifa<\/h2>\n<ol><li>“Organizm — qal’a” o‘xshatishidan foydalanib, uch bosqichli himoyani o‘z so‘zingiz bilan tushuntiring.<\/li><li>Atamalar jadvalidan 5 ta atamani yod oling.<\/li><li>Mini-testni qayta ishlang va har bir javobingizni izohlang.<\/li><\/ol>\n<p class=\"small\">Dars yakuni: organizm bir nechta himoya usullaridan foydalanadi. Ular birgalikda ishlaydi, ammo hech biri barcha kasalliklardan mutlaq himoya bermaydi.<\/p>\n<\/section>\n<\/main>\n<footer>6-sinf Tabiiy fanlar • O‘qituvchi uchun interaktiv dars materiali<\/footer>\n<script>\nfunction showStage(n){\n const arena=document.getElementById('arena'),status=document.getElementById('simStatus'),bar=document.getElementById('bar');\n if(n===1){arena.innerHTML='<span class=\"cell\">🧱<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell\">🚫<\/span>';status.textContent='1-bosqich: Teri va shilliq qavatlar ko‘plab mikroblarning ichkariga kirishiga to‘sqinlik qiladi. Teri shikastlanmaganida bu muhim himoya devoridir.';bar.style.width='33%'}\n if(n===2){arena.innerHTML='<span class=\"cell microbe\">🦠<\/span><span class=\"arrow\">→<\/span><span class=\"cell whitecell\">🟡<\/span><span class=\"arrow\">→<\/span><span class=\"cell\">💥<\/span>';status.textContent='2-bosqich: Mikrob ichkariga kirsa, tug‘ma immun javob ishga tushishi mumkin. Fagotsit deb ataladigan ayrim leykotsitlar mikrobni o‘rab olib yutadi va parchalaydi.';bar.style.width='66%'}\n if(n===3){arena.innerHTML='<span class=\"cell microbe\">🦠<\/span><span class=\"arrow\">+<\/span><span class=\"cell\">🔱<\/span><span class=\"arrow\">→<\/span><span class=\"cell\">🧠<\/span><span class=\"cell\">✅<\/span>';status.textContent='3-bosqich: Orttirilgan immun javobda antitelolar muayyan antigenni taniydi. Xotira hujayralari shu antigen qayta uchraganda tezroq javob berishga yordam beradi.';bar.style.width='100%'}\n}\nfunction resetSim(){document.getElementById('arena').innerHTML='<span class=\"cell\">🧱<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell microbe\">🦠<\/span><span class=\"cell\">🛡️<\/span>';document.getElementById('simStatus').textContent='Boshlash uchun “1. Tashqi to‘siq” tugmasini bosing.';document.getElementById('bar').style.width='0%'}\nfunction checkQuiz(){const ans={q1:'b',q2:'a',q3:'b',q4:'b',q5:'a'};let score=0,answered=0;for(const [q,a] of Object.entries(ans)){const s=document.querySelector('input[name=\"'+q+'\"]:checked');if(s){answered++;if(s.value===a)score++}}const r=document.getElementById('quizResult');r.className='result';r.style.background=score>=4?'#e4f8ef':'#fff3d9';r.style.color='#183247';r.textContent='Natija: '+score+'/5 ta to‘g‘ri. Javob berilgan: '+answered+'/5. '+(score===5?'Ajoyib! Mavzuni juda yaxshi tushungansiz.':score>=3?'Yaxshi! Xato javoblarni qayta ko‘rib chiqing.':'Atamalar va uch bosqichli himoyani yana bir bor o‘qing.')}\nfunction resetQuiz(){document.getElementById('quiz').reset();document.getElementById('quizResult').textContent='';document.getElementById('quizResult').className=''}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Kasalliklar (test/o‘yin)", "i": "🩺", "g": "Odam organizmi", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Kasalliklar | 6-sinf Tabiiy fanlar<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3f7ee;--cd:#fff;--tx:#23301f;--ac:#3a7d44;--rd:#d62839;--ln:#d5e2cf;--ok:#2b9348;--no:#d62839;--bl:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}}\n:root[data-theme=\"dark\"]{--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}\n*{box-sizing:border-box}html,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:var(--bg);padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}h3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c,.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}.msg{margin:8px 0;font-weight:800}\nlabel{display:block;margin:8px 0 2px}input[type=range]{width:100%;height:32px;accent-color:var(--ac)}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.av{font-size:64px;text-align:center;line-height:1.1}.pop{animation:pop .5s}\n@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}\n@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}\n.grid span.in{animation:fl 1s infinite;background:#d6283933;border-radius:10px}\n.germs{font-size:20px;word-break:break-all;min-height:30px}\nsvg{width:100%;height:auto;display:block}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}nav span{display:block;font-size:22px}\n.note{font-size:14px;opacity:.85;margin:10px 0}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<header><h1>🦠 Kasalliklar<\/h1><div id=\"sb\">⭐ <span id=\"sc\">0<\/span><\/div><\/header>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<h2>1. Sog'lom turmush tarzi<\/h2>\n<div class=\"c\"><b>Salomatlik<\/b> tananing jismoniy va ruhiy sog'lom holati.<\/div>\n<div class=\"c\"><b>Sog'lom turmush tarzi:<\/b> to'g'ri ovqatlanish, kuniga 9–10 soat uyqu, kamida 60 daqiqa harakat, toza havo, gigiyena, ekran vaqtini cheklash, zararli odatlardan saqlanish.<\/div>\n<div class=\"c\">Bu odatlar <b>immunitetni<\/b> (organizmning kasallikka qarshi kurashish qobiliyatini) mustahkamlaydi.<\/div>\n<h3>Immunitet shkalasi<\/h3>\n<div class=\"box\">\n<div class=\"av\" id=\"av0\">🙂<\/div>\n<div class=\"bar\"><i id=\"imb\"><\/i><\/div>\n<div class=\"msg\">Immunitet: <span id=\"imv\">50<\/span>%<\/div>\n<div id=\"hb\"><\/div>\n<div class=\"msg\" id=\"hm\">Odatni tanlang.<\/div>\n<\/div>\n<h3>O'yin: foydali yoki zararli?<\/h3>\n<div class=\"box\" id=\"g1\"><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>2. Kasalliklarning kelib chiqishi<\/h2>\n<div class=\"c\"><b>Yuqumli kasalliklar<\/b> qo'zg'atuvchisi bor va odamdan odamga o'tadi: bakteriyalar, viruslar, zamburug'lar, parazitlar (masalan, gijjalar).<\/div>\n<div class=\"c\"><b>Yuqumsiz kasalliklar<\/b> boshqalarga yuqmaydi. Sabablari: noto'g'ri ovqatlanish, kam harakat, zararli odatlar, travma, irsiyat, ifloslangan muhit.<\/div>\n<div class=\"c\"><b>Yuqish yo'llari:<\/b> havo-tomchi (aksirish, yo'tal), iflos qo'l, ifloslangan suv va oziq, umumiy buyumlar, hasharotlar.<\/div>\n<div class=\"c\"><b>Kasallik zanjiri:<\/b> manba → yuqish yo'li → sog'lom odam. Bitta bo'g'in uzilsa, kasallik tarqalmaydi.<\/div>\n<h3>Mikrob tarqalishi (sxema)<\/h3>\n<div class=\"box\">\n<div class=\"grid\" id=\"ppl\"><\/div>\n<div class=\"msg\">Kasallangan: <span id=\"cnt\">1<\/span>/12<\/div>\n<svg viewBox=\"0 0 300 80\" aria-label=\"Tarqalish grafigi\"><rect width=\"300\" height=\"80\" fill=\"none\" stroke=\"currentColor\" opacity=\".25\"/><polyline id=\"ch\" fill=\"none\" stroke=\"#d62839\" stroke-width=\"3\" points=\"\"/><\/svg>\n<label>🛡️ Immunitet kuchi: <b id=\"i1v\">30<\/b>%<input id=\"imm1\" type=\"range\" min=\"0\" max=\"100\" value=\"30\"><\/label>\n<button data-n=\"4\">🤧 Aksirish<\/button><button data-n=\"2\">🤝 Qo'l siqish<\/button><button data-n=\"3\">🥤 Umumiy buyum<\/button><button data-n=\"5\">💧 Iflos suv<\/button><button id=\"rs1\">↺ Qayta<\/button>\n<div class=\"msg\" id=\"sm\"><\/div>\n<\/div>\n<h3>Immunitet jangi<\/h3>\n<div class=\"box\">\n<label>🛡️ Immunitet kuchi: <b id=\"i2v\">50<\/b>%<input id=\"imm2\" type=\"range\" min=\"0\" max=\"100\" value=\"50\"><\/label>\n<button id=\"fb\">🦠 Mikrob hujumi<\/button>\n<div class=\"germs\" id=\"fv\">🦠🦠🦠🦠🦠🦠🦠🦠🦠🦠<\/div><div class=\"germs\" id=\"fl2\"><\/div>\n<div class=\"av\" id=\"av1\">🙂<\/div><div class=\"msg\" id=\"fm\"><\/div>\n<\/div>\n<h3>O'yin: kasallik zanjirini uz<\/h3>\n<div class=\"box\" id=\"g2\"><\/div>\n<h3>O'yin: sabab toping<\/h3>\n<div class=\"box\" id=\"g2b\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>3. Kasalliklarning oldini olish<\/h2>\n<div class=\"c\"><b>Gigiyena:<\/b> qo'lni sovun bilan kamida 20 soniya yuvish (ovqatdan oldin, hojatxonadan keyin, ko'chadan kelgach), tishni kuniga 2 marta yuvish.<\/div>\n<div class=\"c\"><b>Oziq va suv:<\/b> meva-sabzavotni yuvish, qaynatilgan yoki toza suv ichish, muddati o'tgan mahsulotni yemaslik.<\/div>\n<div class=\"c\"><b>Emlash:<\/b> organizmga zararsizlantirilgan qo'zg'atuvchi yoki uning qismi kiritiladi, immunitet kasallikni oldindan \"o'rganadi\".<\/div>\n<div class=\"c\"><b>Boshqalar:<\/b> xonani shamollatish, aksirganda tirsak bilan yopish, sport, uyqu, karantin va izolyatsiya.<\/div>\n<div class=\"c\"><b>Qo'l yuvish tartibi:<\/b> kaft → kaft orqasi → barmoq orasi → bosh barmoq → tirnoqlar → bilak.<\/div>\n<h3>Qo'l yuvish<\/h3>\n<div class=\"box\">\n<button id=\"hs\">🧼 Boshlash (20 soniya)<\/button> ⏱️ <b id=\"tm\">20<\/b>\n<div class=\"germs\" id=\"gm\">🦠🦠🦠🦠🦠🦠<\/div>\n<div id=\"stp\"><\/div><div class=\"msg\" id=\"hw\"><\/div>\n<\/div>\n<h3>Emlash (sxema)<\/h3>\n<div class=\"box\">\n<button id=\"v1\">💉 Emlangan bola<\/button><button id=\"v2\">🧒 Emlanmagan bola<\/button>\n<div class=\"av\" id=\"av2\">🧒<\/div><div class=\"msg\" id=\"vm\">Birini tanlang, so'ng mikrob hujumini ko'ring.<\/div>\n<\/div>\n<h3>Sog'lom kun rejasi<\/h3>\n<div class=\"box\" id=\"g3\"><\/div>\n<h3>O'yin: xavfsizmi yoki xavfli?<\/h3>\n<div class=\"box\" id=\"g4\"><\/div>\n<\/section>\n\n<section id=\"s3\"><h2>Yakuniy test<\/h2><div class=\"box\" id=\"g5\"><\/div><\/section>\n<p class=\"note\">⚕️ Kasal bo'lsang, kattalarga ayt va shifokorga murojaat qil. Dorini o'zboshimchalik bilan ichma.<\/p>\n<\/main>\n<nav>\n<button class=\"on\" data-t=\"0\"><span>🥗<\/span>Turmush<\/button>\n<button data-t=\"1\"><span>🦠<\/span>Kelib chiqishi<\/button>\n<button data-t=\"2\"><span>🧼<\/span>Oldini olish<\/button>\n<button data-t=\"3\"><span>📝<\/span>Test<\/button>\n<\/nav>\n<script>\nlet score=0;const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));scrollTo(0,0)});\nconst pop=el=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};\n\n// Universal savol-javob (variantlar aralashtiriladi, f=true bo'lsa tartib saqlanadi)\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`<p class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}<\/p><button class=\"rs\">Qayta boshlash<\/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return}\n    const t=items[i],ord=t.o.map((_,k)=>k);if(!t.f)ord.sort(()=>Math.random()-.5);\n    box.innerHTML=`<p class=\"q\">${t.q}<\/p>`+ord.map(k=>`<button data-k=\"${k}\">${t.o[k]}<\/button>`).join('')+'<div class=\"msg fb\"><\/div>';\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}else{b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'<br><button class=\"nx\">Keyingisi<\/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()}});\n  };go()}\nconst mk=(arr,o,f)=>arr.map(x=>({q:x[0],o:o||x[1],a:o?x[1]:x[2],e:o?x[2]:x[3],f}));\n\n// ---- 1-bo'lim: immunitet shkalasi ----\nlet imm=50;\nconst H=[['😴 Uxlash',12,'Uyqu organizmni tiklaydi.'],['🏃 Sport',10,'Harakat immunitetni mustahkamlaydi.'],['🥕 Meva-sabzavot',10,'Vitaminlar himoya kuchini oshiradi.'],['💧 Toza suv',6,'Suv organizm uchun zarur.'],['🧼 Qo\\'l yuvish',8,'Mikroblar kamayadi.'],['📱 Kechasi telefon',-12,'Uyqu qisqaradi, immunitet pasayadi.'],['🍟 Chips, gazli ichimlik',-10,'Foydasiz ovqat organizmni zaiflashtiradi.'],['🌙 Uyqusiz qolish',-14,'Uyqusizlik organizmni holsizlantiradi.']];\n$('#hb').innerHTML=H
