ki oqishi uchun manba, simlar va iste’molchi kabi elementlar yopiq yo‘l hosil qilgan tizim. Sxema esa zanjir elementlarini shartli belgilar bilan ko‘rsatadi.<\/p><\/section>\n<section class=\"card\"><h2>1. Elementlari ketma-ket ulangan elektr zanjir<\/h2><div class=\"grid\"><div><p>Ketma-ket ulanishda elementlar bir yo‘l bo‘ylab birin-ketin ulanadi. Tok o‘tishi uchun faqat bitta yo‘l mavjud.<\/p><ul><li>Barcha elementlardan bir xil tok o‘tadi: <b>I = I₁ = I₂<\/b>.<\/li><li>Manba kuchlanishi qismlardagi kuchlanishlar yig‘indisiga teng: <b>U = U₁ + U₂<\/b>.<\/li><li>Bitta chiroq yoki sim uzilsa, butun zanjir ochilib, barcha chiroqlar o‘chadi.<\/li><\/ul><\/div><div class=\"diagram\"><svg viewBox=\"0 0 420 180\" role=\"img\" aria-label=\"Ketma-ket ulangan ikki chiroq sxemasi\"><path class=\"wire\" d=\"M70 60 H115 M155 60 H205 M245 60 H295 V130 H70 V90 M70 60 V72 M70 90 V130\"/><path class=\"wire\" d=\"M70 72 V90\"/><circle cx=\"135\" cy=\"60\" r=\"20\" class=\"bulb on\"/><path d=\"M122 47 L148 73 M148 47 L122 73\" stroke=\"#92400e\" stroke-width=\"3\"/><circle cx=\"225\" cy=\"60\" r=\"20\" class=\"bulb on\"/><path d=\"M212 47 L238 73 M238 47 L212 73\" stroke=\"#92400e\" stroke-width=\"3\"/><rect x=\"45\" y=\"72\" width=\"50\" height=\"18\" rx=\"3\" class=\"battery\"/><text x=\"70\" y=\"85\" text-anchor=\"middle\" class=\"label\">+/−<\/text><text x=\"135\" y=\"28\" text-anchor=\"middle\" class=\"label\">Chiroq 1<\/text><text x=\"225\" y=\"28\" text-anchor=\"middle\" class=\"label\">Chiroq 2<\/text><text x=\"210\" y=\"157\" text-anchor=\"middle\" class=\"label\">Bitta tok yo‘li<\/text><\/svg><b>Shartli sxema<\/b><\/div><\/div>\n<div class=\"note\">Tasavvur qiling: tok yo‘lda ketayotgan sayohatchiga o‘xshaydi. U chiroq 1 dan, keyin chiroq 2 dan o‘tib, manbaga qaytadi.<\/div><\/section>\n<section class=\"card\"><h2>2. Elementlari parallel ulangan elektr zanjir<\/h2><div class=\"grid\"><div><p>Parallel ulanishda zanjir bir nechta tarmoqqa bo‘linadi. Har bir chiroq manbaning ikki qutbi orasiga alohida ulanadi.<\/p><ul><li>Har bir tarmoqdagi kuchlanish bir xil: <b>U = U₁ = U₂<\/b>.<\/li><li>Umumiy tok tarmoqlardagi toklar yig‘indisi: <b>I = I₁ + I₂<\/b>.<\/li><li>Bitta chiroq uzilsa, boshqa tarmoq ishlashda davom etadi.<\/li><\/ul><\/div><div class=\"diagram\"><svg viewBox=\"0 0 420 180\" role=\"img\" aria-label=\"Parallel ulangan ikki chiroq sxemasi\"><path class=\"wire\" d=\"M65 65 H125 M165 65 H350 V135 H65 V95 M65 65 V75 M65 95 V135 M125 65 H145 M165 65 H350\"/><path class=\"wire\" d=\"M125 65 H145 M165 65 H350\"/><path class=\"wire\" d=\"M125 65 V40 H280 V65 M125 135 V110 H280 V135\"/><circle cx=\"145\" cy=\"40\" r=\"18\" class=\"bulb on\"/><path d=\"M133 28 L157 52 M157 28 L133 52\" stroke=\"#92400e\" stroke-width=\"3\"/><circle cx=\"145\" cy=\"110\" r=\"18\" class=\"bulb on\"/><path d=\"M133 98 L157 122 M157 98 L133 122\" stroke=\"#92400e\" stroke-width=\"3\"/><rect x=\"40\" y=\"75\" width=\"50\" height=\"20\" rx=\"3\" class=\"battery\"/><text x=\"65\" y=\"89\" text-anchor=\"middle\" class=\"label\">+/−<\/text><text x=\"215\" y=\"25\" text-anchor=\"middle\" class=\"label\">1-tarmoq<\/text><text x=\"215\" y=\"105\" text-anchor=\"middle\" class=\"label\">2-tarmoq<\/text><\/svg><b>Shartli sxema<\/b><\/div><\/div>\n<div class=\"note\">Uyimizdagi lampalar odatda parallel ulanadi: bir xonadagi chiroq o‘chsa ham, boshqa xonadagi chiroq yonishi mumkin.<\/div><\/section>\n<section class=\"card\"><h2>3. Interaktiv simulyatsiya<\/h2><p>Ulanish turini tanlang, kalitni ochib-yoping va chiroqlar qanday o‘zgarishini kuzating.<\/p>\n<div class=\"controls\"><label for=\"mode\"><b>Ulanish turi:<\/b><\/label><select id=\"mode\"><option value=\"series\">Ketma-ket<\/option><option value=\"parallel\">Parallel<\/option><\/select><button id=\"switch\" class=\"green\">🔌 Kalit yopiq<\/button><button id=\"fault\" class=\"secondary\">💡 1-chiroqni uzish<\/button><button id=\"reset\" class=\"secondary\">Qayta tiklash<\/button><\/div>\n<div class=\"diagram\"><svg id=\"sim\" viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Interaktiv elektr zanjiri\"><g id=\"drawing\"><\/g><\/svg><div class=\"result\" id=\"status\">Zanjir yopiq: chiroqlar yonmoqda.<\/div><\/div>\n<p><b>Kuzatish:<\/b> ketma-ket zanjirda bitta chiroq uzilsa, ikkalasi ham o‘chadi. Parallel zanjirda esa ikkinchi chiroq yonishda davom etadi.<\/p>\n<\/section>\n<section class=\"card\"><h2>4. Qaysi zanjirdagi chiroqlar yorqinroq?<\/h2><p>Bir xil ikkita chiroq va bir xil batareya ishlatilsa, odatda <b>parallel ulangan chiroqlar yorqinroq<\/b> yonadi. Chunki parallel tarmoqdagi har bir chiroqqa manbaning to‘liq kuchlanishi beriladi. Ketma-ket ulanishda kuchlanish chiroqlar orasida taqsimlanadi.<\/p><div class=\"warn\">Eslatma: bu xulosa bir xil chiroqlar va ideal manba haqidagi oddiy maktab modeli uchun. Haqiqiy yorqinlik chiroqning xususiyati va manbaga ham bog‘liq.<\/div>\n<table><tr><th>Xususiyat<\/th><th>Ketma-ket<\/th><th>Parallel<\/th><\/tr><tr><td>Tok yo‘llari<\/td><td>Bitta<\/td><td>Bir nechta tarmoq<\/td><\/tr><tr><td>Kuchlanish<\/td><td>Qismlarga taqsimlanadi<\/td><td>Har bir tarmoqda bir xil<\/td><\/tr><tr><td>Bitta chiroq uzilsa<\/td><td>Barchasi o‘chadi<\/td><td>Boshqasi yonishi mumkin<\/td><\/tr><tr><td>Bir xil chiroqlarning yorqinligi<\/td><td>Odatda xiraroq<\/td><td>Odatda yorqinroq<\/td><\/tr><\/table><\/section>\n<section class=\"card\"><h2>📝 Bilimingizni tekshiring<\/h2><form id=\"quiz\">\n<div class=\"quiz-q\"><b>1. Ketma-ket zanjirda nechta asosiy tok yo‘li bor?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> A) Bitta<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> B) Ikkita<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> C) Cheksiz<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Parallel zanjirda bitta chiroq uzilsa, odatda nima bo‘ladi?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> A) Hamma chiroq o‘chadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> B) Boshqa tarmoqdagi chiroq yonishi davom etadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> C) Batareya yo‘qoladi<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Parallel ulanishda har bir tarmoqdagi kuchlanish qanday?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> A) Har doim nol<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> B) Har birida har xil bo‘lishi shart<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> C) Manba kuchlanishiga teng<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Bir xil chiroqlar va batareyada qaysi ulanishda chiroqlar odatda yorqinroq yonadi?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> A) Parallel<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> B) Ketma-ket<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> C) Ikkalasi ham doim bir xil<\/label><\/div>\n<button type=\"button\" id=\"check\">Javoblarni tekshirish<\/button><button type=\"reset\" class=\"secondary\">Tozalash<\/button><p id=\"quizResult\" class=\"result\"><\/p><\/form><\/section>\n<section class=\"card\"><h2>🌟 Xulosa<\/h2><ul><li>Elektr zanjiri tok o‘tishi uchun yopiq bo‘lishi kerak.<\/li><li>Ketma-ket ulanishda tok uchun bitta yo‘l bor.<\/li><li>Parallel ulanishda tok tarmoqlarga bo‘linadi.<\/li><li>Parallel ulanish uy elektr tizimlarida qulay, chunki jihozlar mustaqil ishlashi mumkin.<\/li><\/ul><\/section>\n<div class=\"footer\">6-sinf Fizika • Elektr zanjir sxemalari • O‘quv maqsadida tayyorlandi<\/div>\n<\/main>\n<script>\nconst mode=document.getElementById('mode'), sw=document.getElementById('switch'), faultBtn=document.getElementById('fault'), reset=document.getElementById('reset'), drawing=document.getElementById('drawing'), status=document.getElementById('status');\nlet closed=true, broken=false;\nfunction path(d,live){return `<path d=\"${d}\" class=\"wire ${live?'live':''}\"/>`}\nfunction bulb(x,y,on,label){return `<circle cx=\"${x}\" cy=\"${y}\" r=\"23\" class=\"bulb ${on?'on':''}\"/><path d=\"M${x-13} ${y-13} L${x+13} ${y+13} M${x+13} ${y-13} L${x-13} ${y+13}\" stroke=\"#92400e\" stroke-width=\"3\"/><text x=\"${x}\" y=\"${y-34}\" text-anchor=\"middle\" class=\"label\">${label}<\/text>`}\nfunction render(){\n const parallel=mode.value==='parallel'; let a=closed&&!broken, b=closed&&(!broken||parallel);\n let s='';\n if(!parallel){\n s+=path('M100 80 H205',a)+path('M251 80 H345',a)+path('M391 80 H500 V190 H100 V125',a);\n s+=`<rect x=\"75\" y=\"85\" width=\"50\" height=\"35\" rx=\"5\" class=\"battery\"/><text x=\"100\" y=\"107\" text-anchor=\"middle\" class=\"label\">+/−<\/text>`;\n s+=bulb(228,80,a,'Chiroq 1')+bulb(368,80,b,'Chiroq 2');\n s+=path(closed?'M100 80 V100':'M100 80 V95 M100 80 L125 55',a);\n }else{\n s+=path('M100 80 H165 V55 H240',a)+path('M286 55 H440 V190 H100 V125',a);\n s+=path('M165 55 V135 H240',a)+path('M286 135 H440',b);\n s+=`<rect x=\"75\" y=\"85\" width=\"50\" height=\"35\" rx=\"5\" class=\"battery\"/><text x=\"100\" y=\"107\" text-anchor=\"middle\" class=\"label\">+/−<\/text>`;\n s+=bulb(263,55,a,'Chiroq 1')+bulb(263,135,b,'Chiroq 2');\n s+=path(closed?'M100 80 V100':'M100 80 V95 M100 80 L125 55',a);\n }\n // moving charge dots when circuit is closed and the path is conducting\n if(a){for(let i=0;i<5;i++){let x=145+i*58;s+=`<circle cx=\"${x}\" cy=\"${parallel?190:190}\" r=\"5\" class=\"electron\"><animate attributeName=\"cx\" values=\"${x};${x+35};${x}\" dur=\"1.4s\" repeatCount=\"indefinite\"/><\/circle>`}}\n drawing.innerHTML=s;\n sw.textContent=closed?'🔌 Kalit yopiq':'🔓 Kalit ochiq';\n faultBtn.textContent=broken?'🛠 1-chiroqni tiklash':'💡 1-chiroqni uzish';\n if(!closed)status.textContent='Kalit ochiq: zanjir uzilgan, chiroqlar o‘chiq.';\n else if(broken&&!parallel)status.textContent='1-chiroq uzilgan: ketma-ket zanjir uzildi, ikkala chiroq ham o‘chiq.';\n else if(broken&&parallel)status.textContent='1-chiroq uzilgan: 1-chiroq o‘chiq, 2-chiroq yonishda davom etadi.';\n else status.textContent='Zanjir yopiq: ikkala chiroq yonmoqda.';\n}\nsw.onclick=()=>{closed=!closed;render()};faultBtn.onclick=()=>{broken=!broken;render()};reset.onclick=()=>{closed=true;broken=false;mode.value='series';render()};mode.onchange=render;render();\ndocument.getElementById('check').onclick=()=>{const ans={q1:'a',q2:'b',q3:'c',q4:'a'};let score=0;for(const [q,v] of Object.entries(ans)){const pick=document.querySelector(`input[name=\"${q}\"]:checked`);if(pick&&pick.value===v)score++}document.getElementById('quizResult').textContent=`Natija: ${score}/4 ta to‘g‘ri javob.`+(score===4?' Ajoyib!':score>=2?' Yaxshi! Mavzuni yana bir bor takrorlang.':' Nazariyani qayta o‘qib, yana urinib ko‘ring.');};\ndocument.getElementById('quiz').onreset=()=>{document.getElementById('quizResult').textContent=''};\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Tog‘ jinslarining turlari", "i": "🪨", "g": "Yer haqida", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fan — Tog‘ jinslarining turlari<\/title>\n<style>\n:root{--bg:#f3f7fb;--ink:#172b4d;--blue:#1769aa;--teal:#0f9d8a;--gold:#f2b544;--card:#fff;--muted:#5b6b82}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,\"Segoe UI\",sans-serif;line-height:1.65}\nheader{background:linear-gradient(135deg,#123b63,#168b9a);color:white;padding:34px 18px;text-align:center}\nheader .tag{display:inline-block;background:#ffffff24;border:1px solid #ffffff55;border-radius:99px;padding:5px 13px;font-size:.9rem}\nh1{font-size:clamp(1.8rem,5vw,3rem);margin:12px 0}header p{max-width:850px;margin:auto}\nnav{position:sticky;top:0;background:#fff;box-shadow:0 2px 10px #18324d18;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}\nnav a{color:var(--blue);text-decoration:none;font-weight:bold;padding:6px 10px;border-radius:8px}nav a:hover{background:#e5f3fb}\nmain{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:var(--card);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 6px 22px #1b365014}\nh2{color:#125c88;margin-top:0;border-bottom:2px solid #e3eff6;padding-bottom:8px}h3{color:#137c78} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.type{border-top:6px solid var(--blue)}.type:nth-child(2){border-color:var(--gold)}.type:nth-child(3){border-color:var(--teal)}\n.emoji{font-size:2.3rem}.note{background:#eaf6ff;border-left:5px solid var(--blue);padding:12px 15px;border-radius:8px}.warning{background:#fff5dc;border-left:5px solid var(--gold);padding:12px 15px;border-radius:8px}\nul{padding-left:24px}li{margin:5px 0}.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.step{padding:14px;background:#f0f8fa;border-radius:12px;text-align:center}\nbutton,select{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}button{background:var(--blue);color:white;font-weight:bold}button:hover{filter:brightness(1.08)}button.secondary{background:#e4eef7;color:var(--ink)}button.green{background:var(--teal)}\n.sim{background:linear-gradient(135deg,#e6f6ff,#f1fbf5);border:1px solid #cce7ee;border-radius:14px;padding:18px}\n.rock{font-size:4rem;text-align:center;animation:float 2s ease-in-out infinite}.lava{color:#d94828}.result{text-align:center;font-size:1.15rem;font-weight:bold;min-height:42px}\n@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\ntable{width:100%;border-collapse:collapse;background:white}th,td{border:1px solid #d8e3ec;padding:10px;text-align:left}th{background:#e4f2f7}\n.table-wrap{overflow-x:auto}.question{padding:14px;border:1px solid #dce7ef;border-radius:12px;margin:12px 0}.question p{font-weight:bold;margin:0 0 8px}.question label{display:block;padding:4px}\n#score{font-size:1.2rem;font-weight:bold;margin-top:12px}.footer{text-align:center;color:var(--muted);padding:24px}\n@media(max-width:600px){.card{padding:16px}nav{position:static}th,td{font-size:.9rem;padding:7px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"tag\">6-sinf · Tabiiy fan<\/span>\n  <h1>🌍 Tog‘ jinslarining turlari<\/h1>\n  <p>Yer qa’ridagi magma, suv va shamol olib kelgan cho‘kindilar hamda issiqlik va bosim ta’siri — bular tog‘ jinslarining shakllanish tarixini hikoya qiladi.<\/p>\n<\/header>\n<nav>\n  <a href=\"#kirish\">Kirish<\/a><a href=\"#magmatik\">Magmatik<\/a><a href=\"#chokindi\">Cho‘kindi<\/a><a href=\"#metamorfik\">Metamorfik<\/a><a href=\"#simulyatsiya\">Simulyatsiya<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n<main>\n<section class=\"card\" id=\"kirish\">\n<h2>📘 1. Tog‘ jinslari haqida<\/h2>\n<p><b>Tog‘ jinslari<\/b> — Yer po‘stini tashkil etuvchi tabiiy qattiq moddalar majmuasi. Ular bir yoki bir nechta minerallardan tuzilishi mumkin. Yer po‘stining qattiq tashqi qismi litosferaning tarkibiga kiradi.<\/p>\n<p>Tog‘ jinslari kelib chiqishiga ko‘ra uch asosiy guruhga bo‘linadi:<\/p>\n<div class=\"grid\">\n <div class=\"card type\"><div class=\"emoji\">🌋<\/div><h3>Magmatik<\/h3><p>Magma yoki lava sovib qotganda hosil bo‘ladi.<\/p><\/div>\n <div class=\"card type\"><div class=\"emoji\">🌊<\/div><h3>Cho‘kindi<\/h3><p>Zarralar, minerallar yoki organizmlar qoldiqlari to‘planib, zichlashganda hosil bo‘ladi.<\/p><\/div>\n <div class=\"card type\"><div class=\"emoji\">🔥<\/div><h3>Metamorfik<\/h3><p>Oldingi jinslar yuqori harorat va bosim ta’sirida o‘zgarganda hosil bo‘ladi.<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Eslab qoling:<\/b> tog‘ jinslari doimiy aylanishda bo‘ladi. Bir turdagi jins geologik jarayonlar ta’sirida boshqa turga aylanishi mumkin.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"magmatik\">\n<h2>🌋 2. Magmatik tog‘ jinslari<\/h2>\n<p>Yer qa’rida yuqori harorat ta’sirida erigan jinslar <b>magma<\/b> deyiladi. Magma Yer yuzasiga otilib chiqqanda <b>lava<\/b> deb ataladi. Magma yoki lava sovib qotishi natijasida magmatik tog‘ jinslari hosil bo‘ladi.<\/p>\n<div class=\"grid\">\n <div>\n  <h3>Yer ostida — intruziv<\/h3>\n  <p>Magma yer ostida sekin soviydi. Kristallar o‘sishi uchun vaqt ko‘p bo‘lgani sababli ular ko‘pincha yirik donali bo‘ladi.<\/p>\n  <p><b>Misol:<\/b> granit 🪨<\/p>\n <\/div>\n <div>\n  <h3>Yer yuzasida — effuziv<\/h3>\n  <p>Lava yuzada tez soviydi. Kristallar juda mayda bo‘lishi yoki shishasimon tuzilma hosil bo‘lishi mumkin.<\/p>\n  <p><b>Misollar:<\/b> bazalt, obsidian, pemza<\/p>\n <\/div>\n<\/div>\n<div class=\"steps\">\n <div class=\"step\"><div class=\"emoji\">🔴<\/div><b>Magma<\/b><br>Yer ostida erigan jins<\/div>\n <div class=\"step\"><div class=\"emoji\">🌋<\/div><b>Lava<\/b><br>Yuzaga chiqqan magma<\/div>\n <div class=\"step\"><div class=\"emoji\">❄️<\/div><b>Sovish<\/b><br>Jins qotib boradi<\/div>\n <div class=\"step\"><div class=\"emoji\">🪨<\/div><b>Natija<\/b><br>Magmatik jins<\/div>\n<\/div>\n<ul>\n<li><b>Granit:<\/b> ko‘pincha och rangli, donador, tarkibida turli rangdagi mineral donalari ko‘rinadi.<\/li>\n<li><b>Bazalt:<\/b> odatda to‘q rangli va mayda donali.<\/li>\n<li><b>Obsidian:<\/b> vulqon shishasi; ko‘pincha silliq va shishasimon ko‘rinadi.<\/li>\n<li><b>Pemza:<\/b> gaz pufakchalari tufayli g‘ovak bo‘lishi mumkin; ayrim bo‘laklari suvda suzadi.<\/li>\n<\/ul>\n<div class=\"warning\">Magma va lava juda issiq bo‘ladi. Vulqon lavasi bilan tajriba faqat animatsiyada ko‘rsatiladi — haqiqiy lava yoki vulqonga yaqinlashish mumkin emas.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"chokindi\">\n<h2>🌊 3. Cho‘kindi tog‘ jinslari<\/h2>\n<p>Shamol, suv, muz va harorat o‘zgarishi tog‘ jinslarini yemiradi. Hosil bo‘lgan mayda zarralar ko‘chib, daryo, ko‘l yoki dengiz tubida to‘planadi. Vaqt o‘tishi bilan qatlamlar bosim ostida zichlashib, sementlanishi mumkin.<\/p>\n<div class=\"steps\">\n <div class=\"step\"><div class=\"emoji\">🌧️<\/div><b>1. Nurash<\/b><br>Tosh maydalanadi<\/div>\n <div class=\"step\"><div class=\"emoji\">🏞️<\/div><b>2. Tashilish<\/b><br>Suv va shamol zarralarni ko‘chiradi<\/div>\n <div class=\"step\"><div class=\"emoji\">〰️<\/div><b>3. To‘planish<\/b><br>Cho‘kindilar qatlam hosil qiladi<\/div>\n <div class=\"step\"><div class=\"emoji\">🪨<\/div><b>4. Zichlanish<\/b><br>Cho‘kindi jinsga aylanadi<\/div>\n<\/div>\n<h3>Cho‘kindi jinslarning asosiy guruhlari<\/h3>\n<ul>\n<li><b>Mexanik (parchali):<\/b> qumtosh, shag‘al, gil va boshqa jins bo‘laklaridan hosil bo‘lgan jinslar.<\/li>\n<li><b>Kimyoviy:<\/b> suvda erigan moddalar cho‘kishi natijasida hosil bo‘ladi. Misollar: tosh tuzi, ayrim gips qatlamlari.<\/li>\n<li><b>Organik yoki biogen:<\/b> organizmlar qoldiqlari yoki ularning faoliyati bilan bog‘liq. Misollar: ko‘mir, chig‘anoq qoldiqlaridan hosil bo‘lgan ayrim ohaktoshlar.<\/li>\n<\/ul>\n<p><b>Qiziqarli ma’lumot:<\/b> cho‘kindi qatlamlarda qadimiy organizmlarning qoldiqlari — <b>qazilmalar (fossiliyalar)<\/b> saqlanishi mumkin. Ular olimlarga Yerning o‘tmishini o‘rganishga yordam beradi.<\/p>\n<div class=\"note\">Har bir cho‘kindi jinsda qazilma bo‘lavermaydi. Qazilmalar, ayniqsa, organizm qoldiqlari saqlanishiga qulay sharoitlarda ko‘proq uchraydi.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"metamorfik\">\n<h2>🔥 4. Metamorfik tog‘ jinslari<\/h2>\n<p>“Metamorfik” so‘zi o‘zgarish ma’nosini bildiradi. Oldindan mavjud bo‘lgan magmatik yoki cho‘kindi jinslar yer ostida yuqori harorat va bosim ta’sirida erib ketmasdan, mineral tarkibi va tuzilishini o‘zgartirishi mumkin. Shu jarayon <b>metamorfizm<\/b> deyiladi.<\/p>\n<div class=\"grid\">\n <div class=\"step\"><div class=\"emoji\">⚪➡️✨<\/div><b>Ohaktosh → Marmar<\/b><p>Ohaktosh issiqlik va bosim ta’sirida kristalli marmarga aylanishi mumkin.<\/p><\/div>\n <div class=\"step\"><div class=\"emoji\">🪨➡️〰️<\/div><b>Granit → Gneys<\/b><p>Granit kuchli metamorfizmda yo‘l-yo‘l ko‘rinishli gneysga aylanishi mumkin.<\/p><\/div>\n <div class=\"step\"><div class=\"emoji\">🟤➡️📚<\/div><b>Gil jinslari → Slanets<\/b><p>Gilga boy jinslar bosim va harorat ta’sirida qatlamli metamorfik jinslarga aylanishi mumkin.<\/p><\/div>\n<\/div>\n<p><b>Qayerda uchraydi?<\/b> Tog‘lar hosil bo‘layotgan hududlarda, Yer po‘stining chuqur qismlarida va magma yaqinidagi qizigan zonalarda metamorfizm yuz berishi mumkin.<\/p>\n<div class=\"warning\">Metamorfizm — toshning shunchaki erib, qayta qotishi emas. U odatda qattiq holatda, yuqori harorat va bosim ta’sirida sodir bo‘ladi.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"simulyatsiya\">\n<h2>🧪 5. Virtual simulyatsiya: “Tosh qanday hosil bo‘ladi?”<\/h2>\n<p>Quyidagi boshqaruvlar yordamida uch xil jarayonni sinab ko‘ring. Bu soddalashtirilgan o‘quv modeli.<\/p>\n<div class=\"sim\">\n <label for=\"process\"><b>Jarayonni tanlang:<\/b><\/label>\n <select id=\"process\" onchange=\"updateSim()\">\n  <option value=\"slow\">Magma yer ostida sekin soviydi<\/option>\n  <option value=\"fast\">Lava yer yuzasida tez soviydi<\/option>\n  <option value=\"sediment\">Cho‘kindilar to‘planib zichlashadi<\/option>\n  <option value=\"meta\">Jins issiqlik va bosim ta’sirida o‘zgaradi<\/option>\n <\/select>\n <div class=\"rock\" id=\"rock\">🪨<\/div>\n <div class=\"result\" id=\"simResult\">Natija: yirik kristalli granit hosil bo‘lishi mumkin.<\/div>\n <p id=\"simExplain\">Sekin sovishda kristallar o‘sishi uchun ko‘proq vaqt bo‘ladi.<\/p>\n <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n  <button onclick=\"updateSim()\">Jarayonni ko‘rsat<\/button>\n  <button class=\"secondary\" onclick=\"nextSim()\">Keyingi jarayon ↻<\/button>\n <\/div>\n<\/div>\n<h3>🔎 Sinab ko‘ring<\/h3>\n<ol>\n<li>Tanlang: “sekin soviydi”. Natijada qanday jins hosil bo‘lishi mumkin?<\/li>\n<li>Endi “tez soviydi”ni tanlang. Kristallar qanday farq qiladi?<\/li>\n<li>Cho‘kindi jarayonida zarralar qayerda to‘planadi?<\/li>\n<li>Ohaktosh issiqlik va bosim ta’sirida qaysi jinsga aylanishi mumkin?<\/li>\n<\/ol>\n<\/section>\n\n<section class=\"card\">\n<h2>📊 6. Taqqoslash jadvali<\/h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Turi<\/th><th>Qanday hosil bo‘ladi?<\/th><th>Misollar<\/th><th>Ko‘p uchraydigan belgilar<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Magmatik<\/b><\/td><td>Magma yoki lava sovib qotadi<\/td><td>Granit, bazalt, obsidian, pemza<\/td><td>Kristalli, ba’zan shishasimon yoki g‘ovak<\/td><\/tr>\n<tr><td><b>Cho‘kindi<\/b><\/td><td>Zarralar yoki moddalar to‘planib, zichlanadi<\/td><td>Qumtosh, gil, tosh tuzi, ko‘mir, ohaktosh<\/td><td>Ko‘pincha qatlamli; ayrimlarida qazilmalar bo‘ladi<\/td><\/tr>\n<tr><td><b>Metamorfik<\/b><\/td><td>Oldingi jinslar issiqlik va bosimda o‘zgaradi<\/td><td>Marmar, gneys, slanets<\/td><td>Kristallari qayta shakllangan; ba’zan yo‘l-yo‘l yoki qatlamli<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>📝 7. Bilimingizni tekshiring<\/h2>\n<p>Har bir savol uchun bitta javobni belgilang va “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n<div class=\"question\"><p>1. Magma sovib qotganda qaysi jinslar guruhi hosil bo‘ladi?<\/p>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Cho‘kindi<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Magmatik<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Metamorfik<\/label><\/div>\n<div class=\"question\"><p>2. Qaysi jins yer ostida sekin sovigan magmadan hosil bo‘lishi mumkin?<\/p>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Granit<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Ko‘mir<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Marmar<\/label><\/div>\n<div class=\"question\"><p>3. Cho‘kindi jinslar qanday hosil bo‘lishi mumkin?<\/p>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Faqat vulqon otilishidan<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Faqat muzlashdan<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Zarralar to‘planib, zichlanishidan<\/label><\/div>\n<div class=\"question\"><p>4. Ohaktosh metamorfizm natijasida qaysi jinsga aylanishi mumkin?<\/p>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Bazalt<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Marmar<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Pemza<\/label><\/div>\n<div class=\"question\"><p>5. Qadimiy organizm qoldiqlari qaysi jinslarda ko‘proq saqlanishi mumkin?<\/p>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Cho‘kindi jinslarda<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Barcha magmatik jinslarda<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Faqat marmarda<\/label><\/div>\n<div class=\"question\"><p>6. Lava nima?<\/p>\n<label><input type=\"radio\" name=\"q6\" value=\"a\"> Daryo tubidagi qum<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> Yer yuzasiga chiqqan magma<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> Qadimgi o‘simlik qoldig‘i<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button>\n<button type=\"reset\" class=\"secondary\" onclick=\"document.getElementById('score').textContent=''\">Qayta ishlash<\/button>\n<div id=\"score\" role=\"status\"><\/div>\n<\/form>\n<\/section>\n\n<section class=\"card\">\n<h2>🎯 8. Darsni mustahkamlash<\/h2>\n<ul>\n<li>Uchta asosiy tog‘ jinsi guruhini ayting.<\/li>\n<li>Granit va bazaltning hosil bo‘lishidagi farqni tushuntiring.<\/li>\n<li>Cho‘kindi jinslar hosil bo‘lishining ketma-ketligini sanang.<\/li>\n<li>Marmar qanday hosil bo‘lishini izohlang.<\/li>\n<li>Atrofingizdagi tosh yoki qurilish materialidan misol keltirib, uning qaysi guruhga mansubligini taxmin qiling.<\/li>\n<\/ul>\n<div class=\"note\"><b>Uyga vazifa:<\/b> daftarni uch ustunga bo‘ling: “Magmatik”, “Cho‘kindi”, “Metamorfik”. Har biriga kamida uchta misol yozing va bir jinsning hosil bo‘lish yo‘lini rasm bilan tasvirlang.<\/div>\n<\/section>\n<\/main>\n<div class=\"footer\">6-sinf Tabiiy fan · Tog‘ jinslarining turlari | Interaktiv o‘quv materiali<\/div>\n<script>\nconst data={\n slow:{icon:\"🪨\",title:\"Natija: yirik kristalli granit hosil bo‘lishi mumkin.\",text:\"Magma yer ostida sekin soviydi. Kristallar o‘sishiga vaqt yetarli bo‘lgani uchun donalar ko‘pincha yirikroq bo‘ladi.\"},\n fast:{icon:\"🌋\",title:\"Natija: bazalt yoki obsidian kabi jinslar hosil bo‘lishi mumkin.\",text:\"Lava yer yuzasida tez soviydi. Kristallar juda mayda bo‘lishi yoki shishasimon tuzilma yuzaga kelishi mumkin.\"},\n sediment:{icon:\"🌊\",title:\"Natija: qumtosh kabi cho‘kindi jins hosil bo‘lishi mumkin.\",text:\"Zarralar suv yoki shamol bilan ko‘chadi, tubda to‘planadi va vaqt o‘tishi bilan zichlanib, sementlanadi.\"},\n meta:{icon:\"🔥\",title:\"Natija: marmar yoki gneys kabi metamorfik jinslar hosil bo‘lishi mumkin.\",text:\"Oldingi jinslar yuqori harorat va bosim ta’sirida, odatda erimasdan, tuzilishi va minerallarini o‘zgartiradi.\"}\n};\nfunction updateSim(){let k=document.getElementById('process').value,d=data[k],r=document.getElementById('rock');r.textContent=d.icon;r.style.animation='none';void r.offsetWidth;r.style.animation='float 2s ease-in-out infinite';document.getElementById('simResult').textContent=d.title;document.getElementById('simExplain').textContent=d.text}\nfunction nextSim(){let s=document.getElementById('process'),i=(s.selectedIndex+1)%s.options.length;s.selectedIndex=i;updateSim()}\nfunction checkQuiz(){let answers={q1:'b',q2:'a',q3:'c',q4:'b',q5:'a',q6:'b'},score=0,total=Object.keys(answers).length;for(let q in answers){let v=document.querySelector('input[name=\"'+q+'\"]:checked');if(v&&v.value===answers[q])score++}let msg='Natija: '+score+' / '+total+'. ';msg+=score===total?'Ajoyib! Barcha javoblar to‘g‘ri!':score>=4?'Yaxshi! Xatolarni ko‘rib, yana urinib ko‘ring.':'Mavzuni qayta o‘qing va yana urinib ko‘ring.';document.getElementById('score').textContent=msg}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Tog‘ jinslari va toshqotgan qoldiqlar", "i": "🦴", "g": "Yer haqida", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fanlar — Togʻ jinslarining oʻzgarishi va toshqotgan qoldiqlar<\/title>\n<style>\n:root{--ink:#203047;--muted:#5b6b7f;--green:#287a57;--sand:#f5ead5;--sky:#eaf6ff;--card:#fff;--line:#d9e4ea;--orange:#e28a37}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;line-height:1.65;color:var(--ink);background:linear-gradient(180deg,#eaf7ff,#f8f6ef 48%,#edf7ee)}\nheader{padding:42px 18px;text-align:center;color:white;background:linear-gradient(135deg,#174e70,#287a57);position:relative;overflow:hidden}\nheader:after{content:\"\";position:absolute;width:280px;height:280px;border:30px solid #ffffff18;border-radius:50%;right:-60px;top:-120px}\nheader h1{max-width:950px;margin:0 auto 12px;font-size:clamp(26px,4vw,42px);line-height:1.2}header p{max-width:800px;margin:auto;font-size:17px;color:#eaf8ff}\n.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px}.nav a{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:20px;text-decoration:none;color:#205b4a;font-weight:bold;font-size:14px}\nsection,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 7px 22px #183b5010}\nh2{color:#21684c;margin-top:0;font-size:25px}h3{margin:12px 0 6px;color:#245a73}p{margin:8px 0}ul,ol{padding-left:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.mini{padding:16px;border-radius:14px;background:#f6fafb;border:1px solid var(--line)}.icon{font-size:32px}.tag{display:inline-block;padding:4px 10px;border-radius:15px;background:#e2f4e9;color:#21684c;font-weight:bold;font-size:13px}\n.note{padding:13px 16px;background:#fff6df;border-left:5px solid var(--orange);border-radius:8px;margin:14px 0}.blue{background:#eef8ff;border-left-color:#3996c8}.sim{background:#f7fbff;border:1px solid #cbdfea;border-radius:16px;padding:18px;margin-top:12px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0}.controls button,.quiz button{border:0;border-radius:10px;padding:10px 15px;background:#287a57;color:white;font-weight:bold;cursor:pointer}.controls button.secondary{background:#47738b}.controls input{width:min(100%,400px);accent-color:#287a57}.stage{min-height:155px;border-radius:12px;background:linear-gradient(#dff2ff 0 48%,#d8c39a 48% 100%);padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.rock{font-size:68px;filter:drop-shadow(2px 4px 2px #0002);transition:.4s}.stage .caption{position:absolute;bottom:10px;left:10px;right:10px;background:#ffffffd9;border-radius:8px;padding:5px;font-weight:bold}.layers{height:180px;display:flex;flex-direction:column;justify-content:flex-end;background:#dff2ff;border-radius:12px;overflow:hidden;border:1px solid #cbdfea}.layer{height:30px;display:flex;align-items:center;padding-left:12px;font-size:13px;font-weight:bold;color:#263b46;transition:height .4s}.layer:nth-child(1){background:#d6bd8e}.layer:nth-child(2){background:#c7a16c}.layer:nth-child(3){background:#a77e56}.layer:nth-child(4){background:#8b674c}.layer:nth-child(5){background:#72543f}.fossil{font-size:36px;display:inline-block;transition:.4s}.timeline{display:flex;flex-wrap:wrap;gap:8px}.timeline span{background:#eef6f1;border-radius:9px;padding:8px 11px;font-size:14px}.question{padding:15px;margin:12px 0;border:1px solid var(--line);border-radius:12px}.question label{display:block;margin:7px 0;cursor:pointer}.feedback{font-weight:bold;margin-top:8px}.good{color:#16824b}.bad{color:#b33c2d}.footer{text-align:center;color:var(--muted);padding:18px;font-size:14px}\n@media print{body{background:white}.nav,.controls button,.quiz button{display:none}section,.panel{box-shadow:none;break-inside:avoid}header{background:#287a57!important;print-color-adjust:exact}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div style=\"font-size:48px\">⛰️ 🦴 🌿<\/div>\n  <h1>Togʻ jinslarining oʻzgarishi va toshqotgan qoldiqlar<\/h1>\n  <p>6-sinf Tabiiy fanlar uchun interaktiv dars konspekti, matnli animatsiyalar va virtual simulyatsiyalar<\/p>\n<\/header>\n<div class=\"wrap\">\n<nav class=\"nav\">\n<a href=\"#maqsad\">Dars maqsadi<\/a><a href=\"#nurash\">Nurash<\/a><a href=\"#fossil\">Toshqotmalar<\/a><a href=\"#sim\">Simulyatsiyalar<\/a><a href=\"#tajriba\">Uy tajribasi<\/a><a href=\"#test\">Mini-test<\/a>\n<\/nav>\n\n<section id=\"maqsad\">\n<h2>📋 Dars rejasi va maqsadlari<\/h2>\n<ol><li>Togʻ jinslarining oʻzgarishi, nurash va yemirilish jarayonlarini tushunish.<\/li><li>Fizik, kimyoviy va biologik nurashni misollar orqali farqlash.<\/li><li>Toshqotgan qoldiqlar qanday hosil boʻlishini bosqichma-bosqich izohlash.<\/li><li>Simulyatsiyalar va oddiy tajriba orqali kuzatish hamda xulosa chiqarish.<\/li><\/ol>\n<div class=\"grid\">\n<div class=\"mini\"><span class=\"tag\">Asosiy tushuncha<\/span><h3>Nurash<\/h3><p>Togʻ jinslarining suv, havo, harorat va tirik organizmlar taʼsirida parchalanishi yoki tarkibining oʻzgarishi.<\/p><\/div>\n<div class=\"mini\"><span class=\"tag\">Asosiy tushuncha<\/span><h3>Fossiliya<\/h3><p>Qadimda yashagan organizmlarning saqlanib qolgan qoldigʻi yoki izi.<\/p><\/div>\n<div class=\"mini\"><span class=\"tag\">Kutiladigan natija<\/span><h3>Oʻquvchi bajara oladi<\/h3><p>Nurash turlarini ajratadi, toshqotma hosil boʻlishini tartiblaydi va misollar keltiradi.<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Oʻqituvchi uchun:<\/b> Dars boshida oʻquvchilardan soʻrang: “Nega togʻ choʻqqilari vaqt oʻtishi bilan oʻzgaradi?” va “Qadimgi hayvonlar haqida olimlar qanday bilib olishadi?”<\/div>\n<\/section>\n\n<section id=\"nurash\">\n<h2>1. Togʻ jinslarining oʻzgarishi<\/h2>\n<p>Togʻ jinslari doimiy ravishda oʻzgarib turadi. Harorat almashishi, suv, shamol, muz, havo tarkibidagi moddalar hamda tirik organizmlar jinslarni yemirishi mumkin. Nurash natijasida yoriqlar, mayda toshlar, shagʻal va qum hosil boʻladi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"icon\">🌡️🪨<\/div><h3>Fizik nurash<\/h3><p>Togʻ jinsi kimyoviy tarkibi deyarli oʻzgarmasdan mayda boʻlaklarga ajraladi. Masalan, suv yoriqqa kirib muzlaganda kengayib, yoriqni kattalashtirishi mumkin. Haroratning takroriy almashishi ham jinsni yoradi.<\/p><p><b>Misol:<\/b> muzlagan suv taʼsirida toshning boʻlinishi.<\/p><\/div>\n<div class=\"mini\"><div class=\"icon\">💧🧪<\/div><h3>Kimyoviy nurash<\/h3><p>Suv va unda erigan moddalar togʻ jinslarining minerallari bilan reaksiyaga kirishib, tarkibini oʻzgartiradi yoki ayrim qismlarini eritadi.<\/p><p><b>Misol:<\/b> kuchsiz kislotali yomgʻir suvi ohaktoshni asta-sekin eritishi.<\/p><\/div>\n<div class=\"mini\"><div class=\"icon\">🌱🪨<\/div><h3>Biologik nurash<\/h3><p>Tirik organizmlar taʼsirida togʻ jinslari yemiriladi. Oʻsimlik ildizlari yoriqlarga kirib kengayadi; ayrim mikroorganizmlar ham minerallarga taʼsir qilishi mumkin.<\/p><p><b>Misol:<\/b> daraxt ildizi tosh yorigʻini kengaytirishi.<\/p><\/div>\n<\/div>\n<h3>Nurashdan keyin nima boʻladi?<\/h3>\n<p>Yemirilgan zarrachalarni daryo, shamol, muzlik yoki tortishish kuchi boshqa joyga olib borishi mumkin. Zarrachalar choʻkib, qatlamlar hosil qiladi. Vaqt oʻtishi bilan bosim va minerallar taʼsirida ular choʻkindi togʻ jinslariga aylanishi mumkin.<\/p>\n<div class=\"note blue\"><b>Eslab qoling:<\/b> Nurash — jinsning parchalanishi yoki oʻzgarishi; eroziya va tashilish — zarrachalarning olib ketilishi; choʻkish — zarrachalarning bir joyda toʻplanishi. Bular bir-biriga bogʻliq, ammo aynan bir jarayon emas.<\/div>\n<\/section>\n\n<section id=\"fossil\">\n<h2>2. Toshqotgan qoldiqlar (fossiliyalar)<\/h2>\n<p><b>Toshqotgan qoldiqlar<\/b> — qadimda yashagan oʻsimlik va hayvonlarning saqlanib qolgan qoldiqlari yoki faoliyati izlari. Ular orasida suyak, tish, chigʻanoq, barg izi, oyoq izi va yogʻochning toshlashgan namunalari boʻlishi mumkin.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"icon\">🦕<\/div><h3>1-bosqich: Koʻmilish<\/h3><p>Organizm oʻlgach, uning qoldigʻi loy, qum yoki boshqa choʻkindi ostida tez koʻmilsa, saqlanib qolish ehtimoli ortadi. Koʻp qoldiqlar parchalanib ketadi, shuning uchun fossiliya hosil boʻlishi kam uchraydi.<\/p><\/div>\n<div class=\"mini\"><div class=\"icon\">🟫<\/div><h3>2-bosqich: Qatlamlanish<\/h3><p>Ustiga vaqt oʻtishi bilan yangi choʻkindi qatlamlari toʻplanadi. Pastdagi qatlamlar siqilib, qattiqlashib boradi.<\/p><\/div>\n<div class=\"mini\"><div class=\"icon\">💎<\/div><h3>3-bosqich: Saqlanish va minerallashish<\/h3><p>Mineralga boy suv qoldiqning gʻovaklariga kirishi yoki uning ayrim qismlarini minerallar almashtirishi mumkin. Baʼzan organizmning oʻzi saqlanmaydi, faqat izi yoki qolipi qoladi.<\/p><\/div>\n<div class=\"mini\"><div class=\"icon\">⛏️<\/div><h3>4-bosqich: Yuzaga chiqish<\/h3><p>Yer poʻstining koʻtarilishi va eroziya qatlamlarni ochib, fossiliyalarni yuzaga yaqinlashtirishi mumkin. Paleontologlar ularni oʻrganib, qadimgi hayot haqida maʼlumot oladi.<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Muhim aniqlik:<\/b> Har bir toshqotma suyakning butunlay toshga aylanishi bilan hosil boʻlavermaydi. Baʼzilari qolip, iz yoki boshqa saqlanish shaklida uchraydi.<\/div>\n<\/section>\n\n<section id=\"sim\">\n<h2>3. Interaktiv simulyatsiyalar — “Vaqt mashinasi”<\/h2>\n<div class=\"sim\">\n<h3>🎞️ Simulyatsiya A: Toshning yorilishi va maydalanishi<\/h3>\n<p>Slayderni siljiting yoki “Keyingi bosqich” tugmasini bosing. Har bir bosqichda uzoq vaqt davomida sodir boʻlishi mumkin boʻlgan jarayonni kuzating.<\/p>\n<div class=\"stage\" id=\"rockStage\"><div class=\"rock\" id=\"rockEmoji\">🪨<\/div><div class=\"caption\" id=\"rockCaption\">Boshlanish: yaxlit tosh<\/div><\/div>\n<div class=\"controls\"><button onclick=\"rockStep(-1)\" class=\"secondary\">◀ Oldingi<\/button><input type=\"range\" id=\"rockRange\" min=\"0\" max=\"4\" value=\"0\" oninput=\"showRock(this.value)\"><button onclick=\"rockStep(1)\">Keyingi bosqich ▶<\/button><button class=\"secondary\" onclick=\"showRock(0)\">Qayta boshlash<\/button><\/div>\n<p id=\"rockText\">Togʻ jinsining yuzasi hozircha yaxlit. Nurash hali sezilarli iz qoldirmagan.<\/p>\n<div class=\"timeline\"><span>0 yil<\/span><span>Yoriqlar paydo boʻlishi<\/span><span>Muzlash-erish<\/span><span>Maydalanish<\/span><span>Tashilish va yumaloqlanish<\/span><\/div>\n<\/div>\n\n<div class=\"sim\">\n<h3>🦴 Simulyatsiya B: Toshqotma qanday hosil boʻladi?<\/h3>\n<p>Bosqichlarni tanlang va qoldiqning choʻkindi qatlamlar ostida qanday saqlanishini kuzating.<\/p>\n<div class=\"stage\" style=\"background:linear-gradient(#dff2ff 0 42%,#d8c39a 42% 100%);flex-direction:column\">\n<div class=\"fossil\" id=\"fossilEmoji\">🦕<\/div>\n<div class=\"layers\" id=\"layers\" style=\"width:100%\">\n<div class=\"layer\">Yangi choʻkindi<\/div><div class=\"layer\">Qum va loy<\/div><div class=\"layer\">Qadimgi qatlam<\/div><div class=\"layer\">Toshqotma joylashgan qatlam<\/div><div class=\"layer\">Qattiq jins<\/div>\n<\/div>\n<div class=\"caption\" id=\"fossilCaption\">1-bosqich: organizm qoldigʻi<\/div>\n<\/div>\n<div class=\"controls\"><button class=\"secondary\" onclick=\"fossilStep(-1)\">◀ Oldingi<\/button><input type=\"range\" id=\"fossilRange\" min=\"0\" max=\"3\" value=\"0\" oninput=\"showFossil(this.value)\"><button onclick=\"fossilStep(1)\">Keyingi bosqich ▶<\/button><\/div>\n<p id=\"fossilText\">Organizm qoldigʻi suv yoki koʻl bo‘yidagi choʻkindi muhitda qoladi.<\/p>\n<\/div>\n<\/section>\n\n<section id=\"tajriba\">\n<h2>4. Uyda bajariladigan xavfsiz tajriba: fossiliya izi<\/h2>\n<p><b>Kerakli jihozlar:<\/b> plastilin, barg yoki chigʻanoq, gips kukuni va suv, kichik idish hamda qoshiq. Gips bilan ishlaganda kattalar yordami kerak; uni ogʻizga solmang va koʻzga tekkizmang.<\/p>\n<ol><li>Plastilinni tekis qilib yoying.<\/li><li>Barg yoki chigʻanoqni ustiga bosib, iz qoldiring va ehtiyotkorlik bilan oling.<\/li><li>Gipsni yoʻriqnomasiga muvofiq suv bilan aralashtiring. Aralashmani iz qolipiga quying.<\/li><li>Toʻliq qotishini kuting, soʻng ehtiyotkorlik bilan ajrating.<\/li><li>Hosil boʻlgan nusxani kuzating: unda qaysi belgilar saqlangan?<\/li><\/ol>\n<div class=\"note blue\"><b>Xulosa:<\/b> Bu tajriba haqiqiy million yillik toshqotma hosil qilmaydi; u qoldiqning izi yoki qolipi qanday saqlanishi mumkinligini namoyish etadi.<\/div>\n<\/section>\n\n<section id=\"test\" class=\"quiz\">\n<h2>5. Bilimingizni tekshiring<\/h2>\n<p>Har bir savol uchun bitta javobni tanlang, keyin “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quizForm\">\n<div class=\"question\"><b>1. Toshning kimyoviy tarkibi deyarli oʻzgarmasdan maydalanishi qaysi jarayon?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Fizik nurash<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Kimyoviy nurash<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Minerallashish<\/label><\/div>\n<div class=\"question\"><b>2. Oʻsimlik ildizi tosh yorigʻini kengaytirishi qaysi nurash turiga misol?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Fizik<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Biologik<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Kimyoviy<\/label><\/div>\n<div class=\"question\"><b>3. Fossiliya saqlanishiga qaysi sharoit yordam berishi mumkin?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Qoldiqning tez koʻmilishi<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Qoldiqning uzoq vaqt ochiq qolishi<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Uni doimo olovda tutish<\/label><\/div>\n<div class=\"question\"><b>4. Choʻkindi zarrachalari vaqt oʻtishi bilan qanday jins hosil qilishi mumkin?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Faqat metall<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Choʻkindi togʻ jinsi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Plastik<\/label><\/div>\n<div class=\"question\"><b>5. Quyidagilardan qaysi biri fossiliya boʻlishi mumkin?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Qadimgi oyoq izi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Yangi qogʻoz<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Plastik oʻyinchoq<\/label><\/div>\n<button type=\"button\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button>\n<button type=\"reset\" class=\"secondary\" onclick=\"document.getElementById('result').textContent=''\">Qayta ishlash<\/button>\n<div id=\"result\" class=\"feedback\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n<section>\n<h2>🧠 Dars yakuni: eslab qoling<\/h2>\n<ul><li>Nurash fizik, kimyoviy va biologik boʻlishi mumkin.<\/li><li>Nurash jinslarni parchalab yoki tarkibini oʻzgartirib, zarrachalar hosil qiladi.<\/li><li>Fossiliyalar qadimgi organizmlar qoldiqlari yoki izlaridir.<\/li><li>Tez koʻmilish, choʻkindi qatlamlar va mineralga boy suv ayrim qoldiqlarning saqlanishiga yordam beradi.<\/li><\/ul>\n<p><b>Uyga vazifa:<\/b> Har bir nurash turiga bittadan hayotiy misol yozing. Fossiliya hosil boʻlishining toʻrt bosqichini rasm yoki sxema shaklida tasvirlang.<\/p>\n<\/section>\n<div class=\"footer\">6-sinf Tabiiy fanlar • Interaktiv HTML dars • Faylni internetga ulanmasdan ham brauzerda ochish mumkin.<\/div>\n<\/div>\n<script>\nconst rockData=[\n[\"🪨\",\"Boshlanish: yaxlit tosh\",\"Togʻ jinsining yuzasi hozircha yaxlit. Nurash hali sezilarli iz qoldirmagan.\",\"scale(1) rotate(0deg)\"],\n[\"🪨\",\"Mayda yoriqlar paydo boʻldi\",\"Haroratning takroriy oʻzgarishi va boshqa taʼsirlar jins yuzasida yoriqlar hosil qilishi mumkin.\",\"scale(1) rotate(-3deg)\"],\n[\"🪨\",\"Yoriqqa suv kirib muzladi\",\"Suv muzlaganda kengayishi yoriqni kattalashtirishi mumkin. Bu fizik nurashga misol.\",\"scale(1.04) rotate(2deg)\"],\n[\"🪨 🪨\",\"Tosh boʻlaklarga ajraldi\",\"Yoriqlar kattalashib, jins boʻlaklarga ajralishi mumkin.\",\"scale(.95) rotate(0deg)\"],\n[\"🪨 · · 🪨\",\"Mayda zarrachalar tashildi\",\"Suv va shamol zarrachalarni koʻchirishi mumkin. Zarrachalar bir-biriga ishqalanib, ayrimlari yumaloqlashadi.\",\"scale(.9) rotate(0deg)\"]\n];\nfunction showRock(v){v=+v;document.getElementById('rockRange').value=v;let d=rockData[v];document.getElementById('rockEmoji').textContent=d[0];document.getElementById('rockEmoji').style.transform=d[3];document.getElementById('rockCaption').textContent=d[1];document.getElementById('rockText').textContent=d[2]}\nfunction rockStep(n){let e=document.getElementById('rockRange');showRock(Math.max(0,Math.min(4,+e.value+n)))}\nconst fossilData=[\n[\"🦕\",\"1-bosqich: organizm qoldigʻi\",\"Organizm qoldigʻi suv yoki koʻl bo‘yidagi choʻkindi muhitda qoladi.\",0],\n[\"🦴\",\"2-bosqich: koʻmilish\",\"Loy va qum qoldiqni qoplaydi. Tez koʻmilish yemirilish va parchalanishni kamaytirishi mumkin.\",1],\n[\"💎🦴\",\"3-bosqich: uzoq vaqt va minerallar\",\"Yangi qatlamlar toʻplanib siqiladi. Mineralga boy suv qoldiqni minerallashtirishi yoki uning izini saqlashi mumkin.\",2],\n[\"⛏️🦴\",\"4-bosqich: qatlam ochildi\",\"Yer poʻstining harakati va eroziya qatlamlarni ochadi. Qoldiqni topish va oʻrganish mumkin boʻladi.\",3]\n];\nfunction showFossil(v){v=+v;document.getElementById('fossilRange').value=v;let d=fossilData[v];document.getElementById('fossilEmoji').textContent=d[0];document.getElementById('fossilCaption').textContent=d[1];document.getElementById('fossilText').textContent=d[2];let ls=document.querySelectorAll('.layer');ls.forEach((el,i)=>{el.style.height=(v===0?18:v===1?25:v===2?30:18)+'px';el.style.opacity=(v===0&&i<2)?'.55':'1'});document.getElementById('layers').style.transform=v===3?'translateY(8px)':'translateY(0)'}\nfunction fossilStep(n){let e=document.getElementById('fossilRange');showFossil(Math.max(0,Math.min(3,+e.value+n)))}\nfunction checkQuiz(){const ans={q1:'a',q2:'b',q3:'a',q4:'b',q5:'a'};let score=0,total=Object.keys(ans).length;for(let q in ans){let selected=document.querySelector('input[name=\"'+q+'\"]:checked');if(selected&&selected.value===ans[q])score++}let r=document.getElementById('result');r.textContent='Natija: '+score+' / '+total+'. '+(score===total?'Ajoyib! Barcha javoblar toʻgʻri.':score>=3?'Yaxshi! Xatolarni qayta koʻrib chiqing.':'Mavzuni yana bir bor oʻqing va qayta urinib koʻring.');r.className='feedback '+(score>=4?'good':'bad')}\nshowRock(0);showFossil(0);\n<\/script>\n<\/body>\n<\/html>"}];
const home=document.getElementById('home'),fr=document.getElementById('fr'),ttl=document.getElementById('ttl');

home.innerHTML=h+'</div>';})();
